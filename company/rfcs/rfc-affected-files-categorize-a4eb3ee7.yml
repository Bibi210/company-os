api_version: companyos/v1
kind: rfc
metadata:
  id: a4eb3ee7-45c1-4422-a43a-fbbc07d686f0
  title: "Schema RFC : distinguer affected_files modified vs created (rétro-compatible via anyOf)"
  status: implemented
  implemented_at: "2026-06-05T19:52:08.031986329+00:00"
  approved_at: "2026-06-04T08:43:35.008268632+00:00"
  author: architect
  created_at: "2026-06-04"
  description: >
    Étend spec.affected_files du schema RFC pour permettre de distinguer
    explicitement les fichiers à MODIFIER (existants) des fichiers à CRÉER
    (nouveaux), via une forme structurée objet {modified, created}. Le
    changement est strictement RÉTRO-COMPATIBLE : le format legacy (array
    plat de strings) reste accepté en plus du nouveau format, grâce à un
    anyOf dans le JSON Schema. Aucun RFC existant ne devient invalide.
    Aucun code Rust n'est touché car affected_files n'est lu par aucun code
    (champ purement documentaire dans le YAML, indépendant du mécanisme de
    permit qui repose sur target_paths fourni par le CEO).
  tags:
    - rfc-schema
    - affected-files
    - schema
    - companyos-internals
    - friction-permits
    - backward-compatible
  related:
