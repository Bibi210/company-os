api_version: companyos/v1
kind: rfc
metadata:
  id: d9399863-254e-42f5-a485-ea019ce56a93
  title: "Rendre le proxy MCP résilient aux restarts du binaire (buffer + health check + état explicite)"
  author: architect
  created_at: "2026-05-20"
  status: implemented
  approved_at: "2026-05-20T10:15:43.134587077+00:00"
  implemented_at: "2026-05-20"
  description: >
    Rend le proxy MCP (company/plugins/mcp-proxy.mjs) résilient aux restarts du
    binaire Rust déclenchés par cargo build ou reload_config. Introduit un
    parser NDJSON pour framing JSON-RPC, un buffer FIFO des messages stdin
    avec backpressure (pause/resume), un health check actif avant drainage
    (avec respect du drain event), un circuit breaker contre les restart loops,
    une machine à états explicite, et un debounce calibré pour absorber un
    cargo build multi-étape. Met aussi à jour la règle mcp_reconnect dans
    shared-rules.yml pour refléter le nouveau contrat (la règle devient un
    filet de sécurité de dernier recours). Tranche pour un test d'intégration
    scripté en mode standalone pour valider l'acceptance criterion (g).
  tags:
    - mcp
    - proxy
    - resilience
    - hot-reload
    - infrastructure
    - runtime
    - dx
    - revised
