  title: "V1 process lot 1 : 5 gardes serveur/schema (self-review, approve+findings, commit-puis-consume, RFC approved au grant, reviewers minimum) + purge des règles mortes"
  author: architect
  created_at: "2026-06-10"
  status: draft
  description: >
    Lot 1 du durcissement process (diagnostic c981bf62, phase 2 du
    task-request 11f13a9d, domaine v1-process-hardening de la roadmap
    a410bb43). Mécanise dans le harness les 5 règles de process à meilleur
    rapport valeur/coût, toutes violées ou violables silencieusement
    aujourd'hui : self_review_forbidden (aucune garde code),
    review_findings_honesty (violations récurrentes, lesson e63992f0, avec
    ajout du canal notes pour les observations non-correctives),
    commit-puis-consume (violé en session le 2026-06-10),
    grant_write_permit sans vérification du statut du RFC, et
    reviewers_by_artifact_type jamais consommé par le code. Purge en même
    temps les règles mortes : flow-control.budget_limits,
    flow-control.circuit_breaker, review-protocol.escalation_rules
    (déduplication avec flow-control.max_review_iterations, fusion de
    ceo_cannot_approve_alone dans human-review-triggers), et le chargement
    Rust mort de human-review-triggers — avec verrou schema
    (additionalProperties: false) pour que la réintroduction échoue
    mécaniquement (pattern bd4650e2 : retirer plutôt qu'interdire).
  changelog:
    - date: "2026-06-10"
      author: architect
      description: >
        Itération 2 (round 281a5401, request_changes Implementer). Finding
        bloquant corrigé : purge (d) déclare désormais self_review_forbidden
        et review_analysis_framework dans review-protocol.schema.json (sinon
        additionalProperties: false cassait make validate sur la prose
        conservée). Sous-spécifications tranchées : signature de
        engine.submit_vote change (param notes, inventaire ~9 call-sites +
        main.rs L558) ; fixtures grant via db.upsert_artifact avec embedding
        zéros (new_without_embedder ne peut pas indexer) ; sémantique "all"
