  impact: >
    Comportemental (immédiat après approbation et injection dans les personas) :
    - Tout reviewer qui identifie un gap mais voulait voter approve doit désormais voter
      request_changes. Il n'existe plus de voie médiane légitimée par le système.
    - Les review-reports avec approve + findings correctifs deviennent identifiables comme
      non-conformes. Un reviewer en amont du pipeline peut le signaler.
    - Les workflows de review peuvent allonger légèrement en première itération (plus de
      request_changes initiaux) mais raccourcissent sur la durée (moins d'allers-retours
      post-merge sur des problèmes "approuvés" mais jamais corrigés).

    Scope : tous les personas (shared-rules est injecté globalement). Aucun changement de schéma,
    aucun changement de code Rust, aucune migration de données. Le changement est purement
    sémantique et comportemental.

    Risque principal : sur-interprétation. Certains reviewers pourraient hésiter à approuver
    même quand l'artifact est réellement bon, par peur de paraître laxistes. La règle de
    décision (a)/(b) est conçue pour adresser cela : si rien ne mérite d'être corrigé,
    approve est le bon verdict. La règle ne crée pas de biais vers request_changes — elle
    supprime la fausse catégorie intermédiaire.

  rollback_plan: >
    Si la règle crée des effets indésirables (blocage excessif des reviews, spirales de
    request_changes sur des détails mineurs), procéder comme suit :
    1. Émettre un nouveau RFC pour amender ou retirer la règle `review_findings_honesty`.
    2. En attendant l'approbation du RFC d'amendement, la règle reste active — pas de
       retrait informel via edit direct (zone protégée).
    3. Si le problème est urgent, le CEO peut émettre une note dans un agent-message
       précisant que la règle est suspendue temporairement, en attendant le RFC d'amendement.
    Le rollback complet (suppression de la clé dans shared-rules.yml) nécessite un write
    permit comme toute modification de zone protégée.

  affected_files:
    - company/config/shared-rules.yml
