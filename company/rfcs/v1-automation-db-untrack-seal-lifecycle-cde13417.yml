metadata:
  id: cde13417-5014-4bf5-9daa-edc3f6d257a6
  title: "V1 automation : sortir orchestrator.db de git (seal dédié permits-seal.json), auto-commit des transitions lifecycle serveur, rappel task-requests non clos"
  author: architect
  created_at: "2026-08-14"
  status: draft
  description: >
    Solde le domaine v1-automation (task-request 3779b2a7, recensement
    672a141a, roadmap a410bb43) avec les trois automatisations retenues.
    A1 (structurel) : company/data/orchestrator.db sort du versionnement
    git ; le scellement des permits (RFC 359f9162) committe désormais un
    fichier dédié minimal company/data/permits-seal.json (export JSON
    canonique de la table write_permits, écrit par le serveur, commité en
    pathspec au grant ET au consume) ; la Source B du revert sélectif du
    hook (RFC bde023e2) lit ce JSON en HEAD au lieu de matérialiser un
    blob SQLite de 11.5 MiB dans /tmp ; le PILIER D (RFC cdbfee72)
    s'étend : write_permits devient reconstructible au boot depuis le
    seal en HEAD. Invariant de sécurité préservé à l'identique :
    baseline = union(snapshot, HEAD), nucléaire borné au cas
    baseline-indéterminable. Mesures motivantes : 94 blobs de DB dans
    l'historique (696 MiB non compressés, .git 310 MiB), état M permanent
    du working tree. A2 : les écritures lifecycle serveur
    (close_review_round auto-approve, rfc_set_implemented) sont
    auto-committées en pathspec (plus d'écritures serveur orphelines dans
    le worktree entre sessions). A3 : rfc_set_implemented rappelle
    (famille M19, non bloquant) les task-requests liés encore non clos ;
    la clôture reste une décision LLM. Touche les zones protégées
    crates/, company/plugins/ et company/config/protected-zones.json
    (trigger humain access-matrix : user_approval_confirmed requis au
    grant).
  tags:
    - companyos-v1
    - automation
    - bookkeeping
    - write-permit
