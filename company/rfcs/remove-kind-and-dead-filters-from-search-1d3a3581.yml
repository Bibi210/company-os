kind: rfc
metadata:
  id: 1d3a3581-db81-4c95-9973-2cbae7be35df
  status: approved
  approved_at: "2026-06-05T19:35:02.650394342+00:00"
  title: "Retrait du filtre kind (et des filtres morts author/project/dates) de la surface MCP search ; conservation de tags et id_prefix"
  author: architect
  created_at: "2026-06-05"
  description: >
    Suite au task-request e362e438 (décision utilisateur) et au
    diagnostic-report 655f74d7 (mesure d'usage empirique des six filtres
    structurés introduits par le RFC bdee1af4). Retire le paramètre kind
    du tool MCP search, ainsi que les trois filtres author, project et
    created_after/created_before pour lesquels le diagnostic n'a relevé
    AUCUN signal d'usage interne ni aucune mention dans les règles ou
    workflows (cargo-cult d'API, lesson 02b8e1ce). Conserve tags
    (raffinement thématique légitime) et id_prefix (raccourci de lookup
    déterministe par UUID). Conserve le champ interne SearchFilters.kinds
    (utilisé par la branche list-mode et par list_by_kind) pour préserver
    la capacité de listing en vue d'un futur tool list_artifacts.
    Supprime la fonction legacy engine.search(query, kind, limit),
    confirmée code mort (zéro caller interne). Met à jour les deux
    occurrences de search(query, kind="lesson-learned") dans
    shared-rules.yml et le guide opérateur docs/search-guide.md. Breaking
    change contrôlé sur la surface MCP search (retrait pur, pas de
    deprecation graceful). Touche les zones protégées crates/orchestrator/,
    crates/mcp-servers/orchestrator/, et company/config/shared-rules.yml.
    Approbation CEO et write permit requis.
  tags:
    - search
