api_version: companyos/v1
kind: rfc
metadata:
  id: eb42a8de-e6a9-4f7b-81d1-c91d7120b626
  title: "Discipline d'inventaire des callers d'API publique : instrumentation des personas Architect et Implementer"
  author: architect
  created_at: "2026-06-05"
  status: implemented
  implemented_at: "2026-06-05T18:56:54.477420001+00:00"
  approved_at: "2026-06-05T09:45:20.297025368+00:00"
  description: >
    Formalise la discipline « lister exhaustivement les callers avant
    de changer une signature d'API publique de crate » en l'inscrivant
    directement dans les personas Architect et Implementer, sans tool
    MCP ni modification de schema. L'Architect recense les callers
    (rg / get_references LSP) avant de figer une signature dans un
    design-doc ou RFC, pour garantir l'exhaustivité d'affected_files.
    L'Implementer refait le recensement avant de modifier la signature,
    pour capter les callers ajoutés depuis le RFC, et signale toute
    divergence avec le périmètre du permit. Ferme la classe d'incidents
    recensée par le diagnostic 56513173 (callers oubliés dans 062ebaa8
    et bdee1af4) en attribuant la discipline aux agents qui font déjà
    le raisonnement, sans couche d'outillage intermédiaire.
  tags:
    - workflow
    - api
    - callers
    - rfc-discipline
    - permits
    - friction-reduction
    - personas
    - companyos-internals
