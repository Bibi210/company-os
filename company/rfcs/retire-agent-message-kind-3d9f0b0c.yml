  description: >
    Retire integralement le kind agent-message de CompanyOS. Decision
    utilisateur (task-request 95e93649) : ce kind est legacy, non utilise
    en pratique ; les sub-agents communiquent avec le PM via le retour du
    Task tool. Le RFC supprime la machinerie active du kind : schema JSON,
    variante de l'enum Rust ArtifactKind et ses branches/tests, branche
    d'embedding, reference dans un test d'integration, entrees dans
    shared-rules.yml (artifact_catalog, file_placement, exclusion
    lesson_after_every_artifact), prefixe dans le plugin defense-in-depth,
    reformulation d'une rules.must de la persona implementer (RFC eb42a8de)
    qui mentionnait agent-message comme canal, et supprime les 11 artifacts
    existants + leur dossier. S'appuie sur le recensement exhaustif du
    diagnostic e4ff736b, complete par le recheck caller-inventory de
    l'iteration 2. Touche des zones protegees (schema, crates/, config,
    plugin, persona) : approbation CEO + write permit requis.
