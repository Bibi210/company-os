  id: a4ee8b6a-ebcd-4a76-96eb-7e31785c8ae6
  title: "V1 process lot 2 : 7 mécanismes de durcissement (schemas triaxial et design-doc stricts, placement kind-chemin, supersede_artifact, gate reload_config, CEO no-write, permit lié à son bénéficiaire)"
  author: architect
  created_at: "2026-07-03"
  status: implemented
  implemented_at: "2026-07-11T14:53:53.568871399+00:00"
  approved_at: "2026-07-03T16:31:32.200079386+00:00"
  description: >
    Lot 2 du durcissement process (recensement c981bf62 items 7 à 13,
    task-request 0935d0df, suite du lot 1 implemented RFC 8bf78218,
    domaine v1-process-hardening de la roadmap a410bb43). Sept mécanismes
    valeur haute, sans violation observée : (7) schema review-report
    triaxial structurel (spec.axes nominal/negative/edge REQUIS, sans
    anyOf : zéro review-report YAML existant, vérifié), (8) schema
    design-doc exigeant components et decisions (strict, sans anyOf ni
    migration : les 12 design-docs existants sont déjà conformes,
    vérifié), (9) validation kind-chemin dans companyos-yaml-validator
    (table de placement, hook + pre-commit + make validate gratuits,
    interfaces inchangées), (10) tool MCP supersede_artifact à deux
    écritures atomiques + warning d'asymétrie à l'indexation (lesson
    9b2c1951, pattern serveur rfc_set_implemented sans permit),
    (11) reload_config refuse si des permits actifs subsistent,
    (12) hook : write/edit/mcp_write/mcp_edit bloqués pour agent==ceo
    (+ purge de la promesse morte produces: lesson-learned de ceo.yml),
    (13) hook : hasActivePermit exige granted_to == agent écrivain.
    Après ce lot : 23 des 62 règles du recensement survivent au test
    clean-company comme garanties mécaniques (16 aujourd'hui).
