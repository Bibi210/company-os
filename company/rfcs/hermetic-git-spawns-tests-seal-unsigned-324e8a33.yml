api_version: companyos/v1
kind: rfc
metadata:
  id: 324e8a33-db8a-46d8-aea9-78e2fa050d60
  title: "Hotfix : hermétiser les spawns git des tests contre la config utilisateur + seal machine non signé"
  author: architect
  created_at: "2026-07-11"
  status: approved
  approved_at: "2026-07-11T15:23:59.177507948+00:00"
  description: >
    Hotfix débloquant make ci (rouge sur HEAD depuis la réactivation de
    commit.gpgsign=true dans ~/.gitconfig ; le pre-commit bloque tout commit).
    Rend hermétiques tous les spawns git des TESTS (helpers Rust du module tests de
    l'orchestrator MCP + helper gitCommitDb du harness mjs defense-in-depth) via
    GIT_CONFIG_GLOBAL=/dev/null, GIT_CONFIG_SYSTEM=/dev/null, identité locale et
    commit.gpgsign=false explicite. Tranche aussi le cas PRODUCTION : le commit de
    scellement machine de seal_db_commit (RFC 359f9162) passe en
    -c commit.gpgsign=false, car un pinentry bloquant pendant un grant tiendrait
    l'engine lock et ferait échouer tout grant en environnement gpgsign=true (celui
    d'aujourd'hui), pour une signature qu'aucun consommateur ne vérifie. Généralise la
    lesson 1afcbe17 au canal config (le fix 916bf1d ne couvrait que les variables GIT_*).
  tags:
    - git
    - gpg
    - gpgsign
    - pinentry
    - hermeticite
    - environment-leak
    - ci
    - testing
    - harness
    - hotfix
    - write-permit
    - atomicity
    - companyos-internals
    - critical-infra
