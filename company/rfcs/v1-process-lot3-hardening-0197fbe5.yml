spec:
  motivation: >
    Le recensement c981bf62 (62 règles) a classé 16 règles mécanisables ;
    les lots 1 (violations observées) et 2 (valeur haute) en ont fermé 12.
    Ce lot 3 ferme les 4 restantes (items 14-19 : A14, D23/D24/D26, E32,
    A3, E47b, A11) et solde deux frictions découvertes au lot 2.

    (14) PRÉ-CHECK DE PÉRIMÈTRE AU GRANT — l'item le plus rentable du lot,
    OBLIGATOIRE par le task-request. TROIS incidents de la même classe :
    fichier à créer oublié du permit (lesson 611fde3e, blocage hook +
    permit complémentaire b4f09f5d) ; types.rs oublié pendant la refonte
    search ; tests/ top-level raté au lot 1 MALGRÉ deux lessons et une
    règle persona (lesson 1bb07073 : troisième occurrence APRÈS la
    formalisation en persona eb42a8de, dont le sanity-check AC6 avait
    prédit mot pour mot que la prose ne serait qu'un déplacement de
    probabilité). La conclusion empirique de 1bb07073 est exactement le
    mécanisme proposé ici : comparer l'union des affected_files du RFC aux
    target_paths AVANT le grant, de manière déterministe, plutôt que de
    laisser un agent composer le périmètre à la main.

    (15) TRIGGERS HUMAINS PATH-MATCHABLES — human-review-triggers.yml est
    la SOURCE UNIQUE des conditions d'escalade utilisateur (lot 1, fusion
    de ceo_cannot_approve_alone) mais AUCUN code ne l'évalue : le lot 1 a
    même purgé son chargement Rust mort. Trois des quatre triggers sont
    des conditions de path-matching pur (D23 protected-zones.json, D24
    ceo.yml, D26 suppression sous company/personas/) : de la prose CEO
    jamais évaluée par une machine, sur les fichiers les plus sensibles du
    système. Le lot 2 a d'ailleurs dû SIGNALER manuellement dans son
    propre texte que modifier ceo.yml déclenchait D24 — preuve que le
    trigger ne vit que si un agent pense à le lire.

    (16) MATRICE AUTHOR-PRODUCES — E32 : rien n'empêche un design-doc
    author: pm ou un implementation-plan author: architect. La config
    personas est parsée par crates/config (champ CompanyConfig.personas)
    avec ZÉRO caller — le hors-scope explicite du lot 1 désignait ce lot
    comme son consommateur naturel. Vérification empirique préalable
    (scan des 191 artifacts indexables) : 21 artifacts historiques
    violeraient une lecture littérale des produces, dont 13
    diagnostic-reports author: architect (recensements et investigations,
    y compris c981bf62 lui-même) — ce qui prouve que les produces des
    personas sont INCOMPLETS par rapport à l'artifact_catalog qui déclare
    diagnostic-report et lesson-learned productibles par tout agent. La
    mécanisation doit donc commencer par réconcilier la source de vérité.

    (17) INTÉGRITÉ RÉFÉRENTIELLE DES RELATED — A3 : la structure des
    related est validée (schema) mais pas leur résolution. Vérification
    empirique : 2 liens pendants réels dans le corpus actuel, dont un TYPO
    d'UUID (le RFC c129453c référence c981bf62-3f28-... au lieu de
    c981bf62-9d53-... : préfixe correct, suffixe corrompu). Le graphe de
    connaissances a déjà des arêtes mortes silencieuses ; related() les
    retourne vides sans que personne ne le voie.

    (18) WRITE_PERMIT_GATE PLAN-APPROUVÉ — E47b : la séquence prose exige
    un implementation-plan approuvé avant le permit quand le RFC touche du
    code, mais le grant ne vérifie que le statut du RFC (GARDE 4, lot 1).
    Les données nécessaires existent : les relations plan→RFC sont dans
    l'index (table artifact_relations, bidirectionnelle), les rounds et
    leurs votes sont en DB (compute_consensus est recalculable).

    (19) RAPPELS DE CAPITALISATION — A11 : lesson_after_every_artifact est
    intrinsèquement prose (une lesson forcée serait de la complaisance),
    mais les MOMENTS déclencheurs (RFC implemented, diagnostic resolved)
    sont détectables mécaniquement. Un rappel non bloquant au bon moment
    outille la règle sans la dénaturer.

    (20) PERSONAS.YML — friction lot 2 : company/config/personas.yml
    (généré par le plugin defense-in-depth pour l'injection instructions
    d'opencode.json, SANS api_version) est rejeté par le pre-commit
    (validator --file exit 1, vérifié en vif : InvalidApiVersion). Sa
    régénération au boot est revertée par le hook (pas de permit), son
    commit est bloqué par le pre-commit : il est donc PÉRIMÉ (il affiche
    encore ceo produces: lesson-learned, purgé par le lot 2). Un fichier
    injecté dans le system-prompt de TOUS les agents qui ment sur les
    contrats des personas est pire qu'inutile.

    (21) WARNINGS REINDEX_ALL — friction lot 2 : le mécanisme 10c prévoyait
    que reindex_all loggue les warnings de supersession via tracing::warn,
    mais la dépendance tracing est absente du crate orchestrator (vérifié
    Cargo.toml) : reindex_all ne surface AUCUN warning aujourd'hui. Les
    items 16 et 17 ajoutent des familles de warnings : le canal doit
    exister.

  proposal: >
    MÉCANISME 14 : pré-check de périmètre au grant (couche : serveur MCP +
    engine ; NON BLOQUANT — le CEO peut avoir raison de scoper plus étroit,
    préférence 4e5c109b : le LLM juge, l'algorithme signale).
    a) grant_write_permit lit DÉJÀ le YAML du RFC pour la GARDE 4. Nouvelle
       méthode engine.rfc_scope_warnings(root, rfc_file_path,
       &target_paths) -> Vec<String> : extrait spec.affected_files (FORME A
       array plat, ou FORME B objet {modified, created, deleted — cf.
       mécanisme 15c}), calcule l'UNION, et pour chaque fichier de l'union
       vérifie qu'au moins un target_path le couvre. La sémantique de
       couverture est CELLE DES PERMITS : la fonction privée
       db::path_matches (exact, préfixe, glob) passe pub(crate) et est
       réutilisée telle quelle — pas une 4e implémentation du matching
       (l'unification des 3 existantes reste réservée à
       v1-harness-refactor).
    b) Chaque fichier non couvert produit un warning explicite ("RFC
       affected_files: <path> n'est couvert par aucun target_path — si ce
       fichier sera écrit pendant l'implémentation, le hook la bloquera ;
       étendre target_paths ou assumer le scoping étroit"). Un RFC SANS
       affected_files produit un warning dédié ("pré-check de périmètre
       impossible : le RFC ne déclare pas affected_files").
    c) Les warnings sont retournés dans la RÉPONSE JSON du grant (champ
       scope_warnings de permit_response_json, présent aussi sur le rejeu
       idempotent) : visibles du CEO au moment exact d'émettre, ce qui est
       tout l'objet (fermer la boucle AVANT le blocage hook, pas après).
       Le grant n'est JAMAIS refusé pour un gap de scope.

    MÉCANISME 15 : triggers humains path-matchables (couche : serveur MCP +
    schema + config YAML ; BLOQUANT — c'est la nature d'un trigger humain :
    exiger une affirmation explicite, pas la suggérer).
    a) human-review-triggers.yml gagne un consommateur code. Chaque trigger
       path-matchable gagne un bloc machine-readable optionnel `match` :
       - "rfc modifies access matrix" (D23) : match {paths:
         [company/config/protected-zones.json], on: any}
       - "rfc modifies ceo persona" (D24) : match {paths:
         [company/personas/ceo.yml], on: any}
       - "rfc deletes persona" (D26) : match {paths:
         [company/personas/*], on: deleted}
       - "rfc introduces breaking schema change" (D25) : PAS de match —
         qualifier "breaking" est un jugement sémantique, reste prose CEO
         (classement du recensement, inchangé).
       Sémantique de `on` : any = évalué contre les target_paths du grant
       (comme patterns, via path_matches — un glob target qui COUVRE le
       fichier déclenche, comportement conservateur) ET contre l'union
       affected_files du RFC (littéraux) ; deleted = évalué contre
       affected_files.deleted uniquement (une suppression n'est pas
       inférable des target_paths).
    b) grant_write_permit évalue les triggers APRÈS la GARDE 4 et AVANT
       l'idempotence, par LECTURE FRAÎCHE de
       company/config/human-review-triggers.yml à chaque grant (pas de
       cache ni de hot-reload à plomber : le grant est rare, la fraîcheur
       prime ; types de parsing locaux, le chargement boot purgé au lot 1
       n'est PAS ressuscité). Si au moins un trigger matche et que le
       nouveau paramètre optionnel user_approval_confirmed != Some(true) :
       REFUS avec erreur listant chaque trigger déclenché et le fix
       ("obtenir l'accord utilisateur (ou agir sous délégation documentée),
       puis rappeler grant_write_permit avec user_approval_confirmed=true").
       Le flag accepté est repris en écho dans la réponse JSON du grant (champ
       user_approval_confirmed) pour la trace d'audit ; pas de colonne DB
       (pas de migration, la réponse + le cycle de review du RFC portent la
       trace). Fail-safe : si human-review-triggers.yml est illisible ou
       invalide, le grant est REFUSÉ avec une erreur distincte (même
       philosophie que GARDE 3 quand git est indisponible : un garde-fou
       qui ne peut pas être évalué ne laisse pas passer).
    c) company/schemas/rfc.schema.json : la FORME B d'affected_files gagne
       une clé optionnelle `deleted` (array de strings, "fichiers existants
       qui seront SUPPRIMÉS"). C'est le signal machine-readable dont D26 a
       besoin, et l'union du mécanisme 14 l'inclut (une suppression en zone
       protégée est une écriture au sens du hook). Additif pur : anyOf
       inchangé, FORME A toujours valide.
    d) company/schemas/human-review-triggers.schema.json : déclaration du
       bloc match {paths: array minItems 1, on: enum [any, deleted]},
       required [paths, on], additionalProperties: false sur match, sur les
       items triggers ET sur spec (verrou pattern bd4650e2, cohérent avec
       les schemas durcis des lots 1-2 ; les 3 clés existantes
       condition/action/description restent déclarées).
    e) Résiduels documentés : un RFC qui MENT (suppression non déclarée
       dans deleted) échappe à D26 — c'est le rôle de la review du RFC et
       de la prose CEO ; et modifier human-review-triggers.yml lui-même
       n'est couvert par aucun trigger (méta-trou préexistant, zone
       protégée + cycle RFC restent la garde ; signalé au CEO, hors scope).

    MÉCANISME 16 : matrice author-produces à l'indexation (couche : engine ;
    NON BLOQUANT — décision tranchée : WARNING, pas rejet. Un artifact
    présent sur disque mais refusé à l'indexation deviendrait INVISIBLE de
    search() : pour la mémoire collective, c'est pire que la violation
    qu'on veut signaler. Le blocage dur n'est pas justifié par le
    recensement, qui classe E32 "valeur moyenne, violation rare").
    a) PRÉALABLE — réconcilier la source de vérité : le scan empirique
       montre 13 diagnostic-reports author: architect et 2 author: pm,
       légitimes selon l'artifact_catalog ("peut être produit par tout
       agent confronté à un problème technique") mais absents des produces.
       Les persona YAML sont mis en cohérence avec le catalog :
       - architect.yml : produces += diagnostic-report, review-report
       - pm.yml : produces += diagnostic-report, review-report
       - implementer.yml : produces += review-report
       (review-report : "produit par le reviewer désigné" — tout persona
       review ; ceo.yml reste produces: [] — le CEO n'écrit pas de
       fichiers, mécanisme 12 du lot 2). La matrice mécanique lit alors
       UNIQUEMENT les persona YAML : pas de constante "kinds universels"
       en dur dans le code qui divergerait de la config (le pattern de
       duplication que le recensement dénonce).
    b) Nouvelle méthode engine.author_produces_warnings(root, &artifact)
       -> Vec<String> : lit company/personas/<author>.yml (lecture directe
       du YAML, fraîche), et si artifact.kind n'est pas dans
       artifacts.produces, émet un warning ("author '<author>' ne produit
       pas le kind '<kind>' selon sa persona (artifacts.produces) —
       vérifier l'attribution ou amender la persona par RFC").
    c) Périmètre et rétro-compat, tranchés :
       - KINDS SYSTÈME EXEMPTS : persona, project-config, flow-control,
         review-protocol, human-review-triggers — artifacts de gouvernance,
         author: ceo par convention historique, gardés par les zones
         protégées + cycle RFC, aucun produces ne les revendique.
       - AUTHOR INCONNU (pas de persona YAML) : skip silencieux — vérifier
         l'existence des personas n'est pas le job de ce check.
       - CUTOFF HISTORIQUE : les artifacts avec metadata.created_at
         antérieur au 2026-07-12 (constante documentée
         AUTHOR_PRODUCES_CUTOFF, date de ce RFC) sont exempts. Cela couvre
         les 4 lessons author: ceo (2026-03-15, produces purgé au lot 2 —
         on ne réécrit pas l'histoire, author est factuel) et les 2 RFCs
         early author: ceo/pm (2026-03-15). Vérifié : après réconciliation
         (a) + exemptions (c), le corpus actuel de 191 artifacts produit
         ZÉRO warning — le check ne crie que sur les violations futures.

    MÉCANISME 17 : validation référentielle des related[].id (couche :
    engine + db ; NON BLOQUANT, imposé par le task-request).
    a) Surface single-file : engine.related_integrity_warnings(&artifact) :
       pour chaque related[].id de l'artifact indexé, db.get_artifact(id) ;
       si introuvable, warning ("related[].id <id> introuvable dans l'index
       — lien pendant : id erroné (typo ?) ou artifact supprimé/jamais
       créé"). Edge documenté : deux artifacts neufs se référencant
       mutuellement peuvent produire un faux warning transitoire selon
       l'ordre d'écriture (non bloquant, disparaît à l'indexation du
       second ; reindex_all n'a pas ce problème).
    b) Surface bulk (reindex_all) : passe SQL unique APRÈS l'indexation
       complète (SELECT source_id, target_id FROM artifact_relations WHERE
       target_id NOT IN (SELECT id FROM artifacts)) — aucune sensibilité à
       l'ordre de parcours, coût une requête.
    c) Les 2 liens pendants existants (typo c981bf62-3f28 dans le RFC
       c129453c ; cible 4ade4e7c disparue du diagnostic 56513173)
       remonteront comme warnings dès le premier reindex_all : c'est le
       comportement VOULU (valeur immédiate du mécanisme) ; leur correction
       est un suivi éditorial PM hors scope de ce RFC.

    MÉCANISME 18 : write_permit_gate plan-approuvé (couche : serveur MCP +
    engine + db ; NON BLOQUANT — décision tranchée : WARNING dans la
    réponse du grant, pas refus. Justification : (i) les review rounds
    sont des données ÉPHÉMÈRES perdues à chaque autorepair PILIER D
    (dette documentée, lesson 611fde3e) — un blocage dur rendrait le grant
    impossible après un autorepair alors que le plan a réellement été
    approuvé ; (ii) le lien plan→RFC dans metadata.related n'est imposé
    par aucun mécanisme — un plan légitime non lié produirait un faux
    blocage ; (iii) le CEO au moment du grant est exactement le bon juge
    pour ce signal, préférence 4e5c109b. La faisabilité du check lui-même
    est CONFIRMÉE : relations bidirectionnelles en DB (artifact_relations,
    consommées par le tool related), rounds + votes en DB avec
    compute_consensus recalculable).
    a) Au grant, si l'union affected_files du RFC (mécanisme 14, déjà
       calculée) touche crates/** ou company/plugins/** (du code) :
       résoudre les relations de rfc_id (deux directions), filtrer
       kind == implementation-plan.
       - Aucun plan lié → warning ("le RFC touche du code mais aucun
         implementation-plan lié n'existe dans l'index
         (write_permit_gate) — vérifier que le plan existe et le lier au
         RFC via metadata.related").
       - Plan(s) lié(s) : nouvelle méthode
         db.list_rounds_by_artifact_path(path) (comparaison sur chemins
         relatifs normalisés — même forme que file_path de l'index) ; si
         AUCUN round du plan n'est status Closed avec
         compute_consensus == ConsensusReached (recalculé depuis les votes
         stockés), warning ("plan <id8> lié mais aucun review round fermé
         en consensus trouvé — NB : les rounds sont éphémères, perdus à
         l'autorepair ; si le plan a été approuvé avant un autorepair, ce
         warning est un faux positif attendu").
    b) Warnings retournés dans le même champ scope_warnings que le
       mécanisme 14 (un seul canal de signal au grant).

    MÉCANISME 19 : rappels de capitalisation non bloquants (couche :
    serveur MCP + engine + db).
    a) Nouvelle méthode db.has_linked_lesson(id) -> bool : existe-t-il une
       relation (dans un sens ou l'autre) entre id et un artifact
       kind == lesson-learned.
    b) rfc_set_implemented : la réponse JSON gagne un champ optionnel
       capitalization_reminder quand aucune lesson n'est liée au RFC
       ("RFC implemented sans lesson liée — la règle
       lesson_after_every_artifact attend une capitalisation : chercher
       une lesson existante (search), puis créer/améliorer et lier via
       metadata.related"). Additif, jamais une erreur.
    c) Diagnostic resolved : nouvelle méthode
       engine.capitalization_reminders(root, &artifact) — si
       kind == diagnostic-report ET spec.status == resolved (lu du YAML)
       ET !has_linked_lesson : rappel analogue. Émise UNIQUEMENT sur les
       surfaces single-file (tool index_artifact, index_now, CLI --index —
       donc au moment où le hook auto-indexe l'écriture qui passe le
       diagnostic à resolved), PAS dans reindex_all : le rappel concerne le
       MOMENT de la résolution ; en bulk, il spammerait chaque rebuild avec
       l'historique des diagnostics resolved sans lesson (distinct des
       warnings d'INTÉGRITÉ 16/17 qui décrivent un état défectueux
       permanent et appartiennent aussi au bulk).

    MÉCANISME 20 : personas.yml généré, exempté et réconcilié (couche :
    crate validation + données).
    a) DÉCISION (parmi les trois options du task-request) : EXEMPTION
       EXACTE dans le validator — ni en-tête d'artifact (personas.yml
       n'est PAS un artifact : c'est une VUE générée pour l'injection
       opencode.json instructions ; lui donner un kind exigerait un schema,
       un id stable dans un générateur, une entrée de placement et une
       pollution de l'index pour un cache de prompt), ni déplacement hors
       company/config/ (opencode.json et protected-zones.json
       personas_out le référencent ; le déplacer modifie protected-zones
       .json, déclenche D23 et casse l'injection au premier boot d'un
       clone frais), ni exclusion bash dans le pre-commit seul (patch
       d'une seule surface, dupliquerait la connaissance du chemin).
       L'exemption dans ArtifactValidator (validate_file + validate_dir,
       chemin relatif exact company/config/personas.yml, même machinerie
       de résolution root que l'exception shared-rules.yml du module
       placement, lot 2) rend hook --file, pre-commit et make validate
       cohérents GRATUITEMENT — un seul point de vérité, mécanisé.
       validate_file retourne un rapport valide avec note "generated
       file, skipped (not an artifact)" ; validate_dir idem (aujourd'hui
       le batch le tolère déjà via l'erreur InvalidApiVersion, le test
       tests/integration/edge_cases.rs accepte les deux formes, vérifié).
       Résiduel assumé : un personas.yml corrompu ne serait plus signalé
       par le schema — gardes restantes : l'en-tête "do not edit", la zone
       protégée (permit requis pour l'éditer), et les tests du générateur
       (company/plugins/tests/hot-reload.test.mjs).
    b) RÉCONCILIATION : les éditions des persona YAML du mécanisme 16a
       déclenchent la régénération automatique par le wrapper
       defense-in-depth (onProtectedZoneWrite → generatePersonasYml,
       mécanisme existant) SOUS le permit de ce RFC qui couvre
       company/config/personas.yml ; le fichier régénéré (qui reflète
       enfin ceo produces: [] du lot 2 ET les produces réconciliés du 16a)
       est committé — désormais possible puisque le pre-commit ne le
       rejette plus. La régénération au boot redevient un no-op idempotent
       (contenu identique à HEAD → pas de diff → pas de revert hook).

