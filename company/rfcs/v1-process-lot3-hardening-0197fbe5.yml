    - date: "2026-07-14"
      author: architect
      description: >
        SCOPE AMENDMENT (RFC approved — aucune décision modifiée, uniquement
        le recensement de périmètre) : ajout de crates/orchestrator/src/lib.rs
        à affected_files.modified (17 → 18 paths). Le ré-export public de
        ReindexOutcome (M21, reindex_all retourne {count, warnings}) figurait
        au plan bca90818 mais le fichier lib.rs qui le porte avait été omis
        de l'inventaire affected_files du RFC. Quatrième occurrence de la
        classe 611fde3e (fichier hors périmètre du permit découvert à
        l'exécution) — que le mécanisme M14 de ce même RFC (pré-check de
        périmètre au grant) aurait attrapé une fois livré. Permit
        complémentaire 62dddab7 émis sur demande utilisateur. Précédent :
        amendement 021ef0f du lot 1 (RFC 8bf78218, même procédure).
  description: >
    Lot 3 et dernier du durcissement process (recensement c981bf62 items 14
    à 19 + frictions 20-21 du lot 2, task-request b9dbcff9, suite des lots
    1 (RFC 8bf78218) et 2 (RFC a4ee8b6a) implemented, domaine
    v1-process-hardening de la roadmap a410bb43). Huit mécanismes, TOUS
    retenus (zéro rescope) : (14) pré-check de périmètre au grant — union
    affected_files modified+created+deleted du RFC comparée aux
    target_paths, WARNING non bloquant dans la réponse du grant (3
    incidents observés, lessons 611fde3e/1bb07073) ; (15) triggers humains
    path-matchables D23/D24/D26 — champs machine-readable `match` dans
    human-review-triggers.yml (qui gagne enfin un consommateur code),
    BLOCAGE dur du grant sans user_approval_confirmed=true, +
    affected_files.deleted au schema RFC ; (16) matrice author-produces à
    l'indexation — WARNING, source unique personas (produces des persona
    YAML mis en cohérence avec l'artifact_catalog), cutoff created_at pour
    l'historique ; (17) validation référentielle des related[].id —
    WARNING (2 liens pendants réels trouvés dont un typo d'UUID) ; (18)
    write_permit_gate plan-approuvé — WARNING au grant quand le RFC touche
    du code sans implementation-plan lié dont un round est fermé en
    consensus (rounds éphémères, blocage dur écarté) ; (19) rappels de
    capitalisation non bloquants sur rfc_set_implemented et diagnostic
    resolved ; (20) personas.yml auto-généré exempté de la validation
    artifact par le validator (fichier généré, exemption exacte, toutes
    surfaces cohérentes) et réconcilié avec ses sources ; (21) reindex_all
    retourne {count, warnings} (changement de signature, 9 call-sites
    inventoriés workspace entier). Après ce lot : 27 des 62 règles du
    recensement survivent au test clean-company comme garanties mécaniques
    (23 aujourd'hui), et les 16 règles mécanisables du recensement sont
    toutes traitées.
