metadata:
  id: 973a5569-ec7e-4ee0-a868-2314e3cd5bd4
  title: "Discipline de migration de schéma SQL : PRAGMA user_version + migrations numérotées ordonnées idempotentes + tests de transition entérinés"
  status: implemented
  implemented_at: "2026-06-05T19:52:08.036786673+00:00"
  approved_at: "2026-06-04T09:05:20.430831785+00:00"
  author: architect
  created_at: "2026-06-04"
  description: >
    Formalise une discipline générale de migration du schéma SQLite de
    l'orchestrator. Aujourd'hui migrate() (crates/orchestrator/src/db.rs)
    applique le schéma par "étapes" implicites non versionnées : un bloc
    SCHEMA_SQL/FTS_SQL/VEC_TABLE_SQL transactionnel, puis une boucle
    ALTER TABLE ADD COLUMN hors transaction avec matching de string sur
    "duplicate column", puis un step 2bis (le hotfix 57019e7) qui crée des
    index APRÈS les ALTER, puis un step 3 de détection de drift FTS. Il n'y
    a aucun PRAGMA user_version ni table schema_version : l'ordre correct
    repose entièrement sur la mémoire de l'auteur (la classe de bug du
    hotfix). Ce RFC introduit un registre de migrations numérotées,
    ordonnées et idempotentes, piloté par PRAGMA user_version, applique
    seulement les migrations manquantes au boot, refuse proprement une DB
    de version future, intègre le hotfix 57019e7 dans le registre (cleanup
    du contournement), et exige des tests de transition ENTÉRINÉS dans la
    suite cargo test (DB vierge / legacy / à jour / reprise / version
    future). Touche la zone protégée crates/ : approbation CEO + write
    permit requis.
  tags:
    - sqlite
    - schema-migration
