metadata:
  id: 1c0f2570-71e2-4f02-ac4f-81e406b22568
  title: "Tool MCP rfc_set_implemented(id) — transition approved -> implemented pilotée serveur, sans permit ad-hoc"
  status: approved
  approved_at: "2026-06-03T22:02:26.406521061+00:00"
  author: architect
  created_at: "2026-06-03"
  description: >
    Ajoute un tool MCP rfc_set_implemented(id) côté orchestrator qui fait
    passer un RFC de status: approved à status: implemented sans
    nécessiter de write permit sur company/rfcs/ (zone protégée). Le tool
    réplique EXACTEMENT le pattern déjà éprouvé de close_review_round, qui
    met automatiquement un RFC en status: approved (champ rfc_auto_updated)
    sans permit : l'écriture du YAML est faite par le PROCESSUS SERVEUR
    lui-même via std::fs::write (engine.update_rfc_status_in_file), donc
    en dehors de toute commande bash interceptée par le hook
    defense-in-depth. Le hook ne garde QUE les écritures faites par les
    agents via bash/edit ; les transitions de cycle de vie pilotées par le
    serveur échappent légitimement au permit car elles ne passent jamais
    par le canal surveillé. Le tool valide strictement la transition
    (refus si le RFC n'est pas en approved), met à jour le YAML de manière
    cohérente, et retourne des erreurs explicites. Touche les zones
    protégées crates/ (crates/orchestrator/ et
    crates/mcp-servers/orchestrator/) : approbation CEO + write permit
    requis. Périmètre strictement borné à la transition
    approved -> implemented ; ne touche NI le mécanisme des write permits,
    NI le hook defense-in-depth.
