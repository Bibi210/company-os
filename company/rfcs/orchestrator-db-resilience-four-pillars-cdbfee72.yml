api_version: companyos/v1
kind: rfc
metadata:
  id: cdbfee72-59b9-449c-9e22-2666d8e591e0
  title: "Résilience persistence orchestrator : file lock writer unique, PRAGMA défensifs, graceful shutdown signal-driven, autorepair au boot"
  author: architect
  created_at: "2026-05-27"
  description: >
    Rend la persistence SQLite de l'orchestrator résiliente aux
    scénarios de cycle de vie hostile (restart brutal par le proxy
    résilient RFC d9399863, ouvertures concurrentes par le hook
    defense-in-depth, SIGKILL en cours de transaction). Implémente
    les quatre piliers définis par le design-doc 45c04902 :
    coordination inter-process par flock POSIX (PILIER A),
    configuration WAL défensive uniformisée sur tous les chemins
    d'ouverture (PILIER B), graceful shutdown signal-driven avec
    checkpoint TRUNCATE explicite (PILIER C), autorepair au boot
    par rebuild depuis YAML quand integrity_check échoue (PILIER D).
    Refactor du hook defense-in-depth pour qu'il cesse d'invoquer
    sqlite3 CLI directement sur les QUATRE call sites identifiés
    (hasActivePermit, snapshotPermits, et les deux branches de
    revertPermitTampering) et passe par des outils MCP : un
    existant (check_write_permit) et deux nouveaux
    (snapshot_permits_state, revert_permits_to_snapshot). --index
    devient no-op quand le serveur tient le lock exclusif (le
    file watcher serveur indexe), garantissant l'invariant "un
    seul writer en vie à la fois". Touche les zones protégées
    crates/ et company/plugins/ : approbation CEO + write permit
    requis.
  tags:
    - orchestrator
    - sqlite
    - wal
    - persistence
    - concurrency
    - resilience
    - file-lock
    - graceful-shutdown
    - defense-in-depth
    - critical-infra
  related:
