      relationship: related

spec:
  motivation: >
    Depuis la création de CompanyOS, les fichiers YAML d'artifacts sont nommés avec leur UUID
    complet (ex: ffe3306d-d703-43fd-b11a-d154f67bc719.yml). Ce choix avait l'avantage de
    l'unicité garantie, mais présente de sérieux problèmes opérationnels en pratique :

    1. ILLISIBILITÉ — Un UUID pur ne donne aucune information sur le contenu du fichier.
    Dans un listing `ls` ou dans un `git log`, on voit "7bfc784c-51f3-4d82-a9cf-21351e71e1c1.yml"
    sans savoir s'il s'agit d'un RFC sur le revert defense-in-depth, d'une lesson-learned, ou
    d'un task-request. Il faut ouvrir chaque fichier pour identifier son contenu.

    2. GIT HISTORY ILLISIBLE — Les commits qui modifient un artifact affichent le nom UUID dans
    le diff. "modified: e1ebf14b-34e8-4884-84e6-2458930006ce.yml" est incompréhensible sans
    contexte. "modified: reclassifier-project-config-comme-artifact-projet-e1ebf14b.yml" est
    immédiatement compréhensible.

    3. NAVIGATION REPO DIFFICILE — Parcourir company/rfcs/ ou company/lessons/ avec des UUIDs
    purs est impossible sans l'index. Le repo git lui-même doit être navigable sans outil tiers.
    Un développeur qui clone le repo et fait `ls company/rfcs/` doit comprendre ce qu'il voit.

    4. SLUGS SANS SUFFIXE = COLLISIONS POTENTIELLES — Un slug pur sans suffixe UUID risque des
    collisions pour des artifacts avec des titres similaires. Le suffixe de 8 chars UUID garantit
    l'unicité tout en maintenant la lisibilité.

    5. INCOHÉRENCE EXISTANTE — Certains fichiers ont déjà un nom lisible (clean-code.yml,
    verus-formal-verification.yml) mais sans suffixe UUID, tandis que d'autres sont des UUIDs
    purs. L'absence de convention unifiée crée une incohérence dans le repo.

  proposal: >
    Adopter le format universel suivant pour tous les fichiers YAML d'artifacts CompanyOS :

      <slug-du-titre>-<8-premiers-chars-uuid>.yml

    RÈGLES DE CONSTRUCTION DU NOM :

    1. Slug : dérivé de metadata.title, calculé à la création et immuable (non mis à jour
       si metadata.title change ultérieurement)
       - Normaliser les caractères accentués avant toute autre opération (é→e, è→e, ê→e,
         à→a, â→a, ù→u, û→u, î→i, ô→o, ç→c, etc.)
       - Convertir en lowercase
       - Remplacer tout caractère non alphanumérique (ni lettre ASCII, ni chiffre) par un tiret
         (cette règle couvre tous les cas : espaces, tirets longs —, apostrophes ', +, /,
         (, ), [, ], :, ., et tout autre caractère spécial)
       - Supprimer les tirets multiples consécutifs (-- → -)
       - Supprimer les tirets en début/fin
       - Tronquer le slug à 50 caractères maximum : couper au dernier tiret présent dans les
         50 premiers caractères (pour ne pas couper un mot en plein milieu) ; si aucun tiret
         n'existe dans les 50 premiers caractères, tronquer dur à 50
       - FALLBACK : si le slug résultant est vide (titre entièrement composé de caractères
         non translittérables), utiliser le kind de l'artifact comme slug
         (ex : "rfc", "lesson-learned")

    2. Suffixe UUID : les 8 premiers caractères hexadécimaux de metadata.id
       - Exemple : metadata.id = "ffe3306d-d703-43fd-..." → suffixe = "ffe3306d"
       - Séparateur : tiret (-)

    3. Extension : .yml (jamais .yaml)

    EXEMPLES CONCRETS (application mécanique de l'algorithme) :

    Exemple A — id: 7bfc784c | title: "Fix revert des fichiers untracked dans defense-in-depth (scope complet)"
      1. Pas d'accents
      2. lowercase : "fix revert des fichiers untracked dans defense-in-depth (scope complet)"
      3. non-alnum→- : "fix-revert-des-fichiers-untracked-dans-defense-in-depth--scope-complet-"
      4. dédoublon+trim : "fix-revert-des-fichiers-untracked-dans-defense-in-depth-scope-complet"
      5. longueur 69 > 50 ; dernier - dans les 50 premiers chars est à pos 49 ("-in-")
         → slug = "fix-revert-des-fichiers-untracked-dans-defense-in" (49 chars)
      → fix-revert-des-fichiers-untracked-dans-defense-in-7bfc784c.yml

    Exemple B — id: ffe3306d | title: "Puissance 4 — Proof-Driven Development avec Verus + Rust"
      1. Pas d'accents
      2. lowercase : "puissance 4 — proof-driven development avec verus + rust"
      3. non-alnum→- : "puissance-4---proof-driven-development-avec-verus---rust"
      4. dédoublon+trim : "puissance-4-proof-driven-development-avec-verus-rust"
      5. longueur 51 > 50 ; dernier - dans les 50 premiers chars est à pos 48 ("-verus-")
         → slug = "puissance-4-proof-driven-development-avec-verus" (47 chars)
      → puissance-4-proof-driven-development-avec-verus-ffe3306d.yml

    Exemple C — id: 2492822c | title: "Convention de nommage des fichiers YAML d'artifacts"
      1. Pas d'accents
      2. lowercase : "convention de nommage des fichiers yaml d'artifacts"
      3. non-alnum→- : "convention-de-nommage-des-fichiers-yaml-d-artifacts"
      4. dédoublon+trim : "convention-de-nommage-des-fichiers-yaml-d-artifacts"
      5. longueur 50 = 50 → pas de troncature
      → convention-de-nommage-des-fichiers-yaml-d-artifacts-2492822c.yml

    Exemple D — id: abcd1234 | title: "Créer un project-config au démarrage"
      1. accents : "Creer un project-config au demarrage"
      2. lowercase : "creer un project-config au demarrage"
      3. non-alnum→- : "creer-un-project-config-au-demarrage"
      4. dédoublon+trim : "creer-un-project-config-au-demarrage"
      5. longueur 36 ≤ 50 → pas de troncature
      → creer-un-project-config-au-demarrage-abcd1234.yml

    Exemple E — id: ef012345 | title: "★★★" (fallback slug vide)
      1-5. Tous les caractères sont non-translittérables → slug vide → fallback : kind
      → lesson-learned-ef012345.yml

    FORMAT INTERDIT :
    Tout fichier YAML d'artifact dont le nom correspond au pattern UUID pur est interdit :
      /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.ya?ml$/

    ENFORCEMENT CI — intégration : make ci dépend de check-naming :
    Le script est exposé comme cible Make autonome (`make check-naming`).
    La cible `make ci` existante est enrichie pour dépendre de `check-naming`.
    Le pre-commit existant appelle déjà `make ci` — il n'est PAS modifié. `check-naming`
    s'exécute automatiquement via la dépendance Makefile, sans double exécution.

    Ajouts dans le Makefile :
    ```makefile
    check-naming:
        ./company/scripts/check-artifact-naming.sh .

    ci: check-naming  ## check-naming ajouté comme dépendance de ci
    ```

    Activer le hook une fois la migration terminée (si pas encore configuré) :
    ```bash
    git config core.hooksPath .githooks
    chmod +x .githooks/pre-commit
    ```

    Contenu du script company/scripts/check-artifact-naming.sh :
    ```bash
    #!/usr/bin/env bash
    # Vérifie qu'aucun fichier YAML d'artifact n'est nommé avec un UUID pur.
    # Usage : ./company/scripts/check-artifact-naming.sh [root_dir]
    set -euo pipefail
    ROOT="${1:-.}"
    UUID_PATTERN='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.ya?ml$'
    FOUND=0
    while IFS= read -r -d '' file; do
      basename=$(basename "$file")
      if echo "$basename" | grep -qE "$UUID_PATTERN"; then
        echo "ERROR: UUID filename forbidden: $file" >&2
        FOUND=1
      fi
    done < <(find "$ROOT/company" "$ROOT/projects" \( -name '*.yml' -o -name '*.yaml' \) -print0 2>/dev/null)
    if [ "$FOUND" -eq 1 ]; then
      echo "FAIL: rename artifact files to <slug>-<8chars-uuid>.yml format" >&2
      exit 1
    fi
    echo "OK: all artifact filenames conform to naming convention"
    ```

    ORDRE D'ACTIVATION — migration atomique obligatoire :
    Le hook CI NE DOIT PAS être activé avant que la migration soit complète. L'ordre strict est :
    1. Effectuer TOUS les renommages du Groupe 1 (fichiers UUID purs) en un seul commit git
    2. Seulement après ce commit : activer le hook via `git config core.hooksPath .githooks`
    Activer le hook avant la migration provoquerait le rejet de chaque commit intermédiaire.

    FICHIERS NON CONCERNÉS PAR LE CI :
    Les fichiers avec nom lisible sans suffixe UUID (clean-code.yml, clean-review.yml,
    clean-design.yml, verus-formal-verification.yml) ne matchent PAS le pattern UUID pur et
    ne seront donc PAS rejetés par le script CI. Leur migration vers le format complet
    <slug>-<8chars>.yml est documentée dans l'impact mais reste une migration manuelle
    non bloquante — elle peut être effectuée dans un commit séparé, après l'activation du hook.

    MISE À JOUR shared-rules.yml :
    La règle spec.rules.file_placement est enrichie pour documenter le format de nommage :
    "Le nom du fichier suit le format <slug-du-titre>-<8-premiers-chars-uuid>.yml,
    où le slug est calculé à la création et est immuable."

