  implemented_at: "2026-06-10T09:42:50.513749071+00:00"
  approved_at: "2026-03-15T15:17:19.844899145+00:00"
  description: >
    Introduce une convention de nommage lisible pour tous les fichiers YAML d'artifacts
    CompanyOS : <slug-du-titre>-<8-premiers-chars-uuid>.yml. Interdit les noms UUID purs
    illisibles. Enforcement CI via make ci (qui dépend de check-naming), migration
    atomique des fichiers existants, et mise à jour de shared-rules.
  tags:
    - naming-convention
    - yaml
    - artifacts
    - ci
    - migration
    - readability
  related:
    - id: 7bfc784c-51f3-4d82-a9cf-21351e71e1c1
