    Groupe 2 — Fichiers lisibles sans suffixe UUID (NON rejetés par CI — migration manuelle
    recommandée, non bloquante, peut être faite dans un commit séparé après activation du hook) :
    8. company/lessons/clean-code.yml → à renommer avec son metadata.id réel
    9. company/lessons/clean-review.yml → à renommer avec son metadata.id réel
    10. company/lessons/clean-design.yml → à renommer avec son metadata.id réel
    11. company/lessons/verus-formal-verification.yml → à renommer avec son metadata.id réel

    IMPACT SUR LES AGENTS :
    Avant d'écrire un artifact, chaque agent doit désormais construire le nom de fichier
    en trois étapes : (1) obtenir l'UUID via generate_id(), (2) construire le slug à partir
    du titre prévu en appliquant les règles de slugification (normalisation accents, lowercase,
    tout char non-alphanumérique → tiret, dédoublonnage, troncature à 50 chars sur le slug,
    fallback kind), (3) assembler <slug>-<8chars>.yml. La règle file_placement dans
    shared-rules.yml sera mise à jour pour documenter ce comportement obligatoire.

    IMPACT SUR L'INDEX :
    Après migration, tous les artifacts renommés doivent être re-indexés. L'index MCP
    utilise metadata.id comme clé primaire — les IDs ne changent pas, seuls les chemins
    fichiers changent. Un reindex_all() après la migration restaure l'index complet.
    Les références entre artifacts (metadata.related) utilisent les IDs, pas les chemins :
    aucune mise à jour des références n'est requise.

    IMPACT CI :
    Le script check-artifact-naming.sh est exposé via `make check-naming`, dépendance ajoutée
    à `make ci`. Le pre-commit existant (qui appelle `make ci`) n'est pas modifié.
    L'activation du hook est différée après la migration atomique du Groupe 1.

  rollback_plan: >
    En cas de rollback :
    1. Désactiver le hook : `git config core.hooksPath .git/hooks` (restaurer le défaut)
    2. Supprimer le script company/scripts/check-artifact-naming.sh
    3. Retirer la cible check-naming du Makefile et sa dépendance dans ci
    4. Reverter les renommages de fichiers via git (`git mv` en sens inverse ou `git revert`)
    5. Reverter la mise à jour de shared-rules.yml (règle file_placement)
    6. Lancer reindex_all() pour restaurer l'index avec les anciens chemins

    Le rollback est réversible à tout moment via git history.
    Les metadata.id ne changent jamais — l'index peut être reconstruit à partir des fichiers
    quel que soit leur nom.

