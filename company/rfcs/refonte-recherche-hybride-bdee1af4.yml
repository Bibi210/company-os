    - crates/mcp-servers/orchestrator/Cargo.toml : dépendances
      éventuelles si l'embedding crate doit être référencée
      ici aussi (probablement pas, transitif via orchestrator).
      Estimé +0 à 5 lignes.

    - crates/orchestrator/tests/search_eval.yml (NOUVEAU) :
      jeu de queries de référence, ≥ 20 queries. Estimé +300
