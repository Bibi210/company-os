spec:
  motivation: >
    La règle memory_lookup_before_acting du shared-rules impose à
    tous les agents un lookup avant chaque production d'artifact.
    Cette règle est centrale : elle protège contre la duplication
    de décisions, l'inconsistance, et l'oubli des leçons apprises.
    Mais le tool MCP search() qui doit servir ce lookup retourne
    massivement zéro résultat sur des queries pourtant pertinentes
    — comportement démontré empiriquement pendant le cadrage du
    task-request 02c9f6eb par trois queries autour du sujet
    "search semantic embeddings vector", "recherche memoire
    collective FTS", "lookup memoire faux negatif".

    Le diagnostic-report 6cfd1c62 a mesuré le problème et décomposé
    la cause racine en six facteurs structurellement indépendants
    cumulatifs :
    (1) la FTS5 actuelle est purement lexicale, sans capacité de
        proximité conceptuelle ;
    (2) l'opérateur MATCH a une sémantique AND implicite entre
        tokens, contre-intuitive pour des queries en langage
        naturel ;
    (3) aucun stemming n'est appliqué : "embedding" et "embeddings"
        sont des tokens distincts ;
    (4) le parser FTS5 traite plusieurs caractères comme opérateurs
        réservés, ce qui fait exploser les queries contenant des
        identifiants techniques ;
    (5) la tokenisation des identifiants (UUIDs, noms avec `-` ou
        `_`) est opaque ;
    (6) la fraîcheur de l'index dépend du file watcher, qui peut
        être en retard, donc un YAML fraîchement écrit peut être
        invisible quelques secondes.

    Aucun de ces facteurs n'est résolvable seul. Ajouter un
    tokenizer FTS5 custom (snowball, porter) traiterait les
    facteurs 3 et 4 mais laisserait intacts les facteurs 1, 2,
    5, 6 qui dominent les faux négatifs en pratique. Une refonte
    structurelle est requise.

    Justification du choix RFC plutôt que design-doc simple :

    (a) Le correctif modifie crates/orchestrator/src/db.rs,
        crates/orchestrator/src/engine.rs, et
        crates/mcp-servers/orchestrator/src/main.rs, qui sont
        dans la zone protégée crates/.
    (b) Le correctif ajoute une dépendance Rust (crate pour
        sqlite-vec via rusqlite + extension loader, et crate
        pour l'inférence d'embeddings côté serveur) qui touche
        les Cargo.toml des deux crates.
    (c) Le correctif introduit potentiellement un mécanisme de
        chargement d'extension SQLite (sqlite-vec.so/.dylib)
        qui interagit avec defense-in-depth et la sémantique
        d'ouverture de la DB définie par le RFC cdbfee72.
    (d) Le correctif change la sémantique par défaut de
        search() (breaking change contrôlé), ce qui modifie le
        comportement observable du système pour tous les
        agents.
    (e) Le correctif introduit un nouveau tool MCP index_status,
        donc étend le contrat de l'orchestrator vers l'extérieur.
    (f) Il s'agit d'un changement structurel de la stratégie de
        retrieval d'un service infrastructurel critique (la
        recherche est le cœur opérationnel de la mémoire
        collective), pas d'un livrable projet métier.

    Tous les critères de shared-rules.yml pour un RFC sont réunis :
    zones protégées touchées, changement structurel, impact
    transverse, modification du contrat MCP exposé. Le présent RFC
    est donc soumis au CEO pour approbation et nécessitera un
    write permit ciblant les paths affected_files ci-dessous.

  proposal: >
    Le RFC implémente l'architecture définie par le design-doc
    f433fefc. L'implementation-plan dérivé décidera de l'ordre
    exact des étapes, des noms de fichiers et de fonctions, du
    modèle d'embedding précis, des valeurs de poids et de
    constantes. Ici on documente le QUOI et le POURQUOI au
    niveau des invariants, des contrats, et des composants.

    --- PROPOSITION 1 — Couche lexicale durcie (FTS5 unicode61
    explicite, BM25 ranking, sanitize_fts_query) ---

    La table virtuelle artifacts_fts est recréée avec un
    tokenizer unicode61 explicitement déclaré et paramétré :
    remove_diacritics=2 (folding NFKD), separators étendus pour
    inclure les caractères courants des identifiants techniques
    (au minimum `-_./`). Le tokenizer exact (chaîne d'options)
    est arbitré par l'implementation-plan en cohérence avec la
    doc SQLite FTS5 ; le RFC impose seulement la propriété
    fonctionnelle : "les identifiants techniques avec
    séparateurs courants sont tokenisés en sous-tokens
    accessibles individuellement".

    La fonction de recherche lexicale dans db.rs utilise BM25
    explicite : `SELECT id, bm25(artifacts_fts, w_t, w_g, w_d,
    w_c) AS rank FROM artifacts_fts WHERE ... ORDER BY rank
    LIMIT ?`. Les poids w_t (title), w_g (tags), w_d
    (description), w_c (content) sont configurés en constantes
    Rust (recommandation initiale 10/5/3/1, calibrés
    empiriquement sur le jeu de queries de référence).

    Une fonction `sanitize_fts_query(input: &str, mode: QueryMode)
    -> String` est introduite côté Rust. Modes :
      - QueryMode::Natural (défaut) : tokenise sur whitespace,
        échappe ou retire les caractères réservés FTS5,
        retourne une expression FTS5 valide (recommandation :
        disjonction OR entre tokens pour casser l'AND
        implicite, le ranking BM25 départage).
      - QueryMode::Advanced : passe la chaîne telle quelle au
        MATCH operator. Mode opt-in pour les power users et les
        tests.
      - QueryMode::Exact (utilisé pour id_prefix et filtres
        identifiants) : entoure l'input de double quotes pour
        recherche de phrase exacte.

    La compatibilité avec les opérateurs FTS5 hérités est gérée
    dans Natural mode : les caractères `-` `*` `:` `"` `(` `)`
    sont échappés sauf si l'appelant passe explicitement
    QueryMode::Advanced. Plus jamais d'erreur SQL "no such
    column" sur une query utilisateur.

    Migration de la table FTS5 existante. La recréation du
    tokenizer impose un DROP + CREATE de artifacts_fts. Le DDL
    de db.rs (la constante FTS_SQL) est modifié, et un mécanisme
    de migration au boot détecte la divergence et reconstruit.
    Trois options techniques équivalentes côté implémentation,
    arbitrage dans l'implementation-plan :
      (a) bump explicite d'une "schema_version" stockée dans
          une table user_version SQLite, comparée au boot ;
      (b) detection automatique en parsant le DDL actuel
          via sqlite_master et comparant à FTS_SQL ;
      (c) toujours DROP + CREATE au boot (idempotent, coût
          du reindex à chaque boot).
    Recommandation initiale du RFC : option (a) pour clarté.

    Quel que soit le choix, après recréation la table FTS5 est
    repeuplée par engine.reindex_all() qui itère les YAML sur
    disque. Coût mesuré sur le corpus actuel : < 10s au boot
    post-merge. À 10x : ~100s, acceptable pour une migration
    unique.

    --- PROPOSITION 2 — Couche sémantique embeddings via
    sqlite-vec ---

    Une nouvelle table virtuelle `artifacts_vec` (nom indicatif)
    est créée via l'extension sqlite-vec. Format minimal :
    rowid corrélable à artifacts.id, vecteur float32 de
    dimension D (D est arbitré par le modèle choisi, typiquement
    384 ou 768 ou 1024). La métrique de distance (cosine, L2,
    ou dot product) est fixée à la création de la table en
    cohérence avec le modèle d'embedding choisi (cosine
    recommandé pour les sentence-transformers normalisés).

    Persistance du model_version (EXIGENCE STRUCTURELLE,
    décision PM iteration 2 sur l'incertitude 5). Un identifiant
    de version du modèle d'embedding actif est persisté à côté
    des vecteurs. Au boot du serveur, après le load_extension
    sqlite-vec et le load du modèle, le serveur compare le
    model_version stocké au model_version du modèle chargé. Si
    mismatch (downgrade, hotfix, changement de modèle entre
    deux versions du binaire), le serveur déclenche
    automatiquement un wipe de artifacts_vec + reindex_all
    synchrone qui recalcule les embeddings avec le nouveau
    modèle. La détection doit être O(1) au boot (pas de scan
    des vecteurs). Le format exact de stockage est arbitré
    dans l'implementation-plan parmi trois options techniques
    équivalentes : (i) colonne model_version par row dans
    artifacts_vec (uniforme, mais redondant), (ii) table
    séparée à une seule row (artifacts_vec_meta) avec le
    model_version courant (plus propre, exige une jointure
    triviale au boot), (iii) usage de PRAGMA user_version
    SQLite pour stocker un entier monotone qui encode le
    model_version (le plus léger, mais l'entier est globalement
    réservé à la migration de schéma, donc collision possible
    si on l'utilise déjà ailleurs). Le RFC ne tranche pas
    entre ces trois options ; il impose seulement la propriété
    fonctionnelle : "le mismatch est détecté au boot en O(1)
    et déclenche wipe + reindex_all automatique".

    Chargement de l'extension sqlite-vec. Le RFC ajoute dans
    OrchestratorDb::open un chemin d'enable_load_extension +
    load_extension("sqlite-vec") AVANT migrate(). Trois points
    d'attention :

    (a) Le chargement d'extensions SQLite est désactivé par
    défaut dans rusqlite. L'option `unlock_notify` ou
    `load_extension` doit être activée dans la feature flag
    de rusqlite dans Cargo.toml.

    (b) Le binaire .so / .dylib / .dll de sqlite-vec doit être
    distribué avec le binaire CompanyOS ou installé séparément.
    Recommandation initiale : empaqueter la lib statique via
    une crate Rust qui embed le code C de sqlite-vec (par
    exemple sqlite-vec-rs si elle existe, ou un build.rs
    custom qui compile le .c). L'arbitrage est dans
    l'implementation-plan, sous contrainte : pas de fichier
    .so externe à installer manuellement par l'utilisateur.

    (c) Au boot, si load_extension échoue (lib absente,
    incompatible ABI), le serveur logue ERROR et exite avec
    code non-zero. Pas de fallback silencieux qui dégraderait
    search() en mode lexical sans que l'opérateur le sache.
    Ce comportement est cohérent avec la philosophie du PILIER
    D du RFC cdbfee72 (échec explicite plutôt que dégradation
    silencieuse).

    (d) Maturité de sqlite-vec (précision iteration 3,
    réponse à F-rfc-4). sqlite-vec est actuellement en
    version pre-1.0 (typiquement 0.1.x-alpha). Le risque
    ABI/API est réel : un upgrade automatique de la
    dépendance peut casser le build ou changer la
    sémantique du kNN. Deux mitigations imposées par le
    RFC, à appliquer ensemble :

      (d.1) Pin de version exacte. La dépendance sqlite-vec
      est déclarée avec une contrainte de version exacte
      (par exemple `=0.1.10-alpha.4` plutôt que `^0.1` ou
      `0.1`). Toute évolution exige une modification
      explicite du Cargo.toml et donc une revue. Au
      moment de la première rédaction de cette iteration,
      la version stable la plus récente est à arbitrer
      dans l'implementation-plan en fonction de ce qui est
      disponible au merge.

      (d.2) Smoke test au boot. Après le load_extension
      réussi, ET avant de servir le premier appel MCP, le
      serveur crée une table virtuelle vec0 jetable en
      mémoire (par exemple `vec0_smoketest`), insère un
      petit vecteur de référence connu, exécute une
      requête kNN dessus avec un autre vecteur synthétique
      dont le résultat attendu est calculable analytiquement
      (par exemple deux vecteurs identiques → distance 0,
      ou deux vecteurs orthogonaux → distance maximale),
      et vérifie que le retour est conforme à un ε près.
      Si le smoke test échoue → le serveur exite avec un
      message clair "sqlite-vec smoke test failed, ABI
      mismatch suspected" + détails du test. Coût du
      smoke test : < 10ms. Bénéfice : capture un upgrade
      cassant qui passerait silencieusement (la table
      vec0 se crée mais le kNN retourne des résultats
      faux).

    Le smoke test est intentionnellement minimaliste : il
    ne valide pas que tous les opérateurs et toutes les
    métriques de sqlite-vec marchent, juste que le wiring
    fondamental est intact. Si une régression plus subtile
    se glisse (par exemple changement de comportement sur
    une métrique L2 spécifique), elle sera détectée par le
    bench de qualité (jeu de queries de référence,
    PROPOSITION 10) lors d'une CI ultérieure. Le smoke
    test au boot couvre la classe la plus dangereuse :
    "kNN cassé silencieusement", qui produirait des
    résultats search() incohérents sans erreur visible.

    Pipeline d'embedding. Un nouveau module
    `crates/orchestrator/src/embedding.rs` (nom indicatif)
    expose une trait `Embedder` avec une méthode
    `embed(text: &str) -> Result<Vec<f32>, Error>`. Une
    implémentation concrète est fournie par défaut, basée sur
    le modèle retenu dans l'implementation-plan parmi bge-m3,
    multilingual-e5-large, paraphrase-multilingual-mpnet-base-v2,
    nomic-embed-text-v1.5. Le modèle est chargé en RAM au
    boot du serveur (load coût ~1 à 5s arbitré sur le modèle
    choisi). Une instance unique est partagée par l'engine via
    Arc<dyn Embedder>.

    Critères structurels imposés par le RFC sur tout choix de
    modèle d'embedding :
      (i) déterministe : embed(text) retourne le même vecteur
      à chaque appel pour le même input (PILIER D compatible) ;
      (ii) multilingue natif : performant sur FR + EN technique
      mélangés ;
      (iii) footprint < 1GB RAM et load < 5s.

    Runtime d'inférence. Précision iteration 3 sur F-commun-1
    (vérification empirique de l'Implementer) : aucune option
    d'inférence d'embedding actuellement disponible n'est
    strictement "Rust pur + zéro réseau au build et au
    runtime". candle est Rust pur côté code mais télécharge
    les poids HuggingFace à la première utilisation.
    fastembed-rs s'appuie sur ort (ONNX Runtime, C++ via FFI)
    qui peut télécharger des binaires natifs au build. Les
    sidecar (ollama, llama.cpp en embedding mode) sont des
    process externes avec leur propre gestion de réseau.

    Le RFC sépare trois axes orthogonaux et impose des
    contraintes différentes sur chacun :

      (i) AUTONOMIE RUNTIME de search() — EXIGENCE DURE
      non-négociable. Aucun appel search(), aucun appel
      index_artifact() ne doit déclencher d'accès réseau. Le
      modèle doit être chargé en RAM au boot, à partir d'un
      cache local. Si le cache est absent au boot, le
      serveur exite avec un message clair "embedding model
      not found locally, run <pre-fetch command> first". Pas
      de download paresseux au premier search().

      (ii) ABSENCE DE FFI — NICE-TO-HAVE, aucune contrainte
      dure. Une crate qui dépend de FFI vers ONNX Runtime
      ou GGML est acceptable tant qu'elle respecte (i). Le
      seul critère est l'autonomie runtime, pas la pureté
      du langage.

      (iii) BINAIRE AUTONOME AU BUILD — OUT OF SCOPE. Un
      téléchargement de poids ou de runtime AU BUILD est
      acceptable tant qu'il produit un artifact reproductible
      (checksum stable, version pinned). Le build est un
      événement orchestré (cargo build, CI), pas un événement
      runtime du serveur.

      (iv) SIDECAR PROCESS — autorisé sous condition de (i).
      Un sidecar (ollama, llama.cpp en server mode) qui
      tourne en local et qui est interrogé via socket UNIX
      ou loopback respecte (i) tant que le sidecar lui-même
      ne déclenche pas de download au runtime. La
      coordination de cycle de vie entre serveur orchestrator
      et sidecar (qui démarre lequel, qui surveille la mort
      de l'autre) ajoute de la complexité opérationnelle mais
      reste acceptable. Recommandation MAINTENUE : préférer
      l'embedding in-process si un modèle convenable est
      disponible dans un runtime acceptable. L'arbitrage
      final dépend de la disponibilité du modèle retenu (cf.
      open question 1 de l'implementation-plan).

    Mécanique de pre-fetch des poids/runtime. L'implementation-
    plan doit définir une procédure de pre-fetch déterministe
    : (a) une commande CLI ou une étape de build qui télécharge
    les poids dans un cache local versionné (par exemple
    company/data/embeddings/cache/<model_version>/) ; (b) un
    check au boot du serveur qui vérifie la présence et
    l'intégrité (checksum) du cache ; (c) un mode CI qui pré-
    chauffe le cache avant les tests. Le détail technique est
    arbitré dans le plan ; le RFC impose seulement les trois
    propriétés (a/b/c) et l'autonomie runtime (i).

    Vue embeddable de l'artifact. Le module embedding définit
    pour chaque kind d'artifact la "vue embeddable" qui sera
    concaténée et passée à embed(). Construction minimale
    universelle : metadata.title + ". " + metadata.description
    + ". " + join(metadata.tags, ", "). Extensions par kind :
      - task-request : + spec.description
      - design-doc : + spec.overview
      - rfc : + spec.motivation + spec.proposal (tronqué)
      - implementation-plan : + concaténation des étapes
      - diagnostic-report : + spec.symptom + spec.root_cause
      - lesson-learned : + spec.context + spec.insight +
        spec.recommendation
      - autres : titre + description + tags seulement.
    Le mapping précis kind → champs est dans
    l'implementation-plan. Limite : si la vue embeddable dépasse
    la context length max du modèle (typiquement 512 à 8192
    tokens), tronquer à droite (pas de chunking, décision de
    simplicité tranchée dans le design-doc).

    --- PROPOSITION 3 — Fusion par Reciprocal Rank Fusion ---

    Le module de fusion combine les deux classements lexical et
    sémantique. Fonction pure côté Rust, pas d'I/O :
    ```
    fn rrf_fuse(lexical: &[ArtifactRanked], semantic: &[ArtifactRanked],
                k: f32) -> Vec<ArtifactScored>
    ```
    où ArtifactRanked porte (id, rank_position_1_indexed) et
    ArtifactScored porte (id, score_rrf). k est la constante de
    smoothing, par défaut 60 (canonique TREC).

    Implémentation. HashMap<id, score>, parcours du chemin
    lexical en incrémentant score += 1/(k + rank), même pour
    le chemin sémantique. Trier par score décroissant. Retourner
    les top-N.

    Coût computationnel négligeable : O(K_lex + K_sem + N log N)
    avec K_lex et K_sem typiquement 50 chacun.

    --- PROPOSITION 4 — Filtres structurés push-down ---

    L'API search() accepte les filtres décrits dans la section
    api-search-cible du design-doc f433fefc :
      - kind (string ou liste)
      - author (string)
      - tags (liste, sémantique OR)
      - project (string)
      - created_after / created_before (timestamp RFC3339)
      - id_prefix (string)

    Les filtres sont appliqués AVANT la fusion, en push-down dans
    les deux chemins.

    Chemin lexical : `... WHERE artifacts_fts MATCH ?1 AND a.kind
    IN (?2, ?3, ?4) AND a.author = ?5 ...` avec paramètres
    bindés.

    Chemin sémantique : sqlite-vec supporte JOIN ; on JOIN
    artifacts_vec ON artifacts.id et on applique les mêmes
    filtres. Selon la version de sqlite-vec, le pre-filter peut
    nécessiter un pattern particulier (par exemple un sous-SELECT
    de row_ids puis k-nearest sur ce subset). L'arbitrage exact
    est dans l'implementation-plan.

    Tags. Le filtre tags est sémantiquement OR par défaut (un
    artifact qui matche AU MOINS UN des tags demandés est
    candidat). Note : artifacts.tags est stocké en JSON, donc
    la clause WHERE utilise json_each ou equivalent. Coût
    acceptable jusqu'à ~1000 artifacts.

    --- PROPOSITION 5 — Reranker Claude optionnel ---

    Composant activé par flag `rerank=true` dans search().
    Implémentation : un appel HTTP à l'API Anthropic (Claude
    haiku 3.5 ou supérieur, modèle exact arbitré dans
    l'implementation-plan), avec un prompt structuré qui
    demande de reranker la liste des K candidats par
    pertinence à la query.

    Pré-requis runtime : variable d'environnement
    ANTHROPIC_API_KEY présente. Si absente et rerank=true,
    search() retourne une erreur explicite "rerank=true requires
    ANTHROPIC_API_KEY". Pas de fallback silencieux sur RRF
    non-rerangé.

    Timeout : 5s par appel (arbitré dans
    l'implementation-plan). En cas de timeout ou d'erreur API
    explicite, fallback EXPLICITE sur le classement RRF
    non-rerangé avec un warning dans les logs (le warning rend
    visible la dégradation).

    Coût opérationnel attendu : +1 à 3s par query, +1 appel
    API facturé. OFF par défaut.

    --- PROPOSITION 6 — Query expansion HyDE optionnelle ---

    Composant activé par flag `hyde=true` dans search().
    Implémentation : un appel à Claude pour générer un
    pseudo-document de 100 à 200 tokens qui répond
    hypothétiquement à la query. Le pseudo-document est embedé
    par le modèle local et utilisé pour la phase sémantique.
    Le chemin lexical reste sur la query originale (un
    pseudo-doc est trop bruité pour le lexical).

    Pré-requis runtime, timeout, fallback : identiques à la
    proposition 5 (mêmes contraintes ANTHROPIC_API_KEY,
    timeout 5s, fallback explicite avec warning).

    Coût attendu : +500ms à 2s par query, +1 appel API. OFF
    par défaut.

    Les deux flags rerank et hyde sont indépendants et
    combinables. hyde=true + rerank=true coûte ~2 à 5s total.
    Cas d'usage : queries critiques où la précision prime sur
    la latence (par exemple un diagnostic d'incident où on
    veut maximiser le rappel et la précision).

    --- PROPOSITION 7 — Pipeline d'indexation transactionnel ---

    engine.index_artifact() est étendu pour calculer
    l'embedding et upserter dans la table artifacts_vec en plus
    de artifacts et artifacts_fts.

    Séquence cible :
      (1) Parse YAML, extract metadata + relations.
      (2) Calculer la "vue embeddable" selon le kind.
      (3) Appeler embedder.embed(view) → Vec<f32> ou erreur.
      (4) Ouvrir une transaction SQLite explicite (BEGIN
          IMMEDIATE).
      (5) DELETE FROM artifacts WHERE id = ?, DELETE FROM
          artifacts_fts WHERE id = ?, DELETE FROM
          artifacts_vec WHERE rowid = ?.
      (6) INSERT INTO artifacts ..., INSERT INTO artifacts_fts
          ..., INSERT INTO artifacts_vec ...
      (7) INSERT INTO artifact_relations ...
      (8) COMMIT.

    Si l'étape (3) échoue (modèle indispo, OOM, panic dans
    l'inférence) : la transaction n'est PAS commencée, donc
    pas de rollback à faire, et l'artifact n'est pas indexé du
    tout. Le serveur logue ERROR avec le contexte (id, kind,
    raison). L'agent qui écrit le YAML voit que son artifact
    est absent de search() et peut investiguer via le tool
    index_status (cf. proposition 8).

    Note de policy. Une alternative serait de committer FTS
    même si l'embedding échoue (mode dégradé). Le RFC retient
    le rollback complet parce que l'invariant "tout artifact
    indexé est cohérent dans les trois tables" est plus simple
    à diagnostiquer et à maintenir que "certains artifacts ont
    un embedding, d'autres non". L'observabilité (proposition 8)
    rend l'erreur visible et actionnable.

    Cohérence avec PILIER A du RFC cdbfee72. La transaction
    s'exécute sur l'unique connexion SQLite du serveur (ou de
    --index quand il tient le lock exclusif). Aucun second
    writer n'est introduit. Le pipeline d'indexation reste
    serialisé par le Mutex tokio de l'engine.

    Cohérence avec PILIER D du RFC cdbfee72. reindex_all itère
    les YAML sur disque et appelle index_artifact pour chacun.
    Comme l'embedding est déterministe (contrainte structurelle
    sur le choix du modèle), un rebuild régénère exactement les
    mêmes vecteurs qu'avant la corruption. Pas de backup
    hors-DB nécessaire. Le coût d'un autorepair complet passe
    de ~1s (FTS seul) à ~5s (FTS + embedding * 84 artifacts à
    ~50ms chacun). À 10x corpus : ~50s. Acceptable pour un
    autorepair rare.

    --- PROPOSITION 8 — Tool MCP index_status ---

    Un nouveau tool MCP `index_status` est exposé par le
    serveur orchestrator. Contrat :

      - Paramètre : path (string optionnel). Si fourni, statut
        d'un artifact spécifique (par chemin relatif). Si
        absent, statut global de l'index.
      - Retour : objet JSON décrivant :
          - global : { artifacts_count, fts_count, vec_count,
                       triplet_coherent: bool,
                       file_watcher_alive: bool,
                       pending_index_queue_size: int,
                       last_indexed_at: timestamp }
          - per_path (si path fourni) : { indexed_at, file_mtime,
                                          stale: bool,
                                          present_in_fts: bool,
                                          present_in_vec: bool }
      - Effet : lecture seule, pas d'écriture, latence < 10ms.

    Justification. Le FACTEUR 6 du diagnostic 6cfd1c62 a
    identifié l'opacité de l'état d'indexation comme cause de
    confusion (un faux négatif sémantique est indistinguable
    d'un faux négatif d'indexation). index_status rend cet
    état visible. Cas d'usage : un agent qui pense que sa
    search() devrait remonter un artifact appelle
    index_status(path=...) avant de débattre du résultat.

    Mécanique d'instrumentation (précision iteration 3,
    réponse à F-rfc-3). Pour chaque champ du retour
    global, le RFC fixe la propriété fonctionnelle visée et
    la mécanique minimale acceptable. L'implementation-plan
    peut affiner mais ne peut pas remettre en cause les
    contrats ci-dessous :

      - artifacts_count, fts_count, vec_count :
        propriété "compte exact des rows par table".
        Mécanique : trois SELECT COUNT(*) sur la connexion
        partagée de l'engine (sous Mutex tokio, sérialisé
        avec les autres opérations). Coût négligeable sur
        un corpus < 10k.

      - triplet_coherent (bool) :
        propriété "les trois compteurs ci-dessus sont
        égaux ET aucun id présent dans une table n'est
        absent des deux autres". Mécanique minimale :
        comparaison des trois COUNT calculés ci-dessus
        (égalité numérique) ; si égaux → true. Si non
        égaux → false ET un champ optionnel
        `triplet_diff: { in_artifacts_not_in_fts: [ids],
        in_artifacts_not_in_vec: [ids], in_fts_not_in_artifacts:
        [ids], in_vec_not_in_artifacts: [ids] }` est
        rempli pour faciliter le diagnostic. Le détail
        des SQL diff (EXCEPT, NOT IN) est arbitré dans
        l'implementation-plan ; le contrat est : si false,
        on doit pouvoir nommer au moins un id divergent.

      - file_watcher_alive (bool) :
        propriété "le file watcher tokio task est actuellement
        en train de tourner et capable de recevoir des
        événements notify". Mécanique minimale : un
        `Arc<AtomicBool>` partagé entre la task watcher et
        l'engine. La task écrit `true` au démarrage de la
        boucle de réception, écrit `false` dans un Drop guard
        (ou via un select! tokio sur cancellation token) à
        la sortie. Le tool lit la valeur sans bloquer.
        Alternative équivalente arbitrée dans
        l'implementation-plan : un `JoinHandle` détenu par
        l'engine dont on vérifie `is_finished()`. Les deux
        ont la même propriété fonctionnelle. Pas de
        heartbeat périodique requis (le watcher est passif
        en attente d'événements notify, donc "vivant mais
        idle" et "mort" sont distinguables uniquement par
        l'état du runtime tokio, pas par un timestamp de
        dernier événement).

      - last_indexed_at (timestamp ou null) :
        propriété "horodatage du upsert le plus récent
        toutes tables confondues". Mécanique minimale :
        `SELECT MAX(indexed_at) FROM artifacts`. Coût SQL
        négligeable. Retourne null si la table est vide.

      - pending_index_queue_size (int) :
        propriété "nombre de fichiers en attente de
        traitement par le file watcher". Mécanique minimale :
        un `tokio::sync::mpsc::channel` borné entre la task
        notify et la task index_artifact, dont la longueur
        est exposée via `.capacity() - .free_capacity()` ou
        un compteur AtomicUsize. Si le file watcher tokio
        n'utilise pas de channel intermédiaire (cas du
        debounce simple in-place), ce champ retourne 0 par
        défaut ET cette absence de queue est explicitement
        documentée comme "0 = watcher en mode sans queue
        intermédiaire" plutôt qu'une fausse mesure. La
        décision finale (introduire le channel ou non) est
        dans l'implementation-plan ; le contrat est : si
        une queue existe, sa taille est exposée ; sinon,
        retourner 0 explicitement.

    Pour les champs per_path :

      - indexed_at, file_mtime : SQL et std::fs::metadata
        respectivement, latence négligeable.
      - stale : `indexed_at < file_mtime` (le fichier a été
        modifié après le dernier index).
      - present_in_fts, present_in_vec : deux SELECT EXISTS
        sur les tables correspondantes par id.

    Garantie de latence < 10ms : valable sur un corpus
    actuel (84 artifacts), avec marge à 10x. Si la
    cohérence triplet exige un EXCEPT sur un gros corpus,
    la latence peut monter ; l'implementation-plan peut
    arbitrer un mode "fast" (juste les COUNT) et un mode
    "full" (avec triplet_diff) si besoin. Recommandation
    initiale : mode unique avec triplet_diff seulement si
    triplet_coherent=false.

    --- PROPOSITION 9 — API search() cible (breaking change
    contrôlé) ---

    Signature actuelle (vérifiée empiriquement dans le code à
    la date de l'iteration 3, réponse à F-rfc-5) :
    ```
    search(query: string, kind?: string, limit?: int)
    ```
    Pointeurs :
      - struct SearchParams : crates/mcp-servers/orchestrator/
        src/main.rs:144-154 (query: String, kind: Option<String>,
        limit: Option<usize>).
      - default limit : crates/config/src/constants.rs:52
        (DEFAULT_SEARCH_LIMIT: usize = 10).
      - signature engine.search : crates/orchestrator/src/
        engine.rs:401 (fn search(&self, query: &str, kind:
        Option<&str>, limit: usize) -> Result<...>).

    Audit des callers internes (réponse à F-rfc-5, demande
    sous-jacente). Un seul caller interne dans le workspace :
    crates/mcp-servers/orchestrator/src/main.rs:569
    (`engine.search(&params.query, params.kind.as_deref(),
    limit)`). Aucun autre crate du workspace n'invoque
    engine.search. Les callers EXTERNES sont les agents via
    MCP et le code de configuration des LLMs externes
    (opencode hooks, etc.). Pour ces callers externes, la
    compatibilité ascendante est garantie par le maintien
    strict des champs query, kind, limit dans la struct
    SearchParams (positions et sémantiques nominales
    inchangées). Le breaking change ne porte QUE sur l'ordre
    des résultats (mode=hybrid par défaut au lieu du chemin
    FTS5 pur), pas sur l'API.

    Signature cible :
    ```
    search(
      query: string,
      kind?: string | string[],
      author?: string,
      tags?: string[],
      project?: string,
      created_after?: string,    // RFC3339
      created_before?: string,   // RFC3339
      id_prefix?: string,
      mode?: "lexical" | "semantic" | "hybrid",  // default "hybrid"
      limit?: int,                // default 10, max 100
      rerank?: bool,              // default false
      hyde?: bool,                // default false
      explain?: bool              // default false
    )
    ```

    Compatibilité. Les paramètres query, kind, limit conservent
    leur position et leur sémantique nominale (un kind unique en
    string reste accepté). Le breaking change est dans le
    DÉFAUT : avant, search("foo") = FTS5 pur ; après,
    search("foo") = mode hybrid avec ranking RRF, donc l'ordre
    des résultats peut être différent. Cette différence est
    BÉNÉFIQUE pour les appelants par défaut (les agents de
    lookup mémoire) qui obtiennent un meilleur rappel sans
    changer leur code. Les appelants qui veulent strictement
    l'ancien ranking passent mode="lexical".

    Format de retour. Conservé pour les champs existants
    (results: liste, count: entier). Ajout de champs optionnels
    quand explain=true (scores par résultat, mode_applied,
    candidate_set_sizes, latency_breakdown_ms).

    Migration des callers internes. Aucun changement de code
    requis pour les appelants qui passent par le proxy MCP : la
    signature est compatible ascendante (paramètres nouveaux
    optionnels). Les règles `memory_lookup_before_acting` de
    shared-rules.yml restent applicables sans modification — la
    règle parle de "search(query, kind=...)", ce qui reste
    valide. Pas de mise à jour de shared-rules nécessaire dans
    le cadre de ce RFC. Une lesson-learned post-merge pourra
    documenter les bonnes pratiques d'usage des nouveaux
    paramètres (filters, rerank, explain).

    --- PROPOSITION 10 — Jeu de queries de référence et tests
    de qualité ---

    Un fichier YAML versionné (par exemple
    crates/orchestrator/tests/search_eval.yml ou
    tests/search-eval/queries.yml) est créé. Format défini par
    le design-doc f433fefc section jeu-de-queries-de-reference.

    Coverage minimale imposée par le task-request 02c9f6eb
    (acceptance criterion) :
      - 5 queries lexicales pures (UUIDs, identifiants exacts)
      - 5 queries sémantiques pures (paraphrases)
      - 5 queries mixtes
      - 5 queries edge cases (vide + filtre, langue mélangée,
        query trop longue, query avec opérateurs FTS5
        historiques, query UUID complet)
      - Les 3 queries du symptôme du task-request 02c9f6eb,
        non-négociables.

    Le runner de test (un test Rust dans le crate orchestrator)
    charge le fichier, exécute chaque query via engine.search(),
    et calcule precision@K, recall@K, MRR. Le test échoue si
    une des 3 queries du symptôme retourne 0 résultat, ou si
    la précision moyenne tombe sous un seuil (à arbitrer dans
    l'implementation-plan, recommandation initiale precision@10
    > 0.5 sur le bench complet).

    Tests unitaires complémentaires :
      - sanitize_fts_query sur chaque mode et chaque cas
        d'opérateur problématique
      - rrf_fuse sur des classements synthétiques
      - filters push-down côté lexical et sémantique
      - index_artifact transactionnel : si embed échoue, aucune
        des trois tables n'a écrit
      - reindex_all repeuple bien artifacts_vec

    --- PROPOSITION 11 — Documentation et lesson-learned ---

    Acceptance criterion du task-request : un guide opérateur
    + une lesson-learned.

    Guide opérateur. Un fichier markdown (par exemple
    docs/search-guide.md ou un README dans crates/orchestrator/)
    qui décrit : le pipeline, les modèles utilisés, le format de
    la query, les filtres disponibles, les flags rerank et hyde,
    les limites connues, et un troubleshooting (que faire si
    search() retourne 0 sur une query attendue : vérifier
    index_status, vérifier explain=true, etc.). Ce document
    est mis à jour par l'implementer en fin d'implémentation.

    Lesson-learned. Produite par l'Architect ou l'Implementer à
    la clôture du task-request, capitalisant : (a) la stratégie
    technique qui marche (hybrid + RRF), (b) les surprises
    rencontrées en implémentation (latence du modèle, taille
    du binaire avec le modèle embed, etc.), (c) les
    arbitrages tranchés pendant le plan (modèle exact, poids
    BM25, k de RRF).

    --- INVARIANTS DE COHÉRENCE GLOBALE APRÈS MERGE ---

    (1) À tout instant, un artifact est présent dans les trois
    tables (artifacts, artifacts_fts, artifacts_vec) ou dans
    aucune. Pas de partial indexing. Garanti par les
    transactions atomiques de index_artifact.

    (2) La couche sémantique est strictement additive : si
    sqlite-vec est absent au boot, le serveur exite (pas de
    fallback silencieux). Si l'extension charge mais que
    l'embedder échoue par artifact, l'artifact n'est indexé
    nulle part (rollback complet).

    (3) Le PILIER A du RFC cdbfee72 reste strictement respecté :
    le serveur tient le file lock exclusif, --index acquiert
    l'exclusif temporairement seulement quand aucun serveur ne
    tourne, le hook defense-in-depth reste hors du chemin
    d'écriture artifacts/FTS/vec. Aucun nouveau writer n'est
    introduit.

    (4) Le PILIER D du RFC cdbfee72 reste fonctionnel : un
    integrity_check KO au boot déclenche wipe + reindex_all
    synchrone, qui régénère les embeddings à partir des YAML.
    Coût attendu < 10s sur corpus actuel, < 60s à 10x.

    (5) Le file watcher tokio reste la voie d'indexation
    principale en steady-state, avec un debounce 500ms. La
    voie index_now (PILIER A amendement iteration 5 du RFC
    cdbfee72) reste disponible pour les agents qui veulent
    forcer une indexation immédiate. Les deux voies appellent
    engine.index_artifact qui calcule l'embedding.

    (6) search() retourne au minimum les résultats que l'ancien
    search() FTS5 pur retournait, modulo le changement de
    ranking (BM25 explicite avec poids vs ordre interne FTS5).
    En pratique, le rappel ne peut que croître (la couche
    sémantique ajoute des résultats que FTS5 ne voyait pas).
    Risque résiduel sur le ranking : un résultat précédemment
    en top-3 peut tomber en top-5 à cause de la fusion. Si
    cette régression de ranking est observée comme gênante,
    elle est mesurable via le bench et corrigible par ajustement
    des poids BM25 et de la constante k de RRF.

    --- ANALYSE TRIAXIALE ---

    Cas nominal (happy path). Un agent appelle
    search("design persistence orchestrator") sans paramètres
    additionnels. La query est sanitizée en mode Natural
    (tokens en OR), embedée par le modèle local en ~50ms
    (cosine vector dim D). La couche lexicale exécute FTS5 +
    BM25, retourne 50 candidats. La couche sémantique exécute
    sqlite-vec kNN, retourne 50 candidats. Fusion RRF en <1ms.
    Top-10 retournés à l'agent. Latence totale < 100ms p95
    sur corpus actuel. Le RFC cdbfee72 design-doc (45c04902)
    et son RFC (cdbfee72) sont tous deux dans le top-3,
    ranked par RRF qui combine BM25 (titre matche fort) et
    cosine (concept proche). L'agent obtient un contexte
    pertinent en quelques ms.

    Cas négatif (erreurs et échecs) :

    (a) sqlite-vec absent ou load_extension échoue. Le serveur
    exite au boot avec un message clair "sqlite-vec extension
    required, not loaded — see build instructions". L'opérateur
    voit l'erreur, rebuild avec la lib, redémarre. Pas de
    fallback silencieux. Justification cohérente avec PILIER D
    du RFC cdbfee72 (échec explicite plutôt que dégradation
    silencieuse).

    (b) Modèle d'embedding absent ou load échoue. Le serveur
    exite au boot avec un message clair "embedding model
    required, not loaded — check path / model_name / artifacts
    in <expected location>". Pas de fallback silencieux sur
    lexical-only, pas de flag de bypass. Décision PM iteration
    2 sur l'incertitude 3 : la règle
    memory_lookup_before_acting impose la recherche à TOUS les
    agents avant TOUTE production, un fallback silencieux
    maquillerait la situation. Si CI manque le modèle, le
    modèle est installé dans CI. Comportement identique au
    cas (a) pour cohérence : tous les défauts d'infrastructure
    de la couche sémantique font exiter le serveur au boot.
    L'erreur est ainsi visible immédiatement, pas après une
    série de search() dégradés inexpliqués.

    (c) Query vide sans filtres. search() retourne une erreur
    explicite "empty query requires at least one filter".

    (d) Query trop longue (> 10000 caractères). Le tokenizer
    FTS5 tronque naturellement à sa limite. Le modèle
    d'embedding tronque selon sa context length. Pas
    d'erreur retournée à l'appelant ; un warning est loggé
    serveur si la troncature a eu lieu.

    (e) Corpus vide. search() retourne 0 résultat sans erreur.

    (f) ANTHROPIC_API_KEY absent mais rerank=true ou hyde=true.
    Erreur explicite "rerank/hyde requires ANTHROPIC_API_KEY".

    (g) Claude injoignable au runtime (timeout, rate limit,
    panne réseau). Pour rerank : fallback EXPLICITE sur RRF
    non-rerangé avec warning. Pour HyDE : fallback explicite
    sur la query originale avec warning.

    (h) Erreur d'embedding pendant index_artifact (modèle
    OOM, input corrompu). Rollback de la transaction,
    artifact non indexé, log ERROR côté serveur. L'agent voit
    l'absence via search() et peut diagnostiquer via
    index_status.

    Edge cases (valeurs limites, concurrence) :

    (i) Langues mélangées dans la query. Tokenizer indépendant
    par token, modèle d'embedding multilingue natif. Pas de
    surprise.

    (j) Query UUID complet ou préfixe. Tokenisé en sous-tokens
    grâce au separator `-` explicite. Lexical retrouve les
    artifacts qui contiennent les sous-tokens dans title /
    tags / content. Sémantique génère un embedding peu
    discriminant mais ne nuit pas (RRF résiste).

    (k) Query avec opérateurs FTS5 historiques. Mode Natural
    échappe les caractères réservés, plus jamais d'erreur SQL.

    (l) Corpus 10x. Mesures prédites par le design-doc :
    lexical < 20ms, embedding query ~50ms, ANN ~50ms, RRF
    ~5ms, total p95 ~130ms. Cible 2s respectée avec marge.

    (m) Concurrence avec PILIER A. Le Mutex tokio de l'engine
    sérialise les writes. SQLite WAL autorise les reads
    simultanés. search() ne bloque pas index_artifact, et
    vice-versa au pire de quelques ms.

    (n) Concurrence avec PILIER D (autorepair au boot). Le
    wipe + reindex_all synchrone fait son travail avant que
    search() ne soit servi. Pas de race possible.

    (o) Changement de modèle d'embedding entre deux versions
    du binaire. Sans précaution, les embeddings stockés
    deviennent incompatibles. Décision PM iteration 2 sur
    l'incertitude 5 : un model_version est persisté dès la
    v1, vérifié au boot, et un mismatch déclenche wipe +
    reindex_all automatique. Exigence structurelle, non
    arbitrable. Le détail de stockage (champ dédié dans
    artifacts_vec, table séparée, ou SQLite user_version pour
    un entier monotone) reste arbitré dans
    l'implementation-plan, sous contrainte que le mismatch
    soit détectable en O(1) au boot et que la procédure de
    rebuild soit cohérente avec PILIER D du RFC cdbfee72
    (réutilisation de reindex_all synchrone).

    (p) Première requête après boot, modèle pas warm. Latence
    de la première inférence : 200 à 500ms au lieu de 50ms.
    Atténué par un warm-up au startup (embed d'une query
    synthétique pendant l'init), recommandation à arbitrer
    dans l'implementation-plan.

    (q) Embedding identique pour deux documents. RRF reste
    stable (le lexical départage). Pas d'instabilité.

