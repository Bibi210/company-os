      tokenizer unicode61 explicite, ajout de la table virtuelle
      artifacts_vec, méthode search_artifacts() refactorisée
      pour utiliser bm25() et accepter les filtres push-down,
      ajout de méthodes pour la migration de schéma FTS5,
      load_extension sqlite-vec dans open(). Estimé +200 lignes,
      -50 lignes. Net +150.

    - crates/orchestrator/src/engine.rs : engine.search() étendu
      pour accepter le nouvel objet de paramètres et appliquer
      la fusion RRF, engine.index_artifact() étendu pour
