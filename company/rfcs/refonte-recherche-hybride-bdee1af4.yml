      company/schemas/, company/plugins/, et crates/ comme
      préfixes). Listé dans affected_files pour traçabilité,
      en cohérence avec la lesson 611fde3e (inventaire
      complet des fichiers touchés par l'implémentation,
      même non-protégés). Précision iteration 3, réponse à
      F-rfc-2 (résolution de la contradiction interne de
      l'iteration 1 entre la note et la liste).

    Surface totale estimée : ~2000 lignes nettes ajoutées,
    ~50 lignes supprimées. Comparable au RFC cdbfee72 (~600
    lignes nettes). Le surplus vient principalement de
    embedding.rs et des tests.

    Impact runtime :

    - Boot du serveur : +1 load de l'extension sqlite-vec
      (~50ms), +1 load du modèle d'embedding (~1 à 5s selon
      modèle). Total boot avec modèle : 2 à 6s, vs <1s
      actuellement. Acceptable.

    - Steady-state search() : +50ms pour l'embedding de la
      query, +5ms pour le kNN sqlite-vec, +1ms pour RRF.
      Latence totale ~70 à 100ms p95 sur corpus actuel
      (acceptance criterion < 500ms respecté avec marge x5).

    - Steady-state index_artifact : +50ms pour calculer
      l'embedding. Latence totale d'indexation ~55ms par
      artifact, vs ~5ms actuellement. Acceptable
      (debounce file watcher 500ms domine de toute façon).

    - Boot après corruption (PILIER D) : reindex_all SYNCHRONE
      qui doit calculer l'embedding pour chaque artifact.
      Coût : 84 * ~50ms = ~4.2s sur corpus actuel, ~42s à 10x.
      Vs ~1s sans embedding. Acceptable car rare et borné.

    - Boot post-merge initial : DROP + CREATE de artifacts_fts
      avec nouveau tokenizer + premier remplissage de
      artifacts_vec. Coût équivalent au reindex_all initial,
      ~5s sur corpus actuel.

    - RAM steady-state : +footprint du modèle (500MB à 1GB
      selon modèle choisi). Vs ~50MB actuellement. Acceptable
      sur les machines dev modernes (>16GB RAM), à surveiller
      si déploiement sur des machines contraintes.

    Impact compatibilité :

    - Le contrat MCP exposé par search() est étendu :
      paramètres existants conservés, nouveaux paramètres
      optionnels. La sémantique par défaut change (mode=hybrid),
      ce qui modifie l'ordre observable des résultats mais
      pas la présence/absence des matches (le hybrid contient
      au moins ce que le lexical pur contenait).

    - Un nouveau tool MCP index_status est ajouté. Pas de
      breaking change.

    - Les autres tools MCP (get, related, initiate_review_round,
      grant_write_permit, etc.) sont inchangés.

    - Les schemas YAML des artifacts sont inchangés.

    - Le format des artifacts sur disque est inchangé.

    - La règle memory_lookup_before_acting de shared-rules reste
      applicable telle quelle (parle de search(query, kind=...),
      ce qui reste valide).

    Interactions avec autres composants :

    - RFC cdbfee72 (résilience persistence orchestrator) : ce
      RFC respecte strictement les PILIERS A, B, C, D. PILIER A
      (writer unique flock) inchangé. PILIER B (PRAGMA défensifs)
      inchangé. PILIER C (graceful shutdown) inchangé, plus une
      étape de drop du modèle d'embedding (libération RAM).
      PILIER D (autorepair par reindex) compatible par
      construction grâce au déterminisme du modèle.

    - RFC d9399863 (proxy MCP résilient) : ce RFC ne change pas
      le transport MCP du serveur (stdio). Le proxy bufferise
      les appels search() pendant un restart binaire, comme
      avant.

    - RFC f4fe8a04 (mémoire collective active) : ce RFC sert
      DIRECTEMENT l'objectif du RFC f4fe8a04. La règle
      memory_lookup_before_acting devient enfin opérationnelle
      au sens fort : un lookup retourne des résultats pertinents.

    - Plugin defense-in-depth-core.mjs : pas de modification
      directe. Le hook continue à appeler autoIndex après
      chaque write, --index continue à no-op (PILIER A
      amendement iteration 5 du RFC cdbfee72) si serveur en
      vie. L'extension index_artifact pour calculer l'embedding
      est transparente côté hook.

    Risques résiduels :

    (1) Choix sous-optimal du modèle d'embedding. Mitigation :
    bench obligatoire sur le jeu de queries de référence avant
    de figer le choix dans l'implementation-plan. Si en
    production un meilleur modèle émerge, la migration est
    isolée (changer le modèle + reindex_all, pas de breaking
    change MCP externe).

    (2) sqlite-vec immature sur certains usages. Mitigation :
    extension active, large adoption (Mozilla, divers projets
    open source). Le RFC retient un usage très standard (vec0
    table virtuelle, kNN brute force ou approx ANN), pas un
    usage exotique. Si une régression spécifique apparait, le
    rollback est propre (cf. rollback_plan).

    (3) Augmentation du temps de boot du serveur (2 à 6s vs
    <1s). Mitigation : warm-up du modèle dans une tokio task
    background plutôt que synchronously si possible, à arbitrer
    dans l'implementation-plan. Si le boot est sur le chemin
    critique du proxy résilient (cargo build → restart), la
    latence de réindexation peut devenir perceptible. Acceptable
    car restart est rare.

    (4) Footprint RAM accru (jusqu'à +1GB). Mitigation : choix
    d'un modèle quantizé (int8) qui réduit le footprint
    typiquement par 4. Documentation explicite des prérequis
    système dans le guide opérateur.

    (5) Le déterminisme du modèle peut ne pas être strict en
    pratique (variations float-precision selon hardware,
    version BLAS, etc.). Mitigation : tolérer des écarts
    négligeables de l'ordre de 1e-6 sur les composantes du
    vecteur. Si l'écart est plus grand, c'est un bug du runtime
    d'inférence à investiguer. Pratiquement, les
    sentence-transformers en mode .encode() inference sont
    stables à 1e-5 près sur la même architecture CPU.

    (6) La table artifacts_vec n'a pas de source de vérité
    externe (les YAML ne stockent pas les embeddings). En cas
    de wipe + rebuild (PILIER D), les embeddings sont
    régénérés à partir des YAML. C'est la propriété
    structurelle qui justifie l'exigence de déterminisme. Si
    pour une raison X le modèle change entre deux boots
    (downgrade, hotfix), les embeddings stockés deviennent
    incohérents. Mitigation IMPOSÉE par décision PM iteration
    2 (incertitude 5) : un model_version est persisté à côté
    des vecteurs et comparé au model_version du modèle chargé
    au boot. Mismatch détecté → wipe automatique de
    artifacts_vec + reindex_all synchrone. L'implementation-plan
    arbitre uniquement le format de stockage (champ dédié,
    table séparée, ou SQLite user_version) sous contrainte
    de détection O(1) au boot. Cette mitigation n'est plus
    arbitrable.

    (7) Coût Anthropic si rerank=true ou hyde=true sont
    massivement utilisés. Mitigation : OFF par défaut, exposés
    comme opt-in conscient. Le guide opérateur documente le
    coût attendu.

    (8) Migration du tokenizer FTS5 (DROP + CREATE) au boot
    post-merge. Le coût ~10s sur corpus actuel est invisible.
    Risque résiduel : si l'on découvre post-merge que le
    tokenizer choisi est sous-optimal, un second DROP + CREATE
    + reindex_all est nécessaire. Coût répété mais
    fonctionnellement supporté (PILIER D).

    (9) Maturité pre-1.0 de sqlite-vec (précision iteration 3,
    réponse à F-rfc-4). L'extension est actuellement en
    version 0.1.x-alpha au moment de la rédaction. Risque :
    un upgrade automatique de la dépendance peut casser le
    build (changement d'API Rust côté wrapper) ou changer la
    sémantique du kNN (changement de comportement côté C).
    Mitigation imposée par la PROPOSITION 2 sous-section (d) :
    (i) pin de version exacte dans Cargo.toml (par exemple
    `=0.1.10-alpha.4` plutôt que `^0.1`), donc tout upgrade
    exige une modification explicite et une revue ; (ii)
    smoke test au boot qui valide le wiring fondamental
    (création vec0 jetable, insert d'un vecteur de référence,
    kNN avec résultat analytiquement vérifiable). Si le smoke
    test échoue, le serveur exite avec un message clair.
    Coût de l'instrumentation : < 50 lignes Rust, < 10ms au
    boot. Bénéfice : capture les upgrades silencieusement
    cassants. À long terme, quand sqlite-vec atteindra 1.0,
    la contrainte de pin pourra être assouplie en `^1.0` et
    le smoke test pourra être déplacé en test d'intégration
    si jugé excessif au boot.

  rollback_plan: >
    Le rollback s'effectue en trois temps indépendants :

    (1) crates/ : `git revert <commit-range>` des changements
    appliqués à db.rs, engine.rs, embedding.rs (suppression du
    nouveau fichier), fusion.rs (suppression), query.rs
    (suppression), main.rs, error.rs, Cargo.toml. Le binaire
    recompilé reprend le comportement de search() actuel (FTS5
    pur, AND implicite, sans BM25 explicite, sans embeddings).

    (2) DB : la table artifacts_vec post-revert reste présente
    dans orchestrator.db mais n'est plus écrite ni lue (le
    code qui la référence n'existe plus). Elle est inerte.
    Deux options pour la nettoyer :
      (a) attendre une corruption fortuite + PILIER D, qui
          déclenchera wipe + reindex_all et ne recréera pas
          artifacts_vec (le code revert n'en crée plus).
      (b) lancer manuellement reindex_all après le revert, qui
          recréera artifacts et artifacts_fts depuis les YAML
          sans toucher artifacts_vec (la table existe mais
          n'est plus dans le DDL effectif après revert).
    Aucune option n'est urgente : la table inerte n'a pas
    d'impact négatif.

    (3) Tests, docs : la suppression des fichiers
    search_eval.yml, integration_search.rs, search-guide.md
    est faite par le git revert. Aucun fichier ne dépend
    d'eux.

    Aucune donnée n'est perdue par le rollback. Les YAML
    sources sur disque sont la source de vérité. Les embeddings
    stockés ne sont pas une donnée utilisateur ; ils sont
    régénérables.

    Le rollback laisse le système dans l'état pré-RFC : six
    facteurs de faux négatifs présents, lookup mémoire dégradé,
    mais système opérationnel. La règle
    memory_lookup_before_acting reste applicable, simplement
    moins efficace en pratique. C'est l'état actuel avant
    merge ; le rollback ne dégrade pas la situation.

    Cas particulier — corruption après rollback. Si une
    corruption frappe entre la sortie post-rollback et un
    futur fix, le PILIER D du RFC cdbfee72 fonctionne
    inchangé : wipe + reindex_all depuis YAML, pas d'artifacts_vec
    à reconstruire (puisque le code post-revert ne la touche
    plus).

