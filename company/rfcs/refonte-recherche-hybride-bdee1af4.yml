    - /Cargo.toml (racine du workspace) : ajout de la feature
      `load_extension` à la déclaration de rusqlite au niveau
      [workspace.dependencies] (actuellement ligne 28 :
      `rusqlite = { version = "0.32", features = ["bundled"] }`,
