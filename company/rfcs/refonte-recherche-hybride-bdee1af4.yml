metadata:
  id: bdee1af4-4944-4bee-b7c0-18efd6c7961f
  status: approved
  approved_at: "2026-06-01T13:30:15.109706198+00:00"
  title: "Refonte search() en hybrid retrieval : FTS5 BM25 durci, embeddings locaux via sqlite-vec, fusion RRF, filtres structurés, reranking et HyDE optionnels via Claude"
  author: architect
  created_at: "2026-06-01"
  changelog:
    - date: "2026-06-01"
      author: architect
      description: >
        Révision iteration 3 suite au round 176d40c8 sur le RFC
        (vote Implementer = request_changes, vote CEO = approve
        sur le fond mais conditionne le write permit aux
        corrections, vote PM = approve). Cinq findings spécifiques
        au RFC + un finding commun avec le design-doc sont
        adressés, plus une vérification empirique du code.

        F-commun-1 (recommandation "crate Rust pure" inexacte).
        L'Implementer a démontré que ni candle (Rust pur mais
        download des poids HuggingFace au runtime) ni fastembed-rs
        (dépend de ort/ONNX Runtime C++ avec download de binaires
        au build) ne sont strictement "Rust pur + zéro réseau".
        Finding RETENU. Reformulation de la PROPOSITION 2 sous-
        section "Runtime d'inférence" pour distinguer
        explicitement trois axes orthogonaux : (i) autonomie
        RUNTIME de search() — exigence DURE non-négociable, aucun
        accès réseau ne doit être déclenché par un appel
        search() ou index_artifact() ; (ii) absence de FFI —
        nice-to-have, aucune contrainte ; (iii) binaire
        autonome au BUILD — out of scope, le téléchargement de
        poids ou de runtime au build est acceptable tant qu'il
        produit un artifact reproductible. La PROPOSITION 7
        (pipeline d'indexation) est complétée d'une exigence
        explicite : si le runtime d'inférence retenu télécharge
        des poids, le téléchargement est fait UNE FOIS au boot
        avec cache local, jamais au cours d'un appel
        search()/index_artifact() ; si le cache est absent au
        boot, le serveur exite avec message clair (cohérent
        avec décision iteration 2 sur l'absence de fallback).

        F-rfc-1 (Cargo.toml racine manquant dans
        affected_files). VÉRIFIÉ empiriquement : rusqlite est
        déclaré au [workspace.dependencies] du Cargo.toml racine
        (ligne 28), feature `bundled` seule. Activer
        `load_extension` impose une modification du Cargo.toml
        racine. Finding RETENU. /Cargo.toml ajouté à
        affected_files, juste après Cargo.lock, avec note de
        rationale. La lesson 611fde3e (inventaire des fichiers
        à créer en plus de modifier) trouve ici son équivalent
        pour les fichiers à modifier en zone protégée
        workspace : sans /Cargo.toml dans affected_files, le
        permit ne couvrirait pas l'activation de la feature.

        F-rfc-2 (contradiction sur Cargo.lock). Finding RETENU.
        L'iteration 1 portait une contradiction interne
        (affected_files inclut "Cargo.lock" en ligne, mais la
        section impact dit "pas listé"). Résolution : Cargo.lock
        EST listé dans affected_files pour traçabilité
        (cohérence avec lesson 611fde3e qui insiste sur
        l'inventaire complet). La note d'impact est reformulée
        pour cohérence ("Cargo.lock est listé pour traçabilité
        bien qu'il ne soit pas en zone protégée stricto
        sensu").

        F-rfc-3 (tool index_status sous-spécifié). Finding
        RETENU. Quatre champs (file_watcher_alive,
        last_indexed_at, pending_index_queue_size,
        triplet_coherent) n'avaient pas de mécanique
        d'instrumentation explicitée. La PROPOSITION 8 est
        enrichie d'un paragraphe "Mécanique d'instrumentation"
        qui spécifie pour chaque champ : la propriété
        fonctionnelle visée et la mécanique minimale acceptable
        (AtomicBool pour file_watcher_alive, lecture du
        MAX(indexed_at) en SQL pour last_indexed_at, taille
        d'un mpsc::channel pour pending_index_queue_size,
        comparaison de COUNT par table pour triplet_coherent).
        L'arbitrage technique fin reste dans
        l'implementation-plan, mais l'Implementer dispose
        désormais d'une direction claire qui ne remet pas en
        cause de décision architecturale.

        F-rfc-4 (sqlite-vec pre-1.0 ABI/API risk).
        Finding RETENU. La PROPOSITION 2 sous-section
        "Chargement de l'extension sqlite-vec" est enrichie
        d'un paragraphe sur la maturité de la dépendance, et
        la section impact ajoute un risque résiduel (R9) avec
        stratégie de mitigation : pin de version exacte
        (=0.x.y) plutôt que ^0.x, smoke test au boot qui crée
        une table vec0 jetable et vérifie qu'un kNN sur un
        unique vecteur retourne le bon résultat (échec du
        smoke test = exit avec message clair, cohérent avec
        F-commun-1 sur l'autonomie runtime).

        F-rfc-5 (signature search() actuelle non validée).
        VÉRIFIÉ empiriquement dans le code à la date de cette
        iteration 3 :
        crates/mcp-servers/orchestrator/src/main.rs lignes 144
        à 154 — la struct SearchParams contient bien `query:
        String`, `kind: Option<String>`, ET `limit:
        Option<usize>` (cette dernière ligne 153). La default
        value 10 vient de crates/config/src/constants.rs
        ligne 52 (`DEFAULT_SEARCH_LIMIT: usize = 10`). La
        signature triplet (query, kind?, limit?) du RFC est
        donc correcte. L'Implementer a probablement regardé
        un range trop étroit (145 à 151) qui s'arrête juste
        avant la ligne `limit`. Finding REJETÉ sur le constat
        de fait, MAIS la demande sous-jacente (auditer les
        callers internes du tool search avant le breaking
        change) est légitime et RETENUE. Audit empirique
        réalisé pendant cette iteration : un seul caller
        interne de engine.search dans le workspace,
        crates/mcp-servers/orchestrator/src/main.rs:569.
        Aucun appel transverse depuis d'autres crates. Les
        callers EXTERNES sont les agents via MCP, dont la
        compatibilité ascendante est garantie par le maintien
        de la position et de la sémantique de query, kind,
        limit. La PROPOSITION 9 est annotée pour citer ces
        deux vérifications empiriques avec les pointeurs de
        fichier:ligne, afin que l'Implementer puisse confirmer
        sans re-auditer.

        Aucune autre modification structurelle. Les décisions
        d'iteration 2 (pas de fallback, scope unique,
        model_version dès la v1) restent fermes. Les
        incertitudes 1 et 2 restent ouvertes pour
        l'implementation-plan.

    - date: "2026-06-01"
      author: architect
      description: >
        Révision iteration 2 suite aux arbitrages PM sur les
        cinq incertitudes structurelles remontées par l'agent-
        message 382cf805 (livraison initiale). Le PM a laissé
        ouvertes les incertitudes 1 (modèle d'embedding exact)
        et 2 (runtime ML Rust pur vs sidecar), qui restent
        arbitrées dans l'implementation-plan. Trois incertitudes
        tranchées et intégrées en dur dans le RFC :

        (a) Incertitude 3 — mode lexical-only en fallback si
        modèle indispo. DÉCISION PM : PAS de flag, exit
        explicite. Rationale PM : la règle
        memory_lookup_before_acting impose la recherche à TOUS
        les agents avant TOUTE production ; un fallback
        silencieux maquille la situation et donne une fausse
        impression de fonctionnement. Si CI manque le modèle,
        on installera le modèle dans CI plutôt que d'introduire
        un flag. Conséquence sur le RFC : la variante
        ORCHESTRATOR_LEXICAL_ONLY (proposition 9 sous-cas (b)
        de l'analyse triaxiale) est SUPPRIMÉE de l'option
        space. La sémantique unique retenue est : si le modèle
        d'embedding ne charge pas au boot, le serveur exite
        avec un message clair (cohérent avec le comportement
        sqlite-vec absent). Si l'embedding échoue par artifact
        en runtime, rollback complet de la transaction
        d'index_artifact (déjà la sémantique retenue dans
        l'iteration 1, désormais non amendable).

        (b) Incertitude 4 — scope unique vs RFC découpé en 3.
        DÉCISION PM : scope unique, on garde tout. Rationale
        PM : l'utilisateur a explicitement demandé "le truc
        qui marche" et a accepté le breaking change. Découper
        introduirait une période où la recherche est
        partiellement améliorée et où il faudrait re-cadrer la
        suite, mauvais usage du process. Les flags optionnels
        (rerank, hyde) restent OFF par défaut. Conséquence sur
        le RFC : aucun changement de scope, mais la note
        d'agent-message qui évoquait la possibilité de découper
        est explicitement caduque. Les onze propositions
        forment un tout indivisible pour ce cycle.

        (c) Incertitude 5 — model_version dans artifacts_vec.
        DÉCISION PM : oui, dès la v1. Rationale PM : ta
        recommandation est saine, c'est le genre de feature
        qu'on regrette de pas avoir mise quand on doit migrer
        plus tard, et le coût d'ajout en v1 est faible.
        Conséquence sur le RFC : promu du statut "recommandation
        mitigée arbitrable" au statut "exigence structurelle"
        de la proposition 2 (couche sémantique). Le détail
        d'implémentation (champ dédié dans artifacts_vec vs
        table séparée vs metadata SQLite user_version)
        reste arbitré dans l'implementation-plan, mais le
        contrat fonctionnel est figé : au boot, le serveur
        compare le model_version stocké au model_version du
        modèle chargé, et déclenche wipe + reindex_all
        automatique si mismatch.

        Aucune autre modification structurelle n'est portée
        par cette iteration. Les propositions 1, 3, 4, 6, 7,
        8, 9, 10, 11 sont inchangées sur le fond. Le rollback
        plan reste valide tel quel.
  description: >
    Refonte profonde du tool MCP search() de l'orchestrator pour
    corriger les six facteurs de faux négatifs identifiés par le
    diagnostic-report 6cfd1c62 et atteindre les acceptance criteria
    du task-request 02c9f6eb. Implémente l'architecture définie par
    le design-doc f433fefc : un axe lexical durci (FTS5 unicode61
    explicite, BM25 ranking, sanitize_fts_query côté Rust), un axe
    sémantique ajouté (modèle d'embedding local multilingue
    déterministe, stockage et ANN search via l'extension sqlite-vec
    dans la même connexion SQLite), une fusion par Reciprocal Rank
    Fusion, des filtres structurés (kind, author, tags, project,
    dates, id_prefix), et deux composants optionnels alimentés par
    la clé Anthropic d'opencode (reranker Claude et query expansion
    HyDE). Le pipeline d'indexation calcule l'embedding pendant
    engine.index_artifact() et l'upserte dans la même transaction
    SQLite que artifacts et artifacts_fts, préservant l'invariant
    PILIER A du RFC cdbfee72 (un seul writer flock). PILIER D
    (autorepair par reindex_all depuis YAML) est compatible par
    construction parce que le modèle d'embedding est déterministe.
    Le tool MCP `index_status` est ajouté pour rendre visible
    l'état de l'indexation et lever l'opacité du FACTEUR 6 du
    diagnostic. L'API search() évolue en breaking change contrôlé
    (paramètres existants conservés, nouveaux paramètres optionnels
    avec defaults, sémantique par défaut mode=hybrid). Touche les
    zones protégées crates/orchestrator/, crates/mcp-servers/
    orchestrator/, et la dépendance d'extension SQLite. Approbation
    CEO et write permit requis.
