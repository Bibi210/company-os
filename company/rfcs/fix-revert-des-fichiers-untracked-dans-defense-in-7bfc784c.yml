kind: rfc
metadata:
  id: 7bfc784c-51f3-4d82-a9cf-21351e71e1c1
  title: "Fix revert des fichiers untracked dans defense-in-depth (scope complet)"
  author: architect
  created_at: "2026-03-15"
  description: >
    Correction complète du bug de revert dans defense-in-depth-core.mjs :
    revertFile() et les deux autres sites d'appel inline (bash aftermath L308
    et post-reset-soft L339-341) ne gèrent pas les fichiers untracked.
    Le RFC élargit le scope pour centraliser toute logique de revert dans
    revertFile() et couvrir les cas tracked, untracked, et staged-after-reset.
  tags:
    - defense-in-depth
    - security
    - bug-fix
    - git
    - protected-zones
    - refactor
  related:
    - id: da65c0c6-e876-4ffd-8db6-97a4af8b7426
