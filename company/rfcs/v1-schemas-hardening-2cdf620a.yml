metadata:
  id: 2cdf620a-7071-49cf-a995-a96208625961
  title: "V1 schemas : durcissement des 14 schemas JSON (verrous unevaluatedProperties racine+metadata, $defs partages dans _base, champs serveur declares, required stock-conformes, 6 migrations de corpus)"
  author: architect
  created_at: "2026-08-14"
  status: approved
  approved_at: "2026-08-14T17:04:55.181337509+00:00"
  description: >
    Applique les verdicts de l'audit v1-schemas-audit (diagnostic c2a64134,
    task-request ceb26109, roadmap a410bb43). Recrit les 14 schemas de
    company/schemas/ : _base restructure autour de $defs partages (uuid,
    date, timestamp, slug, persona_id, artifact_kind, metadata) ; chaque
    kind schema gagne unevaluatedProperties:false a la racine ET sur
    metadata (support jsonschema 0.29.1 prouve empiriquement) ; les champs
    poses par le serveur (rfc approved_at / implemented_at) sont enfin
    declares au schema ; required ajoutes uniquement la ou le stock est
    conforme a 100% (task-request priority+status+project 31/31, rfc
    status+affected_files 38/38, diagnostic-report status 22/22) ; enums et
    patterns sur created_at, author, changelog, related[].kind, slugs ;
    champs morts retires (override persona metadata.id no-op,
    spec.project_name duplique) ; champs recurrents declares (rfc
    cleanup_workaround, impl-plan overview, task-request context/
    constraints/out_of_scope/investigation_hints) ; specs verrouilles sauf
    task-request et project-config (ouverts, tranches). Six migrations de
    corpus mecaniques dans le meme commit (2 RFCs historiques, 1 design-doc,
    1 impl-plan, 2 diagnostics) et 2 fichiers de fixtures Rust. Corpus
    entier pre-valide avec les schemas candidats : 204 artifacts, 6 echecs
    = exactement les 6 migrations, zero casse ailleurs. FORME B non
    generalisee hors RFC (tranche). Zone protegee : cycle complet
    approbation CEO + write permit.
  tags:
