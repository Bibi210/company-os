    ===== company/schemas/roadmap.schema.json (contenu integral apres changement) =====

    {
      "$schema": "https://json-schema.org/draft/2020-12/schema",
      "$id": "https://companyos.dev/schemas/roadmap.schema.json",
      "unevaluatedProperties": false,
      "allOf": [
        {
          "$ref": "_base.schema.json"
        },
        {
          "properties": {
            "kind": {
              "const": "roadmap"
            },
            "metadata": {
              "allOf": [
                {
                  "$ref": "_base.schema.json#/$defs/metadata"
                }
              ],
              "unevaluatedProperties": false,
              "required": [
                "description",
                "tags"
              ]
            },
            "spec": {
              "type": "object",
              "properties": {
                "domain": {
                  "allOf": [
                    {
                      "$ref": "_base.schema.json#/$defs/slug"
                    }
                  ],
                  "description": "Domaine couvert par la roadmap (ex: 'companyos-system', 'puissance4-verus', 'product-discovery'). Identifiant kebab-case, libre. Plusieurs roadmaps peuvent partager un domaine si elles couvrent des sous-thèmes distincts, mais c'est rare — privilégier une roadmap par domaine."
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "active",
                    "archived"
                  ],
                  "description": "active = roadmap vivante, mise à jour au fur et à mesure. archived = roadmap historique, plus mise à jour (ex: roadmap d'un trimestre passé que l'on garde pour mémoire)."
                },
                "narrative": {
                  "type": "string",
                  "description": "Récit stratégique de la roadmap : pourquoi ces sujets, pourquoi cet ordre, quel est le fil conducteur. C'est ce qu'on raconte à quelqu'un qui découvre le domaine. Champ libre, plusieurs paragraphes attendus."
                },
                "items": {
                  "type": "array",
                  "description": "Éléments tracés par la roadmap. Chaque item référence un artifact (projet, RFC) ou un sujet en exploration, et porte ses dimensions temporelle, causale, narrative.",
                  "items": {
                    "type": "object",
                    "properties": {
                      "key": {
                        "type": "string",
                        "description": "Identifiant local de l'item dans la roadmap (kebab-case, unique au sein de spec.items). Sert de cible pour les dépendances (depends_on). Ne pas confondre avec metadata.id — c'est juste un handle local."
                      },
                      "title": {
                        "type": "string",
                        "description": "Titre lisible de l'item (ex: 'Migrer le schéma project-config', 'Lancer le projet puissance4-verus')."
                      },
                      "ref": {
                        "type": "object",
                        "description": "Référence vers l'artifact ou le sujet tracé. Trois types supportés : project, rfc, loose. Le type discrimine le contenu attendu.",
                        "oneOf": [
                          {
                            "properties": {
                              "type": {
                                "const": "project"
                              },
                              "project_slug": {
                                "type": "string",
                                "description": "Slug kebab-case du projet (correspond au dossier projects/<slug>/ et au project_name du project-config)."
                              }
                            },
                            "required": [
                              "type",
                              "project_slug"
                            ],
                            "additionalProperties": false
                          },
                          {
                            "properties": {
                              "type": {
                                "const": "rfc"
                              },
                              "id": {
                                "type": "string",
                                "format": "uuid",
                                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                                "description": "metadata.id du RFC référencé."
                              }
                            },
                            "required": [
                              "type",
                              "id"
                            ],
                            "additionalProperties": false
                          },
                          {
                            "properties": {
                              "type": {
                                "const": "loose"
                              },
                              "category": {
                                "type": "string",
                                "enum": [
                                  "idea",
                                  "exploration",
                                  "hotfix",
                                  "observation",
                                  "dependency"
                                ],
                                "description": "Nature du sujet tracé sans artifact formel. idea = en réflexion ; exploration = creusé activement sans engagement de livraison ; hotfix = action ponctuelle hors RFC ; observation = constat à garder en mémoire ; dependency = dépendance externe non maîtrisée."
                              },
                              "label": {
                                "type": "string",
                                "maxLength": 200,
                                "description": "Description courte et lisible du sujet loose."
                              }
                            },
                            "required": [
                              "type",
                              "category",
                              "label"
                            ],
                            "additionalProperties": false
                          }
                        ]
                      },
                      "timeframe": {
                        "type": "string",
                        "enum": [
                          "past",
                          "present",
                          "future"
                        ],
                        "description": "Position temporelle grossière de l'item. past = livré, present = en cours, future = planifié. Cette information est redondante avec status mais sert au regroupement visuel (un PM veut séparer 'ce qui est fait' de 'ce qui est devant nous')."
                      },
                      "status": {
                        "type": "string",
                        "enum": [
                          "planned",
                          "in_progress",
                          "done",
                          "blocked",
                          "cancelled"
                        ],
                        "description": "État de l'item. AUTO-SYNCHRONISÉ : pour les items à ref project ou rfc, ce champ est ÉCRASÉ à la lecture par le status calculé depuis l'artifact source (cf. RFC a5f25718). La SEULE valeur que le PM peut écrire et qui sera respectée pour ces items est `blocked` (droit absolu du PM, court-circuite l'auto-sync). Pour les items à ref loose (pas d'artifact source), le status est manuel et respecté tel quel."
                      },
                      "target_date": {
                        "type": "string",
                        "description": "Cible temporelle libre : date ISO 8601 (2026-09-15), trimestre (2026-Q3), ou label (\"bientôt\", \"post-launch\"). Optionnel. Format libre pour ne pas forcer une rigueur prématurée."
                      },
                      "depends_on": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "description": "Liste de `key` d'autres items de la même roadmap dont celui-ci dépend. Permet de tracer la causalité (ne pas démarrer X tant que Y n'est pas done). Optionnel."
                      },
                      "rationale": {
                        "type": "string",
                        "description": "Pourquoi cet item est dans la roadmap, ou pourquoi à cette position. Complète narrative au niveau global avec une justification par item. Optionnel."
                      }
                    },
                    "required": [
                      "key",
                      "title",
                      "ref",
                      "timeframe",
                      "status"
                    ],
                    "additionalProperties": false
                  }
                }
              },
              "required": [
                "domain",
                "status",
                "narrative",
                "items"
              ],
              "additionalProperties": false
            }
          },
          "required": [
            "spec"
          ]
        }
      ]
    }

  impact: >
    PORTEE. Zone protegee company/schemas/ (14 fichiers recrits) +
    company/rfcs/ (2 migrations) + corpus projets (4 migrations + 1 hygiene)
    + 2 fichiers de tests Rust. Aucun code runtime modifie : aucune ligne
    de src hors bloc cfg(test) ne change.

    POUR LES AUTEURS FUTURS. Tout nouvel artifact est soumis aux verrous a
    l'ecriture (hook), au commit (pre-commit) et a make validate : un
    task-request sans priority/status/metadata.project, un rfc sans status/
    affected_files, un diagnostic sans status, un champ metadata non
    declare, une date malformee ou un related.kind inconnu sont REJETES.
    Les pratiques reelles observees satisfont deja toutes ces exigences
    (c'est le critere de selection des required). Les specs de task-request
    et project-config restent ouverts : les champs libres projet-specifiques
    y restent legaux.

    BRUIT DES ERREURS. Quand une branche allOf echoue, unevaluatedProperties
    racine ajoute une erreur en cascade ("'api_version', 'kind', ... were
    unexpected") apres l'erreur reelle. Le premier message reste toujours
    l'erreur precise ; bruit constate et juge acceptable pendant la
    pre-validation (l'alternative, abandonner le verrou racine, laisse
    passer les cles top-level parasites).

    TRIGGER HUMAIN D25. "Breaking schema change" est un trigger humain en
    prose (non path-matchable, RFC 0197fbe5). Ce RFC est un durcissement
    avec stock migre (aucun artifact valide ne devient invalide apres les
    migrations B), mais il restreint ce que les FUTURS artifacts peuvent
    contenir : le CEO doit considerer le trigger D25 et remonter a
    l'utilisateur avant grant.

    MISE EN SERVICE. Aucun make deploy-serve : aucun binaire ne change
    (seuls des fixtures de tests Rust sont touchees, rebuild au prochain
    make ci). Les deux serveurs MCP (orchestrator et yaml-validator)
    hot-reloadent les .schema.json via leur watcher
    (ConfigChangeKind::Schemas) : les nouveaux schemas prennent effet des
    l'ecriture des fichiers, sans redemarrage. Pas de reload_config (aucune
    config orchestrator Rust modifiee). Ordre impose : schemas + migrations
    B + fixtures C dans le MEME commit (atomicite : a aucun moment le
    corpus n'est invalide face aux schemas en vigueur), make ci vert exige
    avant consume du permit.

  rollback_plan: >
    git revert du commit unique (schemas + migrations + fixtures) : les
    watchers rechargent les anciens schemas immediatement, les artifacts
    migres reviennent a leur forme anterieure par le meme revert, aucune
    donnee DB touchee (les schemas ne sont lus qu'a la validation). Aucun
    deploy-serve ni reload_config au rollback non plus. Si un seul
    durcissement se revele trop strict a l'usage (ex. un required
    conteste), le rollback partiel est un patch de schema isole via un
    nouveau RFC, pas un revert global.

