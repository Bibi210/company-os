api_version: companyos/v1
kind: rfc
metadata:
  id: 25b6678c-5c47-4f3c-9f61-804d98fc78b2
  title: "Hotfix identité d'agent dans le hook : mapping sessionID→persona via authenticate, réparation M13/M12a/garde cross-persona, retrait du hot-reload de code non fiable"
  author: architect
  created_at: "2026-07-14"
  status: implemented
  implemented_at: "2026-07-27T12:30:57.769762524+00:00"
  approved_at: "2026-07-14T14:10:34.232737408+00:00"
  project: company-os
  description: >
    Hotfix de l'incident bloquant diagnostiqué en 9ed7c07c : le mécanisme 13
    (RFC a4ee8b6a, hasActivePermit exige granted_to === input.agent) bloque
    TOUTES les écritures en zone protégée parce que l'API plugin opencode ne
    fournit AUCUN champ agent dans les hooks tool.execute.before/after (vérifié
    sur les binaires 1.15.13 → 1.17.18). Ce RFC introduit une source d'identité
    réelle : un mapping sessionID→persona construit par le hook en observant
    les appels authenticate (dernière authenticate gagne), avec résolution
    input.agent (si un futur opencode le fournit) → mapping → fail-closed avec
    message explicite. M13, M12a (CEO no-write) et la garde cross-persona
    basculent sur cette source. Corrige aussi la détection du nom de tool
    authenticate (mcp_orchestrator_authenticate jamais matché : le hook voit
    orchestrator_authenticate) et retire le hot-reload de code du wrapper
    (import "?t=mtime" non fiable sous Bun, facteur de masquage de l'incident) :
    tout changement de code plugin exige désormais un restart opencode (pattern
    promotion explicite, RFC 18011bfc). Application via la parade échappatoire
    humaine (précédent RFC c129453c) : les agents ne peuvent pas écrire
    company/plugins/ tant que le bug n'est pas corrigé, l'utilisateur applique
    et committe lui-même.
  tags:
    - companyos-v1
    - hotfix
    - defense-in-depth
    - write-permit
    - mechanism-13
    - agent-identity
    - session-mapping
    - authenticate
    - hot-reload
    - opencode-plugin-api
    - companyos-internals
    - critical-infra
  related:
    - id: 9ed7c07c-3c2d-45fa-a5ed-7ec9ac7667f7
      kind: diagnostic-report
      relationship: input
    - id: a4ee8b6a-ebcd-4a76-96eb-7e31785c8ae6
      kind: rfc
      relationship: related
    - id: b9dbcff9-a168-46e7-803e-ce05924386f5
      kind: task-request
      relationship: related
    - id: c129453c-3a8f-47cf-bf3e-a070e12416b0
