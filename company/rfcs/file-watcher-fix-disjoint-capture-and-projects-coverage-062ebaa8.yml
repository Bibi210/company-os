  description: >
    Corrige le bug du file watcher mort au boot diagnostiqué dans le
    diagnostic-report 9534dd33 (disjoint capture en Rust edition 2024 qui
    drop le RecommendedWatcher avant la première iteration du consumer task)
    et profite du même write permit pour livrer l'extension du scope du
    watcher demandée par le task-request 36ecb829 (acceptance criterion 4 :
    surveiller projects/ en plus de company/ et des protected zones).
    Ajoute aussi une instrumentation defensive (Drop bruyant gardé par un
    flag is_shutting_down) pour rendre tout futur problème équivalent
    visible immédiatement sans générer de faux positifs au shutdown propre.
    Touche les zones protégées `crates/mcp-servers/orchestrator/src/main.rs`
    et `crates/config/src/watcher.rs`. Approbation CEO et write permit
    requis.
