api_version: companyos/v1
kind: rfc
metadata:
  id: bde023e2-8633-42c9-911a-80dcd5157c62
  title: "Hook defense-in-depth : revert sélectif par défaut, nucléaire borné au seul cas baseline-indisponible"
  status: approved
  approved_at: "2026-06-04T08:18:00.982890770+00:00"
  author: architect
  created_at: "2026-06-04"
  description: >
    Le hook defense-in-depth, quand il détecte une altération non-MCP de
    write_permits après une commande bash (revertPermitTampering,
    defense-in-depth-core.mjs L216), bascule entre une branche SÉLECTIVE
    (DELETE WHERE id NOT IN before_ids) et une branche NUCLÉAIRE (DELETE
    FROM write_permits, wipe total). Le diagnostic montre que le nucléaire
    se déclenche sur le seul critère `before === null` (la DB n'existait
    pas avant le bash), ce qui amalgame deux situations distinctes : une
    vraie absence de baseline légitime, et une simple recréation/réouverture
    de fichier DB par un binaire. Ce RFC fait du revert sélectif le
    comportement par défaut et borne strictement le wipe total au seul cas
    résiduel où aucune baseline légitime ne peut être déterminée (snapshot
    baseline absent ET aucun permit scellé en HEAD git récupérable). La
    garantie de sécurité d'origine est préservée : tout permit injecté hors
    du canal MCP, absent de la baseline et non scellé en HEAD git, est
    toujours supprimé. La sélectivité signifie « ne pas toucher aux permits
    légitimes », pas « laisser survivre des permits illégitimes ». Touche la
    zone protégée company/plugins/ : approbation CEO + write permit requis.
    Périmètre strictement borné à la logique de revert du hook ; ne modifie
    pas l'émission (atomic-grant-permit RFC 359f9162, déjà livré) ni la
    sémantique des permits.
  tags:
    - defense-in-depth
    - write-permit
    - selective-revert
    - companyos-internals
    - friction-permits
    - security
    - critical-infra
