api_version: companyos/v1
kind: rfc
metadata:
  id: 5bacb08a-ac37-4ccc-847f-16edcf70c1ba
  title: "Durcissement de la récupération MCP post-crash : télémétrie persistée par le proxy, trace de crash pré-unwind, reindex isolé par artifact, boot readiness-first avec embedder late-bound, health-check progressif 10→20→40 s, escalade -32050 à 45 s, surveillance des coredumps par make doctor"
  author: architect
  created_at: "2026-09-11"
  project: company-os
  status: approved
  approved_at: "2026-09-11T08:47:16.916152319+00:00"
  description: >
    RFC du chantier correctif MCP issu du design-doc APPROUVÉ aae2af60 (round
    deda9448 clôturé, double approve après 3 itérations), cadré par le
    task-request 7d83f35d (priorité critical) après l'incident du 2026-09-09
    (diagnostic ccd7c984) : 5 SIGABRT du binaire orchestrator servi en 2 jours
    (déclencheur reproduit : écriture YAML → auto-reindex → crash), 2 reboots
    humains, cécité télémétrique totale (stderr proxy et serveur perdus dans
    un socket opencode non persisté). Porte les 8 décisions D1-D8 du design :
    télémétrie persistée écrite par le proxy seul (fichiers rotatifs sous
    company/data/logs/, stderr serveur capturé par pipe), panic hook
    pré-unwind dans les DEUX serveurs servis (traces fsyncées jamais purgées
    sous company/data/crashes/), investigation gdb des 4 cores orchestrator
    (Implementer, non bloquante), isolation par artifact du reindex
    (catch_unwind périmétré, promesse requalifiée : confinement + trace
    garantie, pas impossibilité de l'abort), boot readiness-first avec
    embedder late-bound et gate de warm-up, health-check progressif
    10→20→40 s, plafond d'escalade -32050 abaissé de 120 s à 45 s,
    surveillance des coredumps par make doctor (baseline auto-capturée,
    informationnel en mode hook deploy-serve), cadrage des tests (overrides
    env des constantes temporelles, harness d'intégration proxy créé,
    injection de faute par variable d'environnement sous
    cfg(debug_assertions)). Porte DEUX SUPERSESSIONS PARTIELLES explicites :
    RFC 18011bfc contrat C2 (seule la valeur 120 s → 45 s change ;
    at-most-once, forme du -32050, drop des notifications survivent) et RFC
    bdee1af4 étape 19 (l'invariant « reindex synchrone avant de servir »
    devient une gate de warm-up : la propriété observable est conservée,
    l'ordonnancement de boot change). Séquencement avec POINT D'ARRÊT
    utilisateur : restart de session opencode requis entre l'instrumentation
    et le reste du chantier.
  tags:
    - mcp
