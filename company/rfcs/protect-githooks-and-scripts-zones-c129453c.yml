kind: rfc
metadata:
  id: c129453c-3a8f-47cf-bf3e-a070e12416b0
  title: "Ajouter .githooks/ et company/scripts/ aux zones protégées"
  author: architect
  created_at: "2026-07-02"
  status: implemented
  implemented_at: "2026-07-03T16:02:35.973192350+00:00"
  approved_at: "2026-07-03T15:59:10.346517058+00:00"
  project: company-os
  description: >
    Ajoute les prefixes ".githooks/" et "company/scripts/" à
    company/config/protected-zones.json. Le pre-commit hook est le point
    d'enforcement Layer 3 du harness : tant qu'il n'est pas en zone protégée,
    tout agent peut le modifier sans RFC ni write permit (démontré le
    2026-06-10, commit 916bf1d). Un harness dont le point d'enforcement est
    librement modifiable par les agents qu'il contraint n'est pas un harness.
    company/scripts/ est inclus par le même argument : check-artifact-naming.sh
    est invoqué PAR le plugin defense-in-depth (chaîne d'enforcement) et
    deploy-serve.sh est exécuté par le proxy (vecteur d'exécution de code).
    Changement de données pur : les quatre consommateurs de la liste de
    prefixes la lisent dynamiquement depuis le JSON, aucun code à modifier.
    protected-zones.json est lui-même en zone protégée (company/config/) :
    approbation CEO + write permit requis.
