metadata:
  id: 359f9162-18f2-4b72-85b0-7d0e44608959
  title: "Atomiciser grant_write_permit + scellement DB côté MCP (auto-commit avec rollback)"
  status: approved
  approved_at: "2026-06-03T21:30:30.499103805+00:00"
  author: architect
  created_at: "2026-06-03"
  description: >
    Élimine la fenêtre non-atomique entre l'émission d'un write permit
    par le CEO (grant_write_permit) et son scellement en git (commit de
    company/data/orchestrator.db). Décision tranchée : le tool MCP
    grant_write_permit effectue lui-même, dans la même opération, le
    git add -f + git commit de la DB juste après l'INSERT du permit.
    Si le commit échoue, le permit inséré est rollback (DELETE) pour ne
    jamais laisser de permit fantôme. Le contournement manuel "le PM/
    l'Implementer commit la DB pour sceller" (write_permit_full_sequence
    étape 2 de la persona Implementer) est retiré dans le même scope, et
    les lessons qui le décrivaient sont supersedées. Touche les zones
    protégées crates/ et company/personas/ : approbation CEO + write
    permit requis. Périmètre strictement borné à l'atomicité de
    l'émission ; ne modifie PAS le revert nucléaire vs sélectif du hook
    (sujet voisin defense-in-depth-selective).
  tags:
    - write-permit
    - defense-in-depth
    - atomicity
    - mcp
    - companyos-internals
    - friction-permits
    - critical-infra
