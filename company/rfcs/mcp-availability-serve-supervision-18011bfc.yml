api_version: companyos/v1
kind: rfc
metadata:
  id: 18011bfc-c8ae-4c31-8aca-f994755b93e7
  title: "Disponibilité MCP définitive : binaires servis séparés du build (target/serve, promotion atomique), supervision sans abandon dans le proxy, readiness événementielle et suppression de mcp_reconnect"
  author: architect
  created_at: "2026-07-02"
  status: draft
  description: >
    Solution définitive au task-request 415c73c0 (3 coupures MCP en 24h,
    reboot manuel à chaque fois), fondée sur le diagnostic 79f13f30 :
    architecture B + A + C. B — les binaires MCP servis vivent dans
    target/serve/, jamais touchés par cargo ; la mise à jour du serveur
    devient une promotion explicite et atomique (make deploy-serve, copie +
    rename) qui déclenche un restart contrôlé, plus jamais subi ; make ci ne
    peut plus tuer le serveur par construction. A — le proxy mcp-proxy.mjs
    perd tout chemin de mort définitive : zéro process.exit sur échec de
    respawn, backoff exponentiel plafonné avec réarmement, respawn
    conditionné à un binaire présent/exécutable (watch du répertoire parent,
    robuste au rename), 'error' et 'close' traités comme événements de cycle
    de vie au même titre que 'exit' (ferme le mode zombie), health check
    conservé comme confirmation post-respawn uniquement. C — le buffer FIFO
    devient le contrat de readiness : les appels MCP attendent pendant une
    indisponibilité ; au-delà d'un plafond (120s), erreur JSON-RPC
    structurée (-32050, escalate:true) ordonnant à l'agent d'escalader à
    l'utilisateur sans retry ; la règle de prose mcp_reconnect est remplacée
    par une courte description du contrat. Supersede partiel du RFC
    d9399863 : NDJSON framing, buffer FIFO, replay du handshake conservés ;
    circuit breaker suicidaire, watch de fichier et prose de retry
    remplacés.
  tags:
    - companyos-v1
    - mcp
    - proxy
    - availability
    - supervision
    - atomic-deploy
    - resilience
    - harness
    - critical-infra
  related:
    - id: 79f13f30-af1a-453e-9b42-962c35f93d26
      kind: diagnostic-report
      relationship: input
    - id: 415c73c0-eae9-46e0-8f05-e3ff38156b3c
      kind: task-request
      relationship: input
    - id: d9399863-254e-42f5-a485-ea019ce56a93
      kind: rfc
      relationship: supersedes
    - id: a410bb43-544c-44c8-b22a-6c3022df3fe3
