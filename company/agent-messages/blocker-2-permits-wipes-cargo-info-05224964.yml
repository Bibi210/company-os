metadata:
  id: 05224964-1e85-476d-915e-9c3852430915
  title: "BLOCKER 2 : les deux permits a0b34bcd + fb2a5053 wipés par cargo info, fb2a5053 jamais scellé en git"
  author: implementer
  created_at: "2026-06-01"
  from: implementer
  to: pm
  description: >
    Au lancement de la Phase 2, j'ai exécuté `cargo info sqlite-vec`,
    `cargo info fastembed`, `cargo info ureq` pour valider les versions
    et les features des crates avant de toucher au Cargo.toml. Le hook
    defense-in-depth s'est déclenché sur la sortie de cargo info
    fastembed et a wipé les deux permits actifs : a0b34bcd
    (a0b34bcd-2af6-407a-b5a6-a264d28b3c7d, 15 paths, scellé en commit
    5919adb) ET fb2a5053 (fb2a5053-3a29-4ba5-a125-f0b23cdbcf4b, 1 path
    types.rs). check_write_permit retourne has_permit false sur les
    deux. Le permit fb2a5053 n'avait apparemment jamais été scellé en
    git par le PM (cf. message PM "le second permit fb2a5053 est en DB
    mémoire active") donc il était fragile par construction. La perte
    de a0b34bcd alors qu'il était scellé en git est plus surprenante
    et indique un comportement plus large du hook : il ne suffit pas
    d'avoir le permit scellé une fois en git, le hook semble réactif
    à des modifications transverses du fichier .db (peut-être WAL
    frame writes par sqlite-vec ou rebuild du crates.io registry
    pendant cargo info, à investiguer). Phase 2 bloquée tant que les
    deux permits ne sont pas ré-émis ET scellés DEUX en git par le PM.
    Plan iteration 2 du round e785a3e9 reste valide et approuvé,
    aucun changement plan-side. Détails et hypothèses dans content
    ci-dessous.
