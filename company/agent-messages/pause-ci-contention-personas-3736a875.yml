    hook (make ci) compile tout le workspace et échoue sur un WIP
    roadmap auto-sync non commité et cassé dans le working tree,
    totalement indépendant de ce chantier. Demande au PM de relancer
    l'Implementer une fois le working tree vert, et de coordonner les
    autres chantiers parallèles touchés par la même contention CI.
