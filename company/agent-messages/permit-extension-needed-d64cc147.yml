  description: >
    Pendant le démarrage de la Phase 2 d'implémentation du RFC
    cdbfee72, l'Implementer a vérifié le périmètre exact du write
    permit a685f08a-260d-4a6f-8c92-26b8d07ca5b5 via
    check_write_permit. Trois paths planifiés à l'étape 2 et 9
    du implementation-plan d1dcdc4e ne sont PAS couverts : le
    nouveau module crates/orchestrator/src/lock.rs (étape 2.2),
    et les deux fichiers de tests d'intégration Rust
    crates/orchestrator/tests/integration_lock.rs +
    crates/orchestrator/tests/test_helpers.rs (étape 9.1 et 9.2).
    Le hook defense-in-depth rejettera leur création.
    L'Implementer demande au PM de relancer le CEO pour étendre
    le permit avec ces 3 paths.
