spec:
  content: >
    PM,

    Les livrables de cadrage et de design pour le task-request
    02c9f6eb (refonte search hybrid lexical + sémantique) sont
    prêts pour les review rounds.

    --- LIVRABLES ---

    1. Diagnostic-report 6cfd1c62
       Fichier : projects/company-os/diagnostic-reports/
       recherche-faux-negatifs-baseline-6cfd1c62.yml
       Status : resolved.
       Contenu : profil empirique du corpus (84 artifacts, 12
       kinds, ~650KB de contenu indexé, bilingue FR+EN),
       confirmation des trois queries symptôme du task-request,
       décomposition en SIX facteurs indépendants cumulatifs
       (sémantique vs lexical, AND implicite FTS5, absence de
       stemming, fragilité aux opérateurs FTS5 historiques,
       tokenisation opaque des identifiants, dépendance au
       file watcher pour la fraîcheur). Baseline de latence :
       FTS5 < 2ms warm sur corpus actuel. Mesure du taux de
       faux négatifs : 24% sur un échantillon de 17 queries
       testées, plus 1 erreur SQL nue. Découverte secondaire :
       le task-request 02c9f6eb n'était pas indexé au moment
       de mon investigation (file watcher en retard ou en
       silence). J'ai corrigé manuellement via index_artifact()
       pour pouvoir mesurer, et j'ai documenté ce facteur 6
       d'observabilité comme cause secondaire à traiter par le
       pipeline d'indexation refondu.

    2. Design-doc f433fefc
       Fichier : projects/company-os/design-docs/
       recherche-hybride-architecture-f433fefc.yml
       Contenu : architecture hybrid retrieval moderne.
       Quatre piliers transverses (lexical durci, sémantique
       par embeddings, fusion RRF, filtres structurés), plus
       deux composants optionnels alimentés par la clé
       Anthropic (reranker Claude, query expansion HyDE).
       Stockage vectoriel via sqlite-vec dans la MÊME
       connexion SQLite que FTS5, ce qui préserve strictement
       PILIER A du RFC cdbfee72 (writer unique flock). Modèle
       d'embedding multilingue local déterministe (contrainte
       structurelle imposée par PILIER D : reindex_all doit
       régénérer exactement les mêmes vecteurs). API search()
       breaking change CONTRÔLÉ (paramètres existants
       conservés, sémantique par défaut change en mode=hybrid).
       Onze composants détaillés, dix décisions tranchées avec
       rationale, douze open questions explicitement reportées
       à l'implementation-plan. Analyse triaxiale complète
       (nominal, négatif, edge cases).

    3. RFC bdee1af4
       Fichier : company/rfc/refonte-recherche-hybride-
       bdee1af4.yml
       Status : draft.
       Contenu : onze propositions concrètes qui implémentent
       l'architecture du design-doc. Surface estimée : ~2000
       lignes nettes ajoutées sur ~12 fichiers Rust + 2
       fichiers de tests + 1 doc. Toutes les zones protégées
       impactées sont listées dans affected_files (crates/
       orchestrator/ x 8 paths, crates/mcp-servers/orchestrator/
       x 2 paths, tests x 2, docs x 1). Lesson lesson learned
       611fde3e prise en compte : les fichiers À CRÉER sont
       inventoriés explicitement (embedding.rs, fusion.rs,
       query.rs, search_eval.yml, integration_search.rs,
       search-guide.md). Cargo.lock est listé pour traçabilité
       (pas en zone protégée stricto sensu). Rollback plan
       en trois temps documenté. Impact runtime mesuré (boot
       +2 à 6s, search +50 à 100ms, autorepair +4 à 42s
       selon corpus). Compatibilité MCP préservée pour les
       autres tools. Cohérence stricte avec PILIERS A, B, C,
       D du RFC cdbfee72.

    --- VERDICT SUR LA COMPLEXITÉ ET RISQUES ---

    Complexité conceptuelle : MOYENNE-HAUTE. L'architecture
    hybride RRF est un pattern bien établi en IR moderne
    (largement déployé par Bing, Vespa, Elastic, Weaviate,
    LangChain, LlamaIndex). Aucune innovation théorique requise.
    Le risque est dans le DÉTAIL d'intégration, pas dans la
    direction.

    Complexité d'implémentation : MOYENNE-HAUTE. Le RFC introduit
    pour la première fois dans CompanyOS :
    (a) le chargement d'extension SQLite (sqlite-vec) avec ses
        contraintes de feature flag rusqlite et de packaging ;
    (b) un modèle d'inférence ML en runtime du serveur (load
        au boot, footprint RAM, déterminisme à valider en
        pratique) ;
    (c) un appel HTTP synchrone à l'API Anthropic dans les
        chemins optionnels rerank et hyde.

    Aucune de ces trois nouveautés n'est insurmontable, mais
    chacune apporte sa surface de bug et son ingénierie de
    déploiement. L'Implementer va devoir trancher trois open
    questions techniques pendant le plan : le modèle exact, le
    runtime d'inférence Rust pur (candle, fastembed-rs, etc.) ou
    sidecar, et la stratégie de packaging de sqlite-vec.

    Risques structurels identifiés (triés par sévérité décroissante) :

    R1 — Modèle d'embedding non strictement déterministe en
    pratique. Théoriquement les sentence-transformers en mode
    inference sont déterministes, mais des variations
    float-precision peuvent apparaître selon hardware / BLAS /
    version de librairie. Si l'écart est > 1e-5, c'est un bug du
    runtime à investiguer, mais ça peut bloquer le PILIER D du
    RFC cdbfee72 (reindex_all qui régénère des vecteurs subtilement
    différents). Mitigation proposée dans le RFC : tolérer des
    écarts négligeables (cosine reste > 0.9999), monitorer en
    test.

    R2 — Le sqlite-vec packaging. La crate Rust qui wrap
    sqlite-vec doit soit embed le code C statiquement, soit
    fournir un binaire .so/.dylib à côté. Si on choisit
    sidecar process pour l'inférence ML, on multiplie ce
    problème. Mitigation : tranchage strict dans
    l'implementation-plan d'une stratégie unique (recommandation
    RFC : tout in-process Rust pur).

    R3 — Augmentation du boot time du serveur de < 1s à 2-6s.
    Le proxy résilient (RFC d9399863) considère un restart
    binaire comme rapide. Si le boot passe à 6s, l'utilisateur
    perçoit la coupure pendant les cargo build. Mitigation : un
    warm-up du modèle en tokio task background plutôt que sync,
    à valider en implémentation.

    R4 — Coût et latence Anthropic. Si quelqu'un (un agent qui
    cherche à maximiser la qualité) écrit search(rerank=true)
    par défaut dans son lookup mémoire, on encourt des appels
    facturés inutiles. Mitigation : OFF par défaut, documenté
    comme opt-in conscient. Le guide opérateur doit insister
    sur le coût.

    R5 — Le breaking change contrôlé sur search() modifie
    l'ordre observable. Aucun test automatisé existant ne
    dépend de l'ordre exact (à vérifier pendant l'implémentation),
    mais si un agent humain s'attendait à un ordre particulier,
    il sera surpris. Mitigation : changelog du tool MCP et
    lesson-learned à la clôture.

    R6 — Migration du tokenizer FTS5 (DROP + CREATE +
    reindex_all post-merge). Le coût ~10s est invisible mais
    peut surprendre l'opérateur qui voit le boot du serveur
    prendre plus longtemps qu'avant la première fois. Mitigation :
    documentation explicite et log explicite au boot ("First
    boot after RFC bdee1af4 merge: reindexing 84 artifacts...").

    --- INCERTITUDES STRUCTURELLES où je signale plusieurs options ---

    Je n'ai PAS tranché les points suivants car ils relèvent
    d'arbitrages d'implementation-plan ou d'arbitrages de
    politique qui peuvent justifier ton input ou celui du CEO.

    INCERTITUDE 1 — Modèle d'embedding exact. J'ai listé quatre
    candidats sérieux (bge-m3, multilingual-e5-large,
    paraphrase-multilingual-mpnet-base-v2,
    nomic-embed-text-v1.5) et imposé trois contraintes
    structurelles (déterminisme, multilingue natif, footprint
    < 1GB). Le choix exact dépend d'une mesure empirique sur le
    jeu de queries de référence, qui se fait dans
    l'implementation-plan. Si tu as une préférence éditoriale
    (par exemple "préfère bge-m3 parce que…"), dis-le, sinon
    l'Implementer arbitrera.

    INCERTITUDE 2 — Runtime d'inférence ML. Crate Rust pure
    (candle, fastembed-rs) ou sidecar process (ollama,
    llama.cpp en embedding mode). J'ai recommandé Rust pur pour
    cohérence "one binary", mais ça dépend de la disponibilité
    du modèle retenu dans un runtime Rust pur. C'est lié à
    l'incertitude 1.

    INCERTITUDE 3 — Mode "lexical only" en fallback si modèle
    indispo. Le RFC actuel dit "si modèle indispo au boot,
    serveur exite". Une variante serait d'introduire un flag
    d'env ORCHESTRATOR_LEXICAL_ONLY=1 qui force le mode dégradé.
    Pros : disponibilité dans des environnements minimaux (CI
    sans modèle). Cons : matrix de modes qui complique le
    debug. Recommandation actuelle : pas de flag, exit explicite.
    Si tu juges qu'il y a un usage important hors-modèle (CI ?),
    on peut ajouter le flag.

    INCERTITUDE 4 — Le RFC actuel embarque les deux composants
    optionnels Anthropic (rerank et HyDE) dans le scope du même
    cycle. Une variante MINIMALISTE serait de les exclure pour
    l'instant et de les rendre dans un RFC ultérieur, et de
    livrer juste le pipeline hybrid local sans Anthropic.
    Pros : scope plus petit, livraison plus rapide. Cons :
    on perd la possibilité de mesurer dans le même cycle si le
    rerank apporte vraiment quelque chose. Recommandation
    actuelle : tout dans le même RFC parce que les flags sont
    OFF par défaut, donc zéro impact pour les utilisateurs qui
    ne les activent pas. Mais c'est un point qui peut faire
    débat.

    INCERTITUDE 5 — model_version stocké dans artifacts_vec
    pour détecter un changement de modèle entre boots. Le RFC
    le recommande mais ne tranche pas définitivement. Si tu
    juges que "un modèle pour toute la vie du système v1" est
    une posture acceptable, on peut différer cette feature au
    V2. Recommandation : implémenter dès la v1 parce que c'est
    facile à ajouter et difficile à rétrofitter quand la
    structure de la table est déjà gravée.

    --- ENCHAÎNEMENT PROPOSÉ ---

    1. Tu lances trois review rounds en parallèle :
       (a) review du diagnostic-report 6cfd1c62 par PM +
           Implementer (le diagnostic n'a pas vocation à
           être contesté sur le fond, mais une review
           triaxiale standard valide la méthodologie).
       (b) review du design-doc f433fefc par PM +
           Implementer (review triaxiale standard ; le PM
           valide l'alignement avec le task-request,
           l'Implementer valide la faisabilité technique).
       (c) review du RFC bdee1af4 par PM + Implementer +
           CEO (RFC standard, le CEO approuve le changement
           structurel et le write permit).

    2. Suite à l'approbation du RFC + grant_write_permit, un
       Implementer prend en charge la rédaction de
       l'implementation-plan (qui devra trancher les open
       questions du design et choisir le modèle d'embedding,
       le runtime, le packaging sqlite-vec, les valeurs précises
       des constantes).

    3. Implémentation + tests + bench qualité + documentation.

    4. Lesson-learned à la clôture du task-request, conformément
       à la règle lesson_after_every_artifact de shared-rules,
       capitalisant : (a) stratégie hybrid + RRF qui marche,
       (b) surprises rencontrées en implémentation (footprint,
       déterminisme effectif, latence du modèle choisi), (c)
       arbitrages tranchés. La lesson chaînera avec 611fde3e
       (résilience persistence) via "related" : les deux
       chantiers partagent l'invariant PILIER A et la
       contrainte PILIER D.

    --- NOTE TRANSVERSE ---

    Si pendant les review rounds des éléments structurels du
    design ou du RFC doivent changer, je suis disponible pour
    réviser. Les open questions sont là pour signaler ce qui
    PEUT changer sans toucher au design. Les décisions sont
    là pour signaler ce qui ne PEUT PAS changer sans
    re-cadrer.

    Si le CEO juge le scope trop large et veut découper en
    plusieurs RFCs (par exemple : RFC1 = lexical durci seul,
    RFC2 = embeddings, RFC3 = rerank/HyDE), je peux faire la
    découpe. Le design-doc actuel pose les bons piliers pour
    un découpage propre. Mais ma recommandation reste l'unité,
    parce que la livraison du PILIER 2 (embeddings) seule
    n'apporte pas beaucoup de valeur sans la fusion RRF, et
    que les trois piliers core (lexical durci + sémantique +
    RRF) sont structurellement couplés.

    À ta main pour les review rounds.

    Architect.
