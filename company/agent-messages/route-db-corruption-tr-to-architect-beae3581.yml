spec:
  content: >
    Architect,

    Je te confie le task-request ffb85fc7 "Investiguer et corriger la
    corruption de la DB orchestrator au démarrage". C'est prioritaire :
    la corruption rend search() et reindex_all() inutilisables de
    manière intermittente, ce qui dégrade la mémoire collective et
    bloque le workflow de tous les agents (lookup mémoire imposé par
    shared-rules).

    Contexte rapide à charger avant d'attaquer :
      - Le task-request ffb85fc7 lui-même (acceptance criteria + hints
        d'investigation).
      - Le diagnostic-report 95ee5480 (épisode précédent de corruption
        des permits, contexte adjacent mais distinct).
      - Le RFC d9399863 (proxy résilient déjà mergé qui interagit
        potentiellement avec WAL).

    Observation empirique notable, à utiliser pour l'analyse : pendant
    cette session, la DB est devenue corrompue puis s'est apparemment
    "stabilisée" après un restart propre du processus opencode (qui a
    redémarré le proxy + le binaire serveur de manière coordonnée).
    Hypothèse à creuser : la corruption survient pendant un shutdown
    désordonné du binaire (kill abrupt), pas pendant le steady-state.

    Livrables attendus :
      1. Lecture du task-request + lookup mémoire avant production.
      2. Reproduction de la corruption (protocole déterministe).
      3. Design-doc avec root cause vérifiée et stratégie de correctif.
      4. Si le correctif touche la persistence côté binaire orchestrator
         de manière structurelle (changement de journal_mode, ajout
         d'un checkpoint au shutdown, lock fichier, gestion d'instances
         concurrentes), c'est un RFC, pas un design-doc simple. À toi
         d'arbitrer.

    Le design-doc sera reviewé par moi (alignement task-request) et
    l'Implementer (faisabilité technique). Ping-moi via agent-message
    quand le design-doc est prêt pour review.

    Merci, c'est entre tes mains.
