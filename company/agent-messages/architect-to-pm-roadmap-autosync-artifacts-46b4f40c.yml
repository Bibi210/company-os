spec:
  content: >
    PM, j'ai bouclé le cadrage architectural du task-request e8c4d628
    (roadmap auto-sync absolu + typage strict loose). Trois artifacts
    produits, prêts pour la chaîne review.

    ARTIFACTS :
    - diagnostic-report 04b06ad9 : mesure empirique de la dérive +
      analyse du data model d'indexation.
    - design-doc 3b286da8 : architecture (composants, décisions,
      triaxiale).
    - RFC a5f25718 : changement structurel, supersede PARTIELLEMENT le
      RFC a49801aa. Statut draft, prêt pour review round (rfc:[all]) puis
      approbation CEO + write permit.

    MESURE DE DÉRIVE (le chiffre que tu voulais). Une seule roadmap
    existe (329da45f). Sur ses 12 items à ref rfc : 5 étaient en
    future/planned alors que les RFCs étaient déjà mergés au moment du
    "où on en est ?" (dérive franche de 42%). Ta mise à jour manuelle
    d'hier a corrigé ça mais a SUR-corrigé : tu as marqué "done" 8 items
    dont le RFC source est encore "approved" sur disque, pas
    "implemented". Donc 8/12 sont encore en dérive vs le mapping cible.

    DÉCOUVERTE NON ANTICIPÉE (importante pour toi). Ces 8 RFCs sont
    "approved" alors que leur code est mergé : leur cycle de vie n'a
    jamais été clôturé via rfc_set_implemented (cause connue, lesson
    80f7b27a : le tool n'était pas visible dans la session où il a été
    créé, clôture en attente d'un reboot). CONSÉQUENCE : quand l'auto-sync
    sera déployé, ces 8 items repasseront de "done" à "in_progress" car
    l'auto-sync dit la vérité du RFC (approved -> in_progress), pas ton
    optimisme. C'est CORRECT et voulu. Pour qu'ils repassent en "done",
    il faut clôturer les 8 RFCs via rfc_set_implemented au prochain boot
    de session. C'est HORS SCOPE de ce task-request mais c'est un sujet
    de suivi que tu devrais tracer (ironie : la roadmap elle-même pourra
    le tracker une fois l'auto-sync en place).

    DÉCISIONS CLÉS QUE J'AI TRANCHÉES :

    1. OÙ VIT L'AUTO-SYNC : À LA LECTURE (summarize/list), pas à
       l'indexation. C'est l'option (b) de ton hint, et ton avis non
       bloquant était le bon. Raison décisive : les items de roadmap ne
       sont PAS matérialisés en DB aujourd'hui (ils sont déjà parsés à la
       volée par les deux tools), et la table artifacts n'a pas de
       colonne status. Le calcul à la lecture est toujours frais (un RFC
       qui change de status ne rend aucune roadmap stale), ne touche pas
       le pipeline d'indexation, et préserve trivialement PILIER A et
       PILIER D. AUCUNE migration SQL, aucune table roadmap_items.

    2. STOCKAGE DES ITEMS : inchangé, ils restent dans le YAML, parsés à
       la volée. Pas de table dédiée.

    3. MAPPING REF=RFC (sur metadata.status, le canonical) : draft ->
       planned, review (round open, best-effort) -> in_progress, approved
       -> in_progress, implemented -> done, rejected -> cancelled. Le
       signal "round open" est best-effort et jamais bloquant (les rounds
       ne sont pas rebuildés par PILIER D).

    4. MAPPING REF=PROJECT : fallback déterministe binaire. Dossier
       projects/<slug>/ existe -> in_progress ; absent -> planned. PAS de
       déduction d'activité git (signal bruité, coûteux, ambigu). Le PM
       garde blocked. Porte ouverte pour enrichir plus tard si un champ
       status arrive au project-config. J'ai préféré inclure ce mapping
       simple plutôt que le différer (ton out_of_scope l'autorisait à
       différer, mais le fallback existence-dossier est sans risque).

    5. BLOCKED SACRALISÉ : short-circuit AVANT tout mapping. Un item
       blocked dont le RFC source est implemented reste blocked. C'est la
       seule valeur que tu peux écrire manuellement et qui sera respectée
       pour un item rfc/project.

    6. external -> loose : breaking schema change borné (1 roadmap,
       migrée dans le même cycle). category enum strict + label maxLength
       200 + additionalProperties:false.

    7. DRIFT WARNINGS : ajoutés à summarize_roadmap uniquement (pas
       list_roadmaps). Format {key, yaml_status, mapped_status, ref}.
       Non bloquant, l'auto-sync gagne toujours.

    MIGRATION 329da45f (incluse dans le RFC) : tes 3 items external
    deviennent loose (db-schema-migration-hotfix -> hotfix,
    api-callers-discoverability -> idea, backup-strategy -> observation),
    et les 8 items rfc approved sont alignés en in_progress dans le YAML
    pour éviter 8 drift_warnings le jour 1.

    VERDICT COMPLEXITÉ : MOYENNE. Le gros du travail est du code Rust
    localisé (roadmap_summary.rs + engine.rs, plus la migration des
    fixtures de test qui utilisent "external"). Pas de migration SQL, pas
    de nouveau tool MCP, pas de touche à l'enum ArtifactKind ni à
    access_level. Le périmètre permit est circonscrit (7 fichiers,
    affected_files en FORME B structurée).

    RISQUES STRUCTURELS : (a) breaking schema change external->loose,
    mitigé par migration même cycle ; (b) le status YAML devient
    cosmétique pour rfc/project non blocked, mitigé par la réécriture de
    la description du champ + les drift_warnings ; (c) appariement
    file_path en review_rounds potentiellement fragile pour la détection
    round-open, mitigé car le mapping reste correct sans ce signal
    (raffinement optionnel, abandonnable en implementation-plan).

    À toi d'orchestrer la review du RFC. Je reste dispo pour les
    itérations.
