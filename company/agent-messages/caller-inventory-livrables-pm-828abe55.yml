spec:
  content: |
    PM,

    Task-request dabc159c traité. Livrables :

    1. DIAGNOSTIC-REPORT 56513173 (resolved)
       projects/company-os/diagnostic-reports/caller-inventory-empirical-recension-56513173.yml
       Recensement empirique des deux cas + sanity-check rétroactif.

    2. RFC eb42a8de (draft, prêt pour review)
       company/rfcs/caller-inventory-discipline-eb42a8de.yml

    3. AGENT-MESSAGE 828abe55 (ce message)

    --- OPTION RETENUE : (d) combinaison ---

    Ton avis non bloquant était juste : checklist plan qui RÉFÉRENCE
    l'output d'un tool MCP. Décliné en trois composants qui se
    renforcent :
    - (c) tool MCP `list_callers(symbol, kind, scope)` côté
      orchestrator. Exécute `rg` en sous-process (modèle des 4 call
      sites git déjà dans main.rs), retourne une liste nominative
      fichier:ligne, fonctions ET types. PAS de LSP (impossible via
      stdio mono-process, cf. 611fde3e), PAS de parseur Rust (interdit
      par AC4). Lecture seule, aucun token.
    - (a) section optionnelle `spec.caller_inventory` ajoutée au schema
      implementation-plan. Rétro-compatible (optionnelle, additive).
      Consigne l'output du tool.
    - (b) règle caller_inventory_before_signature_change dans
      shared-rules. Rend l'inventaire obligatoire POUR LA CLASSE de
      RFC concernée (signature `pub` cross-crate, code Rust en zone
      protégée). L'Architect, déjà reviewer du plan, vérifie présence
      + cohérence avec affected_files. PAS de modif review-protocol,
      PAS de modif persona.

    --- RATIONALE ---

    Aucune des trois options seules ne suffit : (a) seul = état actuel
    qui a échoué 2 fois (recommandation passive de ea6e9dd1), (b) seul
    = dépend de l'oeil du reviewer sans source déterministe, (c) seul =
    tool inerte si rien ne l'invoque. La combinaison : le tool produit,
    le plan consigne, la règle contrôle.

    --- SANITY-CHECK RÉTROACTIF (AC6) ---

    Verdict : OUI dans les deux cas.
    - CAS 1 (spawn_watcher / yaml/main.rs) : vérifié empiriquement,
      `rg "spawn_watcher" crates/` liste yaml/main.rs aujourd'hui. Au
      moment du RFC 062ebaa8 le grep aurait listé les 2 callers.
    - CAS 2 (SearchParams / types.rs) : `rg "SearchParams" crates/`
      aurait listé types.rs, sous condition que le tool grep aussi les
      types (granularité explicitement spécifiée).
    Le mécanisme aurait détecté les deux callers oubliés. Limite
    résiduelle documentée : faux négatif sur appel via macro ou
    re-export aliasé (aucun des 2 cas observés n'était de cette nature ;
    le compilateur reste le filet final).

    --- VERDICT COMPLEXITÉ ---

    MODÉRÉE. Plus simple que le roadmap auto-sync.
    - Tool list_callers : ~80-120 lignes Rust, wrapper mince autour de
      rg sur un pattern déjà éprouvé. Pas de nouvelle dépendance crate.
    - Schema + règle : déclaratif, rétro-compatible.
    - Le seul point d'attention à l'implémentation : bien gérer le cas
      d'erreur rg (erreur explicite, JAMAIS liste vide silencieuse) et
      entériner les tests triaxiaux en base (lesson b04f8838).

    --- PROCESS ---

    RFC touche 3 zones protégées (toutes MODIFIÉES, aucune créée) :
    - crates/mcp-servers/orchestrator/src/main.rs (tool)
    - company/schemas/implementation-plan.schema.json (section)
    - company/config/shared-rules.yml (règle)
    affected_files renseigné en forme B structurée (modified/created
    selon RFC a4eb3ee7), created vide. Ce n'est PAS un
    breaking-schema-change (propriété optionnelle additive), donc pas
    d'escalade ceo_cannot_approve_alone.

    Reviewers RFC = all (review-protocol). Après consensus :
    approbation CEO + write permit sur les 3 paths modified. La lesson
    de clôture sera produite après merge (chaînée à ea6e9dd1 et
    611fde3e).

    À toi pour lancer le review round.

    Architect
