api_version: companyos/v1
kind: human-review-triggers
metadata:
  id: c7ce9b0f-6d47-4ad6-bda1-493e1432321c
  title: Human Review Triggers
  author: ceo
  created_at: "2026-03-14"
  description: >
    SOURCE UNIQUE des conditions imposant une intervention humaine avant de
    poursuivre. Absorbe l'ancien champ review-protocol.escalation_rules.
    ceo_cannot_approve_alone (supprimé par le RFC 8bf78218) : ses 4 catégories
    (modify-access-matrix, modify-ceo-persona, breaking-schema-change,
    delete-persona) correspondent 1:1 aux 4 triggers ci-dessous, qui restent
    inchangés. Toute condition d'escalade utilisateur se déclare désormais ici
    et nulle part ailleurs.

spec:
  triggers:
    - condition: rfc modifies access matrix
      action: escalate_user
      description: >
        Toute modification de l'access matrix doit être approuvée par l'utilisateur.
        Évalué mécaniquement par grant_write_permit (mechanism 15, RFC 0197fbe5) :
        un permit couvrant protected-zones.json est refusé sans user_approval_confirmed=true.
      match:
        paths:
          - company/config/protected-zones.json
        on: any
    - condition: rfc modifies ceo persona
      action: escalate_user
      description: >
        Les règles du CEO ne peuvent être modifiées sans approbation utilisateur.
        Évalué mécaniquement par grant_write_permit (mechanism 15, RFC 0197fbe5) :
        un permit couvrant ceo.yml est refusé sans user_approval_confirmed=true.
      match:
        paths:
          - company/personas/ceo.yml
        on: any
    - condition: rfc introduces breaking schema change
      action: escalate_user
      description: >
        Les changements de schema incompatibles requièrent une approbation utilisateur.
        Reste prose (jugement sémantique) : aucun bloc match, non évalué mécaniquement au grant.
    - condition: rfc deletes persona
      action: escalate_user
      description: >
        La suppression d'un persona requiert une approbation utilisateur.
        Évalué mécaniquement par grant_write_permit (mechanism 15, RFC 0197fbe5) :
        un affected_files.deleted sous company/personas/ est refusé sans user_approval_confirmed=true.
      match:
        paths:
          - company/personas/*
        on: deleted
