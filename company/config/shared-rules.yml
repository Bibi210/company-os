api_version: companyos/v1
kind: project-config
metadata:
  id: f8f5c8d2-ef11-4756-8c9c-c3624bc128e2
  title: Shared Rules
  author: ceo
  created_at: "2026-03-14"
  description: Rules that ALL personas must follow. Injected globally via instructions.
  project_name: company-os

spec:
  ownership: owned
  repo_url: https://github.com/Bibi210/company-os
  companyos_is_a_project:
    description: >
      CompanyOS est lui-même un projet qui vit dans CompanyOS. Les modifications au système
      (workflow, config, schemas, plugins, personas) suivent exactement les mêmes règles que
      n'importe quel autre projet : task-request → design-doc → implementation-plan → review → merge.
      Les changements structurels passent par un RFC avec approbation CEO et write permit.
      Le code Rust des crates vit dans crates/, les artifacts CompanyOS vivent dans company/.
  artifact_catalog:
    description: >
      Liste complète des types d'artifacts du système. Chaque agent doit connaître ces kinds
      pour naviguer l'index et produire des artifacts correctement typés.
    kinds:
      task-request:
        description: >
          Demande de tâche créée par le PM. C'est le point d'entrée de tout workflow projet :
          elle définit CE QUI doit être fait et les CONDITIONS DE SUCCÈS.
          Contient des critères d'acceptation (obligatoires), une priorité (low/medium/high/critical),
          et un statut de suivi (backlog → in_progress → done | cancelled).
          Rattachée à un projet via metadata.project.
          Déclenche la chaîne : task-request → design-doc → implementation-plan → review → merge.
          Produite par le PM, consommée par l'Architect pour rédiger le design-doc.
        schema: company/schemas/task-request.schema.json
      design-doc:
        description: >
          Document d'architecture rédigé par l'Architect. Répond à la question QUOI et POURQUOI :
          quels composants construire, quelles décisions architecturales prendre, quel rationale.
          Ne contient PAS de détails d'implémentation (pas de noms de fichiers, pas de code, pas d'ordre d'exécution).
          C'est la vision technique de haut niveau qui guide l'implémentation.
          Produit à partir d'un task-request, reviewé par PM + Implementer.
        schema: company/schemas/design-doc.schema.json
      implementation-plan:
        description: >
          Plan d'implémentation rédigé par l'Implementer. Répond à la question COMMENT et DANS QUEL ORDRE :
          quels fichiers modifier/créer, dans quel ordre, avec quelles dépendances entre étapes.
          Chaque étape est concrète et actionnable (chemin de fichier, fonction à modifier, test à écrire).
          Produit à partir d'un design-doc approuvé, reviewé par l'Architect.
          Ne remet PAS en question les décisions du design-doc — si un problème est détecté, escalader à l'Architect.
        schema: company/schemas/implementation-plan.schema.json
      rfc:
        description: >
          Request For Change sur CompanyOS lui-même. Propose un changement structurel au système :
          workflows, config, schemas, plugins, personas ou zones protégées.
          Contient une motivation (pourquoi changer), une proposal (quoi changer), un impact (conséquences),
          un rollback_plan optionnel (comment revenir en arrière), et la liste des affected_files.
          Cycle de vie : draft → review → approved | rejected → implemented.
          Nécessite approbation CEO + write permit avant implémentation.
          Tout agent peut initier un RFC dès qu'il identifie une amélioration possible.
          Rédigé par l'Architect, reviewé selon le review-protocol.
        schema: company/schemas/rfc.schema.json
      review-report:
        description: >
          Verdict produit par un reviewer après analyse d'un artifact.
          Contient un verdict (approve ou request_changes), une liste de findings détaillés,
          et un summary optionnel. Identifié par un round_id (numéro du round de review)
          et le reviewer (persona qui a conduit la review).
          L'analyse doit être triaxiale : cas nominal (happy path), cas négatif (erreurs, échecs),
          et edge cases (valeurs limites, concurrence). Un artifact qui ne couvre que le cas nominal
          reçoit automatiquement request_changes.
          Un agent ne peut JAMAIS reviewer son propre artifact (auto-review interdit).
          Produit par le reviewer désigné dans le review-protocol, consommé par l'auteur de l'artifact reviewé.
        schema: company/schemas/review-report.schema.json
      lesson-learned:
        description: >
          Capitalisation de connaissance produite après un artifact ou un problème résolu.
          Contient trois champs obligatoires : context (situation rencontrée), insight (ce qu'on a appris),
          et recommendation (quoi faire différemment à l'avenir).
          metadata.description et metadata.tags sont obligatoires pour permettre la recherche sémantique.
          Avant d'en créer une, toujours chercher via search(query) si une lesson
          similaire existe déjà. Le rappel large du retrieval hybride remonte les lessons
          proches sémantiquement mieux qu'un filtre par type : raffiner avec tags si besoin,
          pas par kind (le filtre kind a été retiré de search, RFC 1d3a3581).
          Si une lesson proche existe, l'améliorer ou en créer une qui la supersede (avec related).
          Artifact global (vit dans company/lessons/), pas rattaché à un projet spécifique.
          Tout agent peut en produire. C'est la mémoire collective de l'organisation.
        schema: company/schemas/lesson-learned.schema.json
      diagnostic-report:
        description: >
          Rapport d'investigation technique produit face à un problème ou une anomalie.
          Contient un symptom (obligatoire — ce qu'on observe), une root_cause (cause identifiée),
          une resolution (action corrective appliquée), et un status (investigating → resolved | wont_fix).
          Utilisé pour les pannes MCP, les échecs de build, les incohérences de données, etc.
          Le symptom est toujours renseigné en premier ; root_cause et resolution sont ajoutés
          au fur et à mesure de l'investigation.
          Artifact projet (vit dans projects/<slug>/diagnostic-reports/).
          Peut être produit par tout agent confronté à un problème technique.
        schema: company/schemas/diagnostic-report.schema.json
      persona:
        description: >
          Définition complète d'un agent du système CompanyOS.
          Contient : identity (description de son rôle et sa mission), rules.must (obligations)
          et rules.never (interdictions), artifacts.produces et artifacts.consumes (quels kinds
          il crée et lesquels il lit), et review_behavior (comment il conduit ses reviews).
          metadata.id est l'identifiant unique de la persona (ex: "pm", "architect", "implementer"),
          metadata.display_name est son nom lisible.
          C'est le contrat d'un agent : ce qu'il fait, ce qu'il ne fait pas, et comment il interagit
          avec les autres. Modifier une persona est un changement structurel qui passe par un RFC.
          Artifact global (vit dans company/personas/).
        schema: company/schemas/persona.schema.json
      project-config:
        description: >
          Configuration d'un projet géré par CompanyOS.
          Contient le project_name (identifiant kebab-case du projet), le type d'ownership
          (owned = projet interne, contributed = contribution à un projet externe),
          et un repo_url optionnel.
          C'est aussi le conteneur pour les règles partagées (shared-rules) et toute
          configuration spécifique au projet. Le fichier shared-rules.yml est lui-même un project-config.
          Artifact projet (vit dans projects/<project-slug>/config/<artifact-id>.yml).
          Exception : company/config/shared-rules.yml reste dans company/config/ car il représente
          la configuration système de CompanyOS lui-même.
        schema: company/schemas/project-config.schema.json
      flow-control:
        description: >
          Garde-fous opérationnels du système pour éviter les boucles infinies et la surconsommation.
          Contient : max_review_iterations (nombre max de rounds review avant escalade, obligatoire),
          budget_limits (max_tokens_per_task, max_subagent_spawns — plafonds de ressources par tâche),
          et circuit_breaker (consecutive_failures_threshold, cooldown_seconds — coupe-circuit en cas
          d'échecs en série). Ces paramètres protègent contre les spirales de review,
          les agents emballés, et les pannes en cascade.
          Artifact global (vit dans company/config/).
        schema: company/schemas/flow-control.schema.json
      review-protocol:
        description: >
          Configuration centrale du processus de review.
          Contient reviewers_by_artifact_type (obligatoire — mapping kind → liste de personas reviewers)
          et escalation_rules (max_iterations_before_ceo — seuil avant escalade au CEO,
          ceo_cannot_approve_alone — kinds que le CEO ne peut pas approuver seul).
          Consulté par tout agent avant de lancer ou conduire une review.
          Définit QUI review QUOI et les règles d'escalade quand le processus bloque.
          Artifact global (vit dans company/config/).
        schema: company/schemas/review-protocol.schema.json
      human-review-triggers:
        description: >
          Liste des conditions qui imposent une intervention humaine avant de poursuivre.
          Contient un tableau de triggers, chacun avec : condition (critère évalué, ex: "rfc modifie
          des zones protégées"), action (ce qui se passe, ex: "bloquer et notifier le CEO"),
          et description (explication lisible du trigger).
          Sert de filet de sécurité : certaines actions sont trop critiques pour être approuvées
          uniquement par des agents. Exemples : modification de personas, changement de permissions,
          suppression de données, modifications de zones protégées.
          Artifact global (vit dans company/config/).
        schema: company/schemas/human-review-triggers.schema.json
      roadmap:
        description: >
          Vue d'ensemble d'un domaine (système, projet métier, thématique stratégique)
          organisée selon trois dimensions : temporelle (past/present/future, dates
          ou trimestres), causale (dépendances entre items), narrative (récit du
          pourquoi).
          Référence des éléments hétérogènes : projets (via project_slug),
          RFCs (via id UUID), ou sujets sans artifact formel (type loose, avec
          une category typée : idea/exploration/hotfix/observation/dependency).
          Une roadmap est un artifact GLOBAL : elle vit dans company/roadmaps/
          et porte un `domain` qui identifie son périmètre (ex: 'companyos-system',
          'puissance4-verus'). Plusieurs roadmaps coexistent, une par domaine.
          Statut : `active` (vivante, mise à jour) ou `archived` (historique).
          Produite et maintenue par le PM. Le status des items à ref
          project/rfc est AUTO-SYNCHRONISÉ à la lecture depuis l'artifact
          source (RFC a5f25718) ; le PM ne peut écrire manuellement que
          `blocked` (droit absolu). Les items à ref loose (sans artifact
          source) gardent un status manuel. Sert au PM à répondre à
          "où en sont mes sujets ?".
        schema: company/schemas/roadmap.schema.json
  rules:
    artifact_id:
      description: >
        metadata.id de tout artifact DOIT être un UUID v4 obtenu via generate_id() avant l'écriture du fichier YAML.
        Ne jamais inventer un ID manuellement (pas de slug, pas de nom lisible).
        Le titre de l'artifact reste lisible dans metadata.title — c'est lui qu'on lit, pas l'ID.
    lessons:
      description: >
        Après chaque artifact produit ou problème résolu, cherche une lesson existante via search(query).
        Le rappel large du retrieval hybride remonte mieux les lessons proches sémantiquement
        qu'un filtre par type ; raffine avec tags si le rappel est trop large, pas par kind
        (le filtre kind a été retiré de search, RFC 1d3a3581).
        Si une lesson similaire existe : soit tu l'ameliore ou tu en crée une nouvelle améliorée,
        et lie les deux avec related (relationship: supersedes vers l'ancienne, derived-from depuis la nouvelle).
        Si aucune lesson similaire n'existe : crée-en une nouvelle via direct write.
    related_artifacts:
      description: >
        Tout artifact produit doit référencer ses artifacts liés dans metadata.related.
        Les références utilisent metadata.id (pas des chemins fichiers).
        Utilise le bon type de relationship : input, derived-from, supersedes, related.
    artifact_index:
      description: >
        L'index unifié est le Wikipedia de l'entreprise. Avant de produire un artifact, consulte l'index :
        1. search(query) pour scanner les titres/descriptions liés à ton sujet
        2. get(id) pour lire le détail de ce qui t'intéresse
        3. related(id) pour naviguer le graphe de connaissances
        L'indexation est automatique : chaque écriture de fichier YAML est auto-indexée par le plugin defense-in-depth.
        Tu n'as PAS besoin d'appeler index_artifact manuellement après un write/edit.
        Note : les artifacts techniques (task-request, design-doc, implementation-plan, review-report, diagnostic-report)
        résident dans projects/<project-slug>/<kind>s/ et non dans company/<kind>/.
    file_placement:
      description: >
        Règle de placement des fichiers YAML par kind :
        - Artifacts projet  → projects/<project-slug>/<kind>s/<artifact-id>.yml
        - Artifacts globaux → company/<folder>/<artifact-id>.yml
        Kinds projet  : task-request, design-doc, implementation-plan, review-report, diagnostic-report,
                        project-config
        Kinds globaux : lesson-learned, persona, rfc, flow-control, review-protocol,
                        human-review-triggers, roadmap
        Le project-slug doit être un identifiant kebab-case unique et immuable.
    review_protocol:
      description: >
        Le protocole de review est défini dans company/config/review-protocol.yml. Consulte-le avant chaque review round.
        Deux règles absolues :
        (1) Auto-review interdit — un agent ne peut JAMAIS reviewer son propre artifact. Si le protocole
        ne désigne que l'auteur comme reviewer, escalader au CEO.
        (2) Analyse triaxiale obligatoire — chaque review doit couvrir : cas nominal (happy path),
        cas négatif (erreurs, échecs, inputs invalides), et edge cases (valeurs limites, concurrence, etc.).
        Le review-report doit contenir un verdict par axe. Un artifact qui ne couvre que le cas nominal
        est insuffisant et doit recevoir request_changes.
        Les reviewers listés sont le minimum requis — un agent peut ajouter d'autres reviewers
        s'il estime que leur expertise est pertinente pour l'artifact en question.
    authentication:
      description: >
        Chaque persona doit appeler authenticate(persona=<son id>) au début de chaque session
        pour obtenir un token secret. Ce token est requis pour les opérations privilégiées :
        grant_write_permit (CEO uniquement), submit_review_vote, consume_write_permit.
        Ne jamais écrire le token dans un fichier ni le partager avec un autre agent.
    mcp_reconnect:
      description: >
        Le proxy MCP (company/plugins/mcp-proxy.mjs) gère de manière transparente
        les restarts du binaire serveur déclenchés par cargo build ou
        reload_config(). Les messages MCP envoyés pendant un restart sont
        bufferisés et rejoués après health check, donc les appels doivent
        normalement réussir sans intervention de l'agent (le seul délai
        observable est le temps de re-handshake, typiquement 1 à 5 secondes).

        Si malgré tout un appel MCP échoue avec une erreur de connexion
        (timeout, connection refused, broken pipe, EOF, tool not found), c'est
        le signe d'un problème plus profond (proxy lui-même cassé, OOM,
        circuit breaker du proxy ouvert sur restart loop, etc.). NE PAS
        considérer l'opération comme échouée immédiatement. Procédure :
        attendre quelques secondes, puis réessayer l'appel. Répéter jusqu'à 3
        tentatives espacées de quelques secondes. Si après 3 tentatives le
        serveur ne répond toujours pas, produire un diagnostic-report et
        escalader à l'utilisateur.
        Ne jamais abandonner un workflow en cours à cause d'une coupure MCP
        transitoire.
    continuous_improvement:
      description: >
        Chaque agent doit être consciencieux et proactif dans l'amélioration des processus.
        Si tu identifies un point de friction, une incohérence, un workflow inefficace ou une
        opportunité d'amélioration, ne te contente pas de le noter en lesson learned.
        Si le problème nécessite non pas de changer le contexte (c'est-à-dire solliciter des
        lessons learned) mais de changer les règles du jeu, les workflows, les outils ou la
        configuration, propose un RFC pour changer les choses. Les RFC ne sont pas réservés aux
        demandes explicites de l'utilisateur : tout agent peut en initier un dès qu'il estime
        que CompanyOS peut être amélioré.
        L'Architect rédige le RFC, mais l'idée peut venir de n'importe quel persona.
        Exemples de déclencheurs :
        - Un workflow qui demande trop d'étapes manuelles
        - Une règle qui bloque systématiquement sans raison valable
        - Un schéma trop laxiste
        - Un manque d'outillage
        - Une duplication d'information entre fichiers
        Le cycle reste le même : RFC → review → approbation CEO → remontée utilisateur
        (optionnelle) → write permit → implémentation.
        L'objectif n'est pas seulement de proposer des RFC : les problèmes doivent remonter
        à la surface et être pris en charge.
    memory_lookup_before_acting:
      description: >
        Avant de produire tout artifact (RFC, design-doc, implementation-plan, diagnostic-report,
        task-request), tout agent doit effectuer un lookup de mémoire en trois temps :

        Étape 1 — Scanner : appeler search(query) sur le sujet de l'artifact. Lire attentivement
        les résumés retournés (titre, description, tags). Ce scan est toujours fait, sans exception.

        Étape 2 — Curate : juger quels artifacts éclairent réellement la décision en cours.
        Appeler get(id) uniquement sur ceux-là. Il n'y a ni quota minimum ni maximum — c'est du
        jugement. Parfois 0 get() si rien n'est pertinent, parfois plusieurs si le sujet est dense
        ou si des décisions passées ont un impact direct.

        Étape 3 — Naviguer (optionnel) : une fois un artifact pertinent identifié via get(), appeler
        related(id) pour remonter les chaînes de connaissance liées. Cela permet de découvrir des
        lessons ou décisions en amont qui ne seraient pas remontées par le search() initial. Cette
        étape est optionnelle — elle se justifie quand le sujet est complexe ou interconnecté.

        L'objectif est la CURATION, pas la conformité. Un lookup mécanique qui noie le contexte
        avec des get() non filtrés est aussi problématique qu'une absence de lookup. Le critère
        de qualité : « Est-ce que ce que j'ai lu change ou confirme ma décision ? »
    lesson_after_every_artifact:
      description: >
        Précise et complète la règle `lessons` existante — les deux s'appliquent conjointement.
        La règle `lessons` dit COMMENT créer (chercher avant, dédupliquer). Cette règle dit QUAND
        créer et pour quels kinds.

        Une lesson-learned doit être créée après les artifacts de résultat suivants — pas seulement
        après les erreurs, ce qui a bien fonctionné mérite aussi d'être capturé :

        Déclencheurs (kinds concernés) :
        - RFC approuvé → lesson sur ce qui a motivé le changement et ce qu'on a appris du processus
        - Design-doc approuvé → lesson sur les décisions architecturales clés et leur rationale
        - Implementation-plan terminé → lesson sur les surprises rencontrées (bon et mauvais)
        - Diagnostic-report résolu → lesson sur la root cause et comment éviter le problème
        - Review round difficile (plusieurs request_changes successifs) → lesson sur pourquoi
          le premier jet était insuffisant et ce qui a débloqué la situation

        Kinds explicitement exclus (coordination pure, pas de résultat capitalisable) :
        - `review-report` — vote intermédiaire, pas un résultat en soi
        - `task-request` — entrée du workflow, pas un résultat
        - `lesson-learned` — créer une lesson sur une lesson crée une récursivité sans fin

        Exception : si une lesson très similaire existe déjà et couvre le sujet de façon complète,
        l'améliorer plutôt qu'en créer une nouvelle (utiliser supersedes dans metadata.related).
        La recherche préalable (rule `lessons`) détermine si on crée ou améliore.
    lesson_chaining:
      description: >
        Toute nouvelle lesson doit référencer les lessons existantes liées dans metadata.related.
        La mémoire est un graphe, pas une pile de fiches isolées.

        Types de liens à utiliser :
        - `supersedes` : la nouvelle lesson corrige ou remplace une ancienne (ex. : apprentissage
          contredit par l'expérience)
        - `derived-from` : la nouvelle lesson est une spécialisation d'une lesson plus générale
          (ex. : « erreur de validation YAML en RFC » dérive de « erreur de validation YAML »)
        - `related` : deux lessons parlent du même pattern sans que l'une remplace l'autre
          (ex. : deux lessons sur des anti-patterns de workflow différents mais liés)

        Le lookup (search() + get() parcimonieux, cf. `memory_lookup_before_acting`) avant de
        créer une lesson est obligatoire — pas pour éviter de créer, mais pour savoir où la lesson
        s'insère dans la chaîne de connaissances existante.

        Cas zéro : si aucune lesson liée n'existe dans l'index, metadata.related peut rester vide.
        L'absence de lien est une information valide — elle signifie que cette lesson ouvre un
        nouveau fil dans la mémoire collective.
    review_findings_honesty:
      description: >
        Un reviewer dispose de deux verdicts valides et exclusifs :
        - `approve`          : l'artifact est bon tel quel. Rien n'est à corriger.
        - `request_changes`  : quelque chose doit être corrigé avant approbation.

        La catégorie "non bloquant" n'existe pas. Si un finding mérite d'être mentionné
        comme finding, alors le verdict est request_changes — sans exception, sans gradation.

        Un approve accompagné de findings correctifs est une contradiction logique. Elle
        est interdite : un tel review-report doit être considéré comme défectueux.

        Critère objectif pour classer chaque observation :
        (a) Correctif → request_changes : l'observation pointe un gap qui affecte les acceptance
            criteria du task-request associé, ou qui dégrade l'utilisabilité de l'artifact pour
            son consommateur direct (ex. : ambiguïté qui bloquerait l'Implementer, incohérence
            qui invaliderait une décision architecturale). Si oui → finding obligatoire, verdict
            request_changes.
        (b) Hors-scope → ne pas mentionner comme finding : l'observation ne touche ni les
            acceptance criteria ni l'utilisabilité de l'artifact. Elle peut figurer en note
            informelle hors-verdict si elle apporte de la valeur à l'auteur, mais elle ne pèse
            pas sur le verdict.

        Le test de classification est simple : "Est-ce qu'un consommateur de cet artifact (PM,
        Implementer, CEO selon le kind) serait bloqué ou induit en erreur si ce point n'est
        pas corrigé ?" Si oui → (a). Sinon → (b).

        Cas analyse triaxiale verte : la règle `review_protocol` impose l'analyse des cas
        nominal, négatif et edge cases. Si cette analyse ne révèle aucun gap au sens (a),
        le verdict est approve sans findings. Les observations positives (ce qui fonctionne bien)
        ne sont pas des findings et n'ont pas à figurer dans le review-report. Un approve sans
        findings n'est pas un approve paresseux — c'est la conclusion d'une analyse complète
        qui n'a trouvé aucun problème à corriger.

        L'objectif est la protection de la chaîne de qualité : un approve doit signifier
        que l'artifact peut avancer sans modification, pas qu'il peut avancer "malgré" ses lacunes.
        Les auteurs ont besoin de reviews honnêtes. Voter approve sur un artifact qu'on sait
        perfectible (au sens des acceptance criteria), c'est faire passer la diplomatie avant
        la qualité.
    affected_files_categorization:
      description: >
        Recommandation (non imposée) sur le remplissage de spec.affected_files dans un RFC.
        Le schema RFC accepte deux formes pour affected_files (RFC a4eb3ee7, anyOf
        rétro-compatible) :

        - FORME B structurée — objet { modified, created } : RECOMMANDÉE pour tout RFC qui
          touche du code ou crée des fichiers. Renseigner affected_files.modified avec les
          fichiers DÉJÀ PRÉSENTS dans HEAD qui seront édités, et affected_files.created avec
          les fichiers NOUVEAUX qui seront créés. Les deux clés sont optionnelles : un RFC
          qui ne fait que créer renseigne seulement created, un RFC qui ne fait que modifier
          renseigne seulement modified.

        - FORME A legacy — array plat de strings : reste VALIDE et acceptée (rétro-compatibilité).
          À privilégier pour les RFCs ne touchant que des artifacts YAML sans création de fichier,
          où la distinction modified/created n'apporte rien.

        POURQUOI cette recommandation. Distinguer explicitement created de modified évite le
        blocage hook documenté par la lesson 611fde3e : un fichier à CRÉER oublié dans le permit
        CEO provoque un refus du hook defense-in-depth au moment de l'écriture, imposant un
        round-trip Implementer → PM → CEO et un permit complémentaire. En rendant la distinction
        explicite et machine-readable, la FORME B permet à un futur outillage de pré-vérification
        de calculer l'union modified+created comme target_paths candidats et de signaler les oublis
        AVANT le blocage.

        REMPLACE LE CONTOURNEMENT DE PROSE. Cette règle ferme, pour les FUTURS auteurs, le chemin
        du contournement qui consistait à expliciter la distinction modified/created EN PROSE dans
        la section impact (cf. RFCs 359f9162, 1c0f2570, bde023e2, cdbfee72). La distinction relève
        désormais du champ structuré affected_files, pas de la prose. Les RFCs déjà mergés ne sont
        PAS réécrits : leur prose est un artefact historique figé.
