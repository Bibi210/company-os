metadata:
  id: b04f8838-84b5-4332-b3a4-5782a943d766
  title: "Les cas de test triaxiaux doivent être entérinés dans la suite de tests automatisée, pas seulement exécutés à la main"
  author: pm
  created_at: "2026-06-04"
  description: >
    L'analyse triaxiale (cas nominal, négatif, edge) imposée par le
    review-protocol produit un ensemble de cas de test de grande valeur.
    Mais exécuter ces cas UNE FOIS à la main pendant la session (par
    exemple via le tool MCP yaml-validator pour un changement de schema)
    ne protège la feature qu'à l'instant t. Ces cas s'évaporent dès la fin
    de la session. Pour qu'ils protègent la feature DANS LE TEMPS, ils
    doivent être entérinés comme tests automatisés versionnés dans la
    suite de tests du projet, donc rejoués à chaque CI. Un cas triaxial
    validé manuellement mais non commité n'est pas un test de
    non-régression : c'est une vérification ponctuelle qui ne garantit
    rien pour l'avenir. La règle : tout cas de test conçu pour valider une
    feature doit finir en base, exécutable automatiquement, pas dans un
    log de session.
