spec:
  context: >
    Domaine v1-automation du programme V1 (roadmap a410bb43) : recensement
    des étapes de bookkeeping manuel restantes après les 3 lots de
    process-hardening, puis implémentation (RFC cde13417). Décisions :
    orchestrator.db sorti du versionnement git (94 blobs, 696 MiB
    d'historique) au profit de company/data/permits-seal.json (export JSON
    canonique de write_permits, seule donnée autoritative de la DB), seals
    commités automatiquement au grant ET au consume, transitions lifecycle
    des RFCs commitées par le serveur, rappels non bloquants de clôture.
    Deux rejets délibérés : auto-clôture des task-requests et statuts des
    items loose de roadmap (points de décision LLM), persistance des
    tokens (sécurité). Le cycle a aussi essuyé un incident de bookkeeping
    instructif : le renommage du fichier RFC après ouverture du round a
    cassé l'auto-transition approved (résolution par chemin figé), forçant
    une réémission de round.

  insight: >
    (a) Le critère de coupe cache/autorité est la reconstructibilité : tout
    ce qui se recalcule depuis une source de vérité (index FTS, embeddings
    déterministes) n'a rien à faire dans git ; tout ce qui fait autorité
    (les permits) doit y être scellé sous la forme la plus petite et la
    plus lisible possible. (b) Les gardes conçues pour les agents (make ci
    au pre-commit, signature gpg) s'appliquaient par défaut aux commits du
    serveur et créaient des modes de gel : la convention "commits machine"
    (--no-verify + pathspec + contenu machine-généré) est le pendant git de
    la décision seals-non-signés (324e8a33). La frontière n'est pas
    humain/machine par confort : elle tient parce que le contenu machine
    est généré, borné et scellé par le hook en amont. (c) Un point de
    friction observé vaut mieux qu'un mécanisme spéculatif : les deux
    rejets du recensement (auto-clôture, statuts loose) protègent des
    décisions que la machine ne sait pas prendre. (d) Résoudre les
    artifacts par chemin figé casse au premier renommage : toute référence
    durable doit résoudre par metadata.id via l'index (candidat harness
    remonté pour close_review_round).

  recommendation: >
    Appliquer le critère de reconstructibilité à tout nouveau fichier
    versionné volumineux ou churné. Toute nouvelle garde au commit doit
    déclarer explicitement si elle s'applique au canal machine et pourquoi.
    Corriger close_review_round pour résoudre le RFC par metadata.id
    plutôt que par artifact_path figé (candidat v1-harness-refactor,
    incident du 2026-08-25 en preuve). Vérifier au premier usage réel
    chaque nouveau mécanisme de bookkeeping sur sa propre chaîne (le
    self-test de clôture est gratuit et probant).
