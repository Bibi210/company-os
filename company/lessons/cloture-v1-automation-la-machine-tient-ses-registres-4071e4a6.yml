metadata:
  id: 4071e4a6-e439-4307-935c-7f9f4e491130
  title: "Clôture du domaine v1-automation : séparer l'état autoritatif minuscule du cache volumineux, et laisser la machine committer ses propres transitions"
  author: pm
  created_at: "2026-08-25"
  description: >
    Capitalisation de clôture du domaine v1-automation (RFC cde13417
    implemented). Trois enseignements : (a) quand un fichier versionné
    conflate un cache dérivé reconstructible (l'index SQLite, 696 MiB de
    blobs morts en historique) et un état autoritatif minuscule (les write
    permits), la bonne coupe est d'extraire l'état autoritatif dans un
    fichier de seal dédié minimal et de sortir le cache du versionnement ;
    (b) les commits machine (seals, transitions lifecycle) doivent porter
    leur propre convention (--no-verify, pathspec-scopé, contenu
    machine-généré) distincte des commits d'agents, sinon chaque garde
    ajoutée pour les humains devient un point de gel pour la machine ;
    (c) le self-test ultime d'un mécanisme de bookkeeping est de le voir
    travailler pour sa propre clôture : rfc_set_implemented a commité sa
    transition et rappelé le task-request ouvert lors de la clôture du RFC
    qui l'introduisait.
  tags:
    - automation
    - bookkeeping
    - git
    - sqlite
    - write-permit
