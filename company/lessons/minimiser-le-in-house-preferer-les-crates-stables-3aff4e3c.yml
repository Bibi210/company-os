metadata:
  id: 3aff4e3c-fe6b-4079-a589-0de7a05c3a9e
  title: >
    Minimiser le in-house : si une crate stable et reconnue couvre le besoin,
    on l'adopte au lieu de réimplémenter ; et pas de littéraux magiques dans le code
  author: pm
  created_at: "2026-08-25"
  description: >
    Directive utilisateur érigée en principe permanent (2026-08-25, second
    volet du jour après cc0ca5d7), ajoutée au périmètre du domaine
    v1-rust-audit (roadmap a410bb43, task-request 0db7585b). Deux règles de
    code. (1) Ne pas réinventer la roue : avant d'écrire un composant
    in-house (parsing, matching, retry, sérialisation, glob, locking, etc.),
    vérifier si une crate stable et reconnue par la communauté couvre le
    besoin ; si oui, on l'adopte TOUJOURS au lieu de coder in-house. Le code
    maison est limité au strict minimum : la logique métier propre à
    CompanyOS. (2) Pas de littéraux magiques : toute valeur littérale
    porteuse de sens (seuil, timeout, chemin, nom de table, code d'erreur,
    format) est nommée en constante typée à un seul endroit. Un littéral
    répété ou non nommé est un invariant que rien ne fait respecter, même
    famille de red flag que la primitive obsession (cc0ca5d7).
  tags:
    - rust
    - dependencies
    - crates
    - not-invented-here
