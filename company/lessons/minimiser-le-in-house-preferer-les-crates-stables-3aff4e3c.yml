spec:
  context: >
    Au lancement du domaine v1-rust-audit (2026-08-25, ~14 000 LOC Rust sur
    4 crates + 2 serveurs MCP, jamais de passe d'hygiène globale),
    l'utilisateur a fixé deux critères d'audit supplémentaires, en plus du
    dead code, de la duplication, des API sans callers et de la passe
    primitive-obsession (cc0ca5d7). Le code de CompanyOS a grandi
    organiquement au fil de 20+ RFCs : le risque identifié est double, des
    valeurs littérales disséminées qui encodent des décisions sans les
    nommer, et des composants maison qui refont ce que l'écosystème Rust
    fournit déjà en mieux (testé, maintenu, documenté par la communauté).

  insight: >
    Le code in-house est un passif, pas un actif : chaque ligne maison doit
    être comprise, testée, maintenue et auditée par nous seuls, alors qu'une
    crate stable et reconnue mutualise ce coût sur toute la communauté
    (fuzzing, revues, edge cases découverts par des milliers d'usages). Le
    critère d'adoption est la stabilité et la reconnaissance communautaire
    (maturité, maintenance active, usage répandu), pas la nouveauté. La
    valeur différenciante de CompanyOS est sa logique métier (orchestration,
    permits, artifacts), jamais ses utilitaires. Même logique pour les
    littéraux : un littéral magique est la forme la plus locale du même mal,
    une connaissance non institutionnalisée. La valeur existe mais rien ne la
    nomme, rien ne la centralise, rien n'empêche sa divergence entre deux
    occurrences. C'est l'application au code du test spirituel du programme
    V1 : la connaissance doit vivre dans une structure qui la fait respecter
    (le type, la constante, la crate éprouvée), pas dans la mémoire de celui
    qui a écrit la ligne.

  recommendation: >
    En écriture de code : avant d'implémenter un utilitaire, chercher la
    crate établie qui le fait (crates.io, blessed.rs) ; ne coder in-house
    que si aucune crate stable et reconnue ne couvre le besoin, et justifier
    ce choix explicitement dans le plan ou le RFC. Nommer toute valeur
    littérale porteuse de sens en constante typée, définie à un seul
    endroit. En review (Architect, Implementer) : un utilitaire réinventé ou
    un littéral magique est un finding correctif au même titre qu'un champ
    String porteur d'invariant (cc0ca5d7). Pour v1-rust-audit : le
    diagnostic-report recense chaque composant in-house redondant avec sa
    crate candidate (nom, version, maturité) et chaque littéral magique avec
    sa constante cible ; le RFC d'application arbitre les remplacements en
    pesant le coût de migration contre le passif de maintenance.
