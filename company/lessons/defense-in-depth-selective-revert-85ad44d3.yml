metadata:
  id: 85ad44d3-e0a5-49e3-93f7-6a384cd161b7
  title: "Le hook defense-in-depth ne wipe plus par défaut : revert SÉLECTIF (baseline = union snapshot + HEAD), nucléaire borné au seul cas baseline-indéterminable"
  author: implementer
  created_at: "2026-06-04"
  description: >
    Capitalisation après l'implémentation du RFC bde023e2 (plan 655fb3fb) qui
    réécrit revertPermitTampering dans company/plugins/defense-in-depth-core.mjs.
    Le comportement par défaut du hook face à une altération hors-canal de la
    table write_permits N'EST PLUS le wipe total : c'est désormais un DELETE
    SÉLECTIF qui ne supprime que les ids HORS d'une baseline légitime, calculée
    comme l'UNION de deux sources (snapshot before = Source A, ids scellés en
    HEAD git = Source B). Le wipe nucléaire ne subsiste QUE dans le cas résiduel
    strict « Source A null ET Source B inexploitable » (baseline indéterminable).
    Cette lesson documente la distinction CRITIQUE null (indéterminable -> wipe)
    vs Set vide (déterminable mais vide -> DELETE total qui ferme la faille
    historique L230), la fermeture de cette faille, les surprises rencontrées,
    et supersede PARTIELLEMENT la lesson ed7776fb (le wipe n'est plus le défaut)
    tout en préservant ses parties encore valides (jamais de SQL direct).
  tags:
    - defense-in-depth
    - write-permits
    - selective-revert
    - security
