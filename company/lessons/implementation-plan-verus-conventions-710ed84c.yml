spec:
  context: >
    En produisant les implementation-plans du projet Puissance 4 Verus, deux plans ont été
    identifiés : un plan fonctionnel (game-core) et un plan méta (verus-strategy). Le plan
    méta ne crée aucun fichier de code — il définit les règles applicables à tous les modules.
    Sans ce plan méta, chaque implémenteur pourrait inventer ses propres conventions de
    nommage, structure de fichier, et points de validation, créant des incohérences difficiles
    à détecter en review.

  insight: >
    Un implementation-plan méta (conventions-only) est un artifact valide et utile dans les
    projets avec des contraintes transversales fortes (Verus, protocoles de preuve, styles
    d'annotation). Il remplit trois fonctions :

    (1) Référence normative : les autres plans peuvent y pointer ("voir verus-strategy plan")
        au lieu de dupliquer les conventions dans chaque plan.

    (2) Point de validation unique : les conventions de nommage et de structure sont auditées
        une fois, en review du plan méta, pas de façon fragmentée dans chaque plan fonctionnel.

    (3) Préserve la cohérence inter-modules : game_core.rs et ai_engine.rs auront les mêmes
        marqueurs de section, la même structure d'ordre, et les mêmes patterns de nommage —
        même s'ils sont écrits par des agents différents à des moments différents.

    Le plan méta doit être produit EN PREMIER, avant les plans fonctionnels, pour être
    disponible comme référence dès la phase B des autres plans.

  recommendation: >
    Pour tout projet Verus (ou tout projet avec des contraintes formelles transversales) :

    (1) Commencer par un implementation-plan de conventions avant les plans fonctionnels.
        Ce plan documente : structure de fichier, nommage, commentaires obligatoires,
        procédure de validation, procédure d'échec.

    (2) Le plan méta référence le design-doc de stratégie (verus-strategy) et la lesson
        b2c68c30 (pièges SMT). Il est le pont entre la stratégie abstraite et le code concret.

    (3) Les plans fonctionnels référencent le plan méta dans leur section `dependencies`
        et dans `metadata.related` pour traçabilité.

    (4) Le plan méta ne contient PAS de code — uniquement des descriptions textuelles de
        conventions. Si une convention évolue en cours de projet, mettre à jour le plan
        méta est suffisant (pas besoin de modifier chaque plan fonctionnel).
