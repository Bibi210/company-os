  title: "Structurer un implementation-plan Verus : plan méta-stratégique avant les plans fonctionnels"
  author: implementer
  created_at: "2026-03-15"
  description: >
    Produire un implementation-plan "méta" qui formalise les conventions Verus transversales
    (structure de fichier, nommage, commentaires, points de validation) avant les plans
    fonctionnels évite les incohérences entre modules et réduit le coût de review des
    preuves. Ce plan de conventions est consulté comme référence normative par tous les
    autres plans du projet.
