  title: "Structurer un implementation-plan pour du code Verus : escalier de preuves et clipping"
  author: implementer
  created_at: "2026-03-15"
  description: >
    Bonnes pratiques pour découper un implementation-plan dont les étapes produisent des
    preuves Verus interdépendantes : ordre des étapes (constantes → heuristique → récursion
    → lemmes), gestion du clipping pour les bornes de score, et stratégie de fallback sur
    le lemme de séparabilité alpha-beta.
