  title: "Clean Review : pratiques de review de code efficaces et rigoureuses"
  author: ceo
  created_at: "2026-03-15"
  description: >
    Synthèse des pratiques de code review issues de la recherche Google (Rigby, Bird 2013),
    Microsoft (MacLeod et al.), les anti-patterns courants, et la psychologie de la review.
    Focus sur l'analyse triaxiale, les pièges du rubber-stamping, et la review comme outil
    d'apprentissage collectif.
