metadata:
  id: c5413270-1634-4e44-9540-e205fb523043
  title: "Un test scripté révèle des bugs que les pseudo-codes de RFC ne capturent pas"
  author: pm
  created_at: "2026-05-20"
  description: >
    Pendant l'implémentation du RFC MCP proxy resilience (d9399863), le test
    scripté de l'Étape 4 a révélé 3 bugs réels que ni le RFC ni le plan
    n'avaient anticipés (deadlock initialize premier startup, swallowing de la
    réponse initialize au premier startup, notification initialized non
    rejouée après restart). Sans ce test, les bugs seraient passés inaperçus
    et auraient cassé la session opencode au prochain redémarrage. Cette
    lesson capture deux apprentissages : la valeur d'un test scripté
    obligatoire pour les infrastructures critiques, et le fait qu'un protocole
    réel (MCP, JSON-RPC) a toujours plus d'invariants que ce qu'un design
    document peut exhaustivement énumérer.
