metadata:
  id: cf3c40a8-37a2-4e73-ab01-aefc282ec2a4
  title: "Discipline de migration SQL par PRAGMA user_version + registre de migrations numérotées : éliminer structurellement la classe de bug d'ordonnancement DDL"
  author: implementer
  created_at: "2026-06-04"
  description: >
    Refonte de OrchestratorDb::migrate() (RFC 973a5569) : remplacer une
    séquence impérative plate de steps DDL par un registre ORDONNÉ de
    migrations numérotées piloté par PRAGMA user_version. Le pattern
    transforme une garantie d'ordre implicite et fragile (le hotfix 57019e7
    "CREATE INDEX doit venir après ALTER", maintenu à la main entre deux
    steps) en propriété STRUCTURELLE (les deux opérations vivent dans la
    même migration, donc le même BEGIN IMMEDIATE, donc le même ordre
    garanti). Capitalise aussi : remplacer le matching fragile du message
    d'erreur SQLite "duplicate column" par PRAGMA table_info déterministe,
    refuser proprement une DB de version future (variant d'erreur dédié,
    DB non touchée), et l'application concrète de b04f8838 (les 7 tests de
    transition sont entérinés en base, pas exécutés à la main).
  tags:
