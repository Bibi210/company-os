api_version: companyos/v1
kind: lesson-learned
metadata:
  id: 6aa2daed-e87c-4649-99e6-6f9c09f3528a
  title: "Clôture du domaine v1-schemas-audit : durcir les 14 schemas d'un coup exige la pré-validation du corpus ET la migration dans le MÊME commit ; le hook per-file impose de retirer un champ mort avant de le replier ailleurs"
  author: implementer
  created_at: "2026-08-14"
  description: >
    Capitalisation de clôture du DOMAINE v1-schemas-audit (task-request
    ceb26109, diagnostic c2a64134, roadmap a410bb43, programme companyos-v1).
    RFC 2cdf620a (approved puis implemented) : les 14 schemas de
    company/schemas/ réécrits en un seul commit atomique (verrous
    unevaluatedProperties racine + metadata, _base restructuré en $defs
    partagés, champs serveur approved_at/implemented_at enfin déclarés,
    required stock-conformes, enums/patterns, champs morts retirés), + 6
    migrations de corpus + 2 fixtures Rust. make ci vert, zéro extension de
    permit. Trois enseignements : (1) durcir un harness statique large exige
    de PROUVER contre le stock avant d'écrire — la pré-validation du corpus
    entier avec le crate réel (204 artifacts, 6 échecs = exactement les 6
    migrations prévues) a transformé un changement à risque en changement
    déterministe, et le résultat s'est reproduit à l'octet près à
    l'implémentation ; (2) l'atomicité schema+corpus n'est pas qu'une
    intention : le hook defense-in-depth valide CHAQUE écriture contre le
    NOUVEAU schema, donc chaque edit intermédiaire doit déjà être valide, ce
    qui IMPOSE l'ordre « retirer le champ mort d'abord, le replier ensuite »
    pour toute migration de repli ; (3) unevaluatedProperties de jsonschema
    0.29.1 fonctionne à travers allOf + $ref externe (_base en Resource) mais
    produit une cascade d'erreur racine après l'erreur réelle : bruit connu,
    premier message toujours précis, vérifié en vif.
