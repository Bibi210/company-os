metadata:
  id: 54f76b21-372c-4209-98cf-d2ead9749c8f
  title: "RFC de correction schéma : cycle complet en un round dès que le changement est minimal et chirurgical"
  author: pm
  created_at: "2026-03-15"
  description: >
    Un RFC de correction de schéma minimal (une ligne, un fichier) peut traverser le cycle
    complet draft → review → approved → implemented en un seul round sans itération si le
    problème est bien identifié, le changement bien circonscrit, et le rollback trivial.
    La clé est de ne pas sous-estimer la valeur d'un petit fix systémique.
  tags:
    - rfc
    - schema
    - workflow
    - correction
    - systemic-fix
    - best-practice
  related:
    - id: 27b75614-9d8d-4748-b54c-ef1c8f6c7c98
