metadata:
  id: cc0ca5d7-f6e6-452c-9864-a84971a9473e
  title: "Les invariants vivent dans les types : String/bytes est un dernier recours, au même niveau de red flag qu'un littéral magique"
  author: pm
  created_at: "2026-08-25"
  description: >
    Directive utilisateur érigée en principe permanent (2026-08-25), déclenchée
    par la struct SealPermit du RFC cde13417 : 8 champs, tous String (id, rfc_id,
    granted_to, target_paths, status, granted_by, granted_at, consumed_at).
    Dans un langage typé, chaque champ doit porter son invariant dans son type :
    un id est un Uuid, un status est un enum fermé, un timestamp est un
    DateTime, une persona est un PersonaId, un chemin est un type de chemin.
    Passer par String/bytes est un dernier recours à justifier explicitement,
    pas un défaut de confort. Un champ String qui encode implicitement un
    invariant est du même niveau de red flag qu'une valeur en littéral dans le
    code : l'invariant existe mais rien ne le fait respecter.
  tags:
