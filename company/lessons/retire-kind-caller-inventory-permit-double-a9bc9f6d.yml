metadata:
  id: a9bc9f6d-19f3-47f3-b752-f39e7a44046c
  title: "Retirer un kind d'artifact (agent-message) : la discipline caller-inventory paie au premier passage, et l'amendement d'un RFC en cours coûte un permit en double"
  author: implementer
  created_at: "2026-06-05"
  description: >
    Capitalisation de clôture après l'implémentation du RFC 3d9f0b0c
    (plan ac9d40ff) qui retire intégralement le kind agent-message de
    CompanyOS : variant Rust AgentMessage, schema agent-message.schema.json,
    références dans shared-rules.yml (artifact_catalog + file_placement +
    exclusion lesson), prefixe dans defense-in-depth-core.mjs, mention
    "via agent-message" dans personas/implementer.yml, 11 YAML
    company/agent-messages/ + dossier, et nettoyages embedding.rs /
    edge_cases.rs. Deux enseignements opérationnels : (a) la discipline
    caller-inventory remontée en rules.must par le RFC eb42a8de (lesson
    b6ec1709) a produit un effet concret AU PREMIER PASSAGE en faisant
    repérer la mention résiduelle "via agent-message" dans implementer.yml
    ligne 49, qui aurait sinon survécu au retrait du kind ; (b)
    l'amendement du périmètre RFC en iteration 2 (ajout de
    implementer.yml) a entraîné l'émission de DEUX write permits
    successifs (6 puis 7 paths) sur le même RFC, les deux restés actifs,
    surface de friction au moment de la clôture.
