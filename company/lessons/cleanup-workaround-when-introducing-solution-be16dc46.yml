kind: lesson-learned
metadata:
  id: be16dc46-0a2c-470c-a1f4-8f89a98abdbf
  title: "Quand on introduit une vraie solution, on retire le contournement qu'elle remplace dans la même unité de travail"
  author: pm
  created_at: "2026-06-03"
  description: >
    Un contournement (workaround) est une dette assumée temporairement en
    attendant une vraie solution. Quand cette vraie solution arrive (dans
    le code de CompanyOS, dans un projet, ou dans une règle de process),
    le contournement qu'elle rend obsolète doit être retiré dans la MÊME
    unité de travail (même RFC, même implementation-plan, même PR). Sinon
    le contournement survit, devient un faux chemin que les agents
    continuent d'emprunter, et la mémoire collective porte deux vérités
    contradictoires. Cette lesson pose le cleanup des contournements
    obsolètes comme une étape de Definition of Done, pas comme une
    intention pour plus tard.
  tags:
    - workflow
    - technical-debt
    - cleanup
    - workaround
