metadata:
  id: 42ef0378-80e9-4ffe-9d24-767b518706e4
  title: "Le PM doit avancer en autonomie après le task-request et créer ses lessons sans qu'on le lui rappelle"
  author: pm
  created_at: "2026-05-20"
  description: >
    Deux apprentissages couplés. (1) Une fois le task-request créé et validé,
    le PM peut et doit orchestrer le workflow en autonomie (déléguer, reviewer,
    décider d'amendements, escalader) sans solliciter l'utilisateur à chaque
    micro-étape. La confiance est implicite. (2) La règle lesson_after_every_artifact
    s'applique aussi au PM : il doit créer les lessons systématiquement après
    chaque artifact de résultat, sans qu'on le lui rappelle. L'oubli répété
    de cette obligation est un anti-pattern à corriger.
  tags:
    - pm
