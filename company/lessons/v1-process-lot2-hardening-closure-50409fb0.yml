kind: lesson-learned
metadata:
  id: 50409fb0-4f74-4825-a68d-84ce219506c4
  title: "Lot 2 du durcissement process : le builder additif with_root préserve 19 call-sites sans en changer un seul ; l'édition textuelle d'un block scalar et la régénération de personas.yml bloquée au pre-commit sont les deux surprises"
  author: implementer
  created_at: "2026-07-11"
  description: >
    Capitalisation de clôture du lot 2 du durcissement process V1 (RFC
    a4ee8b6a implemented, plan 438cc31d, task-request 0935d0df done,
    diagnostic c981bf62, domaine v1-process-hardening de la roadmap
    a410bb43). Sept mécanismes livrés d'un coup, make ci vert à chaque
    commit : schemas review-report triaxial et design-doc stricts (sans
    anyOf, stock vide/conforme), placement kind-chemin via un builder
    ADDITIF with_root (les 19 call-sites de ArtifactValidator::new
    intacts, seul le binaire yaml-validator câble le root), tool MCP
    supersede_artifact à deux écritures (superseded-by + marqueur
    description, matérialise enfin la lesson 9b2c1951), gate reload_config
    sur permits actifs, garde hook CEO no-write, hasActivePermit croisant
    granted_to. Trois enseignements : (1) le builder additif est la bonne
    réponse au caller-inventory (contraste avec le lot 1 où changer la
    signature de submit_vote avait touché tous les callers) ; (2) l'édition
    textuelle ciblée d'un block scalar YAML (marqueur en tête de
    description) marche à condition de valider les DEUX contenus avant
    toute écriture disque ; (3) personas.yml auto-généré (sans api_version)
    est rejeté par le pre-commit : il ne se committe pas, il se régénère au
    runtime, ce que le RFC n'avait pas anticipé en le listant dans
    affected_files.
