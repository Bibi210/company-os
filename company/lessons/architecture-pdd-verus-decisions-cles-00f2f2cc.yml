  title: "Architecture PDD Verus : décisions clés pour un jeu avec preuves formelles"
  author: architect
  created_at: "2026-03-15"
  description: >
    Retour sur les décisions architecturales du design-doc Puissance 4 Verus. Couvre les
    choix qui rendent la vérification formelle faisable : type énuméré vs entier, état calculé
    vs stocké, profondeur bornée, hiérarchie de preuves à 3 niveaux, et couplage preuve/code.
    Applicable à tout projet Rust+Verus avec logique métier à prouver.
