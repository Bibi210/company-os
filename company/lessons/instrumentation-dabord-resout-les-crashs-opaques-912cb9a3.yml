metadata:
  id: 912cb9a3-2d5c-4724-ade4-9324e0a48f9e
  title: "Face à un crash récurrent opaque, livrer l'instrumentation persistée AVANT tout correctif : elle résout en minutes ce que les post-mortems n'atteignent pas"
  author: pm
  created_at: "2026-09-14"
  description: >
    Le chantier de durcissement MCP (RFC 5bacb08a) a ordonné la livraison :
    télémétrie persistée et trace de crash pré-unwind d'abord, correctifs
    ensuite, avec un point d'arrêt utilisateur entre les deux. Résultat : la
    root cause de 6 SIGABRT (panic EPIPE sur stderr mort, puis double panic),
    que 6 core dumps analysés sur 5 jours n'avaient pas révélée et que deux
    diagnostics successifs avaient mal attribuée (destructeurs rusqlite/ort),
    a été identifiée en quelques minutes par la première trace pré-unwind
    écrite. La télémétrie a aussi capturé en direct la boucle de kill du
    health-check (hypothèse H1 prouvée) et un fait inconnu (timeout d'init
    MCP ~30 s du client opencode). Leçon jumelle : requalifier honnêtement
    une promesse de design (confinement + trace garantie plutôt que "double
    panic impossible") vaut mieux qu'une garantie fausse : le criterion
    offrait la branche "mécanisme équivalent", et c'est le CEO qui a le plus
    fermement approuvé cette honnêteté.
  tags:
