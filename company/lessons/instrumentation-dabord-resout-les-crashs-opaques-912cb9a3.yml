spec:
  context: >
    6 SIGABRT du serveur orchestrator servi en 5 jours, 3 reboots humains,
    déclencheur reproduit (écriture YAML → auto-reindex → crash) mais root
    cause inaccessible : les stderr du proxy et du serveur partaient dans un
    socket client jamais persisté, et les analyses gdb des core dumps ne
    remontaient que le mécanisme d'abort (panic_in_cleanup), pas le message
    du panic originel. Deux diagnostics successifs ont hypothéqué des
    suspects plausibles mais faux (Drop rusqlite/ort). Le task-request
    7d83f35d a imposé une contrainte d'ordre : instrumentation livrable
    indépendamment et en premier.
  insight: >
    Un crash pendant l'unwind détruit précisément l'information qui
    l'explique : seul un hook qui écrit AVANT l'unwind (fsync, fichier dédié,
    jamais purgé) capture le panic originel, et seul un superviseur qui
    persiste le stderr de son enfant capture ce qu'un process mourant ne
    peut plus écrire proprement. Les post-mortems (core dumps, hypothèses)
    plafonnent vite : 6 cores bien analysés ont donné le mécanisme, jamais
    la cause ; la première trace pré-unwind a donné la cause en lecture
    directe. Corollaire de process : l'ordre de livraison est une décision
    d'architecture (le déclencheur étant les écritures du chantier lui-même,
    chaque étape non instrumentée était une panne aveugle potentielle), et
    un point d'arrêt utilisateur explicite avec critère observable est le
    seul moyen de garantir qu'une instrumentation portée par un plugin de
    session est réellement EN SERVICE avant la suite. Corollaire d'honnêteté :
    quand le mécanisme retenu ne tient pas la promesse littérale du criterion
    (catch_unwind n'empêche pas un abort), requalifier la promesse dans le
    design plutôt que la maintenir : les reviewers valident ce qui est
    réellement tenu, et la crédibilité du design en sort renforcée.
  recommendation: >
    Face à un mode de panne récurrent et opaque : (1) cadrer et livrer
    l'instrumentation persistée (journal superviseur + trace de crash
    pré-unwind) comme PREMIER lot, indépendant, avant tout correctif ;
    (2) si l'instrumentation dépend d'un restart utilisateur, mettre un
    point d'arrêt explicite dans le séquencement avec un critère de reprise
    OBSERVABLE (le journal existe et reçoit des lignes de la nouvelle
    session) ; (3) rendre l'instrumentation incapable de nuire (best-effort,
    jamais fatale, drain inconditionnel : les invariants de non-létalité et
    d'infaillibilité appartiennent au RFC, pas au plan) ; (4) ne pas
    conditionner les durcissements à l'identification de la root cause fine :
    concevoir agnostique, et laisser l'instrumentation trancher ensuite ;
    (5) quand un criterion promet plus que le mécanisme ne tient, requalifier
    la promesse par la branche "mécanisme équivalent" plutôt que de laisser
    une garantie fausse dans un document d'approbation.
