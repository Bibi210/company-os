metadata:
  id: 0b4eba7c-8e66-44d2-8846-352e2d3f37c9
  title: >
    Clôture du domaine v1-personas-audit : après un durcissement mécanique, réaligner
    la prose des personas sinon les agents raisonnent sur un modèle faux du système ;
    et appliquer un RFC peut révéler un bug latent dans l'outillage qui le consomme
  author: implementer
  created_at: "2026-08-09"
  description: >
    Capitalisation de clôture du DOMAINE v1-personas-audit (task-request 3dcd3a6b,
    diagnostic d9f9ae30, roadmap a410bb43, programme companyos-v1). Le domaine
    v1-process-hardening avait mécanisé 27 des 62 règles de process dans le harness ;
    ce domaine-ci en tire la conséquence sur les 4 personas. RFC 098f35db (approved
    puis implemented) : 12 règles réécrites en pointeurs courts vers leur mécanisme,
    2 supprimées (redondance mécanisée), 5 ajoutées (manques V1 : reprise de session
    et vérif deploy-serve pour le PM, mode de mise en service dans les RFCs pour
    l'Architect, discipline user_approval_confirmed et traitement des scope_warnings
    pour le CEO), 3 consumes corrigés, 3 review_behavior élargis. 24 règles de
    jugement conservées intactes. Deux enseignements : (1) un durcissement mécanique
    laisse une dette de prose : tant que la persona ordonne en impératif ce que le
    harness impose déjà, l'agent raisonne sur un modèle FAUX (il croit tenir une
    règle par bonne volonté alors qu'elle est gardée par la machine) — il faut une
    passe de réalignement qui transforme chaque règle mécanisée en pointeur vers son
    mécanisme, en gardant la clause de jugement résiduel. (2) L'application d'un RFC
    peut révéler un bug latent dans l'outillage qui le consomme : les review_behavior
    élargis (première prose contenant ' : ') ont cassé le générateur personas.yml
    qui concaténait des scalaires non quotés, forçant un revert + le hotfix bd416171
    (JSON.stringify). Un artefact de test non représentatif cache un bug pendant des
    mois ; c'est la donnée réelle nouvelle qui le déclenche.
  tags:
    - companyos-v1
    - personas
    - audit
    - prose
    - harness
