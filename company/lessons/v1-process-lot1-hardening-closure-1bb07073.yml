  id: 1bb07073-421c-4a4b-b647-1dc7bdac89b5
  title: "Durcir 5 règles de process dans le harness (lot 1) : early-return + verrou schema marchent ; mais le caller-inventory limité à crates/ a re-raté un caller, malgré DEUX lessons et un RFC déjà dédiés — la prose ne suffit pas"
  author: implementer
  created_at: "2026-06-11"
  description: >
    Capitalisation de clôture du lot 1 du durcissement process V1 (RFC
    8bf78218 implemented, plan 4b56b1b9, task-request 11f13a9d done,
    diagnostic c981bf62). Deux enseignements indissociables : (1) la
    technique de mécanisation qui marche pour transformer une règle de prose
    en invariant harness (early-return côté engine/serveur MCP pour les
    gardes comportementales + additionalProperties:false côté schema pour les
    purges, pattern bd4650e2) ; (2) l'incident du caller-inventory : malgré la
    règle persona eb42a8de et les lessons ea6e9dd1 + 611fde3e, j'ai limité le
    recensement des callers de submit_vote à `rg crates/` et raté le crate de
    tests TOP-LEVEL `tests/integration/`, découvert seulement au cargo test.
    C'est la troisième occurrence de la même classe d'oubli APRÈS sa
    formalisation en persona : preuve empirique que la discipline en prose
    réduit mais n'annule pas le risque, et motivation directe pour la
    mécanisation déterministe du pré-check de périmètre (lot 3).
