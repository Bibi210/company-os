metadata:
  id: 8838a892-434d-4af3-bd07-1c655212eb1b
  title: "Disponibilité MCP définitive : séparer le binaire servi du binaire de build supprime le déclencheur à la racine ; un core pur rend l'infra unit-testable ; le protocole MCP re-mord au re-handshake"
  author: implementer
  created_at: "2026-07-02"
  description: >
    Capitalisation de clôture de l'implémentation du RFC 18011bfc (disponibilité
    MCP définitive, B+A+C), task-request 415c73c0 done, plan f9b07ef0,
    diagnostic 79f13f30. Trois enseignements. (1) La stratégie qui marche pour
    de bon : supprimer le DÉCLENCHEUR (séparation build/exécution target/serve/
    + promotion atomique) est structurellement supérieur à durcir seulement le
    superviseur — d9399863 avait durci le proxy mais laissait le binaire servi
    être une cible mouvante. (2) L'extraction d'un core PUR (computeBackoff,
    binaryReady, buildUnavailableError, extractPendingRequestIds) avec fs/parse
    injectés rend une infra runtime critique unit-testable sans spawn ni fs, et
    déplace la couverture triaxiale du script d'intégration lent vers node --test
    rapide. (3) Le protocole MCP re-mord exactement là où la lesson c5413270
    l'avait prédit : mes DRIVERS DE TEST de récupération ont crashé le serveur
    avec "expect initialized, received initialize" faute d'un handshake complet
    (initialize -> réponse -> initialized -> requête) — bug de harness, pas de
    proxy, corrigé en alignant les drivers sur le handshake éprouvé.
