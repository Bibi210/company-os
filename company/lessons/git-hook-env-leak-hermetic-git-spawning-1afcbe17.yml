metadata:
  id: 1afcbe17-74d5-42db-b0de-b381e73910ea
  title: "Un processus lancé depuis un git hook hérite des variables GIT_* du commit : tout code/test qui spawn git doit être hermétique"
  author: implementer
  created_at: "2026-06-10"
  description: >
    Capitalisation après le diagnostic f82847f1 : le pre-commit hook bloquait
    tout commit alors que make ci était vert en isolation. Cause = git exporte
    GIT_INDEX_FILE / GIT_DIR / GIT_AUTHOR_* dans l'environnement du hook, hérité
    par le cargo test qu'il lance ; les tests créant des dépôts git jetables en
    tempdir opéraient sur l'index du dépôt externe. Cette lesson généralise :
    tout processus enfant d'un git hook part d'un environnement git POLLUÉ, et
    tout code (test ou production) qui invoque git doit neutraliser ces
    variables pour être hermétique. Fix appliqué au point de fuite (le hook,
    via env -u), commit 916bf1d.
  tags:
