        Ajout du PIÈGE D (BLOC 2) : rendre un crate Creusot vérifié EXÉCUTABLE en
        ajoutant un binaire (src/main.rs) sans casser la preuve. `cargo creusot prove`
        échoue sur le `println!` du main (Unsupported constant value) ; solution propre
        `cargo creusot prove -- --lib` qui exclut le binaire de la vérif. Pendant exact
        du piège #3 Verus (println! interdit dans verus!). Aucun #[trusted]/assume, code
        prouvé inchangé. Tag `executable` ajouté.
