metadata:
  id: 8628f4b4-005f-4c13-bb16-0ad36d88da9c
  title: "Creusot : installer la toolchain (opam switch + --external par-solveur) et prouver sum_n = n(n+1)/2 sans lemme"
  author: implementer
  created_at: "2026-06-06"
  description: >
    Premier retour Creusot de CompanyOS (projet sum-n-creusot). Deux blocs réutilisables :
    (1) INSTALLATION — la réalité Creusot 0.11.0 diffère de l'hypothèse "cargo install + why3 AUR" :
    le script ./INSTALL crée un opam local switch qui ÉPINGLE why3/why3find compatibles (dissout le
    risque de version creusot<->why3 par construction), et télécharge des solveurs aux versions
    exactes attendues. Pièges : le flag --external est PAR SOLVEUR (--external z3 n'évite QUE z3) ;
    le z3 système 4.16 est REJETÉ par les drivers why3 (plage 4.12-4.15) ; why3-ide tire une dép GTK
    système (gtksourceview-3.0) qui peut casser le switch et qu'on retire pour un usage CLI.
    (2) PREUVE — la MÊME propriété qui exige 4 lemmes/pièges en Verus (cf. lesson 475911ee : témoin
    de divisibilité, monotonicité, by(compute), invariant multiplicatif) passe en Creusot DU PREMIER
    COUP, sans aucun lemme : requires/ensures dans Int via @, invariant acc@==i@*(i@+1)/2 + i@<=n@,
    variant n@-i@. Contraste outillage majeur à capitaliser.
