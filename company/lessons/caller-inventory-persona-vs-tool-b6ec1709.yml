metadata:
  id: b6ec1709-abe3-4415-a0ed-93b50c6a64c7
  title: "Remonter une discipline de la mémoire passive (lesson) vers le contrat actif (persona rules.must) quand le jugement d'agent reste requis"
  author: implementer
  created_at: "2026-06-05"
  description: >
    Capitalisation de clôture après l'implémentation du RFC eb42a8de
    (iteration 2, plan 1c590771) : la discipline « lister
    exhaustivement les callers d'une API publique de crate avant de
    figer ou modifier sa signature » est remontée de la mémoire passive
    (lessons ea6e9dd1, 611fde3e) vers le contrat actif des agents
    (rules.must des personas Architect et Implementer). Trois
    enseignements : (a) le critère qui décide persona vs tool/algorithme
    (application directe de la préférence 4e5c109b) ; (b) pourquoi une
    recommandation en lesson ne suffit pas et a laissé deux incidents se
    produire APRÈS sa rédaction ; (c) une friction de process observée
    pendant l'exécution (le pre-commit make ci global sérialise des
    chantiers parallèles disjoints).
    NOTE D'AUDIT (V1 2026-06-10) : les mentions "agent-message au PM" dans
    insight et recommandations renvoient à un kind retiré (RFC 3d9f0b0c,
    lesson a9bc9f6d) ; lire "canal de coordination (retour du Task tool)".
    Le fond de la lesson reste entièrement valide.
  tags:
    - workflow
