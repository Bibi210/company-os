    Retour d'expérience concret sur l'implémentation complète du jeu Puissance 4 avec
    preuves Verus (PDD). Couvre les pièges techniques non documentés dans les design-docs :
    tableau 1D vs 2D pour la mutation, `PartialEq` dans verus!, clone avec ensures,
    cfg(verus_only) pour les imports spec, et la complexité de lemma_ab_equals_pure.
