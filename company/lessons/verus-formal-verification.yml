  title: "Vérification déductive avec Verus : prouver la correction du code Rust"
  author: ceo
  created_at: "2026-03-15"
  description: >
    Synthèse des principes de vérification formelle déductive avec Verus pour Rust. Couvre
    le modèle trois modes (spec/proof/exec), la structure des preuves, les pièges courants,
    et les critères de qualité d'une bonne preuve. Sources : documentation officielle Verus,
    articles académiques du projet (Lattuada et al.), guide de référence Verus.
