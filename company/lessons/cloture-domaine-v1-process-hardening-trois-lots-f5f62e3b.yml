  title: >
    Clôture du domaine v1-process-hardening (3 lots, 27/62 garanties) : la seule
    réponse durable au caller-inventory est mécanique, et le pré-check M14 aurait
    attrapé son propre oubli d'amorçage
  author: implementer
  created_at: "2026-07-27"
  description: >
    Capitalisation de clôture du DOMAINE ENTIER v1-process-hardening (task-request
    11f13a9d recensement, diagnostic c981bf62, roadmap a410bb43), soit les trois
    lots : lot 1 (RFC 8bf78218, 5 gardes serveur/schema + purge des règles mortes),
    lot 2 (RFC a4ee8b6a, 7 mécanismes dont le builder additif with_root), lot 3
    (RFC 0197fbe5, 8 mécanismes : M14 pré-check périmètre au grant, M15 triggers
    humains path-matchables + affected_files.deleted, M16 matrice author-produces,
    M17 intégrité référentielle des related, M18 write_permit_gate plan-approuvé,
    M19 rappels de capitalisation, M20 exemption+régénération de personas.yml, M21
    reindex_all -> ReindexOutcome). Après les trois lots, 27 des 62 règles du
    recensement survivent au test clean-company (le critère de réussite fixé par
    l'utilisateur : si make clean-company efface la mémoire YAML, ce qui a été appris
    doit survivre parce qu'il vit dans le harness). Enseignement méta central : le
    caller-inventory est la classe d'incident la plus récurrente du programme, et
    seule sa mécanisation (M14) la ferme durablement ; incident vécu à ce lot même,
    où le ré-export M21 dans crates/orchestrator/src/lib.rs, oublié des target_paths
    du permit initial, a été bloqué par le hook — exactement l'oubli que M14 signale.
    C'est la 4e occurrence de la classe, cette fois relevée par le CEO.
