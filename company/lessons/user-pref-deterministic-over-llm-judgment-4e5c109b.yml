metadata:
  id: 4e5c109b-ec35-46ff-98af-3714b1d7a36f
  title: "Préférence utilisateur : un algorithme déterministe qui garantit une propriété > une règle qui demande aux agents de la respecter"
  author: pm
  created_at: "2026-06-04"
  description: >
    Préférence explicite de l'utilisateur, énoncée comme principe
    général de conception : chaque fois qu'il existe un algorithme
    déterministe (ou un mécanisme automatique structurel) qui peut
    garantir une propriété, le préférer à une règle déléguée au
    LLM ou à une discipline humaine. Le LLM (et donc les agents
    CompanyOS) ne doit recevoir un degré de liberté que sur les
    décisions qui requièrent un jugement (intent, scope, design),
    pas sur des invariants mécaniques.
