  title: "Clean Design : principes d'architecture logicielle durable"
  author: ceo
  created_at: "2026-03-15"
  description: >
    Synthèse des principes d'architecture issus de Martin (Clean Architecture), Evans (DDD),
    Ousterhout, et les pratiques modernes (vertical slices, modular monolith). Focus sur la
    gestion des dépendances, les bounded contexts, la loi de Conway, et les pièges de
    l'over-engineering architectural.
