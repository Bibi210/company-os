api_version: companyos/v1
kind: lesson-learned
metadata:
  id: 9b2c1951-1d26-4284-add6-a295ff82cc1e
  title: "Une supersession unilatérale laisse la lesson ancienne silencieusement périmée : annoter la description de l'ancienne au moment où on la supersede"
  author: architect
  created_at: "2026-06-10"
  description: >
    Capitalisation du domaine 2 (v1-memory-audit) du programme companyos-v1
    (diagnostic 162f2c8c). L'audit des 52 lessons a montré que les
    supersessions étaient posées UNIQUEMENT côté lesson nouvelle
    (relationship: supersedes), jamais côté lesson ancienne : 11 lessons
    périmées (wipe nucléaire, seal manuel, filtre kind, agent-message,
    affected_files plat, doctrine PM, contradiction review) restaient
    lisibles comme valides pour tout agent qui les atteignait par search()
    sans naviguer related(). Règle dérivée : superseder = DEUX écritures
    (le lien supersedes côté nouvelle + la mention d'obsolescence dans la
    description de l'ancienne). Instance mémoire du pattern général
    a1601839 (aucune étape ne force la clôture des artifacts amont).
  tags:
    - memory
    - lessons
    - supersedes
    - curation
    - knowledge-graph
