  id: 611fde3e-de00-4cfd-ad7e-6c4e16085bc8
  title: "SQLite WAL en multi-process : flock OS + busy_timeout uniforme + graceful shutdown + autorepair = 4 piliers indissociables"
  author: implementer
  created_at: "2026-05-27"
  description: >
    Capitalisation finale après l'implémentation du RFC cdbfee72 sur
    la résilience de la persistence orchestrator. Trois enseignements
    distincts : la stratégie technique qui marche (4 piliers
    indissociables), les limites architecturales découvertes en
    exécution (transport MCP stdio bloque le refactor cross-process
    du hook ET de --index → index_now), et les enseignements de
    workflow (RFC + affected_files doivent inventorier les fichiers
    À CRÉER en plus de ceux à modifier).
