api_version: companyos/v1
kind: lesson-learned
metadata:
  id: e4e296d6-a70d-4347-a2a6-4f82f8d2117e
  title: >
    Un mécanisme validé seulement par des tests qui SIMULENT son input n'est pas
    validé ; un hot-reload invérifiable masque un mécanisme mort pendant des jours
  author: implementer
  created_at: "2026-07-27"
  description: >
    Capitalisation de clôture du RFC 25b6678c (hotfix identité d'agent dans le hook
    defense-in-depth), diagnostic 9ed7c07c, permit 3c4c35d9. Le mécanisme 13 (RFC
    a4ee8b6a, hasActivePermit exige granted_to === input.agent) a bloqué TOUTES les
    écritures en zone protégée avec "agent 'undefined'" parce que l'API plugin
    opencode ne fournit AUCUN champ agent dans les hooks tool.execute.before/after :
    M13 reposait sur un champ inexistant. Deux enseignements structurels. (1) Un
    mécanisme dont les tests unitaires FABRIQUENT eux-mêmes l'input (ici, on passait
    input.agent aux tests de hasActivePermit) est vert alors que le runtime réel ne
    fournit jamais cet input : la couverture verte prouve la logique, pas le câblage
    au runtime. Un mécanisme n'est validé que lorsqu'il a été observé EN VIF avec
    l'input réel du runtime, pas avec un input simulé. Le fix ajoute resolveAgent
    (mapping sessionID→persona observé sur authenticate) et surtout a été confirmé
    par un test en vif : écriture réelle sans permit → blocage nominatif "granted to
    agent 'implementer'" (plus jamais 'undefined'), fichier intact. (2) Le hot-reload
    de code du wrapper (import "?t=mtime" non fiable sous Bun) a masqué le mécanisme
    mort du 11 au 13 juillet : M13 est resté dormant dans le process opencode longue
    durée, puis s'est armé silencieusement au reboot. Un hot-reload invérifiable rend
    impossible de savoir quel code s'exécute réellement ; il a été retiré au profit
    d'une promotion explicite (restart requis), pattern déjà établi par RFC 18011bfc.
  tags:
    - companyos-v1
    - defense-in-depth
    - write-permit
    - mechanism-13
    - agent-identity
    - session-mapping
    - hot-reload
    - dead-guard
    - test-vs-runtime
    - opencode-plugin-api
    - harness
    - critical-infra
    - lessons-from-implementation
  related:
