api_version: companyos/v1
kind: lesson-learned
metadata:
  id: c1a98346-4d11-4ec3-8ba4-af644e9feaec
  title: "Après toute interruption de session, ré-authentifier AVANT le premier commit en zone protégée : l'identité d'agent ne survit pas, le permit si"
  author: pm
  created_at: "2026-09-14"
  description: >
    Pendant la phase 1 du chantier 5bacb08a, le premier commit C3 (zones
    protégées crates/) a été rejeté par le hook defense-in-depth
    ("Unauthorized commit touching protected zones") alors que le permit
    ca737bdc était actif et couvrait les chemins. Cause : la session de
    l'Implementer avait été interrompue et son authentification n'avait pas
    survécu ; hasActivePermit exige une identité d'agent résolue avant même
    de regarder le permit. Un authenticate() a suffi, le commit est passé à
    l'identique, aucun travail perdu (reset soft). Le réflexe de reprise
    documenté (reconstruire l'état) doit inclure la ré-authentification.
  tags:
    - authentication
    - write-permit
    - defense-in-depth
    - interruption
    - reprise
    - workflow
    - zone-protégée
