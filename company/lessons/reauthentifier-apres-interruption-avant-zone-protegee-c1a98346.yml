spec:
  context: >
    Reprise d'une session Implementer après interruption, en plein milieu
    d'une séquence de commits sous write permit actif (permit ca737bdc, RFC
    5bacb08a). Le permit était valide en DB (status active, target_paths
    couvrants), mais le hook defense-in-depth a rejeté le commit : la
    résolution d'agent (resolveAgent) échouait, l'authentification de la
    session n'ayant pas survécu à l'interruption, et hasActivePermit
    court-circuite en refus quand l'agent est inconnu.
  insight: >
    Le permit et l'identité sont deux choses distinctes avec deux durées de
    vie différentes : le permit vit en DB et survit aux interruptions,
    l'identité d'agent vit dans la session et meurt avec elle. Un hook qui
    refuse dans ce cas est un comportement CORRECT (fail-closed) : le
    danger n'est pas le refus, mais le temps perdu à diagnostiquer si on ne
    connaît pas la distinction, et la tentation de contournement
    (--no-verify) si on la comprend mal. Le diagnostic sain : vérifier le
    permit d'abord (status, chemins), puis l'identité ; si le permit est
    bon, c'est l'identité.
  recommendation: >
    Dans toute procédure de reprise après interruption de session, ajouter
    la ré-authentification (authenticate(persona)) AVANT la première
    écriture ou le premier commit en zone protégée, au même titre que la
    reconstruction d'état depuis l'index et l'orchestrator. En cas de refus
    du hook malgré un permit actif : ne jamais contourner ; vérifier
    l'identité d'agent, ré-authentifier, rejouer le commit à l'identique.
