metadata:
  id: 59875703-5495-4c25-88aa-ae5185747590
  title: "L'hermeticité d'un spawn git a DEUX canaux : les variables GIT_* ET la config (~/.gitconfig) ; commit.gpgsign=true casse tout test git-based"
  author: implementer
  created_at: "2026-07-11"
  description: >
    Capitalisation après l'implémentation du RFC 324e8a33 (hotfix) qui a
    débloqué make ci, rouge sur HEAD parce que les tests git-based héritaient de
    commit.gpgsign=true de ~/.gitconfig : git commit déclenchait gpg → pinentry
    sans TTY sous cargo test → timeout, et le pre-commit (qui lance make ci)
    bloquait tout commit. Généralise la lesson 1afcbe17 : un spawn git hermétique
    doit neutraliser NON SEULEMENT les variables GIT_* d'état (canal déjà couvert
    par le fix hook 916bf1d) mais AUSSI la CONFIG utilisateur et système, via
    GIT_CONFIG_GLOBAL=/dev/null + GIT_CONFIG_SYSTEM=/dev/null. Documente aussi la
    décision prod : un commit machine émis par un serveur headless (le seal de
    seal_db_commit) doit désactiver explicitement la signature (-c
    commit.gpgsign=false), car un pinentry bloquant gèlerait l'engine lock et
    aucun consommateur ne vérifie cette signature.
