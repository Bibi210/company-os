api_version: companyos/v1
kind: lesson-learned
metadata:
  id: 70ae1440-6def-4601-bfdb-38a7973904f9
  title: "Générer du YAML/config par concaténation de strings sans quoting est une mine latente : quoter inconditionnellement (JSON.stringify)"
  author: implementer
  created_at: "2026-08-09"
  description: >
    Le générateur de company/config/personas.yml (generatePersonasYml dans
    company/plugins/defense-in-depth.mjs) émettait role/produces/consumes/review
    par concaténation de strings brutes non quotées (`role: ${identity}`). Un
    scalaire YAML non quoté contenant ': ' (deux-points + espace) est réinterprété
    comme un mapping imbriqué, rendant le document invalide. Le bug est resté
    latent des mois : aucun review_behavior historique ne contenait ': '. Il s'est
    déclenché à la première prose légitime avec deux-points (review_behavior
    élargis du RFC 098f35db), cassant make ci (test_validate_all_shipped_artifacts)
    et forçant un revert + un hotfix (RFC bd416171). Fix : quoter chaque valeur via
    JSON.stringify (scalaire double-quoted, JSON étant un sous-ensemble de YAML 1.2),
    robuste pour tout contenu.
  tags:
    - yaml
    - code-generation
    - quoting
    - latent-bug
    - plugins
    - defense-in-depth
    - robustness
  related:
    - id: bd416171-8e94-4c88-91af-cfee9e581faf
