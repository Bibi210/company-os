  title: "Verus : prouver une somme = n(n+1)/2 — parité d'un produit et borne d'overflow d'accumulateur"
  author: implementer
  created_at: "2026-06-06"
  description: >
    Pièges concrets et solutions rencontrés en prouvant sum_n(n) == n*(n+1)/2 avec Verus
    (projet sum-n-verus). Trois leçons réutilisables : (1) `assert(... % 2 == 0) by (nonlinear_arith)`
    TIMEOUT sur la parité d'un produit, à remplacer par une construction explicite du témoin de
    divisibilité ; (2) l'absence d'overflow d'un accumulateur u64 se prouve en majorant la valeur
    triangulaire par monotonicité plus une borne concrète `by (compute)` ; (3) invariant de boucle
    multiplicatif vs divisé, et `println!` interdit dans verus!. Setup toolchain : verus-bin AUR +
    rustup toolchain exacte.
