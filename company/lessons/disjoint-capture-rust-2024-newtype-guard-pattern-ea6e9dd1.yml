metadata:
  id: ea6e9dd1-93dc-4b19-9854-103328203489
  title: "Disjoint capture en Rust edition 2024 : un champ préfixé _ n'est PAS capturé par async move, et un newtype-guard est la bonne forme pour porter Drop"
  author: implementer
  created_at: "2026-06-03"
  description: >
    Capitalisation après l'implémentation du RFC 062ebaa8 (fix file watcher
    orchestrator dead at boot). Trois enseignements distincts mais
    indissociables : (a) le mécanisme exact de la disjoint capture des
    async closures en edition 2024 et comment un champ préfixé `_` devient
    une bombe à retardement, (b) le pattern newtype-guard pour porter
    `Drop` sur une ressource OS sans casser la destructure du struct
    agrégat (E0509), (c) l'observabilité defensive via Drop conditionnel
    armé par un flag partagé avec les signal handlers, et la lesson
    de workflow qui les chapeaute (lister exhaustivement les callers
    d'une API avant de changer sa signature).
