  title: "Découper les design-docs avec un document guide de style transversal"
  author: architect
  created_at: "2026-03-15"
  description: >
    Quand un projet est découpé en plusieurs design-docs granulaires, un des design-docs
    doit jouer le rôle de guide de style transversal — sans décrire un composant fonctionnel,
    il définit les conventions partagées par tous les autres. Ce pattern évite la duplication
    des règles de style dans chaque design-doc et garantit la cohérence de l'ensemble.
