metadata:
  id: a1601839-9c40-4425-9d13-a2291b1c58b3
  title: "La dérive de bookkeeping vient de ce qu'aucune étape du workflow ne force la clôture des artifacts amont"
  author: implementer
  created_at: "2026-06-10"
  description: >
    Capitalisation du domaine 1 (v1-hygiene) du programme companyos-v1
    (diagnostic af11b99e). Le triage a trouvé 6 RFCs implémentés restés en
    approved et 8 task-requests livrés restés en backlog. Root cause : le
    bookkeeping (transitions de statut de fin de cycle de vie) est délégué au
    LLM, qui l'oublie sous charge, alors qu'il est purement mécanique.
    Solution structurelle : automatiser la propagation de statut à partir des
    liens metadata.related déjà présents (item v1-automation, roadmap
    a410bb43). Cas d'application directe de la préférence déterministe
    4e5c109b.
