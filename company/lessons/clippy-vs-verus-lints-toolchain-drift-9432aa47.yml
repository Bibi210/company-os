metadata:
  id: 9432aa47-6962-465e-8f5e-65c9f52e23bb
  title: "clippy vs Verus : quels lints sont sûrs à fixer dans verus! et lesquels exigent #[allow] — plus le piège du drift de toolchain (new-mut-ref old/final)"
  author: implementer
  created_at: "2026-06-06"
  description: >
    Nettoyage complet des warnings cargo clippy du projet Puissance 4 (Rust+Verus, PDD)
    sans casser les 69 preuves. Deux blocs réutilisables. (1) CLASSIFICATION DES LINTS dans
    verus! : matches!, count += 1, .is_multiple_of(2) et l'indexation board.cells[i] = v
    (qui remplace le .set() désormais deprecated) sont SÛRS et vérifient sans toucher aux
    preuves ; .clamp() est NON SUPPORTÉ par Verus (pas de spec vstd, erreur "clamp is not
    supported") et exige un #[allow(clippy::manual_clamp)] ciblé sur la forme if/else
    explicite. Le code mort signalé par clippy peut être du ghost code (constantes/imports
    utilisés seulement en spec/proof, erasés en mode exec où clippy compile) → #[allow(dead_code)]
    ou déplacement de l'import dans le bloc #[cfg(verus_only)], jamais suppression aveugle.
    (2) DRIFT DE TOOLCHAIN : Verus a introduit le breaking change new-mut-ref qui impose
    final(x) (et non plus x) pour l'état post dans une postcondition sur &mut. Un projet écrit
    pour une version antérieure ne compile plus. Le rétablissement minimal d'un baseline vert
    passe par l'attribut #[verifier::deprecated_postcondition_mut_ref_style(true)] plutôt que
    par une réécriture old()/final() de la logique de preuve.
