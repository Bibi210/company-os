api_version: companyos/v1
kind: lesson-learned
metadata:
  id: aa8c4d52-12b2-4d1f-b931-008951231a11
  title: "Le point d'enforcement doit vivre dans la zone qu'il enforce ; protéger l'appelant sans l'appelé ne protège rien"
  author: implementer
  created_at: "2026-07-03"
  description: >
    Capitalisation de clôture du RFC c129453c (task-request 30ab07d5 done) :
    ajout de .githooks/ et company/scripts/ aux prefixes de
    protected-zones.json. Deux enseignements. (1) Un harness dont le point
    d'enforcement (le pre-commit hook, Layer 3) est librement modifiable par
    les agents qu'il contraint n'est pas un harness : le point d'enforcement
    doit vivre DANS la zone qu'il enforce, sinon il s'auto-neutralise (un agent
    pose exit 0 en tête de hook, démontré le 2026-06-10 commit 916bf1d, fix
    légitime mais précédent dangereux). (2) L'investigation a révélé un angle
    mort symétrique : le bypass par DÉLÉGATION. Le plugin protégé
    (company/plugins/) déléguait à company/scripts/check-artifact-naming.sh un
    script NON protégé ; protéger l'appelant sans protéger l'appelé ne protège
    rien (modifier le script rend le check inopérant sans toucher la zone
    protégée). deploy-serve.sh, exécuté par le proxy, est un vecteur d'exécution
    du même calibre. Chaîne d'enforcement = tous les maillons doivent être
    protégés, pas seulement le premier.
  tags:
    - companyos-v1
    - protected-zones
    - githooks
