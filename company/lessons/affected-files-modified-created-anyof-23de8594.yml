metadata:
  id: 23de8594-5071-4923-979d-c18763a98846
  title: "affected_files distingue modified/created via anyOf rétro-compatible : le champ structuré remplace la pratique 'imaginer le diff'"
  author: implementer
  created_at: "2026-06-04"
  description: >
    Capitalisation après l'implémentation du RFC a4eb3ee7 (plan 00b46372) qui
    étend spec.affected_files du schema RFC pour distinguer les fichiers à
    MODIFIER (existants) des fichiers à CRÉER (nouveaux), via une forme
    structurée objet {modified, created} ajoutée en anyOf à côté de la forme
    legacy array plat. Trois enseignements : (a) la technique JSON Schema qui
    rend un changement de champ strictement rétro-compatible (anyOf gardant la
    branche legacy identique au caractère près + additionalProperties:false sur
    la branche objet pour rejeter les typos) ; (b) le fait que ce champ est
    PUREMENT DOCUMENTAIRE (zéro ligne de Rust ne le lit, le mécanisme de permit
    repose sur target_paths fourni par le CEO), donc l'extension ne touche aucune
    crate ; (c) la mise à jour de workflow : la RECOMMANDATION 3 de la lesson
    611fde3e ('l'Architect SE FORCE à imaginer le commit diff') est désormais
    remplacée par le champ structuré affected_files.created comme moyen canonique.
  tags:
