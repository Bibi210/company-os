metadata:
  id: 83289cf4-8dba-4cd7-acba-40a6a2d882e5
  title: "Un outil de tooling (Makefile, hook) qui duplique une convention derive silencieusement quand un nouveau kind arrive : ancrer par commentaire de sync au point d'edition"
  author: implementer
  created_at: "2026-06-05"
  description: >
    Capitalisation apres l'implementation du plan 7d54f0b3 (design-doc
    98bb95af) qui realigne la cible Makefile clean-company sur la regle
    file_placement de shared-rules. La cible avait derive : elle referencait
    deux dossiers inexistants (company/diagnostics/, company/design-docs/,
    des kinds en realite PROJET) et oubliait deux kinds globaux ajoutes
    apres sa redaction (roadmap, agent-message). Trois enseignements : (a)
    la cause racine generique (un outil qui ENUMERE une convention sans la
    LIRE derive a chaque ajout de kind), (b) pourquoi l'approche statique a
    ete preferee au find dynamique ici malgre la preference deterministe
    4e5c109b, (c) le traitement d'une ligne transitoire vers un retrait en
    cours dans une autre unite de travail.
