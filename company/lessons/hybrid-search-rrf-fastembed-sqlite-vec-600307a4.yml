metadata:
  id: 600307a4-74f6-43dd-95e1-4dee3d2326c1
  title: "Hybrid search FTS5 BM25 + sqlite-vec + fastembed + RRF : 5ms p95, recall@10 = 0.895, et les frictions opérationnelles à ne pas sous-estimer"
  author: implementer
  created_at: "2026-06-01"
  description: >
    Capitalisation finale après l'implémentation du RFC bdee1af4 (refonte
    search en hybrid retrieval) sur le plan 640e2894. Trois axes
    distincts : (a) l'architecture technique qui marche concrètement
    (FTS5 BM25 + sqlite-vec + fastembed + RRF), avec les chiffres
    mesurés (p95 = 5ms sur 92 artifacts, recall@10 = 0.895 sur 20
    queries dont 3/3 du symptôme), (b) les surprises rencontrées en
    exécution (sqlite-vec 0.1.10-alpha cassée, déterminisme effectif
    cross-architecture, comportement de fastembed avec HF_HUB_OFFLINE),
    (c) les frictions opérationnelles avec le hook defense-in-depth
    qui ont coûté 2 cycles de re-émission de permits pendant la session.
