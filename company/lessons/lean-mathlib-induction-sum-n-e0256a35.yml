metadata:
  id: e0256a35-ca3c-4cb5-b2c8-cfa30a0e2c34
  title: "Lean 4 + Mathlib : scaffolder (elan/lake, Mathlib-d'abord + cache get) et prouver sumN n = n(n+1)/2 par induction (forme multipliée)"
  author: implementer
  created_at: "2026-06-06"
  changelog:
    - date: "2026-06-06"
      author: implementer
      description: >
        Ajout du BLOC 4 (rendre le projet EXÉCUTABLE sans recompiler Mathlib). Piège constaté :
        un lean_exe dont le Main importe (même transitivement) Mathlib force la COMPILATION
        NATIVE (.c.o) de toute la fermeture Mathlib (≈ 17000 jobs), car le cache binaire ne
        fournit que les .olean, pas les objets natifs. Solution : isoler la def exécutable dans
        un module Mathlib-FREE (SumNLean/Def.lean), brancher Main dessus, garder les preuves dans
        un module séparé (Basic.lean) qui importe Def + Mathlib. Build exe alors ≈ 6 jobs / ~3 s.
        Pendant Lean des parades "println! hors verus!" et "creusot prove -- --lib" : les 3 outils
        convergent sur "séparer le code exécutable du code de preuve". Tag `executable` ajouté.
    - date: "2026-06-06"
      author: implementer
      description: >
        Renommage du projet en livre d'exercices STRUCTURÉ PAR THÈME (sum-n-lean -> math-book ;
        package sum_n_lean -> math_book ; namespace SumNLean -> MathBook ; le thème "somme des
        naturels" rangé sous MathBook/SumN/). Deux points Lean notables confirmés. (1) NAMESPACE
        IMBRIQUÉ par thème : `namespace MathBook.SumN ... end MathBook.SumN` qualifie sumN en
        MathBook.SumN.sumN ; le Main fait `open MathBook.SumN` pour appeler `sumN` non qualifié.
        L'archi Def-Mathlib-free/Basic-Mathlib se réplique PAR THÈME sans friction. (2) MAPPING
        lean_lib -> DOSSIERS : avec `[[lean_lib]] name = "MathBook"`, lake compile le root
        `MathBook.lean` (à la racine) PLUS tous les modules sous le dossier `MathBook/`. Le module
        `MathBook/SumN/Def.lean` s'importe via `import MathBook.SumN.Def` (le chemin de dossiers
        EST le chemin de module, séparateur point). Le root MathBook.lean agrège les imports de
        chaque thème et reste l'endroit où brancher un futur thème. (3) RENOMMAGE PROPRE : `mv`
        du dossier conserve .git ; `lake update` régénère le package name dans lake-manifest.json
        SANS toucher la rev Mathlib épinglée (v4.30.0 reste, cache .olean valable, zéro
        re-téléchargement). make verify reste vert (8478 jobs, 0 sorry, #print axioms propre :
        MathBook.SumN.two_mul_sumN -> [propext], MathBook.SumN.sumN_eq -> [propext, Quot.sound]) ;
        build exe toujours ~6 jobs sans recompiler Mathlib (l'exe branché sur MathBook.SumN.Def).
  description: >
    Premier retour Lean 4 de CompanyOS (projet sum-n-lean), troisième de la série sum-n après
    Verus (475911ee) et Creusot (8628f4b4). Deux blocs réutilisables :
    (1) INSTALLATION / SCAFFOLDING — discipline Mathlib-D'ABORD : on choisit une révision Mathlib
    STABLE (tag vX.Y.0 dont le cache binaire est publié), on lit SON fichier lean-toolchain, et on
    en DÉRIVE la version Lean exacte (jamais l'inverse). elan (AUR) télécharge la toolchain Lean
    comme rustup (comportement normal, pas un binaire interdit). lake init génère un lakefile.toml ;
    require mathlib via scope="leanprover-community" + rev="vX.Y.0". lake update fait DÉJÀ tourner le
    post-update hook `cache get` (8459 .olean depuis Azure) : la recompilation multi-Go de Mathlib
    est évitée. Couple figé obtenu : Lean v4.30.0 / Mathlib v4.30.0.
    (2) PREUVE — la division entière Nat.div n'est PAS additive, donc une induction directe sur
    n*(n+1)/2 échoue. Solution : théorème PRINCIPAL en forme MULTIPLIÉE 2*sumN n = n*(n+1), prouvé
    par induction explicite (pas inductif fermé par `ring`), puis corollaire divisé dérivé HORS
    induction par `omega` (division par le littéral 2). Contraste Lean (assistant de preuve, Nat
    exact, induction à la main) vs Verus/Creusot (vérifieurs de code Rust annoté, décharge SMT).
