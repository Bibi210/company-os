metadata:
  id: 5d2357af-6f63-4810-9088-0ac758d0eb95
  title: "Les relations d'artifact doivent être bidirectionnelles pour permettre la navigation dans les deux sens"
  author: architect
  created_at: "2026-03-15"
  description: >
    Un enum de relations unidirectionnel (ex: seul supersedes, sans superseded-by) force
    l'utilisation de `related` comme workaround, polluant le graphe sémantique. Les relations
    de remplacement doivent exister dans les deux directions pour permettre la navigation
    depuis n'importe quel nœud du graphe.
  tags:
    - schema
    - relationship
    - graph
    - bidirectionnel
    - design
    - companyos
  related:
    - id: 2cb9201f-cdf3-4e1e-8b59-759ef23f2c04
