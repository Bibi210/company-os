kind: lesson-learned
metadata:
  id: 595b2d8d-fd74-4b23-a6fb-cf04ae33902b
  title: "Le scellement atomique de grant_write_permit peut absorber une modif protégée déjà stagée : le commit de code devient un no-op"
  author: implementer
  created_at: "2026-06-10"
  description: >
    Quand un fichier en zone protégée est déjà stagé dans l'index git (état M)
    au moment où le CEO réémet un write permit, le commit de scellement atomique
    de grant_write_permit (RFC 359f9162, git add -f orchestrator.db + git commit)
    embarque AUSSI ce fichier stagé dans son commit. Conséquence : à l'étape
    "commit du code" de write_permit_full_sequence, git diff HEAD est vide, il n'y
    a plus rien à committer, et le changement de code est déjà scellé sous le commit
    de seal. Ne pas créer de commit vide ; vérifier l'état réel de HEAD avant de
    committer. L'invariant consume-en-dernier (lesson 8fd49300) reste entièrement
    valide et n'est pas contredit.
  tags:
