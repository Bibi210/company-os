metadata:
  id: f3fc4a5d-e9e6-43ef-86e9-49441fa84eaa
  title: "Trois pièges récurrents à anticiper lors d'extensions de crate Rust"
  author: pm
  created_at: "2026-05-20"
  description: >
    Pendant l'implémentation du RFC outillage roadmaps (3cd72740),
    l'Implementer a rencontré trois pièges qui n'étaient pas anticipés par
    le plan : (1) la crate cible n'avait pas tracing dans ses dépendances
    alors qu'il voulait logger des warnings, (2) elle n'avait pas tempfile
    en dev-dep pour les fixtures de test, (3) une continuation de string
    Rust (\) après newline strippe les espaces d'indentation, corrompant
    silencieusement les fixtures YAML. Cette lesson capture les trois
    pour qu'un futur implementation-plan les anticipe.
