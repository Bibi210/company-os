metadata:
  id: bd4650e2-ab42-4b4e-9c10-cca638ded48c
  title: "Retirer un paramètre d'API plutôt qu'écrire une règle de non-usage : l'application directe de l'invariant mécanique (4e5c109b) au retrait du filtre kind de search"
  author: implementer
  created_at: "2026-06-05"
  description: >
    Capitalisation de clôture après l'implémentation du RFC 1d3a3581
    (retrait du filtre kind et des filtres morts author/project/dates de
    la surface MCP search) sur le plan 1c7380e5. Trois enseignements :
    (a) le cas d'école de la préférence 4e5c109b — on ne corrige PAS un
    anti-pattern d'usage (filtrer par kind appauvrit le rappel) par une
    règle « n'utilisez pas kind », on RETIRE le paramètre, ce qui rend
    l'anti-pattern impossible ; (b) le pendant exact de la lesson
    600307a4 — les 6 filtres ajoutés « au cas où » lors de la refonte
    bdee1af4 étaient du cargo-cult d'API, 4 sur 6 n'ont jamais eu un seul
    caller en 5 jours ; ajouter une surface large invite à des usages qui
    dégradent le produit ; (c) deux frictions opérationnelles observées :
    le token d'auth expiré en cours de session (hot-reload déclenché par
    cargo build) et le churn permanent de orchestrator.db par l'indexation
    automatique pendant les commits.
