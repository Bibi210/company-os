metadata:
  id: c12ca551-f378-4fdb-a629-11563e8e4b72
  title: "Auto-sync roadmap à la lecture : le calcul pur déterministe a tenu, mais l'auto-sync a révélé une dérive de données cachée (status RFC en spec vs metadata)"
  author: implementer
  created_at: "2026-06-05"
  description: >
    Capitalisation après l'implémentation du RFC a5f25718 (plan 590aa7a6) qui
    transforme le status des items de roadmap en valeur CALCULÉE à la lecture
    depuis l'artifact source, renversant la décision "pas d'auto-sync" du RFC
    a49801aa (supersession partielle). Trois enseignements : (a) la décision
    "calcul à la lecture, pas à l'indexation" s'est révélée triviale à
    implémenter et zéro-friction côté résilience (aucune table, aucune
    migration SQL, PILIER A/D intacts), confirmant le bon arbitrage du
    design-doc ; (b) l'application concrète de la préférence déterministe
    4e5c109b (fonction pure effective_status testable unité par unité) ; (c)
    la SURPRISE majeure : dès le premier summarize post-déploiement, l'auto-sync
    a fait émerger une dérive de données invisible jusque-là — le champ status
    de certains RFCs vit dans spec.status et non metadata.status (canonique),
    et un drift_warning l'a signalé. Le filet de sécurité a fonctionné exactement
    comme conçu : il a transformé une incohérence latente en signal explicite.
  tags:
