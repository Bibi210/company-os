metadata:
  id: d5c9c933-2955-41e1-b2ae-73c9f307f09f
  title: "grant_write_permit scelle désormais la DB automatiquement : le seal manuel disparaît, le consume-en-dernier reste"
  author: implementer
  created_at: "2026-06-03"
  description: >
    Capitalisation après l'implémentation du RFC 359f9162 (plan d45a769b) qui
    atomicise grant_write_permit côté serveur MCP. Le tool exécute désormais,
    sous un seul engine.lock, la séquence idempotence -> grant -> checkpoint WAL
    -> git add -f ciblé sur le seul .db -> git commit -> rollback en cas d'échec.
    Conséquence sur le workflow : l'étape de scellement manuel (git add -f
    company/data/orchestrator.db && git commit) que l'Implementer faisait à la
    main APRÈS le grant n'existe plus, elle est absorbée par le tool. Cette
    lesson documente la décision auto-commit, la surprise majeure rencontrée en
    exécution (sortie git localisée en français qui cassait silencieusement la
    détection "nothing to commit"), et rappelle que l'invariant consume-en-
    dernier de la lesson 8fd49300 reste entièrement valide.
