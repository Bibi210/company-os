spec:
  context: >
    Avant ce RFC, l'émission d'un permit laissait un état non scellé en DB : le
    plugin defense-in-depth pouvait wiper la table write_permits à la moindre
    altération détectée (lesson ed7776fb), et l'Implementer devait sceller la DB
    à la main par un git add -f + git commit immédiatement après le grant. Cette
    étape manuelle était une source d'erreurs (oubli, mauvais ordre vis-à-vis du
    commit du code) et un contournement assumé (la RECOMMANDATION 3 de la lesson
    600307a4 pointait justement les frictions répétées de re-émission de permits
    pendant une session). Le RFC 359f9162 supprime le contournement en rendant le
    grant atomique : grant + checkpoint WAL + git seal + rollback se font côté
    serveur, sous un seul lock, en une opération. Le retrait du seal manuel de la
    persona implementer.yml a été fait dans la MÊME unité de travail que le code
    (discipline de cleanup, lesson be16dc46).

  insight: >
    Trois enseignements concrets de l'exécution.
    (1) DÉCISION AUTO-COMMIT QUI MARCHE : sceller dans le tool MCP, pas dans
    l'engine. seal_db_commit vit sur OrchestratorServer (main.rs) car c'est là
    qu'est root_path et la logique git (std::process::Command, aucune crate
    nouvelle) ; l'engine reste focalisé sur la DB. Le checkpoint WAL
    (checkpoint_truncate) DOIT précéder le git add, sinon le permit fraîchement
    inséré vit encore dans le -wal et le .db committé ne le contient pas (edge h,
    le risque le plus délicat du RFC). Le rollback utilise un DELETE ciblé par id
    (delete_permit), JAMAIS restore_permits_from_snapshot, pour ne pas wiper
    collatéralement les autres permits actifs (edge e). L'idempotence compare les
    target_paths par ensemble normalisé trié+dédupliqué : un rejeu du même grant
    (même rfc + persona + set de paths, ordre indifférent) renvoie le permit
    existant, jamais un doublon.
    (2) SURPRISE MAJEURE — LA LOCALE GIT : la détection de "nothing to commit"
    par matching de texte est FRAGILE car git localise sa sortie. Dans cet
    environnement git parle français ("rien à valider, la copie de travail est
    propre"), ce qui faisait tomber le re-seal idempotent dans la branche
    GitFailed avec un stderr vide, totalement opaque. De plus, les sidecars
    -wal/-shm non suivis changent encore le message ("no changes added to
    commit" au lieu de "nothing to commit"). Correctif : forcer LC_ALL=C + LANG=C
    sur CHAQUE invocation git pour une sortie stable en anglais, ET matcher
    plusieurs phrasings ("nothing to commit", "no changes added to commit",
    "nothing added to commit"). Leçon transférable : tout code qui parse la
    sortie texte d'un binaire externe doit neutraliser la locale.
    (3) L'INVARIANT CONSUME-EN-DERNIER SURVIT : l'auto-commit scelle le permit
    mais ne le consomme PAS — il reste 'active' après le grant. La séquence
    write -> commit du code -> consume reste non-négociable (lesson 8fd49300) ;
    seul le seal manuel disparaît de la séquence. Un test de régression (T8)
    vérifie que grant+seal laisse le permit active et consumed_at=null.

  recommendation: >
    (a) Workflow Implementer : après grant_write_permit, ne PAS faire de git add
    -f company/data/orchestrator.db && git commit — c'est désormais automatique.
    La prochaine action est directement la modification des fichiers protégés,
    puis git add <fichiers> && git commit du code, puis consume EN DERNIER. La
    règle write_permit_full_sequence d'implementer.yml a été mise à jour en ce
    sens.
    (b) Parsing de binaires externes : toujours forcer LC_ALL=C/LANG=C avant de
    matcher des marqueurs texte (git, et tout autre outil dont la sortie est
    traduisible). Ne jamais supposer la locale de l'environnement serveur.
    (c) Atomicité d'une opération DB + effet de bord externe (ici git) : tenir le
    même lock du début à la fin (insert -> checkpoint -> seal -> rollback) pour
    sérialiser concurrence ET effet de bord ; checkpointer le WAL avant tout
    snapshot disque ; et garantir l'invariant "soit l'état existe ET est scellé,
    soit il n'existe pas du tout" via un rollback ciblé par id.
