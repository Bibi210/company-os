metadata:
  id: 80f7b27a-9bc5-47b6-bdf4-65a18f7f5df9
  title: "rfc_set_implemented : clore un RFC sans permit en répliquant l'écriture serveur de close_review_round, et le piège du tool-list MCP non rafraîchi en session"
  author: implementer
  created_at: "2026-06-04"
  description: >
    Capitalisation après l'implémentation du RFC 1c0f2570 (plan 0e77b612) qui
    ajoute le tool MCP rfc_set_implemented(id) : une transition de cycle de vie
    approved -> implemented pilotée par le processus serveur, donc SANS write
    permit, sur le modèle exact de close_review_round. Trois enseignements :
    (a) la décision de réutiliser l'unique voie d'écriture serveur
    update_rfc_status_in_file plutôt que d'en créer une jumelle, et pourquoi
    l'écriture serveur échappe légitimement au hook ; (b) la réutilisation
    EXCLUSIVE des variants OrchestratorError existants (error.rs jamais touché)
    pour rester strictement dans le périmètre du permit ; (c) la surprise
    opérationnelle majeure du dogfooding : un nouveau tool MCP ajouté au binaire
    n'est PAS visible dans la session MCP courante même après reload_config(),
    car le client fixe sa tool-list au handshake et le proxy ne relaie pas
    notifications/tools/list_changed. Le dogfooding a donc nécessité un restart
    de session.
