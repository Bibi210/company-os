api_version: companyos/v1
kind: roadmap
metadata:
  id: 329da45f-e24f-4200-9e18-e2e47b5a4f27
  title: "Roadmap CompanyOS système"
  author: pm
  created_at: "2026-06-03"
  description: >
    Première roadmap du domaine companyos-system. Trace l'évolution
    structurelle de CompanyOS lui-même : les RFCs qui ont façonné
    l'infrastructure (mémoire collective, persistence, résilience,
    indexation), ce qui est en cours, et les chantiers identifiés
    comme candidats à formaliser. Cette roadmap est vivante et
    maintenue manuellement par le PM. Elle ne se synchronise PAS
    automatiquement avec les artifacts référencés (le status que
    porte un item ici est la vérité PM, pas le status courant de
    l'artifact).
  tags:
    - roadmap
    - companyos-system
    - infrastructure
    - meta
  changelog:
    - date: "2026-06-04"
      author: pm
      description: >
        Mise à jour majeure suite à la résolution de cinq sujets
        candidats en RFCs mergés. Items passés de future/planned à
        past/done avec leur ref RFC : atomic-grant-permit (359f9162),
        rfc-set-implemented-tool (1c0f2570), defense-in-depth-selective
        (bde023e2), rfc-affected-files-categorize (a4eb3ee7),
        schema-migration-discipline (973a5569). L'item
        db-schema-migration-hotfix passe de present/done à past/done
        (superseded par RFC 973a5569). L'item backup-strategy passe à
        cancelled (couvert par git remote, sans chantier dédié).
        Narrative mise à jour pour refléter que les frictions
        opérationnelles initiales sont soldées. Un seul sujet reste
        en future : api-callers-discoverability.

spec:
  domain: companyos-system
  status: active

  narrative: >
    CompanyOS est un système qui se construit en s'utilisant lui-même.
    Chaque évolution structurelle passe par le même processus que
    n'importe quel projet métier : task-request, design-doc / RFC,
    review, implementation-plan, exécution, lesson-learned. La
    spécificité du domaine companyos-system, c'est que les sujets
    qu'il tracke sont les FONDATIONS sur lesquelles tout le reste
    repose. Quand la mémoire collective dérive ou que la persistence
    SQLite se corrompt, ce n'est pas un bug projet, c'est un bug qui
    cassera silencieusement tous les workflows d'agents jusqu'à ce
    qu'on s'en rende compte (souvent trop tard).

    Le fil conducteur de cette roadmap est la fiabilité opérationnelle
    de la mémoire collective. Trois piliers se sont construits dans
    l'ordre logique suivant.

    D'abord, la coordination inter-process. Le proxy MCP doit survivre
    aux restarts du binaire serveur (RFC d9399863), la persistence
    SQLite doit survivre aux ouvertures concurrentes et aux SIGKILL
    (RFC cdbfee72), et le file watcher tokio doit effectivement
    démarrer plutôt que mourir silencieusement à cause d'un piège de
    capture asynchrone (RFC 062ebaa8). Sans ces trois fondations,
    aucune écriture n'est durable et aucun search n'est fiable.

    Ensuite, la mémoire elle-même. Le lookup obligatoire avant
    production d'artifact (RFC f4fe8a04) impose à tous les agents
    d'aller consulter la mémoire collective avant d'agir, et de
    capitaliser systématiquement après. Mais cette règle était une
    promesse non tenue tant que search() retournait massivement zéro
    résultat. La refonte search en hybrid retrieval (RFC bdee1af4) a
    transformé cette règle de rituel en pratique réellement utile,
    avec un recall@10 mesuré à 0.895 et une latence p95 sous 5ms.

    Enfin, le kind roadmap lui-même (RFC a49801aa, outillage MCP
    3cd72740) qui permet au PM de raconter cette histoire et de
    suivre les sujets sans parcourir manuellement le repo. La
    présente roadmap en est le premier exemple.

    Côté frictions opérationnelles, la dette identifiée à la
    création de cette roadmap a été soldée en cinq RFCs courts et
    chirurgicaux (mise à jour du 2026-06-04) : atomicité de
    l'émission de permit (RFC 359f9162), tool MCP rfc_set_implemented
    pour clore les RFCs sans permit ad-hoc (RFC 1c0f2570), revert
    sélectif du hook defense-in-depth au lieu du nuclear (RFC
    bde023e2), schema RFC affected_files distinguant modified/created
    (RFC a4eb3ee7), et discipline de migration SQL via PRAGMA
    user_version + migrations numérotées (RFC 973a5569). Les
    frictions qui rendaient le workflow write-permit fragile sont
    désormais structurellement fermées.

    Côté futur, un sujet reste ouvert : la discipline "lister les
    callers d'une API avant de changer sa signature", lesson
    ea6e9dd1, qui demande encore à être formalisée soit comme
    checklist obligatoire dans les implementation-plans soit via
    tooling LSP automatique. Pas urgent, mais le pattern a déjà
    causé deux extensions de permit imprévues.

    Le PM met à jour cette roadmap au fil de l'eau quand un item
    change d'état. Pas de bot, pas de synchronisation automatique.
    Le status d'un item ici est la vérité que le PM affirme à
    l'instant t, pas une lecture en temps réel de l'artifact source.

  items:
    # PAST - chantiers structurels majeurs livrés

    - key: proxy-resilient
      title: "Proxy MCP résilient aux restarts du binaire"
      ref:
        type: rfc
        id: d9399863-254e-42f5-a485-ea019ce56a93
      timeframe: past
      status: done
      target_date: "2026-Q2"
      rationale: >
        Première fondation de la résilience opérationnelle. Sans ce
        RFC, un simple cargo build pendant une session opencode
        cassait la connexion MCP de manière irrécupérable. Tous les
        chantiers infra suivants en dépendent.

    - key: db-resilience
      title: "Résilience persistence SQLite orchestrator (4 piliers)"
      ref:
        type: rfc
        id: cdbfee72-59b9-449c-9e22-2666d8e591e0
      timeframe: past
      status: done
      target_date: "2026-Q2"
      depends_on: [proxy-resilient]
      rationale: >
        Le proxy résilient envoyait SIGKILL au binaire en cas de
        timeout, ce qui a fait apparaître une classe de corruptions
        SQLite jamais vue avant. Les 4 piliers (file lock POSIX,
        PRAGMA défensifs, graceful shutdown, autorepair PILIER D)
        ferment cette classe de bugs.

    - key: memory-lookup-rule
      title: "Lookup mémoire obligatoire et lessons systématiques"
      ref:
        type: rfc
        id: f4fe8a04-b654-42a1-b055-bf0b991bbb3a
      timeframe: past
      status: done
      rationale: >
        Pose la règle que tous les agents doivent consulter la
        mémoire collective avant chaque artifact et capitaliser
        après. Règle indispensable mais qui n'avait de sens que si
        search() marchait. Le sujet search a donc immédiatement
        suivi.

    - key: roadmap-kind
      title: "Introduction du kind roadmap"
      ref:
        type: rfc
        id: a49801aa-911e-45d7-95a3-b21d6ea2bd2d
      timeframe: past
      status: done
      target_date: "2026-Q2"
      rationale: >
        Schéma JSON + extension de l'enum ArtifactKind Rust + mise à
        jour des personas. Permet au PM de tracker les sujets.

    - key: roadmap-tooling
      title: "Outillage MCP list_roadmaps + summarize_roadmap"
      ref:
        type: rfc
        id: 3cd72740-1424-46ac-8ee6-96f714f3fa94
      timeframe: past
      status: done
      target_date: "2026-Q2"
      depends_on: [roadmap-kind]
      rationale: >
        Donne au PM les tools MCP pour répondre vite à "où en sont
        mes sujets ?" sans parcourir company/roadmaps/ à la main.
        Ce qui rend la présente roadmap utilisable au lieu d'être
        un document statique.

    - key: hybrid-search
      title: "Refonte search() en hybrid retrieval (BM25 + embeddings + RRF)"
      ref:
        type: rfc
        id: bdee1af4-4944-4bee-b7c0-18efd6c7961f
      timeframe: past
      status: done
      target_date: "2026-Q2"
      depends_on: [memory-lookup-rule, db-resilience]
      rationale: >
        Sans cette refonte, search() retournait massivement zéro
        résultat sur des queries pertinentes. La règle
        memory_lookup_before_acting était une promesse non tenue.
        Recall@10 mesuré à 0.895, p95 < 5ms. Sept queries de
        référence dont 3/3 du symptôme initial passent.

    - key: file-watcher-fix
      title: "Fix file watcher disjoint capture Rust edition 2024"
      ref:
        type: rfc
        id: 062ebaa8-8876-42e4-b1a7-8ed3655238e2
      timeframe: past
      status: done
      target_date: "2026-Q2"
      depends_on: [hybrid-search]
      rationale: >
        Bug critique découvert après la refonte search : le watcher
        tokio mourait silencieusement au boot à cause d'un piège
        edition 2024 (champ _watcher préfixé underscore non
        capturé par async move). Newtype WatcherGuard avec Drop
        conditionnel + extension à projects/ + test de régression.
        Sans ce fix, toute écriture YAML pendant une session était
        ignorée par l'index, dégradant silencieusement la mémoire.

    # PAST (suite) - hotfix superseded par RFC 973a5569

    - key: db-schema-migration-hotfix
      title: "Hotfix ordre CREATE INDEX vs ALTER TABLE (db.rs)"
      ref:
        type: external
        label: "Hotfix appliqué hors RFC (commit 57019e7), superseded par RFC 973a5569"
      timeframe: past
      status: done
      rationale: >
        Bug d'ordre SQL dans db.rs : les CREATE INDEX sur les
        colonnes ajoutées par ALTER TABLE étaient exécutés AVANT
        les ALTER TABLE eux-mêmes, crashant la migration sur toute
        DB pré-existante. Hotfix appliqué chirurgicalement, test
        de régression ajouté. Le sujet général de discipline a
        ensuite été pris en charge par le RFC 973a5569 (cf.
        schema-migration-discipline ci-dessous).

    # PAST (suite) - sujets candidats originaux désormais formalisés en RFC

    - key: atomic-grant-permit
      title: "Rendre grant_write_permit + scellement DB atomique côté MCP"
      ref:
        type: rfc
        id: 359f9162-18f2-4b72-85b0-7d0e44608959
      timeframe: past
      status: done
      target_date: "2026-Q2"
      rationale: >
        RÉSOLU (RFC 359f9162, commit 09757aa). grant_write_permit
        effectue désormais lui-même, dans la même opération MCP, le
        checkpoint WAL + git add -f ciblé + git commit du .db, avec
        rollback du permit si le commit échoue. Invariant : à la
        sortie du tool, soit le permit existe ET est scellé en HEAD,
        soit il n'existe pas. La fenêtre non-atomique est fermée à la
        source, neutralisant les deux mécanismes qui tuaient le permit
        (check tampering du hook, PILIER D autorepair). Grant rendu
        idempotent par clé (rfc_id + granted_to + target_paths) sur
        décision CEO. Contournement manuel (seal step) retiré de la
        persona Implementer. Lesson de capitalisation d5c9c933.

    - key: rfc-set-implemented-tool
      title: "Tool MCP rfc_set_implemented(id) pour clore les RFCs sans permit ad-hoc"
      ref:
        type: rfc
        id: 1c0f2570-71e2-4f02-ac4f-81e406b22568
      timeframe: past
      status: done
      target_date: "2026-Q2"
      rationale: >
        RÉSOLU (RFC 1c0f2570, commit 3c25889). Le tool MCP
        rfc_set_implemented(id) fait passer un RFC de approved à
        implemented par écriture serveur (std::fs::write via
        update_rfc_status_in_file étendu avec implemented_at), sans
        write permit, exactement comme close_review_round met un RFC
        en approved. Validation stricte (transition autorisée
        uniquement depuis approved), idempotence sur déjà-implemented
        (décision CEO), ouvert à tout agent sans token (décision CEO).
        12 tests triaxiaux verts. Lesson 80f7b27a. NOTE : le dogfooding
        (utiliser le tool pour clore les RFCs du chantier) est en
        attente d'un redémarrage de session opencode car le proxy MCP
        ne relaye pas notifications/tools/list_changed (limitation
        découverte, candidate RFC future). Les RFCs 359f9162 et
        1c0f2570 restent en approved jusqu'au prochain boot session.

    - key: defense-in-depth-selective
      title: "Hook defense-in-depth selective revert (vs nuclear actuel)"
      ref:
        type: rfc
        id: bde023e2-8633-42c9-911a-80dcd5157c62
      timeframe: past
      status: done
      target_date: "2026-Q2"
      rationale: >
        RÉSOLU (RFC bde023e2, commit 4f803b6). Le revert sélectif est
        désormais le comportement par défaut : DELETE WHERE id NOT IN
        (baseline), où baseline = union du snapshot before (Source A) et
        des permits scellés en HEAD git (Source B, fondée sur le
        scellement du RFC 359f9162). Le wipe nucléaire est borné au seul
        cas résiduel où la baseline est indéterminable (Source A null ET
        Source B inexploitable). Diagnostic clé : l'ancien critère
        nucléaire before===null amalgamait vraie absence de baseline et
        simple recréation du fichier DB, d'où les permits légitimes
        détruits. La faille préexistante du sous-cas silencieux L230 (un
        permit injecté survivait quand before listait 0 id) est aussi
        fermée. Invariant de sécurité validé par le CEO : aucun permit
        frauduleux ne survit. 46 tests JS verts. Lesson 85ad44d3
        (supersede partiellement ed7776fb).

    - key: rfc-affected-files-categorize
      title: "RFC schema : distinguer affected_files.modified vs created"
      ref:
        type: rfc
        id: a4eb3ee7-45c1-4422-a43a-fbbc07d686f0
      timeframe: past
      status: done
      target_date: "2026-Q2"
      rationale: >
        RÉSOLU (RFC a4eb3ee7, commit 5c3d289). Le bloc spec.affected_files
        du schema RFC accepte désormais DEUX formes via un anyOf
        rétro-compatible : FORME A legacy (array plat de strings,
        identique à l'existant) et FORME B structurée
        (objet {modified, created} avec deux listes optionnelles).
        Les RFCs touchant du code sont encouragés à utiliser la FORME B
        pour rendre la distinction modifier/créer explicite et
        machine-readable, ce qui ferme la classe d'oublis qui avait
        coûté deux blockers permits sur RFC bdee1af4 (Cargo.toml et
        types.rs oubliés car non distingués). Aucun changement Rust,
        purement schema + règle dans shared-rules.yml. Lesson de
        capitalisation produite.

    - key: schema-migration-discipline
      title: "Discipline de migration de schéma SQL côté orchestrator"
      ref:
        type: rfc
        id: 973a5569-ec7e-4ee0-a868-2314e3cd5bd4
      timeframe: past
      status: done
      target_date: "2026-Q2"
      depends_on: [db-schema-migration-hotfix]
      rationale: >
        RÉSOLU (RFC 973a5569, commit 7c7171d). PRAGMA user_version
        + migrations numérotées idempotentes installées côté orchestrator.
        Chaque migration porte un numéro de version, est exécutée
        une seule fois (vérification du user_version courant avant
        application), et la migration globale est elle-même
        transactionnelle. Tests de transition couvrant DB vierge,
        DB legacy sans colonnes filtre, et DB déjà migrée. Le hotfix
        db.rs précédent est désormais une migration v_n du nouveau
        système, ce qui ferme la classe de bugs ordre-DDL pour le
        futur. Lesson capitalisée.

    # FUTURE - sujets restant à formaliser

    - key: api-callers-discoverability
      title: "Discipline 'lister les callers avant changer une signature d'API'"
      ref:
        type: external
        label: "Lesson ea6e9dd1, formaliser comme checklist plan ou via tooling LSP"
      timeframe: future
      status: planned
      rationale: >
        Deux occurrences observées de callers oubliés dans un RFC
        (types.rs côté refonte search, yaml/src/main.rs côté
        watcher fix), causant chaque fois un cycle d'extension
        permit. Ajouter une étape 0.x obligatoire dans tout
        implementation-plan qui change une signature d'API
        publique de crate : grep / get_references LSP exhaustif
        des callers, validation par l'Architect au review du
        plan.

    - key: backup-strategy
      title: "Stratégie de sauvegarde mémoire collective"
      ref:
        type: external
        label: "Sujet jamais ouvert formellement, à scoper"
      timeframe: future
      status: cancelled
      rationale: >
        Annulé sur décision utilisateur (2026-06-03). Les YAML sont
        la source de vérité (PILIER D du RFC cdbfee72) et la DB
        SQLite n'est qu'un index reconstructible via reindex_all.
        Tant que les artifacts existent, la mémoire est récupérable
        intégralement. Le repo est versionné en git avec un remote
        (github.com/Bibi210/company-os) : le push git normal couvre
        de fait la réplication hors-machine. Le besoin initial (un
        seul disque local sans réplication) est donc adressé par le
        workflow git existant. Sujet fermé, pas de chantier dédié.
