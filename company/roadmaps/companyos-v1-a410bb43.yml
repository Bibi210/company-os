    - date: "2026-06-10"
      author: pm
      description: >
        v1-hygiene terminé (diagnostic af11b99e, lesson a1601839) : 6 RFCs
        approved passés implemented, 9 task-requests backlog passés done,
        2 conservés backlog (api-callers tracé companyos-system,
        onnx-cpu-saturation ajouté à companyos-system suite au triage).
        v1-memory-audit passe en in_progress.
    - date: "2026-06-10"
      author: pm
      description: >
        Création de la roadmap. Décisions utilisateur fondatrices : roadmap
        dédiée (domaine companyos-v1), objectif final tag git v1, ordre
        hygiène d'abord validé, droit de tri délégué intégralement aux agents
