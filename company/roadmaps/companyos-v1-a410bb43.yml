api_version: companyos/v1
kind: roadmap
metadata:
  id: a410bb43-544c-44c8-b22a-6c3022df3fe3
  title: "Roadmap CompanyOS V1 — revamp from inside out"
  author: pm
  created_at: "2026-06-10"
  description: >
    Programme de refonte complète de CompanyOS vers une Version 1 taguée en git.
    CompanyOS a grandi organiquement : idées mortes, code mort, duplication, et
    bonnes idées appliquées à un seul endroit au lieu de partout. Cette roadmap
    découpe le revamp en domaines analysés un par un (artifacts, mémoire, process,
    personas, schemas, code Rust, plugins, outillage), chacun suivant le cycle
    complet CompanyOS (recensement, tri, RFC/design-doc, implémentation, lesson).
    Deux principes directeurs fixés par l'utilisateur : (1) les interactions entre
    agents conçues comme importantes doivent vivre dans le HARNESS (hooks, tools
    MCP, schemas) et non dans la prose, pour être impossibles à contourner ;
    (2) tout ce qui est mécanisable sans LLM (transitions de statut, indexation,
    scellement, validation) doit être algorithmique et automatique.
    L'utilisateur a délégué le droit de tri (garder/tuer/fusionner) aux agents
    pour ce programme (décision du 2026-06-10).
  tags:
    - roadmap
    - companyos-v1
    - revamp
    - cleanup
    - hardening
    - automation
    - meta
