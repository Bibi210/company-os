  changelog:
    - date: "2026-07-02"
      author: pm
      description: >
        v1-mcp-availability LIVRÉ définitivement : RFC 18011bfc implemented
        (diagnostic root cause 79f13f30 en 4 couches, architecture B+A+C :
        binaires servis dans target/serve avec promotion atomique make
        deploy-serve, supervision sans abandon dans le proxy avec zéro
        process.exit et backoff réarmé, readiness événementielle avec
        erreur -32050 escalate). La règle de prose mcp_reconnect est
        supprimée au profit du contrat mcp_availability (test clean-company
        satisfait). 62 tests JS verts, script d'intégration 10/10, make ci
        vert. Lesson 8838a892. Le nouveau proxy s'active au prochain boot
        de session opencode ; la mort du vieux proxy pendant le deploy
        final était sa dernière occurrence possible.
    - date: "2026-06-11"
      author: pm
      description: >
        Lot 1 process-hardening LIVRÉ : RFC 8bf78218 implemented (5 gardes
        serveur/schema actives et vérifiées en vif, purge des règles mortes
        avec verrous, canal notes). 16 des 62 règles du recensement survivent
        désormais au test clean-company (10 avant). Lesson 1bb07073 :
        l'incident caller-inventory tests/ (3e occurrence malgré 2 lessons
        et une règle persona) prouve que la prose ne suffit pas -> le lot 3
        devra livrer un pré-check de périmètre déterministe.
        v1-mcp-availability passé en in_progress priorité critical sur
        directive utilisateur ("vraiment régler ce problème définitivement") :
        3 coupures MCP en 24h nécessitant chacune un reboot manuel.
    - date: "2026-06-10"
      author: pm
      description: >
        Deux directives utilisateur ajoutées : v1-mcp-availability
        (remplacer le polling/retry MCP par une gestion propre, task-request
        415c73c0, suite à l'incident proxy mort pendant relink) et
        v1-protect-githooks (ajouter .githooks/ aux zones protégées,
        task-request 30ab07d5). Lot 1 process-hardening en cours : RFC
        8bf78218 approved (2 itérations), permit 286abb1a émis, plan
        4b56b1b9 rédigé, en attente review Architect.
    - date: "2026-06-10"
      author: pm
      description: >
        Clarifications utilisateur intégrées : (1) le test spirituel du
        programme est "make clean-company ne casse rien et tout ce qu'on a
        appris se retrouve dans le harness" ; (2) nouvel item
        v1-harness-refactor (refactor global du harness en fin de programme
        pour éviter la chimère). v1-release en dépend désormais.
        v1-memory-audit terminé (diagnostic 162f2c8c, lesson 9b2c1951) :
        52 lessons auditées, 11 obsolescences datées, 1 doublon résolu,
        graphe rechaîné sur 6 fichiers. v1-process-hardening passe en
