  project: sum-n-creusot
  description: >
    Projet d'exercice minimal pour s'entraîner à la vérification formelle avec Creusot.
    L'objectif principal n'est PAS le contenu fonctionnel (un simple sum_n) mais la mise
    en place de TOUTE l'architecture de compilation/vérification autour : scaffolding Cargo,
    Makefile avec cible verify, et installation de la toolchain Creusot (creusot + why3 +
    solveurs SMT). Le code se réduit à une fonction sum_n itérative et à son contrat Creusot
    prouvé établissant sum_n(n) == n*(n+1)/2.
