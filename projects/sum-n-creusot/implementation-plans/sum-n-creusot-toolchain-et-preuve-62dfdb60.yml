metadata:
  id: 62dfdb60-1651-4de3-b327-7c83aa88cc07
  title: "sum-n-creusot — Plan d'implémentation : toolchain Creusot + scaffolding + preuve sum_n = n(n+1)/2"
  author: implementer
  created_at: "2026-06-05"
  project: sum-n-creusot
  description: >
    Plan d'exécution concret du design-doc 85f38442 : COMMENT et DANS QUEL ORDRE construire
    le terrain de jeu Creusot. Couvre l'installation effective de la toolchain (creusot 0.11.0
    via le script officiel ./INSTALL = opam local switch pour why3/why3find + solveurs SMT),
    le scaffolding Cargo dans /home/bibux/Compagny/sum-n-creusot/ (HORS company-os), le code
    sum_n + contrat Pearlite (requires/ensures dans Int, invariant, variant), le Makefile verify,
    le README, et les 3 points de fragilité. IMPORTANT : ce plan acte une divergence de
    stratégie d'installation par rapport au design-doc (le design supposait `cargo install creusot`
    + `why3-bin` AUR + `why3 config detect` global ; la réalité Creusot 0.11.0 est un opam local
    switch versionné + solveurs gérés par creusot-setup). La divergence est documentée comme
    décision d'implémentation déléguée et signalée pour validation. Sondage environnement réalisé
    (cargo 1.94, opam 2.5.1, curl, rustup présents ; z3 4.16 dans extra ; why3-bin 1.8 et cvc5
    sur AUR ; creusot ABSENT d'AUR et de crates.io comme binaire ; alt-ergo absent d'AUR).
  tags:
    - rust
    - creusot
    - why3
    - smt
    - formal-verification
    - implementation-plan
    - scaffolding
    - sum-n
    - toolchain
    - opam
  changelog:
    - date: "2026-06-06"
      author: implementer
      description: >
        TERMINÉ. Plan exécuté intégralement et avec succès. Toolchain installée
        (creusot 0.11.0, why3 1.8.2+git, why3find 1.3.0+dev, alt-ergo 2.6.2, cvc4 1.8,
        cvc5 1.3.1 ; z3 4.16 système rejeté par why3, sans impact). Scaffolding via
        `cargo creusot new`, code sum_n + contrat (requires/ensures dans Int via @,
        invariant acc@==i@*(i@+1)/2 + i@<=n@, variant n@-i@), BORNE=4_000_000_000.
        `make verify` => Proved ✔ (exit 0), preuve déchargée par alt-ergo SANS lemme
        manuel ni assume/admit. `cargo build` sans warning. Makefile + README livrés.
        Divergence d'install vs design-doc signalée et documentée (diagnostic-report
        e10d745f, résolu par décision utilisateur). Lesson 8628f4b4 capitalisée.
        Projet vit dans /home/bibux/Compagny/sum-n-creusot/ (HORS company-os).
