metadata:
  id: e10d745f-35ab-4817-9bbf-9ccf62489904
  title: "Install Creusot : --external z3 ne couvre QUE z3 — alt-ergo/cvc4/cvc5 téléchargés via curl + z3 4.16 non reconnu par why3"
  author: implementer
  created_at: "2026-06-06"
  project: sum-n-creusot
  description: >
    Pendant l'exécution de l'implementation-plan 62dfdb60, l'installation Creusot via
    ./INSTALL --external z3 a téléchargé trois solveurs (alt-ergo, cvc4, cvc5) via curl,
    en violation de la contrainte "aucun download de binaire hors paru/opam/cargo". Le flag
    --external <TOOL> est par-solveur : --external z3 n'a évité QUE le download de z3 (symlinké
    vers /usr/bin/z3), les trois autres solveurs ont été téléchargés par défaut. Second constat :
    le z3 système 4.16.0 n'est PAS reconnu par les drivers why3 de cette version (versions connues
    4.12 à 4.15), donc z3 external est inopérant pour la décharge. Arrêt et signalement conformes
    à la règle stricte, avant toute poursuite du scaffolding/preuve.
