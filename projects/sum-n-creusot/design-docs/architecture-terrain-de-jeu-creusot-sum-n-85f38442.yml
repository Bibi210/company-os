metadata:
  id: 85f38442-8560-4201-bd3b-72c7d8c7c659
  title: "sum-n-creusot — Architecture du terrain de jeu Creusot (sum_n prouvé = n(n+1)/2)"
  author: architect
  created_at: "2026-06-05"
  project: sum-n-creusot
  description: >
    Design architectural d'un terrain de jeu minimal pour la vérification déductive avec
    Creusot. Le coeur est l'INFRASTRUCTURE de compilation/vérification (scaffolding Cargo,
    Makefile verify, toolchain creusot + why3 + solveurs SMT). Le contenu prouvé se réduit
    à une fonction sum_n(n) itérative dont le contrat établit la formule fermée n*(n+1)/2.
    Tranche les choix de typage entier (exec borné vs modèle logique Int), la forme du
    contrat (requires/ensures/invariant/variant), la gestion de la non-linéarité et de la
    division entière côté SMT, le câblage de make verify, et la stratégie d'installation
    de la toolchain sur Arch (paru en priorité, cargo install en complément). Ce projet
    défriche : aucune trace de Creusot n'existe dans la mémoire CompanyOS.
  tags:
    - rust
    - creusot
    - why3
    - smt
    - formal-verification
    - deductive-verification
    - playground
    - scaffolding
    - sum-n
    - architecture
