  author: implementer
  created_at: "2026-09-09"
  project: sidekick
  description: >
    Plan d'exécution du design-doc 8221e203 (approuvé, round 452bb2d0). Traduit
    en étapes ordonnées et actionnables l'ajout de VSCode comme troisième éditeur
    de sidekick : variante Vscode de l'enum app.go, branche register de rpc.go,
    fichier vscode.go exposant les 12 tools MCP (parité Emacs) via un client HTTP
    POST-par-op vers l'extension, extension TypeScript vscode/ (serveur HTTP local,
    register, spawn terminal, 4 commandes palette, status bar, union
    tabGroups+open_buffer), plugin marketplace plugins/vscode/ + entrée dans
    .claude-plugin/marketplace.json, et section README. Cible : branche propre
    prête pour PR upstream vers lthms/sidekick, chaque commit compilant. Aucune
    décision d'architecture n'est prise ici : toutes sont figées par le design-doc.
    Les 3 nuances soulevées par la review Implementer du design (round 452bb2d0)
    sont tranchées comme détails d'implémentation dans les étapes 5, 9 et 8.
