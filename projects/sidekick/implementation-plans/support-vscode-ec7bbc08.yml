  risks:
    - "NUANCE 1 (interrupt) : sendText n'est pas un write PTY brut ; si l'acheminement de l'ETX via sendText s'avère non fiable sur une plateforme, le fallback est terminal.sendText avec une séquence explicite — à valider au test manuel (e). Escalade Architect si aucun canal ne fonctionne (ce serait un défaut de la décision spawn-terminal, pas un redesign local)."
    - "NUANCE 2 (diagnostics) : l'heuristique onDidChangeDiagnostics distingue clean vs non-analysé de façon best-effort ; un LSP qui n'émet jamais l'événement laisserait analyzed=false en permanence. Acceptable : le marqueur 'not analyzed' est conservateur (ne prétend jamais à tort 'clean'). Le contrat honnête des tools prime sur la précision."
    - "NUANCE 3 (Location/LocationLink) : couverte par normalizeLocations ; risque résiduel nul tant que l'API extension respecte les deux formes documentées."
    - "Union tabGroups+open_buffer : openTextDocument peut être disposé par VSCode entre deux ops ; l'extension le rouvre à la demande (idempotent). Si un buffer ouvert par claude disparaît de l'ensemble, glob/grep perdent son périmètre — géré en réouvrant via openedByClaude."
    - "Périmètre du permit : projet CONTRIBUTED hors zones protégées CompanyOS ; aucun write permit CompanyOS requis (le code vit dans le dépôt sidekick, pas dans company/). Si un fichier hors des étapes ci-dessus devait être touché, s'arrêter et signaler avant écriture."
    - "Convention upstream du répertoire d'extension (vscode/ vs editors/vscode) : open_question du design, à confirmer au moment de la PR sans impact architectural. Le plan retient vscode/ par symétrie ; un renommage ultérieur serait un git mv trivial."
