metadata:
  id: e24af522-384d-496a-b7e8-5971f7120562
  title: "sum-n-lean — Architecture : infrastructure de preuve Lean 4 + Mathlib pour theorem sumN n = n(n+1)/2 par induction"
  author: architect
  created_at: "2026-06-06"
  project: sum-n-lean
  description: >
    Architecture du troisième terrain de jeu de la série sum-n, cette fois avec Lean 4,
    un ASSISTANT DE PREUVE (non un vérifieur de code annoté comme Verus ou Creusot).
    Le coeur du design est l'INFRASTRUCTURE de preuve bout-en-bout : scaffolding lake,
    toolchain pilotée par elan, intégration de Mathlib avec son cache binaire, et un
    Makefile dont la cible verify lance lake build (= vérification des preuves). Le contenu
    prouvé est volontairement minimal : une définition récursive def sumN : Nat -> Nat et un
    theorem établissant sumN n = n*(n+1)/2 prouvé PAR INDUCTION à la main. Le design tranche
    la convention de la définition récursive, la FORME DE L'ÉNONCÉ face à la division entière
    sur Nat (énoncé principal en forme multipliée 2 * sumN n = n*(n+1) + corollaire divisé),
    le rôle de Mathlib (tactiques dans les branches, pas de lemme Gauss tout fait court-circuitant
    l'induction), la structure du scaffolding lake, le câblage de make verify avec cache get
    préalable, et la stratégie d'installation sur Arch via elan/paru avec ses points de fragilité
    (couple version Lean <-> version Mathlib, disponibilité du cache).
  tags:
    - lean
    - lean4
    - mathlib
    - formal-verification
    - theorem-proving
    - playground
    - scaffolding
    - sum-n
    - toolchain
    - arch-linux
    - elan
    - lake
