  title: "sum-n-lean — Terrain de jeu Lean 4 : theorem sumN n = n(n+1)/2 par induction"
  author: pm
  created_at: "2026-06-06"
  project: sum-n-lean
  description: >
    Projet d'exercice minimal pour s'entraîner à la preuve formelle avec Lean 4.
    Troisième terrain de jeu de la série (après sum-n-verus et sum-n-creusot), mais avec
    une nature DIFFÉRENTE : Lean n'est pas un vérifieur de code Rust, c'est un assistant de
    preuve / langage à part entière. Ici sum_n et sa preuve SONT les mathématiques. L'objectif
    principal reste l'INFRASTRUCTURE : scaffolding lake, toolchain elan, intégration de Mathlib,
    et Makefile avec cible verify. Le contenu se réduit à une fonction récursive sumN : Nat -> Nat
    et au théorème sumN n = n*(n+1)/2 prouvé PAR INDUCTION (à la main).
