  id: 0a7b3eba-e146-41c1-9708-6afb348acef1
  title: "sum-n-lean — Plan d'implémentation : scaffolding lake + Mathlib (cache), theorem 2*sumN n = n*(n+1) par induction + corollaire divisé"
  author: implementer
  created_at: "2026-06-06"
  project: sum-n-lean
  changelog:
    - date: "2026-06-06"
      author: implementer
      description: >
        TERMINÉ. Toutes les étapes exécutées avec succès. Couple de versions retenu :
        Lean leanprover/lean4:v4.30.0 dérivé de Mathlib v4.30.0 (tag stable, cache binaire
        publié). Scaffolding lake hors company-os dans /home/bibux/Compagny/sum-n-lean/
        (lakefile.toml avec require mathlib rev v4.30.0, lean-toolchain v4.30.0,
        SumNLean/Basic.lean, Makefile, README.md). lake update a déclenché automatiquement
        le cache get (8459 .olean depuis Azure) : aucune recompilation Mathlib. Théorème
        principal forme multipliée 2*sumN n = n*(n+1) prouvé par induction explicite (cas
        succ fermé par ring) ; corollaire divisé sumN n = n*(n+1)/2 dérivé hors induction
        par omega. `make verify` => "Build completed successfully (8477 jobs)" exit 0,
        0 sorry (confirmé `#print axioms` : propext + Quot.sound, aucun sorryAx ; sumN 100 =
        5050). Capitalisation : lesson-learned e0256a35 (premier retour Lean de CompanyOS,
        chaînée aux lessons Verus 475911ee et Creusot 8628f4b4). Légère divergence vs plan
        documentée dans la lesson : lake update fait déjà le cache get (le step 5 explicite
        devient un no-op idempotent), et le projet est une preuve pure (lean_exe/Main.lean
        retirés du squelette lake init).
  description: >
    Plan d'exécution concret du terrain de jeu Lean 4 sum-n-lean, dérivé du design-doc approuvé
    e24af522. Décline en étapes ordonnées et actionnables : (1) sonde lecture seule de
    l'environnement (which elan/lake/lean, paru -Ss elan) ; (2) install elan via paru, choix
    Mathlib-d'abord puis dérivation du lean-toolchain depuis Mathlib ; (3) scaffolding lake hors
    company-os (/home/bibux/Compagny/sum-n-lean/) avec require Mathlib ; (4) lake exe cache get
    AVANT lake build ; (5) écriture de la définition récursive sumN, du théorème principal en
    FORME MULTIPLIÉE 2*sumN n = n*(n+1) prouvé par induction explicite, et du corollaire divisé
    dérivé hors induction ; (6) Makefile (verify/build/help) ; (7) README ; (8) make verify vert,
    0 sorry. Points de fragilité explicités : couple version Lean<->Mathlib, disponibilité du
    cache binaire, division entière tronquée non additive sur Nat.
