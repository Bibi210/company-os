  changelog:
    - date: "2026-06-06"
      author: implementer
      description: >
        TERMINÉ (DONE). Plan exécuté de bout en bout. Toolchain Rust 1.95.0 installée via
        rustup (verus-bin + Z3 4.12.5 déjà présents via AUR). Projet créé dans
        /home/bibux/Compagny/sum-n-verus/ (Cargo.toml, src/main.rs, Makefile, README.md,
        .gitignore). `make verify` passe : 17 verified, 0 errors, avec --no-cheating (aucun
        assume/admit). `cargo build` compile sans warning. Borne overflow N_MAX=6_074_000_999
        vérifiée formellement par lemma_bound_fits (by compute). Lesson 475911ee créée
        (pièges nonlinear_arith parité + overflow accumulateur). Le schema implementation-plan
        n'ayant pas de champ status, l'état DONE est consigné ici.
    - date: "2026-06-05"
      author: implementer
      description: >
        Review round 23694be2 (Architect, request_changes) : ÉTAPE 4-d corrigée. Retrait de
        la valeur de borne chiffrée présentée à tort comme « vérifiée » alors qu'elle débordait
        u64 (référence trompeuse pour l'axe absence d'overflow). Remplacée par la MÉTHODE de
        calcul n_max = floor((-1+sqrt(1+8*(2^64-1)))/2), avec mention d'une borne ronde sûre
        en-dessous comme alternative acceptable, et l'exigence de ne poser aucun chiffre comme
        vérifié sans l'avoir réellement été.
