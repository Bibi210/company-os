metadata:
  id: 52c413d8-1584-4147-86b2-b1921bdd3e9a
  title: "sum-n-verus — Architecture : infrastructure de vérification Verus pour sum_n = n(n+1)/2"
  author: architect
  created_at: "2026-06-05"
  project: sum-n-verus
  description: >
    Architecture du terrain de jeu Verus sum-n-verus. Le coeur du design est
    l'INFRASTRUCTURE de compilation/vérification (scaffolding Cargo, Makefile avec
    cible verify, stratégie d'installation de la toolchain Verus sur Arch via paru),
    le contenu prouvé étant volontairement trivial : une fonction exec sum_n(n)
    itérative et sa preuve Verus que sum_n(n) == n*(n+1)/2 (formule fermée de Gauss).
    Tranche les types entiers et le domaine de n (borne overflow), la forme abstraite
    de la spec (anti-pattern "spec qui répète le code"), l'invariant de boucle clé
    et le variant de terminaison, la gestion de la division entière par 2 et de la
    non-linéarité, et la stratégie d'installation avec fallback et arrêt propre.
  tags:
    - rust
    - verus
    - formal-verification
    - playground
    - scaffolding
    - sum-n
    - toolchain
    - arch-linux
    - paru
