  project: sum-n-verus
  description: >
    Projet d'exercice minimal pour s'entraîner à la vérification formelle avec Verus.
    L'objectif principal n'est PAS le contenu fonctionnel (un simple sum_n) mais la mise
    en place de TOUTE l'architecture de compilation/vérification autour : scaffolding Cargo,
    Makefile avec cible verify, et installation de la toolchain Verus. Le code se réduit à
    une fonction sum_n itérative et à sa preuve Verus que sum_n(n) == n*(n+1)/2.
