    Interface terminal du jeu Puissance 4 : boucle de jeu, affichage de la grille, lecture
    du coup humain avec validation, orchestration des appels à game-core et ai-engine.
    Aucune logique de jeu ni preuve Verus dans cette couche — découplage strict de l'I/O.
