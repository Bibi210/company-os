spec:
  overview: >
    Puissance 4 Verus est un jeu Puissance 4 classique (grille 6 lignes x 7 colonnes,
    humain vs IA) dont la correction est partiellement prouvée par vérification formelle
    déductive via Verus. L'approche Proof-Driven Development (PDD) signifie que les
    spécifications formelles (requires/ensures/invariants) remplacent les tests unitaires
    pour les propriétés critiques.

    L'architecture se décompose en trois couches logiques indépendantes :
    - game-core : les règles du jeu, la grille, la détection de victoire
    - ai-engine : l'algorithme minimax avec élagage alpha-beta
    - cli-frontend : l'interface utilisateur terminal, découplée du game-core

    Principe PDD fondamental (lesson b2c68c30) : les preuves Verus sont tightly coupled
    au code exec. Elles vivent dans les mêmes unités de compilation que le code qu'elles
    spécifient, pas dans des modules de test séparés. Ce couplage garantit que la preuve
    et le code évoluent ensemble — un refactoring qui casse la preuve signale immédiatement
    un contrat violé. Les fonctions spec et proof sont erasées à la compilation (zéro coût
    runtime).

    Anticipation UI : game-core et ai-engine sont UI-agnostiques. Ils ne dépendent d'aucune
    primitive d'affichage ou d'I/O. Ce découplage permet d'ajouter une UI graphique future
    en remplaçant uniquement la couche cli-frontend, sans toucher à la logique vérifiée.

    Stratégie de vérification hiérarchique à 3 niveaux :
    - Niveau 1 (invariants structurels) : validité de la grille, légalité des coups, gravité
    - Niveau 2 (correction fonctionnelle) : soundness et completeness de la détection de victoire
    - Niveau 3 (propriétés algorithmiques) : légalité du coup IA, terminaison, bornes de score
    Les niveaux supérieurs dépendent des inférieurs — on ne peut pas prouver le niveau 3
    sans avoir d'abord prouvé les niveaux 1 et 2.

    Hors scope (par décision explicite) :
    - Preuve d'optimalité complète de l'IA (non bornée) : trop lourde, non réalisable avec Z3
    - Interface graphique : itération future, l'architecture l'anticipe sans la construire
    - Mode multijoueur réseau et persistance des parties

  components:
    - name: "game-core — Représentation de la grille"
      description: >
        La grille est un tableau 6 lignes x 7 colonnes. Chaque cellule a un type énuméré :
        vide, joueur1, ou joueur2 (et non un entier 0/1/2). La grille est le seul état
        mutable du jeu — tout le reste (état de partie, joueur courant) en est dérivé.

        Choix du type énuméré : un type énuméré borne les valeurs par construction et
        élimine les états invalides (pas de valeur "3" possible). Le compilateur Rust garantit
        cet invariant avant même que Verus intervienne — c'est le niveau 0 de vérification.

        Propriétés prouvables (Niveau 1) : après toute séquence de coups légaux, la grille
        contient uniquement des valeurs vides/joueur1/joueur2. La taille reste 6x7.
        L'arithmétique sur les indices bornés (0-5 pour les lignes, 0-6 pour les colonnes)
        est nativement gérée par Z3.

    - name: "game-core — Modèle de coup et gravité"
      description: >
        Un coup est joué dans une colonne donnée (0 à 6). La gravité est appliquée
        automatiquement : le jeton tombe à la case la plus basse disponible dans cette
        colonne. Un coup est légal si et seulement si la colonne est non pleine (moins de
        6 jetons).

        Encapsuler la gravité dans le modèle de coup garantit qu'aucun code ne peut placer
        un jeton "en l'air". La légalité devient une pré-condition (requires) prouvable pour
        toute fonction qui applique un coup.

        Propriétés prouvables (Niveau 1) :
        - Légalité : un coup en colonne c est légal ssi le nombre de jetons en c < 6
        - Gravité : après un coup légal en c, le jeton est à la case la plus basse ; aucune
          cellule vide n'existe sous un jeton dans la même colonne (implication sur indices bornés)
        - Alternance : le joueur courant est déterminé par la parité du nombre de coups joués
          (arithmétique modulo 2)

    - name: "game-core — Détection de victoire"
      description: >
        Détection de victoire dans les 4 directions : horizontal, vertical, diagonale NE,
        diagonale SE. Un joueur gagne s'il a 4 jetons consécutifs dans au moins une direction.
        La détection est un prédicat pur (pas d'effet de bord) — prouvable directement.

        Propriétés prouvables (Niveau 2, les plus importantes du game-core) :
        - Soundness : si détection retourne victoire pour P, alors il existe 4 cellules
          consécutives du joueur P dans une direction. Post-condition existentielle sur domaine
          fini — accessible au solveur SMT.
        - Completeness : si 4 cellules consécutives de P existent dans une direction, alors
          la détection retourne victoire pour P. Implication inverse de la soundness.

        Point de friction anticipé (lesson b2c68c30, piège "opacité") : la fonction de
        détection doit être reveal-ée dans les lemmes qui l'utilisent. Stratégie : prouver
        la soundness et la completeness direction par direction (4 lemmes séparés) pour
        éviter les timeouts SMT. Chaque lemme utilise des assertions intermédiaires comme
        checkpoints.

    - name: "game-core — État de la partie"
      description: >
        L'état de la partie (en cours / victoire joueur1 / victoire joueur2 / match nul) est
        calculé à la demande depuis la grille courante. Il n'est pas stocké comme un champ
        séparé de la structure de jeu.

        Décision architecturale : maintenir un état séparé en parallèle de la grille crée un
        invariant de cohérence supplémentaire à prouver ("l'état stocké correspond bien à
        l'état calculé"). Calculer depuis la grille élimine cet invariant par construction.
        L'état ne peut pas être incohérent avec la grille si l'état n'a pas de représentation
        propre.

    - name: "ai-engine — Minimax avec élagage alpha-beta"
      description: >
        L'IA utilise l'algorithme minimax récursif avec élagage alpha-beta. Le joueur
        maximisant (IA) cherche le coup qui maximise le score minimal garanti à l'adversaire.
        La récursion est bornée par une profondeur D configurable (minimum D=4).

        La profondeur bornée est un choix délibéré qui rend la terminaison prouvable.
        Un minimax complet sur Puissance 4 ne termine pas en temps raisonnable (facteur de
        branchement ~7, profondeur ~42 coups). La profondeur bornée est le seul moyen de
        prouver la terminaison avec un variant de boucle (decreases depth) compréhensible
        par Z3.

        L'élagage alpha-beta est une optimisation de performance séparable : on prouve d'abord
        la correction de minimax sans élagage, puis on prouve que l'élagage retourne le même
        score (optimisation correcte). Cette séparabilité simplifie la stratégie de vérification.

        Propriétés prouvables (Niveau 3) :
        - Légalité : l'IA retourne toujours un coup légal (colonne non pleine), en s'appuyant
          sur la définition de légalité du game-core (Niveau 1)
        - Terminaison : le variant decreases(depth) décroît strictement ; la preuve peut aussi
          utiliser le nombre de cellules vides comme mesure auxiliaire pour les cas terminaux
        - Bornes de score : le score retourné est dans [min_score, max_score] — prouvé par
          récurrence structurelle sur la profondeur, en s'appuyant sur la post-condition bornée
          de la fonction heuristique

        Ce qu'on ne prouve pas : l'optimalité complète et la qualité de la heuristique.
        L'optimalité relève de l'arbre de jeu entier (hors scope). La qualité de la
        heuristique (l'IA joue-t-elle intelligemment ?) relève de l'évaluation empirique.

    - name: "ai-engine — Fonction d'évaluation heuristique"
      description: >
        Fonction d'évaluation pour les états non-terminaux (profondeur D atteinte sans
        victoire ni match nul). La heuristique évalue la "qualité" d'une position en
        comptant les alignements partiels, les menaces, et le contrôle du centre.

        Contrainte de conception critique : la heuristique doit retourner un score dans un
        intervalle borné [min_score, max_score]. Les scores de victoire/défaite sont des
        constantes sentinel strictement en dehors de cet intervalle. Cette distinction permet
        à la preuve de bornes du minimax de savoir si un score vient d'un état terminal ou
        d'une évaluation heuristique.

        Point de friction anticipé (lesson b2c68c30, piège "non-linéarité") : la heuristique
        peut impliquer des pondérations (multiplication longueur d'alignement x poids).
        Stratégie : décomposer en somme de sous-scores linéaires, ou remplacer les
        multiplications par des lookup tables de constantes. Cela évite l'arithmétique
        non-linéaire qui résiste au solveur SMT.

    - name: "cli-frontend — Interface terminal découplée"
      description: >
        La CLI affiche la grille, lit les coups de l'humain, et orchestre la boucle de jeu.
        Elle ne contient aucune logique de jeu — elle délègue entièrement à game-core et
        ai-engine via leurs interfaces publiques.

        Le découplage strict (game-core et ai-engine ne dépendent d'aucune primitive I/O)
        a trois bénéfices :
        1. Prouvabilité : Verus ne peut pas raisonner sur les effets I/O ; les preuves ne
           doivent pas croiser la couche I/O
        2. Testabilité : game-core et ai-engine peuvent être évalués sans terminal
        3. Extensibilité : une UI future (graphique, web) remplace la CLI sans modifier la
           logique vérifiée — condition architecturale pour l'évolution future

  decisions:
    - decision: >
        AD-01 — Preuves Verus tightly coupled au code exec.
        Les fonctions spec, proof, requires et ensures vivent dans les mêmes unités de
        compilation que le code exec qu'elles spécifient. Pas de module "proofs" séparé.
      rationale: >
        Un refactoring qui casse une preuve révèle immédiatement une violation de contrat.
        Si les preuves étaient dans un module séparé, il serait possible de modifier le code
        sans mettre à jour les preuves (drift silencieux). Le couplage fort est une feature :
        il garantit la cohérence preuve/code en permanence. Alternatives écartées : module
        de preuves séparé (risque de drift), tests unitaires à la place (couvre seulement
        des cas finis).

    - decision: >
        AD-02 — Profondeur bornée pour l'IA (minimum D=4).
        Le minimax utilise une profondeur bornée D configurable. La terminaison est prouvée
        via le variant decreases(depth).
      rationale: >
        Un minimax complet ne termine pas en temps raisonnable sur Puissance 4. La profondeur
        bornée est le seul moyen de rendre la terminaison prouvable avec un solveur SMT.
        D=4 est le minimum exigé par la task-request pour la preuve d'optimalité bornée.
        Alternatives écartées : minimax complet (non-terminaison en pratique, preuve
        impossible), MCTS (non-déterministe, non prouvable formellement).

    - decision: >
        AD-03 — État de partie calculé depuis la grille (pas de champ séparé).
        L'état de la partie (en cours / victoire / match nul) est recalculé à la demande
        depuis la grille courante à chaque appel.
      rationale: >
        Maintenir un état séparé crée un invariant de cohérence supplémentaire à prouver.
        Calculer l'état depuis la grille élimine cet invariant par construction — l'état ne
        peut pas être incohérent si il n'a pas de représentation propre. Alternative écartée :
        état stocké séparément (invariant de cohérence coûteux et fragile à prouver).

    - decision: >
        AD-04 — Type cellule énuméré (vide/joueur1/joueur2) plutôt qu'entier.
        Chaque cellule de la grille a un type énuméré à 3 variants, pas un entier u8.
      rationale: >
        Un entier permet des valeurs hors domaine (3, -1, overflow). Un type énuméré borne
        les valeurs par construction — Verus n'a pas besoin de vérifier que la valeur est
        dans l'ensemble {0,1,2} à chaque utilisation. C'est le niveau de vérification le
        plus simple : le compilateur Rust garantit cet invariant avant même que Verus
        intervienne. Alternative écartée : entier u8 (valeurs hors domaine possibles,
        invariant à prouver partout dans les specs).

    - decision: >
        AD-05 — Séparation stricte en 3 couches : game-core, ai-engine, cli-frontend.
        game-core et ai-engine sont des composants purs sans dépendance vers la CLI ou
        tout primitif I/O. cli-frontend est la seule couche qui interagit avec l'I/O.
      rationale: >
        Le découplage I/O est la condition pour que les preuves Verus soient possibles (pas
        de raisonnement sur les effets de bord), que la logique soit testable sans terminal,
        et que la CLI soit remplaçable par une UI future sans modifier la logique vérifiée.
        Alternative écartée : architecture monolithique (preuves impossibles avec I/O mélangé).

    - decision: >
        AD-06 — Stratégie de vérification hiérarchique à 3 niveaux.
        Les preuves sont organisées en 3 niveaux dépendants : invariants structurels (N1),
        correction fonctionnelle (N2), propriétés algorithmiques (N3). Les preuves de N2
        dépendent de N1, les preuves de N3 dépendent de N1 et N2.
      rationale: >
        La hiérarchie garantit que les fondations (grille valide, coups légaux) sont prouvées
        avant les propriétés de plus haut niveau (victoire correcte, IA légale). Cela suit
        les recommandations de la lesson b2c68c30 : preuves modulaires, opacité par défaut,
        reveal sélectif. Une preuve de niveau supérieur ne devrait jamais avoir besoin de
        "voir" les détails d'implémentation des niveaux inférieurs — seulement leurs
        post-conditions.

  open_questions:
    - >
      Timeout SMT sur la completeness de la détection de victoire : la preuve de completeness
      implique un universel sur un domaine fini (toutes positions 6x7). Z3 peut timeout si
      la preuve n'est pas décomposée. L'implémenteur devra valider empiriquement que la
      décomposition direction par direction (4 lemmes) est suffisante.
    - >
      Profondeur D minimale pour l'optimalité bornée : la task-request exige que l'IA "ne
      perd jamais quand elle joue en premier" à D >= 4. Cette propriété est une conjecture
      empirique sur Puissance 4 — elle n'est pas prouvée théoriquement ici. La preuve
      formelle la capture à la profondeur D choisie, pas pour toutes profondeurs.
    - >
      Variant de terminaison du minimax : decreases(depth) est le variant principal, mais
      si l'implémenteur ajoute une détection précoce d'états terminaux dans la récursion,
      le variant devra peut-être combiner depth et le nombre de cellules vides restantes.
      À clarifier lors de la rédaction de l'implementation-plan.
