  title: "Puissance 4 Verus — Architecture PDD (Proof-Driven Development)"
  author: architect
  created_at: "2026-03-15"
  project: puissance4-verus
  description: >
    Design architectural du jeu Puissance 4 en Rust avec vérification formelle Verus.
    Architecture en 3 couches (game-core / ai-engine / cli-frontend), où les preuves Verus
    sont tightly coupled à l'implémentation (PDD). Définit les composants, leurs contrats,
    la stratégie de vérification hiérarchique, et les décisions architecturales clés.
