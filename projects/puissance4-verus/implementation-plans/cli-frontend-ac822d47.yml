  author: implementer
  created_at: "2026-03-15"
  project: puissance4-verus
  description: >
    Plan d'implémentation de cli-frontend : interface terminal jouable, affichage de la
    grille, lecture du coup humain avec validation, boucle de jeu complète, et point
    d'entrée main(). Aucune preuve Verus (AD-CLI-02). Dépend de game-core et ai-engine.
    À exécuter APRÈS les implementation-plans game-core et ai-engine.
