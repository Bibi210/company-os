  description: >
    Plan méta-transversal qui définit les conventions Verus applicables à tous les modules
    du projet : structure de fichier, commentaires de section obligatoires, nommage des lemmes,
    et points de validation cargo verus dans le workflow global. Ne crée pas de fichiers de
    code — produit une référence normative consultée avant chaque implémentation.
