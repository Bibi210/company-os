api_version: companyos/v1
kind: diagnostic-report
metadata:
  id: 04b06ad9-cb50-4c27-a9ba-128ffaff8ddf
  title: "Mesure empirique de la dérive roadmap 329da45f vs réel, et état du data model d'indexation des roadmaps"
  author: architect
  created_at: "2026-06-05"
  project: company-os
  description: >
    Investigation cadrée par le task-request e8c4d628. Mesure
    empiriquement de combien d'items de la roadmap companyos-system
    (329da45f) ont dérivé de la vérité des artifacts sources AVANT la
    mise à jour manuelle d'aujourd'hui, et analyse le pipeline
    d'indexation actuel des roadmaps (engine.rs, db.rs,
    roadmap_summary.rs) pour situer où l'auto-sync devra vivre. Établit
    le constat structurel central : la table `artifacts` indexée ne
    porte PAS de colonne `status`, donc le mapping rfc->status ne peut
    pas se faire par simple lecture de l'index ; il faut soit lire le
    YAML source soit matérialiser le status. Découvre aussi une seconde
    dérive non anticipée : les RFCs sources eux-mêmes sont stale
    (approved alors que mergés), ce qui change la nature du problème.
  tags:
