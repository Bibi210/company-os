metadata:
  id: 578de044-cd26-4202-ad52-33d9e0f809c0
  title: "Root cause des SIGABRT de l'orchestrator servi : panic sur écriture stderr (EPIPE) puis double panic et panic_in_cleanup, PAS un destructeur rusqlite ou ort"
  author: implementer
  created_at: "2026-09-14"
  project: company-os
  description: >
    Investigation D2 du RFC 5bacb08a, livrée pendant la phase 3 du chantier.
    La root cause des SIGABRT récurrents du binaire orchestrator servi est
    IDENTIFIÉE et confirmée par deux sources indépendantes : les traces
    pré-unwind écrites par le panic hook livré en phase 1, qui donnent le
    message du panic ORIGINEL, et les core dumps analysés à gdb, qui donnent
    le mécanisme d'abort. Le panic originel est
    « failed printing to stderr: Broken pipe (os error 32) », levé par la
    bibliothèque standard dans std::io::stdio quand le lecteur du tube
    stderr a disparu. Pendant l'unwind, la machinerie de panic réécrit sur
    stderr, reprend EPIPE, repanique, et core::panicking::panic_in_cleanup
    abort le process : SIGABRT. L'hypothèse du diagnostic ccd7c984, qui
    soupçonnait un destructeur rusqlite (Statement, Transaction) ou une
    valeur ort/ONNX, est RÉFUTÉE. Le chemin reindex n'est pas la cause mais
    l'amplificateur : c'est le moment où le serveur écrit le plus sur
    stderr, donc celui où il rencontre le tube fermé.
  tags:
    - mcp
    - orchestrator
    - sigabrt
    - double-panic
    - root-cause
    - epipe
    - stderr
    - coredump
    - critical-infra
