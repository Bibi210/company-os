  description: >
    Recensement exhaustif et triage item par item du domaine 1 (v1-hygiene)
    du programme companyos-v1. Statue sur les 6 RFCs en status approved
    jamais passés implemented, sur les 11 task-requests en backlog du projet
    company-os, et vérifie l'archivage des projets de test. Droit de tri
    délégué aux agents (décision utilisateur 2026-06-10). Tous les items
    vérifiés contre l'état réel du code/config/git, pas contre les statuts
