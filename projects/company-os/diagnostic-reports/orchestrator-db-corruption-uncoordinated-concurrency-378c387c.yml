metadata:
  id: 378c387c-7e25-4abd-8ccd-5bb7b4d82449
  title: "Corruption récurrente de la DB orchestrator : concurrence non coordonnée entre N ouvertures WAL + absence de graceful shutdown"
  author: architect
  created_at: "2026-05-27"
  description: >
    Investigation de la corruption récurrente de
    company/data/orchestrator.db rapportée par le PM dans le
    task-request ffb85fc7. PRAGMA integrity_check remonte des erreurs
    structurelles graves (rowids out-of-order, btreeInitPage error 11,
    pages "never used", invalid page number, doubles références à des
    pages). Investigation conduite par reproduction empirique (6
    scénarios scriptés exécutés sur des copies de la baseline saine)
    et lecture du code (crates/orchestrator/src/db.rs,
    crates/mcp-servers/orchestrator/src/main.rs,
    company/plugins/defense-in-depth-core.mjs,
    company/plugins/mcp-proxy.mjs, RFC d9399863). La cause racine
    identifiée est structurelle : trois familles de processus
    distincts ouvrent indépendamment la DB SQLite en mode WAL sans
    coordination explicite, et le binaire serveur n'a aucun mécanisme
    de graceful shutdown — ce qui rend le SIGKILL utilisé par le proxy
    résilient (RFC d9399863) potentiellement destructeur. Le correctif
    nécessite un changement structurel de la stratégie de persistence
    et fait donc l'objet du RFC cdbfee72 et du design-doc 45c04902.
  tags:
    - orchestrator
    - sqlite
    - wal
    - corruption
    - persistence
    - concurrency
    - critical-infra
