metadata:
  id: 5e1e6b0b-cf93-48bd-aba3-1e9648a17ca4
  title: "make ci rouge : les tests git-based héritent de commit.gpgsign=true global, pinentry timeout"
  author: architect
  created_at: "2026-07-11"
  project: company-os
  description: >
    Depuis la réactivation de la signature GPG dans ~/.gitconfig (commit.gpgsign=true),
    les 13 tests git-based de crates/mcp-servers/orchestrator/src/main.rs
    (test_seal_db_commit_*, test_grant_*, test_consume_*) échouent : les dépôts git
    temporaires qu'ils créent héritent de la config GLOBALE de l'utilisateur, git commit
    déclenche gpg → pinentry sans TTY → timeout. make ci est rouge sur HEAD, donc le
    pre-commit hook (qui lance make ci) bloque TOUT commit. Même classe que la lesson
    1afcbe17 (fuite d'environnement git vers les processus enfants) : ici la fuite passe
    par la CONFIG (~/.gitconfig, config système) et non par les variables GIT_* déjà
    neutralisées par le fix 916bf1d. Le harness mjs du plugin defense-in-depth
    (gitCommitDb, exécuté par make test-js, lui aussi dans make ci) a la même faille.
