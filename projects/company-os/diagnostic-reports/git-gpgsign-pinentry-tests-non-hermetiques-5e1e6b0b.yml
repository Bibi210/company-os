spec:
  symptom: >
    make ci est rouge sur HEAD ; le pre-commit hook bloque par conséquent tout commit du
    dépôt (incluant le commit du fix lui-même : cycle hotfix requis). Les 13 tests
    git-based de l'orchestrator MCP (test_seal_db_commit_ok_returns_hash,
    test_grant_write_permit_* et test_grant_*, test_consume_*) échouent par timeout.
    Reproduction minimale confirmée hors cargo : dans un dépôt git fraîchement init en
    tempdir avec identité locale posée, `timeout 10 git commit -q -m test` sort en
    exit=124 (pendu sur pinentry). `git config --global commit.gpgsign` retourne true.
  root_cause: >
    Les helpers de test qui spawnent git ne sont pas hermétiques contre la config
    utilisateur. Trois surfaces, toutes dans la classe de la lesson 1afcbe17 (un
    processus qui spawn git doit être hermétique contre l'environnement ambiant) :

    (1) Helpers Rust du module tests de crates/mcp-servers/orchestrator/src/main.rs :
    fn git() (L2225), init_git_repo() (L2240) et deux invocations inline `git show`
    (L2326, L2418) ne posent ni GIT_CONFIG_GLOBAL ni GIT_CONFIG_SYSTEM. Le git commit
    d'init_git_repo hérite de ~/.gitconfig : commit.gpgsign=true → gpg → pinentry sans
    TTY dans le contexte cargo test → blocage/timeout. L'identité (user.name/email) est
    déjà posée en config locale, mais gpgsign, hooksPath et tout autre réglage global
    fuient.

    (2) Code de PRODUCTION seal_db_commit (main.rs L527, introduit par le RFC 359f9162) :
    le `git commit` de scellement hérite lui aussi de la config utilisateur. Les tests
    l'exercent in-process, donc même un fix limité aux helpers (1) ne suffirait que via
    la config locale du repo temporaire ; et en réel, un grant_write_permit exécuté avec
    commit.gpgsign=true depuis le serveur MCP headless (pinentry inaccessible) bloque le
    commit de seal en tenant l'engine lock, puis échoue → grant refusé (rollback
    correct, mais tool inutilisable dans l'environnement actuel).

    (3) Harness mjs company/plugins/tests/defense-in-depth-core.test.mjs : gitCommitDb()
    (L129) fait git init + git commit via execSync sans isolation de config → même
    blocage dans make test-js, également membre de make ci.

    Le problème était LATENT depuis l'écriture de ces tests : masqué parce que la
    signature GPG avait été temporairement désactivée pendant le lot 2 (make ci vert
    alors), révélé à sa réactivation. Le fix 916bf1d (lesson 1afcbe17) ne couvrait que
    les variables GIT_* exportées par les hooks, pas le canal config.
  resolution: >
    RFC hotfix 324e8a33 (draft, cycle rapide) : (a) hermétisation de TOUS les spawns git
    des tests (Rust et mjs) via GIT_CONFIG_GLOBAL=/dev/null + GIT_CONFIG_SYSTEM=/dev/null
    + identité locale + commit.gpgsign=false explicite en config locale du repo
    temporaire ; (b) décision prod tranchée : le commit de seal machine de
    seal_db_commit passe en `-c commit.gpgsign=false` (les commits de seal ne portent
    aucune garantie par signature — le hook defense-in-depth compare le CONTENU de la DB
    en HEAD, pas les signatures — et l'atomicité/disponibilité du grant prime sur une
    signature que personne ne vérifie). Les commits humains restent signés, aucun autre
    comportement prod modifié. NOTE : ce diagnostic et le RFC ne peuvent pas être
    commités tant que make ci est rouge (le pre-commit lance make ci) ; ils seront
    commités avec/après l'implémentation du fix.
  status: resolved
