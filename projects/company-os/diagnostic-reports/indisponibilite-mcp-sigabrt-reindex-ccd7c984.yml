kind: diagnostic-report
metadata:
  id: ccd7c984-eb4b-4d69-90bb-c7a8980b5169
  title: "Indisponibilité MCP >120s le 2026-09-09 : SIGABRT double-panic du reindex, non-récupération ~4 min malgré l'architecture 18011bfc, reboot manuel requis"
  author: pm
  created_at: "2026-09-09"
  project: company-os
  description: >
    Incident de disponibilité MCP du 2026-09-09 (~08:54-08:58 UTC) : le serveur
    orchestrator (binaire servi target/serve/) meurt par SIGABRT (double panic
    dans le task tokio du file watcher pendant l'auto-reindex d'un design-doc),
    puis le proxy ne parvient pas à le ramener à l'état ready pendant ~4 minutes
    (hypothèse dominante : boucle de kill par health-check 10s pendant une
    fenêtre de boot lent). Le plafond de readiness -32050 du RFC 18011bfc a
    fonctionné comme conçu (escalade propre, at-most-once respecté), mais
    l'intention du RFC ("aucune panne de processus ne requiert plus d'humain")
    n'a pas été tenue : reboot manuel de session nécessaire. Root cause du
    crash établie par gdb sur core dump ; séquence de respawn irrécouvrable
    faute de logs persistés (stderr proxy et serveur perdus dans un socket
    opencode non persisté). 20 coredumps companyos recensés à la fin de la
    journée, dont 2 SIGABRT du binaire servi le 25/08 absorbés silencieusement
    et DEUX RÉCIDIVES le 09/09 même (09:24:56 et 09:39:44 UTC) qui confirment
    le pattern déclencheur : écriture YAML → auto-reindex → crash.
  tags:
