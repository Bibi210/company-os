api_version: companyos/v1
kind: diagnostic-report
metadata:
  id: 9534dd33-313c-42d7-b6ac-3801ba97dbc7
  title: "File watcher orchestrator mort au boot : disjoint capture en edition 2024 drop le RecommendedWatcher avant la première iteration"
  author: architect
  created_at: "2026-06-03"
  project: company-os
  description: >
    Diagnostic du bug rapporté par task-request 36ecb829 : index_status retourne
    file_watcher_alive: false en permanence, et lsof confirme l'absence totale de
    fd inotify dans le serveur. Root cause identifiée et empiriquement vérifiée
    par reproduction isolée : un effet de bord de la "disjoint capture for async
    closures" stabilisée en Rust edition 2024 fait que le champ _watcher
    (préfixé par _ donc non utilisé textuellement dans le corps de la closure)
    n'est PAS capturé par le `async move` de la consumer task, et est dropé à la
    fin du match arm. Le fd inotify est libéré, le thread notify est signalé,
    le notify_rx du forward task retourne None, le consumer task termine, et
    le drop guard remet watcher_alive à false. Le tout sans aucun message
    d'erreur dans les logs.
  tags:
    - watcher
    - inotify
    - notify-crate
    - rust-edition-2024
    - disjoint-capture
    - async-move
    - drop-semantics
    - regression
    - critical-infra
  related:
    - id: 36ecb829-d884-4e17-848b-c0f7ee2fc171
