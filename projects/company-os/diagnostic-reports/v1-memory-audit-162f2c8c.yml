metadata:
  id: 162f2c8c-e325-407e-b91b-0616a8dc4be4
  title: "Audit V1 de la mémoire : recensement complet des 52 lessons-learned (doublons, obsolètes, chaînage, métadonnées)"
  author: architect
  created_at: "2026-06-10"
  project: company-os
  description: >
    Domaine 2 du programme companyos-v1 (roadmap a410bb43, item
    v1-memory-audit, task-request 55b8ecc0). Passe complète sur les 52
    lessons de company/lessons/ : chaque lesson lue intégralement et classée
    (saine / doublon / obsolète / chaînage manquant / métadonnées faibles),
    puis corrections appliquées. Résultat : 36 saines, 11 marquées
    obsolètes (totales ou partielles, mention dans description avec
    référence au RFC implemented qui les périme), 1 doublon supersedé
    in-place, 6 chaînes related posées. Aucune lesson supprimée, aucun
    contenu factuel historique réécrit. Aucune lesson consolidée nouvelle
    n'a été nécessaire : le seul cluster doublon (autonomie PM) possédait
    déjà sa consolidation de fait (lesson 42ef0378).
