api_version: companyos/v1
kind: diagnostic-report
metadata:
  id: f82847f1-7ee2-4fc7-a4f5-a1685a62c152
  title: "Pre-commit hook bloque tout commit malgré make ci vert : fuite GIT_* du commit parent vers cargo test"
  author: implementer
  created_at: "2026-06-10"
  description: >
    Pendant la finalisation de l'implementation-plan du RFC 8bf78218
    (plan 4b56b1b9), le pre-commit hook a refusé systématiquement tous les
    commits avec "CI pipeline failed", alors que make ci exécuté à la main
    était intégralement vert. Investigation : le hook exporte involontairement
    l'environnement git du commit en cours (GIT_INDEX_FILE, GIT_DIR, etc.)
    vers le cargo test lancé par make ci ; les tests git-based de l'orchestrator
    MCP, qui créent des dépôts git jetables en tempdir, opéraient alors sur
    l'index du dépôt EXTERNE. Corrigé à la source par sanitization de
    l'environnement au point de fuite (le hook), commit 916bf1d.
  tags:
    - pre-commit
    - git
    - hermeticite
    - environment-leak
    - ci
    - harness
    - companyos-internals
    - critical-infra
