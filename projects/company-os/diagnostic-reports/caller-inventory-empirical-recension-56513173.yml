metadata:
  id: 56513173-dfc6-4c9b-b150-b84e921eeecf
  title: "Recensement empirique des callers oubliés dans les RFCs touchant une API publique de crate"
  author: architect
  created_at: "2026-06-05"
  project: company-os
  description: >
    Investigation préalable au task-request dabc159c. Recense les
    occurrences documentées où un RFC modifiant une signature d'API
    publique de crate (fonction OU type) a omis un caller, le coût
    de cette omission, l'étape à laquelle elle a été détectée, et
    l'état de l'outillage disponible aujourd'hui pour produire un
    inventaire exhaustif des callers AVANT cargo build. Inclut le
    sanity-check rétroactif (acceptance criterion 6 du task-request) :
    le mécanisme proposé par le RFC eb42a8de aurait-il détecté les
    deux callers oubliés ?
