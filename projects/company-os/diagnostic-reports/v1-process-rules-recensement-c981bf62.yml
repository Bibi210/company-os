metadata:
  id: c981bf62-9d53-4ea2-8da3-c34af9d3e922
  title: "Recensement V1 des règles de process : 62 règles classées (mécanisées, mécanisables, prose, mortes) au test clean-company"
  author: architect
  created_at: "2026-06-10"
  project: company-os
  description: >
    Phase 1 du domaine v1-process-hardening (task-request 11f13a9d, roadmap
    a410bb43). Recensement exhaustif des règles de process en prose :
    shared-rules.yml (14 règles + artifact_catalog), review-protocol.yml (4),
    flow-control.yml (3), human-review-triggers.yml (4 triggers), et les
    rules des 4 personas (36 entrées). Total 62 règles, chacune classée au
    test clean-company (survivrait-elle à l'effacement de la mémoire YAML ?) :
    10 déjà mécanisées, 16 mécanisables (mécanisme concret + couche + coût
    proposés), 33 intrinsèquement prose, 3 mortes (budget_limits,
    circuit_breaker, escalation_rules dupliquées/jamais lues). Priorisation
    en 3 lots ; le lot 1 (6 mécanismes coût S, serveur Rust + schema) ferme
    les violations observées : consume-avant-commit du 2026-06-10,
    approve+findings, self-review non gardée, grant sans RFC approved.
