api_version: companyos/v1
kind: diagnostic-report
metadata:
  id: fa9bd072-a132-4a37-8163-1895f531f723
  title: "Freeze MCP perçu après reload_config : saturation CPU du serveur orchestrator par le thread-pool ONNX (fastembed) en spin-wait, pas une coupure"
  author: architect
  created_at: "2026-06-04"
  project: company-os
  description: >
    Investigation du symptôme « la session MCP s'est figée/coupée après
    reload_config() » rapporté par l'utilisateur. Investigation conduite par
    lecture du code réel (reload_config dans crates/mcp-servers/orchestrator/src/main.rs,
    CompanyConfig::load, set_max_iterations, migrate(), reindex_all,
    embedding.rs/fastembed) et observation empirique des processus en cours
    (ps/proc sur le serveur 90269 vivant). Conclusion : reload_config() N'EST
    PAS la cause directe (il ne touche ni la DB, ni migrate(), ni le watcher,
    et il répond reloaded:true à l'instant du diagnostic). La cause du freeze
    perçu est une SATURATION CPU soutenue du binaire serveur (~600% CPU sur 16
    cœurs, ~50 threads, spin-wait quasi sans context switches) due au thread-pool
    intra-op d'ONNX Runtime (backend de fastembed) laissé en configuration par
    défaut. reload_config a servi de RÉVÉLATEUR : il acquiert le même
    tokio::Mutex de l'engine que le reindex_all de boot/watcher (qui ré-embed
    les 123 artifacts), donc tout appel qui tombe pendant une fenêtre de
    contention voit une latence telle qu'opencode la perçoit comme un freeze.
    Le fix structurel relève de la PISTE B (intervention côté binaire Rust) et
    fera l'objet d'un RFC dédié (non rédigé dans cette tâche).
  tags:
    - mcp
    - orchestrator
    - reload-config
    - fastembed
    - onnxruntime
    - cpu-saturation
    - spin-wait
    - lock-contention
    - performance
    - critical-infra
