metadata:
  id: 79f13f30-af1a-453e-9b42-962c35f93d26
  title: "Disponibilité MCP : root cause des coupures définitives — proxy suicidaire (circuit breaker sans réarmement), non supervisé, exécutant le binaire de build"
  author: architect
  created_at: "2026-07-02"
  project: company-os
  description: >
    Investigation root cause du task-request 415c73c0 (3 coupures MCP en 24h,
    chacune résolue par un reboot manuel de session). Conduite par lecture du
    code réel (company/plugins/mcp-proxy.mjs, company/config/opencode.json,
    Makefile, .githooks/pre-commit via f82847f1) et recoupement des 4
    diagnostics antérieurs (e84b641d, fa9bd072, 95ee5480, f82847f1).
    Conclusion : l'état "définitivement mort nécessitant un humain" est
    atteignable par DEUX mécanismes distincts du proxy (suicide par
    process.exit(1) du circuit breaker sans réarmement, et zombie par
    spawn-error non traité comme événement de cycle de vie), déclenchés
    systématiquement parce que le binaire servi EST le binaire de build que
    make ci relink à chaque commit, et irréversibles parce que personne ne
    supervise le proxy. La compensation actuelle (règle de prose mcp_reconnect,
    sleeps + retries LLM) est du polling inopérant dans les deux modes
    terminaux. Recommandation : combiner séparation build/exécution
    (déploiement atomique), supervision sans abandon définitif, et readiness
    événementielle permettant la suppression de mcp_reconnect.
  tags:
    - companyos-v1
    - mcp
