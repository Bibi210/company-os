api_version: companyos/v1
kind: diagnostic-report
metadata:
  id: 6cfd1c62-cbf1-4941-90e1-a0886a9e551c
  title: "Recherche faible dans la mémoire collective : profil du corpus, baseline FTS5 et inventaire des causes de faux négatifs"
  author: architect
  created_at: "2026-06-01"
  description: >
    Investigation cadrée par le task-request 02c9f6eb. Le tool MCP
    search() retourne massivement zéro résultat sur des queries
    pertinentes alors que le corpus contient effectivement les
    artifacts cherchés. Le diagnostic mesure le profil empirique
    du corpus (84 artifacts, 12 kinds, ~650KB de contenu indexé,
    bilingue FR+EN), confirme les trois queries symptôme du
    task-request comme représentatives d'un problème structurel,
    décompose la cause racine en six facteurs indépendants
    cumulatifs (sémantique vs lexical, AND implicite FTS5, absence
    de stemming, fragilité aux opérateurs, tokenisation des
    identifiants, dépendance au file watcher), et établit la
    baseline de latence (FTS5 < 2ms warm sur corpus actuel) qui
    laisse une marge confortable pour ajouter une couche
    sémantique. Diagnostic clos, prêt à driver le design-doc
    f433fefc et le RFC bdee1af4.
  tags:
    - search
    - retrieval
    - fts5
    - sqlite
    - memory
    - baseline
    - false-negatives
    - critical-infra
