api_version: companyos/v1
kind: diagnostic-report
metadata:
  id: c2a64134-a9b4-488c-bc4a-3123ac3dd491
  title: "Audit V1 des 14 schemas JSON : recensement schema par schema (champs morts, laxismes, verrous manquants, incohérences _base), vérifié contre les 204 artifacts du corpus"
  author: architect
  created_at: "2026-08-14"
  project: company-os
  description: >
    Phase d'analyse du domaine v1-schemas-audit (task-request ceb26109,
    roadmap a410bb43, programme companyos-v1). Passe cohérente sur les
    14 schemas de company/schemas/ (_base + 13 kinds), chaque durcissement
    candidat VÉRIFIÉ contre le corpus réel (204 artifacts YAML validés via
    le crate companyos-validation, parité exacte avec le validator de
    production, jsonschema 0.29.1 Draft 2020-12). Résultats : le support
    de unevaluatedProperties par jsonschema 0.29.1 est prouvé empiriquement
    (à travers allOf + $ref externe, la structure exacte du validator),
    ce qui permet de fermer metadata et la racine de chaque kind schema ;
    _base est restructuré autour de $defs partagés (date, timestamp, slug,
    persona_id, artifact_kind, uuid, metadata) ; les champs serveur
    approved_at / implemented_at des RFCs, posés par close_review_round et
    rfc_set_implemented depuis le début, n'ont JAMAIS été déclarés au
    schema rfc (incohérence _base/spécialisation résolue) ; 6 fichiers du
    corpus portent des champs spec hors-schema à migrer (verbatims dans le
    RFC associé) ; le stock est conforme à tous les autres durcissements
    (patterns de dates, slugs, enums, required priority/status/project/
    affected_files), donc strict sans anyOf partout sauf affected_files
    (anyOf FORME A/B conservé). Tranchés : FORME B non généralisée hors
    RFC, author sans enum (source unique personas, M16), tags sans pattern
    (accents français légitimes), steps[] d'implementation-plan non
    verrouillés (5 plans historiques hétérogènes), spec de task-request et
    project-config volontairement ouverts. Débouche sur le RFC de
    durcissement des schemas.
  tags:
    - companyos-v1
    - schemas
    - audit
    - validation
    - harness
    - mechanical-invariant
    - unevaluated-properties
  related:
