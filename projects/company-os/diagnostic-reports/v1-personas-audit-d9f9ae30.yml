api_version: companyos/v1
kind: diagnostic-report
metadata:
  id: d9f9ae30-ddad-4d24-bad8-ae7bf5a6617d
  title: "Audit V1 des 4 personas : 38 entrées classées (conserver 24, pointeur/réécrire 12, supprimer 2, ajouter 5) + 3 corrections produces/consumes"
  author: architect
  created_at: "2026-07-27"
  project: company-os
  description: >
    Phase d'analyse du domaine v1-personas-audit (task-request 3dcd3a6b,
    roadmap a410bb43). Passe cohérente persona par persona, règle par règle,
    sur les 38 entrées actuelles des 4 personas (rules.must/never + règles
    nommées) plus les champs identity, review_behavior, produces et consumes.
    Chaque entrée est classée : CONSERVER (jugement pur, prose légitime),
    RÉÉCRIRE EN POINTEUR (le harness impose désormais, la règle devient une
    ligne courte citant le mécanisme), SUPPRIMER (redondance pure avec le
    harness ou une autre règle), ou AJOUTER (manques observés pendant le
    programme V1). Base : recensement c981bf62 section E, mis à jour des
    mécanismes livrés par les lots 1 (RFC 8bf78218), 2 (RFC a4ee8b6a) et
    3 (RFC 0197fbe5), du flux deploy-serve (RFC 18011bfc) et du hotfix
    identité d'agent (RFC 25b6678c). Débouche sur le RFC de réalignement
    098f35db.
  tags:
    - companyos-v1
    - personas
    - audit
    - prose
    - harness
    - mechanical-invariant
  related:
