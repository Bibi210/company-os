api_version: companyos/v1
kind: diagnostic-report
metadata:
  id: 9ed7c07c-3c2d-45fa-a5ed-7ec9ac7667f7
  title: "M13 bloque toutes les écritures en zone protégée : input.agent n'a JAMAIS été fourni par l'API plugin opencode"
  author: architect
  created_at: "2026-07-14"
  project: company-os
  description: >
    Le mécanisme 13 du lot 2 (RFC a4ee8b6a, hasActivePermit exige granted_to === input.agent,
    fail-closed sur agent falsy) bloque TOUTES les écritures en zone protégée depuis le boot
    de la session courante : l'Implementer (permit 5ddca363 valide et actif) a été bloqué sur
    crates/orchestrator/src/types.rs avec "No active permit granted to agent 'undefined'",
    gelant l'exécution du lot 3 (RFC 0197fbe5) à l'étape 1. Root cause établie par analyse
    des binaires opencode : le payload des hooks tool.execute.before/after est
    {tool, sessionID, callID(, args)} et n'a JAMAIS contenu de champ agent, dans AUCUNE
    version d'opencode vérifiée (1.15.13 → 1.17.18, binaires du cache pacman + typings SDK
    @opencode-ai/plugin). M13 repose sur un champ inexistant ; il est resté dormant du 11 au
    13 juillet parce que le hot-reload du core n'a pas pris effet dans le processus opencode
    longue durée du lot 2, et s'est armé au reboot consécutif à l'upgrade opencode 1.17.15→1.17.18
    du 2026-07-13 17:55. Fix recommandé : mapping sessionID→persona observé par le hook sur
    les appels authenticate (option c), via RFC hotfix.
  tags:
    - defense-in-depth
    - write-permit
    - mechanism-13
    - opencode-plugin-api
    - input-agent
    - hot-reload
    - fail-closed
    - dead-guard
    - companyos-internals
    - critical-infra
