metadata:
  id: 672a141a-54c8-4851-b3c5-dfc32864b0f5
  title: "V1 automation : recensement du bookkeeping manuel restant et triage retenu/rejeté"
  author: architect
  created_at: "2026-08-14"
  project: company-os
  description: >
    Recensement cadré par le task-request 3779b2a7 (domaine v1-automation,
    roadmap a410bb43). Examine les 5 candidats du task-request plus les
    frictions remontées par les lessons du programme V1 (18 cycles RFC
    observés). Pour chaque item : fréquence réellement observée (citations),
    coût, et décision retenu/rejeté avec rapport coût/valeur explicite.
    Tranche structurellement le sort d'orchestrator.db dans git : SORTIE du
    versionnement, avec remplacement du scellement des permits (commit de la
    DB entière, RFC 359f9162) par un fichier de seal dédié minimal
    (company/data/permits-seal.json) qui préserve exactement l'invariant de
    baseline du revert sélectif (RFC bde023e2) et rend en prime la table
    write_permits reconstructible au boot (extension du PILIER D cdbfee72).
    Chiffres clés mesurés : 94 blobs de DB dans l'historique git pour
    696 MiB non compressés, .git à 310 MiB, DB working tree en état M
    permanent, 29 commits de seal. Les automatisations retenues font
    l'objet du RFC cde13417.
