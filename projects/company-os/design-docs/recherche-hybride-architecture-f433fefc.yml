kind: design-doc
metadata:
  id: f433fefc-81b7-4b32-b9a3-3ddd6a020a73
  title: "Architecture hybride lexical + sémantique pour search() : BM25 sur FTS5 normalisé, embeddings locaux via sqlite-vec, fusion RRF, filtres structurés, reranking optionnel"
  author: architect
  created_at: "2026-06-01"
  changelog:
    - date: "2026-06-01"
      author: architect
      description: >
        Révision iteration 3 suite au round 543a9d8d sur le
        design-doc (vote Implementer = request_changes, PM =
        approve). Trois findings spécifiques au design-doc +
        un finding commun avec le RFC sont adressés.

        F-commun-1 (recommandation "crate Rust pure" inexacte,
        commune avec le RFC). Finding RETENU. Reformulation
        du composant pipeline-embeddings-local sous-section
        (b) "Runtime d'inférence" pour clarifier trois axes
        orthogonaux : (i) AUTONOMIE RUNTIME de search() —
        exigence DURE, aucun accès réseau au runtime ; (ii)
        ABSENCE DE FFI — nice-to-have, pas de contrainte
        dure ; (iii) BINAIRE AUTONOME AU BUILD — out of
        scope, le téléchargement de poids ou de runtime au
        build est acceptable. La décision "Runtime d'inférence
        Rust pur..." dans la section decisions est
        renommée et reformulée pour refléter cette
        distinction. Cohérent avec la reformulation du RFC.

        F-design-1 (observabilite-indexation sans stratégie
        minimale). Finding RETENU. Le composant
        observabilite-indexation est enrichi d'une sous-
        section (a') "Mécanique minimale d'instrumentation"
        qui spécifie pour chaque champ exposé par
        index_status la propriété fonctionnelle visée et la
        mécanique minimale acceptable. Cohérent avec la
        précision iteration 3 du RFC bdee1af4 sur la même
        PROPOSITION 8.

        F-design-2 (tolérance epsilon cross-architecture
        absente du design). Finding RETENU. Le composant
        pipeline-embeddings-local est enrichi d'une note sur
        la tolérance de déterminisme effectif. Le RFC
        mentionne en risque résiduel (5) que des variations
        float-precision de l'ordre de 1e-5 à 1e-6 peuvent
        apparaître selon hardware/BLAS/version de librairie ;
        le design-doc doit poser la propriété cible et la
        stratégie de validation. Ajout d'une note explicite
        dans le sous-composant (a) du modèle d'embedding qui
        définit la tolérance acceptable (cosine entre deux
        embeddings du même input > 0.9999, soit une distance
        cosine < 1e-4) et la stratégie de validation (test
        Rust qui embed le même input deux fois sur la même
        machine et vérifie la similarité). Note : la
        cross-architecture (machine A vs machine B) n'est
        pas testable en CI sur un runner unique ; le design
        accepte cette limite et prévoit qu'un mismatch
        observé en production déclenche un wipe + reindex_all
        automatique via le model_version (décision iteration
        2 sur incertitude 5).

        F-design-3 (triaxiale incomplète, cas négatif
        d'embedding au RUNTIME de search()). Finding RETENU.
        L'iteration 1 et 2 du design-doc couvraient l'échec
        d'embedding pendant index_artifact (cas (1) du
        triaxial), mais pas pendant un appel search(). Ajout
        d'un nouveau cas (1') dans la section triaxial_analysis
        sous-section "negatif" qui couvre : modèle pas encore
        chargé en mémoire (lazy load), OOM transitoire pendant
        une inférence, input de query trop long pour la
        context length du modèle, panic interne du runtime
        d'inférence. Sémantique tranchée : si l'embedding de
        la query échoue, search() retourne une erreur explicite
        (pas de fallback silencieux sur mode lexical), cohérent
        avec la décision iteration 2 sur l'incertitude 3 (pas
        de fallback silencieux). L'agent appelant voit l'erreur
        et peut soit retry, soit basculer explicitement en
        mode=lexical s'il accepte la dégradation.

        Aucune autre modification structurelle. Les décisions
        d'iteration 2 (pas de fallback, scope unique, model_
        version dès la v1) restent fermes. Les incertitudes
        1 et 2 restent ouvertes pour l'implementation-plan.

    - date: "2026-06-01"
      author: architect
      description: >
        Révision iteration 2 suite aux arbitrages PM sur les
        cinq incertitudes structurelles remontées par l'agent-
        message 382cf805. Trois décisions PM intégrées en dur
        avant les review rounds, en cohérence avec la révision
        iteration 2 du RFC bdee1af4 (même changelog côté RFC).

        (a) Incertitude 3 — mode lexical-only en fallback.
        Tranchée PAS de fallback, exit explicite. Mises à
        jour : (i) le cas négatif (1) de l'analyse triaxiale
        est aligné sur "exit au boot, code non-zero, message
        clair", avec rationale PM cité ; (ii) une nouvelle
        décision tranchée est ajoutée à la section decisions
        ("Pas de mode dégradé lexical-only..."), avec
        symétrie stricte entre les deux composants de la
        couche sémantique (modèle ET extension sqlite-vec).
        Note : le cas négatif (1) initial de l'iteration 1
        contenait une CONTRADICTION INTERNE avec la
        proposition de pipeline d'indexation transactionnel
        (rollback complet vs commit FTS partiel) ; cette
        iteration 2 corrige aussi cette incohérence en
        alignant tout sur le rollback complet.

        (b) Incertitude 4 — scope unique vs RFC découpé.
        Tranchée scope unique. Mise à jour : nouvelle
        décision "Le scope du RFC bdee1af4 reste UNIQUE et
        indivisible" ajoutée à la section decisions, avec
        rationale PM cité (period intermédiaire dommageable,
        re-cadrage du process, flags OFF par défaut donc
        zéro impact pour les agents qui ne les activent
        pas).

        (c) Incertitude 5 — model_version dans artifacts_vec.
        Tranchée oui, dès la v1. Mises à jour : (i)
        l'open_question correspondante est requalifiée — le
        PRINCIPE est tranché, seul le format de stockage
        reste arbitré dans l'implementation-plan ; (ii) une
        nouvelle décision tranchée est ajoutée à la section
        decisions ("Un model_version est persisté..."), avec
        rationale PM cité (coût d'ajout faible en v1, coût
        de rétrofit élevé en V2, mismatch silencieux
        difficile à diagnostiquer si on ne le détecte pas
        explicitement).

        Les incertitudes 1 (modèle exact) et 2 (runtime
        Rust pur vs sidecar) restent ouvertes pour
        l'implementation-plan, sans changement. Aucune autre
        modification du design n'est portée par cette
        iteration : les composants, les autres décisions, et
        l'analyse triaxiale restent inchangés sur le fond.
  description: >
    Design d'architecture qui refond search() de l'orchestrator
    en hybrid search au sens IR moderne. Trois axes
    complémentaires : un axe lexical conservé et durci (FTS5
    avec tokenizer unicode61 normalisé, ranking BM25 explicite,
    normalisation de la query côté Rust pour éliminer les
    explosions d'opérateurs), un axe sémantique ajouté
    (embeddings vectoriels denses calculés par un modèle local
    multilingue, stockés et interrogés via une table virtuelle
    sqlite-vec dans la même DB que FTS5), une fusion par
    Reciprocal Rank Fusion qui combine les deux classements
    sans avoir besoin de calibrer des scores hétérogènes. Trois
    couches transverses : des filtres structurés sur les
    métadonnées indexées (kind, author, tags, project, date),
    un reranking optionnel par Claude (via la clé Anthropic
    d'opencode) pour les top-K ambigus, et une query expansion
    HyDE optionnelle qui synthétise un pseudo-document avant
    embedding. Le pipeline d'indexation s'inscrit dans
    l'invariant PILIER A du RFC cdbfee72 (un seul writer) :
    l'embedding est calculé pendant index_artifact() côté
    serveur, persisté dans la même connexion SQLite. La
    compatibilité avec PILIER D (autorepair par rebuild
    depuis YAML) est garantie par l'idempotence du calcul
    d'embedding (modèle déterministe avec graine fixe), ce qui
    rend reindex_all suffisant pour restaurer les embeddings
    sans backup hors-DB. Multilingue FR + EN technique par
    construction (modèle d'embedding multilingue obligatoire).
    API search() breaking change accepté : la signature
    s'étend avec un paramètre `mode` (lexical | semantic |
    hybrid, défaut hybrid) et un objet de filtres ; le
    paramètre query devient une string normalisée plutôt qu'un
    fragment FTS5 brut. Les callers internes (lookup mémoire
    des agents, autres tools MCP) sont migrés dans le même
    cycle. Aucun détail d'implémentation (pas de chemin de
    fichier, pas de signature exacte, pas d'ordre d'étapes) :
    ces choix relèvent de l'implementation-plan dérivé.
