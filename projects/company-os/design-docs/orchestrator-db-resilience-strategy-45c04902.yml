api_version: companyos/v1
kind: design-doc
metadata:
  id: 45c04902-53f5-43db-981b-80f937233e62
  title: "Stratégie de résilience persistence orchestrator : writer unique, configuration WAL défensive, graceful shutdown, autorepair au boot"
  author: architect
  created_at: "2026-05-27"
  description: >
    Design d'architecture qui rend la persistence SQLite de
    l'orchestrator résiliente aux scénarios de cycle de vie hostile
    (restart par proxy résilient, kill brutal, ouvertures
    concurrentes par le hook defense-in-depth). Répond aux
    acceptance criteria du task-request ffb85fc7 et formalise les
    décisions architecturales motivées par le diagnostic-report
    378c387c. Trois piliers complémentaires : un writer unique
    coordonné par un file lock OS, une configuration SQLite WAL
    défensive uniformisée sur tous les chemins d'ouverture, et un
    graceful shutdown avec signal handlers. Un quatrième pilier
    d'autorepair au boot transforme tout résidu de corruption en un
    incident court (reconstruction depuis l'index YAML source de
    vérité) au lieu d'un blocage du système. Pas de détails
    d'implémentation, pas de chemins de fichiers — c'est le job de
    l'implementation-plan dérivé de ce design-doc.
  tags:
    - orchestrator
    - sqlite
    - wal
    - persistence
    - concurrency
    - resilience
    - design
    - critical-infra
  related:
    - id: ffb85fc7-f5a4-4bfc-b207-1ff955ef77e5
      kind: task-request
      relationship: input
