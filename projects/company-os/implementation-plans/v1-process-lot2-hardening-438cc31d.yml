  risks:
    - "Édition textuelle de metadata.description en block scalar (>) : l'insertion en tête du contenu du bloc est le point le plus délicat du mécanisme 10. Mitigation : validate_yaml_str sur les DEUX contenus AVANT toute écriture (étape 8.3) ; si l'édition casse le YAML, abort sans écrire. Tests edge dédiés (block scalar ET string quotée, artifact sans bloc related préexistant)."
    - "Câblage with_root incomplet sur reload_schemas (L114) : ce point n'a pas root en scope local comme les autres. Mitigation : stocker root dans YamlValidatorServer au new (ou relire l'ENV dans reload_schemas). Vérifier qu'un reload_schemas ne DÉCONFIGURE pas le placement (régression silencieuse : le validator rechargé perdrait son root)."
    - "Fixtures des tests de supersede/reindex : index_artifact exige un embedder. Si le harness engine utilise new_without_embedder, index_artifact est indisponible (cf. lot 1 étape 14). Mitigation : soit charger l'embedder de cache dans ces tests précis, soit tester la partie édition-textuelle+écriture sans la ré-indexation et couvrir la ré-indexation par un test qui a l'embedder."
    - "Le gate reload_config (mécanisme 11) pourrait bloquer un reload légitime si un permit d'une AUTRE session reste actif. C'est le comportement VOULU (le gate est global sur les permits actifs). Dans la séquence finale, le permit 24e91083 est consommé AVANT le reload, donc pas de blocage. Documenté à l'étape 16(d)."
    - "make ci doit rester vert à CHAQUE commit (contrainte RFC), pas seulement à la fin. Risque si un commit introduit un mécanisme dont le test dépend d'un autre. Mitigation : les 7 mécanismes sont indépendants ; commiter mécanisme + ses tests ensemble (étape 15), le seul couplage est C6 (12+13)."
    - "personas.yml est régénéré par le wrapper, pas édité à la main. Si la régénération ne se déclenche pas (ex. write hors onProtectedZoneWrite), personas.yml divergerait de ceo.yml. Mitigation : vérifier après le write de ceo.yml que personas.yml reflète bien la purge du produces avant de committer C6."
