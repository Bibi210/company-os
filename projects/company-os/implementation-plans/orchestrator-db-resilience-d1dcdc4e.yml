    - description: >
        Étape 10 — Réconciliation RFC, validation finale, boucle
        du workflow write_permit, et clôture.

        (10.0) Amendement du RFC cdbfee72 en iteration 5 —
               réconciliation avec la décision technique de
               l'étape 5.2.

               MOTIF. Le RFC en status: approved stipule en
               PROPOSITION 1 étape 3 que `--index`, lorsqu'il
               rencontre EWOULDBLOCK, appelle index_now via MCP
               avec trois sous-cas (succès, erreur métier, MCP
               injoignable). L'étape 5.2 du présent plan a
               établi techniquement que cet appel est impossible
               cross-process : le serveur orchestrator MCP
               écoute uniquement sur stdio (cf.
               main.rs:764 `let (stdin, stdout) = rmcp::transport::io::stdio()`),
               donc un process séparé `--index` ne peut pas s'y
               connecter. La sémantique retenue à la place est
               celle pré-finding B : "no-op + log + exit 0",
               l'indexation étant déléguée au file watcher du
               serveur (debounce 500ms, le contrat tacite "tout
               YAML searchable dans la seconde" reste tenu).

               MOMENT DE L'AMENDEMENT. Juste APRÈS la validation
               empirique de l'étape 5.2 (étape 5 complète,
               cargo build + cargo test verts sur le comportement
               --index no-op-if-server), et AVANT le passage du
               RFC en status: implemented à l'étape 10.4. Faire
               l'amendement avec la preuve technique en main
               (path d'ouverture du transport stdio, ligne
               main.rs:764) plutôt que sur une hypothèse a
               priori.

               CONTENU DE L'AMENDEMENT. Édition de
               company/rfcs/orchestrator-db-resilience-four-pillars-cdbfee72.yml
               via une iteration 5 ajoutée au metadata.changelog
               qui :
               (a) reconnaît l'impossibilité technique côté
                   --index d'appeler index_now via MCP
                   (transport stdio orchestrator) ;
               (b) reformule le comportement du cas EWOULDBLOCK
                   en PROPOSITION 1 étape 3 en :
                   "--index logue 'server detected via flock,
                   indexing delegated to server file watcher'
                   sur stdout et exit 0. Le file watcher
                   serveur indexera dans la seconde via le
                   debounce de 500ms." ;
               (c) précise que le tool MCP index_now reste
                   exposé côté serveur pour les appelants
                   secondaires (tests d'intégration MCP,
                   agents async futurs qui souhaitent forcer
                   une indexation déterministe, scripts CI) ;
               (d) ne change RIEN aux autres propositions
                   (PILIERs A, B, C, D, autres call sites du
                   refactor defense-in-depth).

               PROCÉDURE. Le RFC cdbfee72 vit dans
               company/rfcs/, zone protégée company/rfcs/ pas
               explicitement listée mais le fichier est un
               artefact YAML. Vérification du périmètre du
               permit a685f08a : le RFC lui-même n'est pas
               dans affected_files (seuls les paths qu'il
               modifie le sont). Or éditer le RFC est une
               modification du contenu de l'artefact RFC,
               différent de modifier les paths qu'il
               référence. Le hook defense-in-depth applique
               sa logique de protected zones par path
               (cf. defense-in-depth-core.mjs ligne 320
               isInProtectedZone) ; company/rfcs/ n'est pas
               dans les prefixes (vérifié dans
               protected-zones.json : seuls company/config/,
               company/personas/, company/schemas/,
               company/plugins/, crates/). Donc l'édition est
               libre, pas besoin d'extension du permit.

               REVIEW DE L'AMENDEMENT. Comme c'est un
               amendement formel d'un RFC déjà approuvé qui
               affecte la sémantique d'une proposition,
               initier un nouveau review round (auteur =
               implementer, reviewers = pm, architect, ceo).
               Vote attendu : approve (la divergence
               technique est documentée et la sémantique de
               remplacement préserve le contrat fonctionnel).
               Si le CEO refuse, escalade : retour à
               l'Architect pour design d'une solution
               alternative (par exemple introduire un canal
               de communication non-stdio entre --index et
               le serveur — ipc unix socket, fichier de file
               de tâches, etc.). Mais ce n'est pas le chemin
               optimiste attendu.

        (10.1) Avant TOUT commit en zone protégée : effectuer le
               scellement du permit dans la DB orchestrator.
               Conformément à la persona implementer rule
               write_permit_full_sequence :
                 - grant_write_permit() déjà fait par le CEO ✓
                 - SCELLER la DB par un commit :
                   git add -f company/data/orchestrator.db &&
                   git commit -m "chore: seal write permit a685f08a (orchestrator DB resilience)"
                 - PUIS implémenter (étapes 1 à 9 déjà commits
                   intermédiaires) ;
                 - PUIS consume_write_permit() ;
                 - PUIS cargo build && cargo test ;
                 - PUIS reload_config() (en DERNIER, optionnel
                   ici car les modifications de config sont
                   minimes).

               Ordre concret retenu :
                 (10.1.a) commit de scellement AVANT toute
                          modification protégée ;
                 (10.1.b) commits intermédiaires pour chaque
                          étape protégée (étapes 1-8) ;
                 (10.1.c) commit final pour les tests (étape 9) ;
                 (10.1.d) cargo build (sans --target-dir) +
                          cargo test ;
                 (10.1.e) consume_write_permit() ;
                 (10.1.f) (optionnel) reload_config().

               Note : la persona dit "consume après commit",
               mais aussi "cargo build après consume". L'ordre
               cohérent est : commit → consume → cargo build →
               cargo test → reload_config. C'est ce que je
               suivrai.

        (10.2) Exécuter le protocole de validation manuel pour
               les AC du task-request (4) et (5) :

               (a) Test AC4 — "démarrer depuis DB saine ne corrompt
                   pas" :
                   * cp company/data/orchestrator.db /tmp/baseline.db
                   * sqlite3 /tmp/baseline.db "PRAGMA integrity_check;"
                     → "ok" attendu
                   * démarrer le serveur (ou laisser cette session
                     active utiliser le serveur via le proxy
                     résilient)
                   * faire quelques appels MCP (search, get)
                   * envoyer SIGTERM (ou utiliser un mécanisme
                     équivalent)
                   * cp company/data/orchestrator.db /tmp/after.db
                   * sqlite3 /tmp/after.db "PRAGMA integrity_check;"
                     → "ok" attendu
                   * Comparaison avant/après : pas de régression
                     visible.

               (b) Test AC5 — "restart par proxy résilient ne
                   corrompt pas" :
                   * Pendant une session active, déclencher un
                     cargo build (qui rebuild le binaire serveur
                     et déclenche un restart via le watcher du
                     proxy).
                   * Attendre que le proxy ait restarté
                     (~quelques secondes).
                   * Vérifier que les appels MCP fonctionnent à
                     nouveau (sans message d'erreur "database
                     malformed").
                   * sqlite3 company/data/orchestrator.db "PRAGMA
                     integrity_check;" depuis l'EXTÉRIEUR (sans
                     toucher la DB) → "ok" attendu.

        (10.3) Si les deux tests passent, on est bon pour les AC
               (4) et (5).

        (10.4) Mettre à jour les statuts :
               - task-request ffb85fc7 → status: done
               - RFC cdbfee72 → status: implemented
                 (préalable obligatoire : l'amendement iteration 5
                 de l'étape 10.0 est approuvé, sinon le RFC ne
                 peut pas passer en implemented avec une
                 divergence non réconciliée.)
               (Ces modifications sont des éditions YAML, indexées
               automatiquement par defense-in-depth.)

        (10.5) Produire la lesson-learned finale (cf. règle
               lesson_after_every_artifact). Avant : search() sur
               "sqlite resilience wal flock" pour voir si une
               lesson similaire existe. Sinon, créer la nouvelle.

        (10.6) Consume le write permit via
               consume_write_permit(token, persona="implementer",
               permit_id="a685f08a-260d-4a6f-8c92-26b8d07ca5b5").
