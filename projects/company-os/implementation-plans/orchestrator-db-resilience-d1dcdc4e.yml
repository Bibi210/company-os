api_version: companyos/v1
kind: implementation-plan
metadata:
  id: d1dcdc4e-1a33-42c6-8037-1fa3e3eba0a8
  title: "Implementation plan : résilience DB orchestrator (flock + PRAGMA + graceful shutdown + autorepair + refactor defense-in-depth + index_now)"
  author: implementer
  created_at: "2026-05-27"
  description: >
    Plan d'implémentation détaillé du RFC cdbfee72 et du design-doc
    45c04902. Exécute les quatre piliers (file lock POSIX, PRAGMA
    défensifs, graceful shutdown signal-driven, autorepair au boot)
    plus le refactor des quatre call sites sqlite3 du hook
    defense-in-depth vers MCP, plus l'introduction du tool MCP
    index_now. Tranche les open questions du design-doc et fige les
    conventions techniques (crate flock, path du sentinel,
    timeouts, sémantique de fallback). L'ordre des étapes respecte
    les dépendances : PRAGMA défensifs (PILIER B) en premier car
    pré-requis de tous les autres opens, transaction DDL (partie
    de PILIER C) en parallèle car bénéficie aux mêmes ouvertures,
    nouveaux outils MCP côté serveur AVANT le refactor du hook qui
    en dépend, file lock (PILIER A) avant graceful shutdown
    (PILIER C) et autorepair (PILIER D) qui s'appuient dessus,
    enfin refactor du hook en dernier car il dépend de tous les
    nouveaux tools MCP. Le write permit a685f08a-260d-4a6f-8c92-26b8d07ca5b5
    est consommé en fin de séquence, après que tous les commits
    git en zone protégée soient passés.
  tags:
