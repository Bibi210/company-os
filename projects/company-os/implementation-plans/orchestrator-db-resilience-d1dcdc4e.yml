    - description: >
        Étape 8 — Refactor du hook defense-in-depth : sqlite3 CLI →
        outils MCP. (Dernière étape sur le code source car elle
        dépend des trois nouveaux tools MCP de l'étape 4.)

        Le hook est en JavaScript Node.js (defense-in-depth-core.mjs).
        Il s'exécute sous le runtime opencode qui dispose d'un client
        MCP injecté implicitement (les outils MCP sont accessibles
        comme fonctions globales ou via un namespace selon la version
        d'opencode). Le pattern d'appel exact dépend de l'API
        opencode-hook ; je l'apprendrai en lisant le hook existant
        et le code de mcp-proxy.mjs.

        (8.1) Lecture exploratoire du hook (defense-in-depth.mjs
              wrapper + defense-in-depth-core.mjs) ET de
              mcp-proxy.mjs pour comprendre comment appeler un
              tool MCP depuis le runtime du hook. Si l'API
              opencode-hook expose `mcp.call("tool_name", args)`
              ou équivalent, on l'utilise.

              Si l'API n'expose PAS d'appel MCP synchrone depuis
              le hook (cas probable : le hook tourne en before/after
              callbacks et bloquer sur un appel async serait coûteux),
              il faudra réécrire en async. Le hook actuel est déjà
              async (les handlers retournent des Promise), donc
              c'est compatible.

              SI ABSOLUMENT IMPOSSIBLE d'appeler MCP depuis le
              hook : on garde sqlite3 inline pour cette première
              itération et on documente cela dans la lesson finale
              + crée un agent-message au PM. Mais c'est un
              fallback pessimiste ; la première analyse devrait
              révéler une voie.

        (8.2) Modifier company/plugins/defense-in-depth-core.mjs :
              - `hasActivePermit(rootDir, filePath)` : remplacer
                l'invocation `run(`sqlite3 ${dbPath} "${query}"`, rootDir)`
                par un appel MCP `check_write_permit(persona,
                filePath)`. La persona provient de input.agent qui
                est dispo dans le contexte du hook. Si l'appel MCP
                échoue (erreur réseau, timeout), retourner false
                (= pas de permit, pas de write) conformément à
                la décision 0.f.

              - `snapshotPermits(rootDir)` : remplacer par
                `snapshot_permits_state()`. Erreur MCP → null.

              - `revertPermitTampering(rootDir, before)` : les deux
                branches (L200 nuclear, L206 selective) fusionnent
                en un seul appel `revert_permits_to_snapshot(before)`.
                Le serveur arbitre en interne :
                * before === null → null param → serveur fait DELETE.
                * before !== null → serveur fait DELETE WHERE NOT IN.
                La fonction du hook retourne true si revert a eu
                lieu, false sinon.

        (8.3) Ajouter le pattern .lock aux VOLATILE_PATTERNS du
              hook (cf. décision 0.c). Ligne 40-42 :
              `const VOLATILE_PATTERNS = [/\.db$/, /\.db-shm$/, /\.db-wal$/, /\.db-journal$/, /\.lock$/, /\.pid$/];`
              C'est déjà couvert par le pattern `/\.lock$/` existant !
              Vérification : grep `\.lock` dans le fichier. Si
              déjà présent, étape 8.3 est no-op (juste validation).

        (8.4) Mettre à jour .gitignore : ajouter `*.lock` ou
              `company/data/orchestrator.lock` à la liste. Convention
              minimale : `*.lock`. Cela exclut aussi Cargo.lock ?
              ATTENTION : Cargo.lock est DÉJÀ ignoré par
              `Cargo.lock` (cf. .gitignore ligne 5). Mais ajouter
              `*.lock` exclurait potentiellement d'autres fichiers
              .lock futurs sans qu'on s'en rende compte. Choix
              spécifique : ajouter `company/data/orchestrator.lock`
              en ligne explicite. Plus précis, moins de surprise.

        (8.5) Pas de modification de company/config/protected-zones.json
              nécessaire (cf. décision 0.c) : le hook reconnaît
              orchestrator.lock comme volatile via le pattern
              déjà existant. Mais le fichier reste dans
              affected_files par prudence (au cas où une
              modification s'avère nécessaire en cours
              d'implémentation).

        (8.6) Vérifier le hook syntaxiquement avec node :
              `node --check company/plugins/defense-in-depth-core.mjs`
      files:
        - "company/plugins/defense-in-depth-core.mjs"
        - ".gitignore"

