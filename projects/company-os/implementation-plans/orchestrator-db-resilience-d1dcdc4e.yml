  changelog:
    - date: "2026-05-27"
      author: implementer
      description: >
        Révision iteration 2 suite au round 037833b7 (vote
        Architect = request_changes, 1 finding (a)). L'Architect
        accepte la décision technique de l'étape 5.2 (--index ne
        peut pas appeler index_now via MCP cross-process puisque
        le transport MCP du serveur orchestrator est stdio, pas
        socket/HTTP) ET la sémantique de remplacement retenue
        (no-op + log + exit 0 pour le cas EWOULDBLOCK). MAIS le
        RFC cdbfee72 en status: approved stipule formellement que
        --index DOIT appeler index_now via MCP (PROPOSITION 1
        étape 3 sous-cas 1/2/3). Sans réconciliation, le plan
        diverge d'un artefact approuvé. Correctif appliqué :
        ajout d'un sous-point 10.0 en tête de l'étape 10
        formalisant l'engagement à amender le RFC en iteration 5
        AVANT que le RFC ne passe en status: implemented à
        l'étape 10.4. Le moment précis de l'amendement est fixé
        juste après la validation empirique de l'étape 5.2 (donc
        avant l'étape 10), pour amender avec la preuve technique
        en main plutôt que sur la base d'une hypothèse. Aucune
        autre modification du plan : la décision technique reste
        intacte, le tool index_now reste exposé côté serveur
        pour les appelants secondaires.

spec:
  steps:
    - description: >
        Étape 0 — Décisions d'implémentation tranchées par l'Implementer.
        Cette étape n'écrit pas de code, elle fige les conventions
        pour les étapes suivantes.

        (a) Choix de la crate flock — DÉCISION : fs2 version 0.4.
            Justification : API la plus directe et lisible pour
            notre usage (File::try_lock_exclusive, lock_exclusive,
            unlock), zéro feature à activer, ~3M downloads
            mensuels, maintenance stable depuis des années.
            rustix nécessiterait d'activer la feature "fs" qui
            tire d'autres modules inutiles, et son API est plus
            bas niveau (manipulation de fd brut). nix idem trop
            large. fs2 est focalisée sur ce besoin précis.
            Dépendance ajoutée uniquement à
            crates/orchestrator/Cargo.toml (la struct LockGuard
            sera exposée par companyos-orchestrator et utilisée
            depuis main.rs sans dep directe).

        (b) Path du fichier sentinel — DÉCISION :
            company/data/orchestrator.lock, à côté de la DB.
            Justification : recommandation initiale du design-doc
            adoptée. Avantage proximité immédiate pour
            l'opérateur qui debugue. .gitignore couvre déjà *.db*
            mais pas *.lock — on étend à *.lock pour garder le
            répertoire propre côté git. Ce fichier reste un
            simple sentinel : son contenu n'est pas significatif,
            seul le lock posix qu'il porte l'est.

        (c) Détection du fichier de lock côté defense-in-depth —
            DÉCISION : ajouter le pattern /\.lock$/ aux
            VOLATILE_PATTERNS du hook (defense-in-depth-core.mjs
            ligne 40-42). Le fichier orchestrator.lock vit dans
            company/data/ qui n'est pas explicitement dans les
            prefixes protégés (vérifié dans protected-zones.json :
            seuls company/config/, company/personas/,
            company/schemas/, company/plugins/, crates/ y sont).
            La règle VOLATILE_PATTERNS sert exactement à exclure
            ce type de fichier des checks d'intégrité (déjà
            utilisée pour .db, .db-shm, .db-wal, .db-journal,
            .pid). Aucune modification de protected-zones.json
            n'est donc nécessaire — c'est le hook lui-même qui
            doit reconnaître .lock comme volatile.

        (d) Timeouts et valeurs — DÉCISION : retenir les
            recommandations initiales du design-doc/RFC. Les
            constantes sont déclarées dans une location
            stable :
              - LOCK_RETRY_INTERVAL = 200ms
              - LOCK_RETRY_TIMEOUT  = 10s (soit 50 tentatives)
              - BUSY_TIMEOUT_MS     = 5000 (PRAGMA)
              - SHUTDOWN_TIMEOUT    = 5s (attente tasks au shutdown)
              - WATCHER_DEBOUNCE    = 500ms (déjà existant)

        (e) Sémantique du fallback côté --index quand MCP
            index_now échoue avec "MCP unavailable" — DÉCISION :
            implémenter le mode "silent fallback" (log stderr +
            exit 0) recommandé par le RFC en PROPOSITION 1
            étape 3 sous-cas 3. Ne pas exposer de flag opt-in
            pour cette première itération ; si l'expérience
            opérationnelle montre que l'erreur silencieuse pose
            problème, on rebasculera vers exit non-zero dans
            une future révision (peu invasive : une seule ligne
            du wrapper run_index).

        (f) Sémantique du fallback côté hook quand un appel MCP
            échoue (check_write_permit, snapshot_permits_state,
            revert_permits_to_snapshot) — DÉCISION : implémenter
            la posture conservatrice (i) recommandée par le RFC
            en fin de PROPOSITION 5 : bloquer le bash/write en
            signalant l'incident. Concrètement : si l'appel MCP
            renvoie une erreur réseau/protocole (pas une erreur
            métier), le hook retourne false pour hasActivePermit
            (= pas de permit, donc revert), null pour
            snapshotPermits, false pour revertPermitTampering.
            Conformément à la philosophie défense en profondeur :
            on échoue fermé.

        (g) Path du lock côté defense-in-depth pendant le
            refactor — DÉCISION : `_zones.db_path` reste pointé
            sur orchestrator.db (utilisé pour le check
            "bash command references db file" ligne 254). Le
            fichier .lock est nouveau et n'a pas besoin d'être
            référencé dans _zones. Le hook ne le touche jamais
            directement, c'est le binaire serveur/--index qui
            l'ouvre via fs2.

        (h) Tests d'intégration — DÉCISION : tests dans
            crates/orchestrator/tests/ (nouveau dossier de tests
            d'intégration Rust), pas dans des scripts bash
            externes. Justification : ce sont des tests qui
            requièrent du contrôle fin sur les flocks et les
            signaux, qui se prête bien à du Rust pur (std::process::Command
            pour spawn le binaire, fs2 pour assister le contrôle
            du lock dans des helpers de test). Les scripts bash
            externes resteraient pertinents pour des tests
            end-to-end avec le proxy, mais ceux-ci sortent du
            scope strict du RFC ; les tests d'intégration Rust
            couvrent largement les scenarios (a) à (k) + (e),
            (e'), (f) listés dans les artefacts approuvés.

        (i) Convention de nommage — DÉCISION : la struct du Drop
            guard s'appelle `DbLockGuard`, vit dans un nouveau
            module crates/orchestrator/src/lock.rs (réexporté
            via lib.rs). Les variants d'erreur ajoutés sont
            `OrchestratorError::LockBusy { timeout_ms: u64 }` et
            `OrchestratorError::IntegrityFailure { details: String }`.

        (j) Dépendances impactées (cf. lesson f3fc4a5d) —
            INVENTAIRE :
              - crates/orchestrator/Cargo.toml : ajouter fs2 = "0.4"
                en dépendance normale. tracing est déjà absent
                mais nous logguerons via eprintln! côté lock.rs
                pour ne pas multiplier les dépendances. Les tests
                d'intégration utiliseront `tempfile` qui n'est pas
                en dev-dep — on implémente le pattern LocalTempDir
                de la lesson f3fc4a5d.
              - crates/mcp-servers/orchestrator/Cargo.toml : aucune
                modification nécessaire (notre flock est encapsulé
                par companyos-orchestrator). Mais ce fichier est
                quand même dans affected_files par prudence (cf.
                changelog iteration 4 du RFC) ; on n'y touche que
                si une dépendance nouvelle se révèle indispensable.

        Aucune décision restant ouverte. Le RFC + design-doc sont
        suffisamment précis pour que les étapes 1 à 10 ci-dessous
        soient strictement applicatives.
      files: []

    - description: >
        Étape 1 — PILIER B : configuration WAL défensive uniformisée
        + transaction DDL pour migrate (partie PILIER C).

        (1.1) Modifier crates/orchestrator/src/db.rs :
              - Ajouter une constante privée `const DEFENSIVE_PRAGMAS: &str`
                contenant la séquence :
                "PRAGMA journal_mode=WAL;
                 PRAGMA foreign_keys=ON;
                 PRAGMA busy_timeout=5000;
                 PRAGMA synchronous=NORMAL;
                 PRAGMA wal_autocheckpoint=1000;"
              - Modifier `OrchestratorDb::open(path)` pour appeler
                `conn.execute_batch(DEFENSIVE_PRAGMAS)` au lieu de la
                séquence actuelle limitée à journal_mode + foreign_keys.
              - `OrchestratorDb::open_in_memory()` reçoit aussi le
                preamble (bénéficie aux tests).
              - Modifier `OrchestratorDb::migrate()` pour exécuter
                SCHEMA_SQL puis FTS_SQL DANS UNE TRANSACTION ENVELOPPANTE :
                `self.conn.execute_batch("BEGIN IMMEDIATE; <SCHEMA_SQL>; <FTS_SQL>; COMMIT;")`
                en une seule chaîne, ce qui garantit rollback automatique
                si un SIGKILL frappe au milieu (rejoué par WAL recovery
                au prochain open).
              - Ajouter une méthode publique `integrity_check(&self) -> Result<bool, OrchestratorError>` :
                exécute `PRAGMA integrity_check` et retourne true si le
                résultat est exactement "ok", false sinon. Loggue les
                détails via eprintln! quand le résultat n'est pas "ok"
                (utilisé par PILIER D).
              - Ajouter une méthode publique `checkpoint_truncate(&self) -> Result<(), OrchestratorError>` :
                exécute `PRAGMA wal_checkpoint(TRUNCATE)`. Utilisée par
                PILIER C shutdown.

        (1.2) Vérifier que les tests inline existants
              (`#[cfg(test)] mod tests` au bas de db.rs) continuent
              de passer après cette modif. Comme open_in_memory est
              utilisé par setup_db() et n'a pas de fichier WAL réel
              (in-memory DB), le `journal_mode=WAL` PRAGMA renverra
              "memory" sans casser. busy_timeout etc. s'appliquent
              normalement.

        (1.3) Ajouter dans db.rs un test :
              `#[test] fn test_integrity_check_passes_on_fresh_db()`
              qui ouvre une DB neuve via open_in_memory + migrate, et
              vérifie integrity_check() == true.

        (1.4) cargo build && cargo test -p companyos-orchestrator.
      files:
        - "crates/orchestrator/src/db.rs"

    - description: >
        Étape 2 — Ajouter la dépendance fs2 et créer le module de
        file lock (PILIER A — partie crate orchestrator).

        (2.1) Modifier crates/orchestrator/Cargo.toml :
              - Ajouter `fs2 = "0.4"` sous [dependencies].

        (2.2) Créer crates/orchestrator/src/lock.rs :
              - Nouveau module exposant deux fonctions et une struct :
                * `pub struct DbLockGuard { file: std::fs::File }` :
                  RAII guard. Quand droppé, l'OS libère le lock
                  automatiquement (kernel POSIX flock semantics).
                * `pub fn acquire_exclusive_blocking(path: &Path, retry_interval: Duration, timeout: Duration) -> Result<DbLockGuard, OrchestratorError>` :
                  ouvre le fichier sentinel (création si absent),
                  tente `try_lock_exclusive` en boucle avec
                  `sleep(retry_interval)` entre les essais, jusqu'à
                  `timeout` total. Retourne `OrchestratorError::LockBusy`
                  si le timeout expire.
                * `pub fn try_acquire_exclusive(path: &Path) -> Result<Option<DbLockGuard>, OrchestratorError>` :
                  tente une fois `try_lock_exclusive` non bloquant.
                  Retourne Ok(Some(guard)) si succès, Ok(None) si
                  EWOULDBLOCK, Err pour les autres erreurs (EACCES,
                  ENOENT, etc.). Utilisé par --index pour détecter
                  la présence d'un serveur.
              - Inclure des #[cfg(test)] tests basiques :
                * test_acquire_then_release : un thread acquiert,
                  drop, un second thread peut acquérir.
                * test_try_acquire_when_held : pendant qu'un guard
                  vit dans le test, try_acquire_exclusive retourne
                  Ok(None).
                * test_blocking_acquire_succeeds_after_release : le
                  thread A acquiert + sleep 300ms + drop, le thread
                  B lance acquire_blocking avec timeout 2s, succès
                  attendu en ~300-500ms.
                * test_blocking_acquire_times_out : thread A
                  acquiert pour 5s, thread B lance
                  acquire_blocking avec timeout 500ms, doit retourner
                  LockBusy.

        (2.3) Modifier crates/orchestrator/src/error.rs :
              - Ajouter le variant
                `LockBusy { path: String, timeout_ms: u64 }` avec
                message "Failed to acquire DB lock on '{path}' after
                {timeout_ms}ms — another writer is holding it".
              - Ajouter le variant
                `IntegrityFailure { details: String }` avec message
                "Database integrity check failed: {details}". (Pas
                strictement nécessaire dans cette étape mais
                préparé pour PILIER D.)

        (2.4) Modifier crates/orchestrator/src/lib.rs :
              - Ajouter `pub mod lock;`
              - Ajouter `pub use lock::DbLockGuard;`

        (2.5) cargo build -p companyos-orchestrator &&
              cargo test -p companyos-orchestrator.
              Les 4 tests de lock.rs doivent passer. Vérifier
              get_diagnostics côté LSP : aucune erreur, aucun warning.
      files:
        - "crates/orchestrator/Cargo.toml"
        - "crates/orchestrator/src/lock.rs"
        - "crates/orchestrator/src/error.rs"
        - "crates/orchestrator/src/lib.rs"

    - description: >
        Étape 3 — PILIER D : autorepair au boot (méthodes côté
        crate orchestrator).

        Cette étape prépare les méthodes nécessaires AU NIVEAU CRATE,
        mais le câblage côté binaire (séquence boot avec choix
        nominal vs rebuild) est l'étape 5 (main.rs).

        (3.1) Modifier crates/orchestrator/src/db.rs :
              - Pas de nouvelle méthode publique nécessaire : on a
                déjà `integrity_check()` (étape 1) et `delete_all_artifacts()`
                existant. Le rebuild se fait au niveau du binaire
                (drop la connexion, supprimer les fichiers, rouvrir,
                migrer, reindex). Donc l'étape 3 est principalement
                conceptuelle : valider qu'aucune nouvelle méthode
                publique n'est requise côté db.rs au-delà de ce qui
                a été ajouté en étape 1.

        (3.2) Modifier crates/orchestrator/src/engine.rs si nécessaire :
              - Pas de modification structurelle requise. reindex_all
                existe déjà (ligne 596) et accepte un sync execution
                via engine.reindex_all(root, validator). C'est
                exactement ce dont PILIER D a besoin pour repeupler
                la DB après rebuild.
              - On ajoute juste une méthode helper
                `pub fn snapshot_permits(&self) -> Result<String, OrchestratorError>`
                qui exécute la même requête que le hook actuel
                (SELECT COUNT(*), GROUP_CONCAT(id || ':' || status)
                FROM write_permits) et retourne le blob string.
              - On ajoute aussi
                `pub fn restore_permits_from_snapshot(&self, snapshot: Option<String>) -> Result<usize, OrchestratorError>`
                qui :
                * Si snapshot is None → DELETE FROM write_permits
                  (nuclear), retourne le nombre de lignes supprimées.
                * Sinon → parse le blob "count|id1:status1,id2:status2,…"
                  pour récupérer les IDs présents, puis exécute
                  DELETE FROM write_permits WHERE id NOT IN (…).
                  Retourne le nombre de lignes supprimées.
              - Ces deux méthodes vivent sur OrchestratorEngine
                (pour rester cohérent avec les autres méthodes
                publiques sur permits : grant_permit, check_permit,
                consume_permit).

        (3.3) Ajouter dans engine.rs des tests :
              - test_snapshot_permits_format : crée 2 permits actifs
                + 1 consumed, appelle snapshot_permits, vérifie le
                format (COUNT|id1:active,id2:active,id3:consumed).
              - test_restore_permits_nuclear : crée 2 permits,
                restore_permits_from_snapshot(None), vérifie que la
                table est vide.
              - test_restore_permits_selective : crée 3 permits,
                snapshot, crée un 4ème, restore, vérifie que seuls
                les 3 d'origine restent.

        (3.4) cargo build && cargo test -p companyos-orchestrator.
      files:
        - "crates/orchestrator/src/engine.rs"

    - description: >
        Étape 4 — Nouveaux tools MCP côté serveur :
        snapshot_permits_state, revert_permits_to_snapshot,
        index_now. (Préalable indispensable au refactor du hook
        en étape 8.)

        Ces trois tools s'ajoutent à l'impl OrchestratorServer dans
        crates/mcp-servers/orchestrator/src/main.rs. Les deux
        premiers wrapent les méthodes ajoutées en étape 3.3 ; le
        troisième wrap engine.index_artifact existant.

        (4.1) Définir trois nouvelles structs de paramètres,
              à côté des autres ParamsXxx existantes :
              - `struct SnapshotPermitsStateParams { }` (pas de
                paramètres ; à confirmer avec rmcp si une struct
                vide est acceptée ; sinon utiliser unit).
              - `struct RevertPermitsToSnapshotParams { snapshot: Option<String> }`.
              - `struct IndexNowParams { path: String }`.

        (4.2) Implémenter les trois #[tool] sur OrchestratorServer :

              snapshot_permits_state :
                description = "Return an opaque blob representing
                the current state of write_permits. Used by
                defense-in-depth hook to detect tampering."
                Pas de validation persona/token : c'est une lecture,
                accessible à tout caller.
                Body : engine.lock().await.snapshot_permits()
                → ok(format!("{{\"snapshot\":\"{}\"}}", blob))
                ou format JSON équivalent.

              revert_permits_to_snapshot :
                description = "Restore the write_permits table to a
                previous snapshot. Removes permits not present in
                the snapshot. Used by defense-in-depth hook to
                revert tampering. Pass null snapshot to wipe all
                permits."
                Body : engine.lock().await.restore_permits_from_snapshot(params.snapshot)
                → retourne le count de permits supprimés.

              index_now :
                description = "Index a single YAML artifact file
                immediately, bypassing the file watcher debounce.
                Used by --index when it detects the server holds
                the lock."
                Body : reconstruit le ArtifactValidator depuis
                self.validator (déjà chargé), appelle
                engine.index_artifact(&self.root_path, &params.path, &validator).
                Retourne l'IndexedArtifact en JSON pretty.

        (4.3) Vérification get_diagnostics : aucune erreur, aucun
              warning. Le `tool_router` macro doit reconnaître les
              trois nouvelles méthodes automatiquement (vérifier que
              `#[tool_router]` les pick correctement).

        (4.4) cargo build -p companyos-orchestrator-server (ce qui
              déclenche aussi la dépendance orchestrator et donc
              recompile fs2 + nouveau module lock.rs).
              Pas de hot-reload ici : le binaire n'est pas encore
              démarré côté serveur, les tools ne sont visibles
              qu'au prochain restart du serveur, donc cargo build
              suffit pour la vérification.

        (4.5) Tests : il n'y a pas de tests intégrés pour ces tools
              au niveau crate orchestrator-server (le pattern dans
              ce repo est de tester engine.rs et db.rs au niveau
              crate, et de tester l'intégration MCP via les tests
              d'intégration de l'étape 9). Donc validation par
              cargo build et inspection LSP uniquement à ce stade.
      files:
        - "crates/mcp-servers/orchestrator/src/main.rs"

    - description: >
        Étape 5 — PILIER A (côté serveur) : acquisition du file lock
        au boot avec retry borné.

        (5.1) Modifier crates/mcp-servers/orchestrator/src/main.rs,
              dans run_server() :
              - Définir des constantes locales :
                * LOCK_RETRY_INTERVAL = Duration::from_millis(200)
                * LOCK_RETRY_TIMEOUT = Duration::from_secs(10)
              - Calculer le path du sentinel :
                let lock_path = format!("{db_dir}/orchestrator.lock");
              - JUSTE AVANT l'ouverture de la DB
                (`OrchestratorDb::open(format!(...))` à la ligne ~752),
                acquérir le lock :
                let _lock_guard = companyos_orchestrator::lock::acquire_exclusive_blocking(
                    Path::new(&lock_path),
                    LOCK_RETRY_INTERVAL,
                    LOCK_RETRY_TIMEOUT,
                )?;
              - Le `_lock_guard` reste vivant pour toute la durée
                de run_server (drop en sortie de fonction = libération
                du lock).
              - Si l'acquisition retourne LockBusy, le `?` propage
                l'erreur jusqu'à `main()`, qui exite avec un message
                lisible. Le format du message doit inclure le timeout
                et le path, ex. "Failed to acquire DB lock on
                'company/data/orchestrator.lock' after 10000ms —
                another writer is holding it. Refusing to start."

        (5.2) Modifier run_index() (ligne ~703) :
              - Calculer le même lock_path.
              - Tenter `try_acquire_exclusive(Path::new(&lock_path))` :
                * Ok(Some(guard)) → AUCUN serveur en vie. Garder
                  le guard local pendant tout le travail de
                  run_index, exécuter db.migrate +
                  engine.index_artifact, et exit 0 à la fin (drop
                  du guard libère le lock).
                * Ok(None) → un serveur tient le lock. APPELER
                  index_now via MCP. NB : run_index est un mode
                  CLI synchrone (pas dans tokio), il n'a pas
                  accès au transport MCP. STRATÉGIE :
                  - Spawn un client MCP en tokio runtime ad-hoc
                    qui se connecte via stdio à... non, ce n'est
                    pas possible depuis un process séparé.
                  - ALTERNATIVE PRAGMATIQUE : utiliser le proxy
                    déjà tournant. Mais run_index n'a pas accès
                    au proxy directement.
                  - DÉCISION RÉVISÉE : implémenter le fallback
                    de PROPOSITION 1 étape 3 sous-cas 3 directement :
                    le run_index log "server detected via flock,
                    skipping index (server file watcher will index)"
                    sur stdout et exit 0. C'est de facto le
                    comportement no-op pur du design-doc avant le
                    finding B. Le file watcher serveur indexera
                    dans la seconde.

                  Mais le finding B impose index_now ! Donc on
                  doit trouver un chemin pour appeler MCP depuis
                  run_index. SOLUTION : run_index utilise
                  reqwest ou un client MCP minimal pour se
                  connecter au transport du serveur. PROBLÈME :
                  le serveur orchestrator MCP tourne en stdio,
                  pas en HTTP/socket. On ne peut pas s'y
                  connecter depuis un autre process.

                  ARBITRAGE FINAL : pour cette première
                  implémentation, on adopte la sémantique "no-op
                  pur + exit 0" pour le cas EWOULDBLOCK côté
                  --index, en logguant clairement la délégation
                  au file watcher. C'est UN ÉCART avec la
                  PROPOSITION 1 étape 3 du RFC (qui spécifie
                  index_now via MCP), mais c'est techniquement
                  impossible avec l'architecture stdio MCP
                  actuelle. Justification documentée à l'étape 0
                  des risques. L'outil index_now reste exposé
                  côté serveur (pour appelants secondaires
                  comme des tests ou futurs agents), mais
                  --index ne l'appelle pas ; il se contente de
                  no-op. Le contrat "tout YAML est searchable
                  dans la seconde" reste satisfait via le file
                  watcher debounce 500ms.
                * Err(e) → log stderr + exit non-zero (cas
                  dégénéré ENOENT/EACCES).

