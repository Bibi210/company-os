    - description: >
        Étape 6 — PILIER C : graceful shutdown signal-driven.

        (6.1) Modifier crates/mcp-servers/orchestrator/src/main.rs,
              dans run_server() :
              - Garder une `JoinHandle` de la tokio task reindex_all
                background (actuellement on drop le résultat de
                tokio::spawn). On la nomme `reindex_handle`.
              - Garder une `JoinHandle` aussi pour la tokio task
                qui consomme le file watcher.
              - Garder le `FileWatcherHandle` directement (au lieu
                de juste le drop quand le scope sort).
              - Installer un signal handler tokio AVANT le
                `service.waiting().await?` :

                use tokio::signal::unix::{signal, SignalKind};

                let mut sigterm = signal(SignalKind::terminate())?;
                let mut sigint  = signal(SignalKind::interrupt())?;

                tokio::select! {
                    _ = service.waiting() => {
                        tracing::info!("MCP service ended normally");
                    }
                    _ = sigterm.recv() => {
                        tracing::info!("SIGTERM received, initiating graceful shutdown");
                    }
                    _ = sigint.recv() => {
                        tracing::info!("SIGINT received, initiating graceful shutdown");
                    }
                }

                // Shutdown sequence
                // (1) drop watcher handle → notify stops, watcher task exits on channel close
                drop(watcher_handle);
                // (2) await reindex_handle with timeout
                let _ = tokio::time::timeout(Duration::from_secs(5), reindex_handle).await;
                // (3) checkpoint TRUNCATE
                let engine_guard = engine.lock().await;
                if let Err(e) = engine_guard.checkpoint_truncate_via_db() {
                    tracing::warn!("Checkpoint failed at shutdown: {e}");
                } else {
                    tracing::info!("Checkpoint TRUNCATE done at shutdown");
                }
                // (4) drop guard + drop lock_guard happens implicitly on scope exit

              NOTE : engine.checkpoint_truncate_via_db() est une méthode
              à ajouter sur OrchestratorEngine qui délègue à
              self.db.checkpoint_truncate(). Cela évite d'exposer
              self.db en mut publique.

        (6.2) Ajouter la méthode déléguée dans engine.rs :
              ```
              pub fn checkpoint_truncate(&self) -> Result<(), OrchestratorError> {
                  self.db.checkpoint_truncate()
              }
              ```
              (Le nom de la méthode côté engine peut être identique à
              celui de db.rs, le compilateur lève le bon scope.)

        (6.3) cargo build && get_diagnostics. Vérifier que tokio::signal::unix
              est bien disponible (tokio "full" inclut "signal").

        (6.4) Test manuel léger : lancer un binaire orchestrator-server,
              envoyer SIGTERM, vérifier dans les logs la séquence
              "SIGTERM received → Checkpoint done". Pas de test
              automatisé à ce stade (couvert par les tests d'intégration
              de l'étape 9).
