  risks:
    - >
      Risque 1 (HAUT) — Hook defense-in-depth incapable d'appeler
      MCP depuis Node.js. Si l'API opencode-hook n'expose pas
      d'appel MCP synchrone ou async depuis les hooks, le refactor
      des 4 call sites sqlite3 ne peut pas se faire. Mitigation :
      étape 8.1 fait l'analyse en premier ; si bloquant, on
      garde sqlite3 inline pour cette itération et on documente
      via lesson + agent-message au PM. Fallback acceptable car
      le risque de corruption est largement réduit par les
      PILIERs A, B, C, D côté binaire ; les sqlite3 inlines du
      hook ne sont qu'un facteur additionnel.
    - >
      Risque 2 (MOYEN) — Impossibilité technique pour --index
      d'appeler index_now via MCP. C'est un écart documenté
      avec la PROPOSITION 1 étape 3 du RFC. Mitigation :
      sémantique "no-op + log + exit 0" appliquée à la place ;
      le file watcher serveur indexe dans la seconde grâce au
      debounce 500ms (latence acceptable selon design-doc).
      L'outil index_now est exposé côté serveur pour utilisateurs
      futurs (tests, agents avancés).
    - >
      Risque 3 (FAIBLE) — Un signal arrive AVANT que le file
      lock soit acquis (très tôt dans run_server) ou APRÈS
      sa libération. Cas extrême peu probable mais à valider :
      les signal handlers ne sont installés qu'AVANT le
      service.waiting().await ; un SIGTERM reçu plus tôt serait
      ignoré (comportement par défaut Linux = exit). Acceptable
      car la fenêtre est < 100ms en pratique.
    - >
      Risque 4 (FAIBLE) — Si reindex_all panique pendant le
      rebuild PILIER D, le binaire exite sans la DB repeuplée.
      Documenté dans le RFC comme cas dégénéré non couvert
      (le YAML lui-même est cassé). Mitigation : reindex_all
      logue chaque skip ; un YAML corrompu provoque un skip
      pas une panique, donc en pratique le rebuild aboutit.
    - >
      Risque 5 (FAIBLE) — La table write_permits est perdue lors
      du rebuild PILIER D. Le permit en cours
      (a685f08a-260d-4a6f-8c92-26b8d07ca5b5) serait perdu si
      le rebuild se déclenche pendant l'implémentation.
      Probabilité : très faible (la DB courante est saine et
      l'implémentation ne déclenchera pas de rebuild). Si ça
      arrive : le CEO devrait re-grant un nouveau permit, ce
      qui est gérable mais coûteux. Mitigation : surveiller la
      santé de la DB pendant l'implémentation, ne pas faire de
      kill -9 brutal sur le serveur tant que le code n'est pas
      mergé.
