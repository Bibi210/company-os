    - description: >
        Étape 7 — PILIER D : autorepair au boot (câblage main.rs).

        (7.1) Modifier crates/mcp-servers/orchestrator/src/main.rs,
              dans run_server() :
              - APRÈS l'acquisition du file lock (étape 5) et APRÈS
                l'ouverture de la DB + db.migrate() (existant), mais
                AVANT le spawn des tasks background (reindex_all et
                watcher) :

                if !db.integrity_check()? {
                    eprintln!(
                        "[orchestrator] Database corruption detected — \
                         rebuilding from YAML index source of truth"
                    );
                    drop(db);
                    let db_file = format!("{db_dir}/{}", constants::DB_FILENAME);
                    let _ = std::fs::remove_file(&db_file);
                    let _ = std::fs::remove_file(format!("{db_file}-wal"));
                    let _ = std::fs::remove_file(format!("{db_file}-shm"));
                    db = OrchestratorDb::open(&db_file)?;
                    db.migrate()?;
                    // Reindex synchronously (not background) here :
                    // we need a temporary engine + validator since the
                    // real ones haven't been built yet at this point in
                    // run_server. Solution : delay this rebuild until
                    // AFTER the engine and validator are built (just
                    // before the tokio::spawn), so we have everything
                    // we need.
                }

              EN PRATIQUE : pour éviter de manipuler engine et
              validator deux fois, on déplace ce check JUSTE APRÈS
              la construction de `validator` et `engine` (ligne ~760)
              mais AVANT le `Arc::new(Mutex::new(...))` qui les
              wrappe. Le rebuild se fait alors :

                let engine_inner = OrchestratorEngine::new(db, max_iterations);
                if !engine_inner.integrity_check()? {
                    eprintln!("[orchestrator] Database corruption detected ...");
                    let db = engine_inner.into_db_for_rebuild();
                    drop(db);
                    // delete files
                    let new_db = OrchestratorDb::open(&db_file)?;
                    new_db.migrate()?;
                    let mut engine_inner = OrchestratorEngine::new(new_db, max_iterations);
                    let count = engine_inner.reindex_all(&root, &validator)
                        .map_err(|e| anyhow::anyhow!("Rebuild reindex failed: {e}"))?;
                    eprintln!("[orchestrator] Rebuilt index with {count} artifacts");
                    engine_inner
                } else {
                    engine_inner
                }

              Pour cela, ajouter sur OrchestratorEngine :
                pub fn integrity_check(&self) -> Result<bool, OrchestratorError> {
                    self.db.integrity_check()
                }
                pub fn into_db_for_rebuild(self) -> OrchestratorDb {
                    self.db
                }

              Le into_db_for_rebuild est un escape hatch pour le
              rebuild ; il n'est exposé que côté binaire, à
              utiliser uniquement par run_server.

