    - description: >
        ÉTAPE 8 — Module fusion.rs (Reciprocal Rank Fusion).
        Nouveau fichier crates/orchestrator/src/fusion.rs, pure
        Rust, zéro I/O.

        API :
          pub struct RankedResult {
            pub id: String,
            pub rank: usize,  // 1-indexed
          }

          pub struct FusedResult {
            pub id: String,
            pub score: f64,
            pub lexical_rank: Option<usize>,
            pub semantic_rank: Option<usize>,
          }

          pub fn rrf_fuse(
            lexical: &[RankedResult],
            semantic: &[RankedResult],
            k: f64,
            top_n: usize,
          ) -> Vec<FusedResult>;

        Implémentation :
          - HashMap<String, FusedResult>.
          - Parcours lexical, set entry.lexical_rank = rank,
            score += 1.0 / (k + rank as f64).
          - Parcours semantic, set entry.semantic_rank = rank,
            score += 1.0 / (k + rank as f64).
          - Collect vers Vec, sort by score desc (avec id en
            tie-breaker pour déterminisme).
          - Truncate à top_n.

        Ajout dans lib.rs : `pub mod fusion;`.

        Tests unitaires :
          - test_rrf_only_lexical : un résultat présent uniquement
            dans lexical, son score = 1 / (k + 1).
          - test_rrf_only_semantic : symétrique.
          - test_rrf_both_higher_than_one : un résultat présent
            dans les deux a un score = 2 / (k + 1), supérieur à
            ceux présents dans une seule.
          - test_rrf_top_n_truncation.
          - test_rrf_deterministic_tie_breaker : deux ids avec
            même score, ordre stable.
