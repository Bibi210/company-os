  risks:
    - >
      Risque sqlite-vec pre-1.0 ABI/API. Mitigation : pin exact (=0.1.x),
      smoke test au boot (étape 3) qui détecte tout cassé silencieux.
      Si la crate change d'API entre 0.1.6 et 0.1.7 par exemple, le
      build fail et on adapte une seule fois.
    - >
      Risque fastembed-rs download au build sur certains environnements
      (ort runtime binary). Si le build CI échoue à cause de ça, on
      ajoute un .cargo/config.toml ou une étape CI pré-build qui
      télécharge ort. Hors permit target_paths, demander extension au
      moment si nécessaire.
    - >
      Risque déterminisme cross-architecture. Le déterminisme effectif
      est garanti same-machine (test étape 4) mais pas cross. Mitigation
      : architecture_marker concaténé dans model_version (étape 5), un
      switch de machine déclenche wipe + reindex automatique. Coût
      acceptable car rare.
    - >
      Risque dépassement latence p95 > 500ms. Mitigation : étape 18
      mesure tôt, l'étape 1 prévoit le fallback vers modèles plus
      petits ou batch d'embedding. Au pire, accepter p95 ~1s sur
      corpus actuel et documenter en lesson-learned.
    - >
      Risque trou de permit sur un fichier non listé. Mitigation
      proactive : la liste des fichiers à créer (embedding.rs,
      fusion.rs, query.rs, search_eval.yml, integration_search.rs,
      search-guide.md) EST dans le permit. Si une autre extension est
      nécessaire en cours (ex. nouveau .cargo/config.toml pour ort),
      agent-message au PM, pas de contournement.
    - >
      Arbitrage ureq vs reqwest (réponse explicite au finding F-plan-4
      iteration 2). Le RFC proposition 5 et le design-doc composant
      reranker-claude-optionnel ne fixent pas un binding HTTP précis.
      Le plan retient ureq pour les appels Anthropic Claude des couches
      optionnelles rerank/HyDE, sur trois critères : (a) synchrone par
      défaut, ce qui s'aligne avec le runtime fastembed lui-même
      synchrone et évite un mix async/sync à orchestrer ; (b) footprint
      plus léger (~150KB vs ~2MB pour reqwest avec ses features TLS +
      tokio) ; (c) zero feature flag à gérer côté Cargo. Inconvénient :
      pas d'API async native, donc l'engine.search wrap l'appel dans
      tokio::task::spawn_blocking pour ne pas bloquer le runtime tokio
      du serveur MCP. Décision maintenue pour cette itération. Mitigation
      en cas de regret : switch reqwest envisageable dans une seconde
      itération du système async-first transverse, coût ~1h de
      refactor localisé à engine.rs si nécessaire. Le risque de
      blocage permit (ureq absent du Cargo.toml workspace) est nul :
      Cargo.toml EST dans le permit a0b34bcd target_paths.
    - >
      Risque cargo test ignoré par défaut sur les tests d'intégration
      qui requièrent le cache embedding. Mitigation : documenter en
      docs/search-guide.md la commande à exécuter en CI
      (--prefetch-embeddings puis cargo test). Lesson-learned finale
      capitalise.
    - >
      Risque incident hook defense-in-depth en cours d'implémentation
      si une commande bash touche orchestrator.db. Mitigation : ne
      JAMAIS faire de sqlite3 inline sur orchestrator.db pendant
      l'implémentation. Utiliser check_write_permit() via MCP pour
      vérifier. Le permit a0b34bcd est déjà scellé donc safe.
