metadata:
  id: 640e2894-6d9e-4c75-bfc7-5a63ec3c84c9
  title: "Refonte search() en hybrid retrieval : plan d'implémentation détaillé (FTS5 BM25 durci + fastembed-rs + sqlite-vec + RRF + filtres + index_status)"
  author: implementer
  created_at: "2026-06-01"
  project: company-os
  changelog:
    - date: "2026-06-01"
      author: implementer
      description: >
        Révision iteration 2 suite au round e785a3e9 (vote Architect
        request_changes avec 5 findings, 3 bloquants + 2 non bloquants).

        F-plan-1 BLOQUANT (types.rs absent du permit a0b34bcd). RÉSOLU
        EN AMONT par PM + CEO via émission d'un permit complémentaire
        fb2a5053-3a29-4ba5-a125-f0b23cdbcf4b ciblant
        crates/orchestrator/src/types.rs, scellé en git par le PM avant
        relance. L'Implementer reflète ce permit complémentaire dans la
        description du plan, la section dependencies, et l'étape 21 qui
        consomme désormais les DEUX permits.

        F-plan-2 BLOQUANT (AC 8 partiel, p95 < 2s à corpus 10x non
        couvert). Ajout d'une étape 18-bis dédiée à la validation du
        comportement à corpus 10x. Approche retenue : génération
        synthétique d'un corpus de 756 artifacts (84 actuels * 9 copies
        avec UUIDs distincts et perturbations de contenu pour éviter la
        dégénérescence de l'index), benchmark des mêmes 20 queries de
        référence, vérification p95 < 2s. Approche fallback documentée
        au cas où la génération est lourde : extrapolation théorique par
        composant (embedding query O(1) constant, k-NN brute force O(N)
        linéaire, FTS5 BM25 O(matches) acceptable, RRF négligeable).

        F-plan-3 BLOQUANT (étape 21 confuse). Réécriture complète.
        Suppression de la confusion entre scellement initial (DÉJÀ
        FAIT par le PM en commits 5919adb pour a0b34bcd et celui pour
        fb2a5053) et commits finaux post-implémentation. Ordre corrigé
        en cohérence avec lesson 8fd49300 (write → commit → consume
        non-négociable, Layer 2 defense-in-depth vérifie status=active
        au moment du commit). Suppression de la phrase fautive sur
        `git add company/data/orchestrator.db` : .gitignore contient
        `*.db*` donc cet add est no-op sans `-f`, et de toute façon
        l'état consumed du permit n'a pas vocation à être persisté en
        git (la DB reste volatile, c'est volontaire).

        F-plan-4 NON BLOQUANT (ureq vs reqwest). Arbitrage documenté
        explicitement à l'étape 13 et dans la section risks. Le RFC
        proposition 5 ne mentionne pas un binding HTTP précis ; le
        design-doc non plus. Le choix ureq dans le plan est défendable
        sur trois critères : (a) synchrone par défaut, ce qui s'aligne
        avec le runtime fastembed (synchrone) et évite spawn_blocking
        sur le tokio runtime, (b) footprint plus léger (~150KB vs
        ~2MB pour reqwest avec ses features TLS + tokio), (c) zero
        feature flags à gérer (reqwest exige features `json` + `rustls`
        ou équivalent). Inconvénient : pas d'API async native, donc
        l'engine.search qui orchestre rerank/HyDE doit envelopper
        l'appel dans tokio::task::spawn_blocking pour ne pas bloquer
        le runtime. Décision maintenue : ureq pour la première
        itération. Si une seconde itération du système devient
        async-first transverse, switch vers reqwest envisageable.

        F-plan-5 NON BLOQUANT (checklist call sites
        OrchestratorEngine::new). Ajoutée à l'étape 7. Quatre call
        sites identifiés empiriquement par grep :
          - crates/mcp-servers/orchestrator/src/main.rs:848 (run_index)
          - crates/mcp-servers/orchestrator/src/main.rs:905 (run_server
            initial engine pre-autorepair check)
          - crates/mcp-servers/orchestrator/src/main.rs:926 (run_server
            rebuild engine post-autorepair)
          - crates/orchestrator/src/engine.rs:796 (test setup_engine)
        Tous doivent être mis à jour pour passer l'Arc<Embedder>.

        Aucune autre modification structurelle. Les 24 étapes
        d'origine sont conservées ; seules les étapes 7 et 21 sont
        réécrites, et une étape 18-bis est insérée entre 18 et 19
        (la numérotation des étapes 19-24 est décalée de +1, désormais
        25 étapes au total). Les décisions techniques tranchées à
        l'étape 1 (modèle E5Small, runtime fastembed-rs, sqlite-vec
        pin, etc.) restent inchangées.

  description: >
    Plan d'implémentation dérivé du design-doc f433fefc et du RFC bdee1af4
    (approuvé). Deux write permits actifs couvrant l'ensemble du scope :
    a0b34bcd-2af6-407a-b5a6-a264d28b3c7d (15 paths originaux) et
    fb2a5053-3a29-4ba5-a125-f0b23cdbcf4b (types.rs, ajouté en réponse au
    finding F-plan-1 de l'iteration 1). Tranche les deux incertitudes
    structurelles laissées ouvertes par l'Architect en cohérence avec les
    contraintes du RFC (autonomie runtime DURE, footprint < 1GB, latence
    p95 < 100ms par embedding, déterminisme effectif > 0.9999 cosine
    similarity sur la même machine). Décompose le chantier en 25 étapes
    ordonnées (24 d'origine + étape 18-bis pour la validation à corpus
    10x ajoutée en iteration 2), regroupées en sept blocs cohérents
    (pré-requis et dépendances, lexical durci, sémantique, fusion et
    API, observabilité, tests et benchmark, clôture). Chaque étape liste
    les fichiers impactés (tous couverts par les 16 target_paths cumulés
    des deux permits), sa dépendance amont, et son critère de validation.
    Le plan ne remet pas en cause les décisions architecturales tranchées
    par les iterations 2 et 3 du RFC et du design-doc. Si un trou de
    permit est découvert en cours d'exécution (par exemple un nouveau
    fichier non listé), l'Implementer s'arrête et demande extension via
    agent-message, conformément à la lesson 611fde3e.
