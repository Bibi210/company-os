    - description: >
        ÉTAPE 18-BIS — Validation à corpus 10x (p95 < 2s).
        Ajoutée en iteration 2 du plan (réponse au finding
        F-plan-2 BLOQUANT : l'AC 8 du task-request 02c9f6eb
        exige p95 < 500ms à corpus actuel ET p95 < 2s à un
        corpus 10x plus gros). L'étape 18 d'origine ne couvrait
        que la première moitié.

        APPROCHE PRINCIPALE — corpus synthétique 10x.

        Sous-étape (a) — génération du corpus de bench.

          Helper Rust dans crates/orchestrator/tests/
          integration_search.rs (ou sous-fichier
          bench_synthetic.rs gated par #[cfg(test)]) :

            fn generate_synthetic_corpus(
              source: &[IndexedArtifact],
              multiplier: usize,
            ) -> Vec<SyntheticArtifact>;

          Stratégie : pour chaque artifact source du corpus
          réel (84 actuels), générer (multiplier - 1) copies
          dérivées avec :
            - UUID v4 frais à chaque copie (zero collision).
            - Titre suffixé d'un marker " [synth-N]" (N =
              numéro de copie) pour garantir unicité tout en
              gardant le contenu sémantique proche.
            - Description et body : conservés à 90%, avec un
              shuffle léger des paragraphes ET ajout d'un
              paragraphe "synth filler" de 200-300 mots
              généré déterministiquement (par exemple en
              concaténant les tags + permutation d'un
              vocabulaire technique fixe). Ce filler évite
              que tous les artifacts soient strictement
              dupliqués, ce qui dégénérerait la qualité de
              l'index FTS5 (toutes les rows ayant le même
              score BM25) et masquerait la latence vraie de
              la kNN.
            - Tags conservés tels quels.
            - kind conservé tel quel.
          Cible : multiplier = 9 → 84 + 84*9 = 840 artifacts.
          Cohérent avec la cible AC8 "corpus 10x" (~840
          artifacts).

        Sous-étape (b) — indexation du corpus synthétique
        dans une DB temporaire isolée.

          Le test #[ignore] crée un répertoire temporaire
          via tempfile::tempdir(), pointe COMPANYOS_ROOT
          vers ce dossier, copie les YAML source (84
          artifacts du corpus actuel) + écrit les YAML
          synthétiques générés (756) dans projects/
          synthetic-bench/<kind>s/. reindex_all sur ce
          root → ~840 artifacts indexés.

          Coût attendu :
            - 840 embeddings * ~25ms = ~21s en synchrone.
            - Acceptable pour un test #[ignore] manuel.
            - Si trop lent, batch via fastembed embed(vec!) :
              fastembed supporte le batching, on peut passer
              64 textes à la fois → ~10s en pratique.
          Mesure de la latence de bench : on mesure
          uniquement search(), pas l'indexation.

        Sous-étape (c) — mesure des mêmes 20 queries de
        référence.

          Pour chaque query du fichier search_eval.yml :
            - Exécuter 10 fois pour réchauffer le cache OS
              et obtenir une distribution stable.
            - Mesurer t0..t9, calculer p50/p95/p99.
          Agréger sur les 20 queries : p50 globale, p95
          globale, p99 globale, par mode (hybrid, lexical,
          semantic).

          Critère de succès :
            - p95 hybrid à 10x corpus < 2000ms (AC 8).
            - p95 lexical et semantic sub-1000ms (gestes
              raisonnables).
          Si p95 > 2000ms, log l'écart et escalade au PM
          via agent-message ; arbitrage : soit on accepte
          la dégradation, soit on optimise (sqlite-vec
          activera un index ANN approximatif au-delà de
          quelques milliers de docs, hors scope iteration 1,
          mais on peut documenter le ticket de suivi).

        Sous-étape (d) — sortie du benchmark.

          Production de target/bench-results/
          search-latency-10x-<timestamp>.json avec p50/p95/p99
          par mode à 84 vs 840 artifacts. Récap stdout :
          tableau comparatif. La lesson-learned finale
          (étape 22) cite les chiffres.

        APPROCHE FALLBACK — extrapolation théorique
        rigoureuse (à utiliser SEULEMENT si la génération du
        corpus 10x se révèle bloquante, par exemple > 5min
        de wall-clock pour reindex).

          Décomposer search() en composants et borner chacun :
            (i)  Embedder query : O(1) constant, ~25ms
                 mesuré à corpus actuel. Inchangé à corpus 10x.
            (ii) FTS5 BM25 lexical : O(nb matches * log K),
                 avec nb matches grandissant linéairement avec
                 le corpus. À corpus actuel < 2ms (mesuré
                 6cfd1c62), extrapolation 10x = ~20ms. Marge
                 acceptable.
            (iii) sqlite-vec brute force kNN : O(N) sur le
                  nombre de vecteurs, latence dominée par le
                  dot product. À 84 vecteurs dim 384 : ~5ms
                  empirique attendu, extrapolation 10x =
                  ~50ms. Marge acceptable.
            (iv)  RRF : O(K_lex + K_sem + K log K) = ~50
                  candidats, négligeable < 1ms.
            (v)   Hydratation top-N : 10 SELECT par PK,
                  négligeable < 1ms par row.
          Somme bornée : 25 + 20 + 50 + 1 + 10 = ~106ms p50
          attendue à corpus 10x. p95 raisonnable 2-3x p50 →
          ~250-300ms. Largement sous 2s AC.

          L'extrapolation est documentée comme borne théorique ;
          on n'arbitre PAS l'AC sur l'extrapolation seule, on
          vise la mesure empirique. L'extrapolation sert à
          (a) justifier que le corpus 10x ne va pas exploser,
          (b) donner un budget par composant pour identifier
          rapidement le coupable si la mesure dérive.

        Validation finale étape 18-bis : `cargo test
        --test integration_search -- --ignored
        bench_search_latency_10x` produit un JSON conforme,
        p95 hybrid < 2000ms.
      files:
        - crates/orchestrator/tests/integration_search.rs

    - description: >
        ÉTAPE 19 — Migration du tokenizer FTS5 au boot. Cette
        étape garantit que le serveur, au premier démarrage
        post-merge, détecte l'ancien schéma FTS5 (sans
        tokenizer explicite) et le remplace.

        Implémentation : dans OrchestratorDb::migrate() ou un
        nouveau helper migrate_fts_if_needed() :
          - Lire le DDL actuel de artifacts_fts via
            SELECT sql FROM sqlite_master WHERE
              name='artifacts_fts'.
          - Si la chaîne ne contient pas "tokenize" ou ne contient
            pas "unicode61 remove_diacritics 2" : DROP TABLE
            artifacts_fts ; CREATE VIRTUAL TABLE selon
            FTS_SQL_NEW (qui contient le tokenizer explicite).
          - Idem pour artifacts table si elle ne contient pas
            les colonnes author/project/created_at (étape 10).
          - Idem pour artifacts_vec : si absente, créer
            (idempotent).
          - Après le DROP+CREATE : appeler le code de reindex_all
            (engine.reindex_all) pour repeupler. Mais reindex_all
            est sur l'engine, pas la DB. Solution : la migration
            elle-même ne reindex pas ; à la place, le code de
            run_server détecte qu'une migration a eu lieu (via un
            flag retourné par migrate) et appelle reindex_all
            synchrone APRÈS la création de l'engine.
          - Tout ce qui touche au schema est dans une transaction
            BEGIN IMMEDIATE.

        Garantie : un boot sur un repo qui était sur l'ancien
        schéma fait :
          1. Acquire flock.
          2. Open DB.
          3. integrity_check (PILIER D).
          4. load_extension sqlite-vec + smoke test.
          5. Check embedding cache.
          6. migrate (avec détection upgrade FTS5 + artifacts).
          7. Si upgrade FTS5 ou artifacts détecté : reindex_all
             synchrone.
          8. Check model_version : si mismatch, wipe vec +
             reindex_all (qui réutilise potentiellement le run
             précédent si déjà fait).
          9. Servir MCP.

        Coût attendu sur corpus 84 artifacts : < 10s total.

        Tests :
          - test_boot_upgrade_from_old_fts5_schema (peut être
            simulé en créant un OrchestratorDb avec l'ancien DDL,
            puis appeler migrate, vérifier que le nouveau DDL est
            en place).
