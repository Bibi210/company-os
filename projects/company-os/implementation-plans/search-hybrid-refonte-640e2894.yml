    - description: >
        ÉTAPE 6 — Pipeline d'indexation transactionnel. Modification
        de upsert_artifact dans db.rs pour inclure l'embedding dans
        la même transaction.

        Avant cette étape, upsert_artifact fait 3 DELETE puis 3
        INSERT séparés (artifacts, artifacts_fts,
        artifact_relations) hors transaction explicite. On passe à
        une transaction atomique englobant artifacts +
        artifacts_fts + artifacts_vec + artifact_relations.

        Nouvelle signature :
          pub fn upsert_artifact(
            &self,
            artifact: &IndexedArtifact,
            content: &str,
            embedding: &[f32],
            relations: &[ParsedRelation],
          ) -> Result<(), OrchestratorError>
        Le paramètre embedding est slice de f32 de longueur
        EMBEDDING_DIM (384). Le caller (engine.index_artifact à
        l'étape 7) calcule l'embedding avant l'appel.

        Corps :
          let tx = self.conn.transaction()?;
          tx.execute("DELETE FROM artifacts WHERE id = ?1", ...)?;
          tx.execute("DELETE FROM artifacts_fts WHERE id = ?1", ...)?;
          tx.execute("DELETE FROM artifacts_vec WHERE artifact_id =
            ?1", ...)?;  // ou DELETE BY rowid via subquery selon le
            schéma exact étape 5
          tx.execute("DELETE FROM artifact_relations WHERE source_id
            = ?1", ...)?;
          tx.execute("INSERT INTO artifacts ...", ...)?;
          tx.execute("INSERT INTO artifacts_fts ...", ...)?;
          // serialize embedding as the bytes blob attendu par
          // sqlite-vec (probably JSON array literal "[f1,f2,...]"
          // or raw little-endian f32 bytes, selon la doc
          // sqlite-vec pour la version pinnée)
          tx.execute("INSERT INTO artifacts_vec (artifact_id,
            embedding) VALUES (?1, ?2)", params![artifact.id,
            embedding_serialized])?;
          for rel in relations {
            tx.execute("INSERT OR IGNORE INTO artifact_relations
              ...", ...)?;
          }
          tx.commit()?;

        Si une seule étape échoue, le rollback automatique laisse
        la DB cohérente (aucune des 4 tables n'a écrit).

        Note importante : si le commit échoue après le calcul de
        l'embedding, on doit pouvoir signaler clairement à
        engine.index_artifact que l'artifact n'a PAS été indexé. La
        signature retourne Result, c'est l'usage habituel.

        Tests unitaires :
          - test_upsert_writes_all_three_tables : vérifie qu'après
            upsert, l'id est présent dans artifacts, artifacts_fts
            ET artifacts_vec.
          - test_upsert_rollback_on_vec_failure : provoquer une
            erreur sur l'INSERT vec (par exemple dimension wrong)
            et vérifier qu'aucune des autres tables n'a écrit.
            Marge tolérable : si la simulation d'erreur est trop
            invasive, ce test peut être skipé avec un commentaire.
          - test_upsert_re_index_replaces : upsert deux fois le
            même id avec embeddings différents, vérifie que la
            seconde valeur a remplacé la première dans
            artifacts_vec.
