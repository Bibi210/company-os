    - description: >
        ÉTAPE 7 — Engine.index_artifact étendu pour calculer
        l'embedding. Modification dans
        crates/orchestrator/src/engine.rs.

        OrchestratorEngine gagne un champ :
          embedder: Arc<Embedder>

        Le constructeur `new` prend l'embedder en paramètre :
          pub fn new(
            db: OrchestratorDb,
            max_iterations: u32,
            embedder: Arc<Embedder>,
          ) -> Self

        CHECKLIST des call sites à migrer (réponse au finding
        F-plan-5 iteration 2, identifiée par grep empirique sur le
        code actuel) :

          1. crates/mcp-servers/orchestrator/src/main.rs:848
             — dans run_index, OrchestratorEngine::new(db,
             DEFAULT_MAX_ITERATIONS). Il faut charger l'embedder
             via Embedder::load_from_cache(&root) avant cet appel
             et le passer en 3e argument. Si load échoue (cache
             absent), exit non-zero immédiat avec message clair.

          2. crates/mcp-servers/orchestrator/src/main.rs:905
             — dans run_server, première instanciation de
             l'engine avant integrity_check. Mêmes modifications.
             L'Arc<Embedder> est chargé UNE seule fois en haut de
             run_server et partagé entre les deux engines
             (instance initiale + instance post-autorepair).

          3. crates/mcp-servers/orchestrator/src/main.rs:926
             — dans run_server, deuxième instanciation après
             autorepair (new_engine = OrchestratorEngine::new(
             new_db, max_iterations)). L'Arc<Embedder> clone'd
             pour la deuxième fois, c'est gratuit (Arc::clone).

          4. crates/orchestrator/src/engine.rs:796
             — dans le module tests, fn setup_engine(). Il
             faut charger un embedder de test, ce qui exige le
             cache embedding pré-fetché. Gating proposé :
             si cache absent au démarrage du test, panic avec
             message "test requires prefetched embedding cache,
             run cargo run --bin companyos-orchestrator-server
             -- --prefetch-embeddings first". Alternative : créer
             un MockEmbedder qui retourne un vecteur constant
             (déterministe mais dénué de sens sémantique), gated
             par #[cfg(test)]. Décision : pour les tests unitaires
             du module engine.rs qui testent la logique de
             consensus / review (test_consensus_*), on utilise
             MockEmbedder ; pour les tests qui testent le pipeline
             d'embedding (test_index_artifact_writes_embedding),
             on utilise Embedder::load_from_cache. Le helper
             setup_engine accepte un paramètre embedder ou existe
             en deux variantes : setup_engine_mock() et
             setup_engine_real().

        Tous les callers transverses (autres crates) ont été
        vérifiés : aucun n'instancie OrchestratorEngine directement
        (les tests integration_lock du crate orchestrator passent
        par les helpers de tests/test_helpers.rs, à vérifier au
        moment du code).

        index_artifact() est étendue :
          (1) Parse YAML comme aujourd'hui.
          (2) extract_artifact_metadata.
          (3) extract_searchable_content (le `content` actuel pour
              FTS).
          (4) extract_relations.
          (5) NOUVEAU : embedder.embed_artifact_view(yaml, kind)
              avant l'appel db.upsert_artifact.
          (6) db.upsert_artifact(&artifact, &searchable, &embedding,
              &relations).
        Si (5) échoue (modèle indispo, OOM, panic) : on retourne
        l'erreur, rien n'est upserté dans aucune des tables
        (cohérent avec le rollback complet imposé par la
        proposition 7 du RFC).

        Note de performance. L'embedder.embed est synchrone côté
        fastembed (potentiel blocage du thread tokio). Mesure
        attendue ~25ms par texte. Sur le file watcher (debounce
        500ms par fichier) c'est négligeable. Sur reindex_all,
        84 artifacts * 25ms ~= 2.1s synchrones, acceptable au
        boot. Si l'étape 18 mesure > 100ms par embedding,
        envisager :
          (a) spawn_blocking pour ne pas bloquer le tokio runtime,
          (b) batch d'embeddings sur reindex_all (fastembed
              supporte batch).
        À ce stade, pas d'optimisation prématurée.

        Tests unitaires :
          - test_index_artifact_writes_embedding : index un YAML,
            vérifie via db que artifacts_vec contient une row.
          - test_index_artifact_failure_no_partial_write :
            si embedder retourne Err (simuler via un trait mock ou
            un embedder factice), aucune des 3 tables n'a écrit.
            Si trop invasif à simuler, accepter une marge.
