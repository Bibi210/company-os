    - description: >
        ÉTAPE 11 — Nouvelle méthode search_semantic dans db.rs,
        puis engine.search() refondue qui orchestre lexical +
        semantic + fusion + filtres + (rerank/hyde optionnels), et
        enfin MCP main.rs avec la nouvelle struct SearchParams.

        (A) crates/orchestrator/src/db.rs : nouvelle méthode

              pub fn search_semantic(
                &self,
                embedding: &[f32],
                filters: &SearchFilters,
                limit: usize,
              ) -> Result<Vec<RankedResult>, OrchestratorError>;

            SQL squelette (sqlite-vec syntax) :
              SELECT a.id,
                     ROW_NUMBER() OVER (ORDER BY v.distance) AS rank
              FROM artifacts_vec v
              JOIN artifacts a ON a.id = v.artifact_id
              WHERE v.embedding MATCH ?
                AND v.k = ?
                AND (filtres ...)
              ORDER BY v.distance;

            Note : selon la version de sqlite-vec, le pré-filtre
            avec JOIN avant le MATCH peut nécessiter un sous-SELECT
            ou un partition_key. À tester à l'écriture : si le
            JOIN dégrade la qualité de la kNN, fallback sur post-
            filter : récupérer top-K' > K élargi sans filtre, puis
            filtrer en Rust à K. Le contrat fonctionnel est
            préservé.

        (B) crates/orchestrator/src/engine.rs : refonte de search()

              pub enum SearchMode { Lexical, Semantic, Hybrid }

              pub struct SearchRequest {
                pub query: String,
                pub mode: SearchMode,  // default Hybrid
                pub filters: SearchFilters,
                pub limit: usize,
                pub rerank: bool,
                pub hyde: bool,
                pub explain: bool,
              }

              pub struct SearchResponse {
                pub results: Vec<ArtifactSummary>,
                pub explain: Option<ExplainTrace>,
              }

              pub fn search(&self, req: SearchRequest)
                -> Result<SearchResponse, OrchestratorError>;

            Pipeline interne :
              (1) Si query vide ET filters tous vides : erreur
                  "empty query requires at least one filter".
              (2) Si query vide ET filters non vides : list par
                  filtres ordonnés par created_at desc (bypass FTS
                  et embed).
              (3) Normaliser query : sanitize_fts_query(query,
                  Natural).
              (4) Selon mode :
                  Lexical : lexical_path uniquement.
                  Semantic : semantic_path uniquement.
                  Hybrid : les deux + rrf_fuse.
              (5) lexical_path : db.search_lexical(fts_query,
                  filters, K_RETRIEVE=50). Retourne
                  Vec<RankedResult>.
              (6) semantic_path : si hyde=true et clé Anthropic OK,
                  query_for_embed = hyde_expansion(query) (étape
                  13) sinon query_for_embed = query original.
                  embedding = embedder.embed_text(query_for_embed).
                  db.search_semantic(&embedding, filters,
                  K_RETRIEVE=50). Retourne Vec<RankedResult>.
              (7) Fusion : rrf_fuse(lex, sem, 60.0, limit).
              (8) Hydrater FusedResult en ArtifactSummary via
                  db.get_artifact pour chaque id (lecture rapide,
                  PRIMARY KEY).
              (9) Si rerank=true et clé Anthropic OK : passer
                  top-K=20 à claude_rerank (étape 13). Sinon top-N.
              (10) Si explain=true : remplir ExplainTrace
                   (mode_applied, candidate_set_sizes, scores RRF,
                   timings). Sinon None.

            Branchements pour rerank/hyde (étape 13). Pour cette
            étape on stub : on accepte les paramètres mais on
            retourne une erreur explicite "rerank/hyde requires
            implementation (step 13)" si activés. L'étape 13 lève
            le stub.

        (C) crates/mcp-servers/orchestrator/src/main.rs : nouvelle
            SearchParams qui supporte les paramètres optionnels du
            RFC. Compat ascendante : query, kind, limit conservent
            leur position et leur sémantique. Nouveaux paramètres
            : author, tags, project, created_after, created_before,
            id_prefix, mode, rerank, hyde, explain. Tous Option<T>.

            Dans `async fn search`, construire une SearchRequest et
            appeler engine.search(req). Reformater la réponse en
            JSON identique au format actuel pour les champs
            existants, et ajouter explain si demandé.

            Migration du seul caller interne main.rs:569 (qui était
            engine.search(&params.query, params.kind.as_deref(),
            limit)) : transformé en un appel via SearchRequest
            construite à partir de SearchParams.

        Tests unitaires (engine.rs et db.rs) :
          - test_search_hybrid_returns_results_present_in_lex_or_sem
          - test_search_lexical_mode_returns_only_lex
          - test_search_semantic_mode_returns_only_sem
          - test_search_empty_query_with_filter_returns_list
          - test_search_empty_query_without_filter_errors
          - test_search_explain_populates_trace
