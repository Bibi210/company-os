    - description: >
        ÉTAPE 21 — Clôture du cycle write permits (séquence de
        commits chirurgicaux pendant l'impl, validation finale,
        consume des DEUX permits, reload_config).

        RÉÉCRITE en iteration 2 (réponse au finding F-plan-3
        BLOQUANT). Trois clarifications par rapport à l'iteration 1 :
        (a) le scellement initial des permits est DÉJÀ FAIT par le
        PM en amont (cf. statut commits ci-dessous), donc cette
        étape ne le re-mentionne plus. (b) L'ordre commit final
        → consume est strict, conforme à la lesson 8fd49300 (Layer 2
        defense-in-depth vérifie status=active au moment du commit ;
        un consume avant le commit final bloque le commit). (c) La
        phrase fautive sur `git add company/data/orchestrator.db`
        est supprimée : .gitignore contient `*.db*` donc cet add
        est no-op sans `-f`, et de toute façon l'état consumed du
        permit ne doit pas être persisté en git (la DB reste
        volatile par design, cohérent avec PILIER D du RFC
        cdbfee72 — la DB est reconstructible depuis les YAML).

        STATUT INITIAL DES PERMITS (rappel, déjà fait par PM).

          Permit a0b34bcd-2af6-407a-b5a6-a264d28b3c7d :
            - Émis par CEO le 2026-06-01T13:36:32Z.
            - 15 target_paths originaux.
            - Scellé en git par le PM dans le commit 5919adb
              ("chore: seal write permit a0b34bcd for RFC
              bdee1af4").

          Permit fb2a5053-3a29-4ba5-a125-f0b23cdbcf4b :
            - Émis par CEO le 2026-06-01T14:01:19Z en réponse au
              finding F-plan-1 de l'iteration 1 du présent plan.
            - 1 target_path : crates/orchestrator/src/types.rs.
            - Scellé en git par le PM avant relance Architect
              iteration 2.

        SÉQUENCE PENDANT L'IMPLÉMENTATION (Phase 2).

          (1) Commits chirurgicaux. Chaque étape (ou groupe d'étapes
              cohérent) est commité dès que cargo build + tests
              unitaires locaux sont verts. Format de message :
              "feat(<scope>): <résumé> (plan 640e2894 étape N)".
              Ces commits TOUCHENT les zones protégées listées
              dans les target_paths cumulés des deux permits, donc
              le Layer 2 defense-in-depth vérifiera que au moins
              un permit actif couvre les fichiers à chaque commit.
              C'est garanti par construction tant que les deux
              permits sont status=active.

          (2) get_diagnostics LSP après chaque modif Rust pour
              capture immédiate des erreurs de typage / import.

          (3) cargo test au fur et à mesure pour valider les tests
              unitaires nouveaux.

        SÉQUENCE FINALE DE CLÔTURE (à exécuter dans cet ordre
        strict, après que TOUTES les étapes 2-20 sont commitées).

          (a) cargo build (sans --target-dir, conformément à la
              règle hotreload_last : c'est cet appel précis qui
              déclenche le hot-reload du binaire MCP).

          (b) cargo test (toute la suite, 0 failed). Inclut les
              tests unitaires nouveaux (étape 16) et les tests
              d'intégration (étape 17). Les tests bench p95 et
              le test 10x sont #[ignore] par défaut, non bloquants
              pour cette étape mais on les exécute en plus avec
              --ignored pour valider les AC 6 et 8.

          (c) COMMIT FINAL du code restant non-commité (si
              applicable, par exemple un dernier ajustement de
              constantes après le benchmark étape 18). Ce commit
              est le DERNIER commit qui touche les zones protégées.
              Si tout a déjà été commité chirurgicalement, cette
              étape (c) est un no-op et on saute directement à (d).

          (d) consume_write_permit(persona=implementer, permit_id=
              a0b34bcd-2af6-407a-b5a6-a264d28b3c7d, token=<token
              de session>). Le permit principal passe de status
              active à consumed. Le Layer 2 defense-in-depth ne
              rejettera plus les commits suivants sur les 15 paths
              de a0b34bcd car il n'y a plus de commit prévu sur ces
              paths.

          (e) consume_write_permit(persona=implementer, permit_id=
              fb2a5053-3a29-4ba5-a125-f0b23cdbcf4b, token=<token
              de session>). Le permit complémentaire passe à
              consumed lui aussi. Les deux permits sont désormais
              clos.

          (f) reload_config() en TOUT DERNIER. C'est l'application
              de la règle hotreload_last : reload_config peut
              recharger le binaire MCP et couper la connexion
              active, perdant le contexte de session. Les
              conditions préalables (a) et (b) sont vérifiées, et
              les deux consume_write_permit (d) et (e) sont faits.

        IMPORTANT — ce qu'il ne faut PAS faire à cette étape.
          - Ne PAS consume avant le commit final (lesson 8fd49300 :
            Layer 2 rejette les commits si permit consumed).
          - Ne PAS faire `git add company/data/orchestrator.db`
            sans `-f` : .gitignore (`*.db*`) rend cet add no-op.
            Et l'état consumed des permits n'a pas vocation à être
            persisté en git (volontaire, cohérent avec PILIER D).
          - Ne PAS oublier le second permit fb2a5053 : oublier la
            consommation laisse un permit actif inutile en DB,
            détecté à la prochaine session.
