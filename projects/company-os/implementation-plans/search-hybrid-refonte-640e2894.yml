        ÉTAPE 15 — Jeu de queries de référence search_eval.yml.
        Création de
        crates/orchestrator/tests/search_eval.yml.

        Format YAML :
          version: 1
          queries:
            - id: q01
              query: "search semantic embeddings vector"
              category: symptom  # nominal / semantic / lexical
                                 # / mixed / edge_case / symptom
              expected_ids:
                - 6cfd1c62-...  # diagnostic report
                - f433fefc-...  # design doc
                - bdee1af4-...  # rfc
              note: "Query du symptôme original task-request"
            - ... (20 queries au total)

        Couverture obligatoire (proposition 10 du RFC) :
          - 5 queries lexicales pures (UUIDs, identifiants).
          - 5 queries sémantiques pures (paraphrases).
          - 5 queries mixtes.
          - 5 queries edge cases (vide+filtre, multilingue mélangé,
            query trop longue, opérateurs FTS5 hérités, UUID
            complet).
          - 3 queries du symptôme task-request 02c9f6eb (incluses
            dans les 20).

        Liste suggérée (à finaliser au moment de l'écriture en
        regardant le corpus actuel) :
          symptom : q01 "search semantic embeddings vector",
                    q02 "recherche memoire collective FTS",
                    q03 "lookup memoire faux negatif".
          lexical_pur : q04 "bdee1af4", q05 "cdbfee72",
                        q06 "PILIER A flock", q07 "fastembed",
                        q08 "sqlite-vec".
          semantic_pur : q09 "concurrence base de données",
                         q10 "tests de qualité review",
                         q11 "modèle d'embedding multilingue",
                         q12 "fenêtre de contention SQL",
                         q13 "stratégie de retrieval moderne".
          mixed : q14 "RFC cdbfee72 résilience WAL",
                  q15 "lesson learned 611fde3e",
                  q16 "design-doc embedding RRF",
                  q17 "diagnostic search faux négatif",
                  q18 "implementation plan orchestrator".
          edge : q19 query="" + filter kind=rfc,
                 q20 query="résumé du jeu de queries 20+ words ..."
                 (string > 200 chars).

