    - description: >
        ÉTAPE 13 — Couches optionnelles reranker Claude et HyDE.
        Modifications dans engine.rs (lift le stub de l'étape 11).

        Architecture :
          - Deux fonctions privées dans engine.rs :
              fn claude_rerank(&self, query: &str,
                candidates: Vec<ArtifactSummary>)
                -> Result<Vec<ArtifactSummary>, OrchestratorError>;
              fn hyde_expansion(&self, query: &str)
                -> Result<String, OrchestratorError>;

          - Both check std::env::var("ANTHROPIC_API_KEY"). Si
            absente, retourne OrchestratorError::AnthropicKeyMissing
            avec message "rerank=true (resp. hyde=true) requires
            ANTHROPIC_API_KEY".

          - Implémentation HTTP. Pour la première version, on
            utilise reqwest::blocking via tokio::task::spawn_blocking
            depuis l'engine. Note : pour ne pas alourdir les
            dépendances workspace, alternative : utiliser
            `ureq` (plus léger, dépendance unique). Décision plan :
            commencer avec `ureq` pour minimiser le footprint deps.
            Si refactor nécessaire, switch ultérieur.

          - Note dépendances : ureq n'est PAS dans le permit
            target_paths. STOP. Cette étape exige d'ajouter ureq à
            workspace.dependencies (Cargo.toml DANS le permit) et
            à crates/orchestrator/Cargo.toml (DANS le permit). OK,
            on peut ajouter. Si le PM/CEO préfère une autre stack
            HTTP, le signaler.

          - Modèle Claude : claude-3-5-haiku-latest (ou variable
            d'env ANTHROPIC_MODEL pour override). Timeout 5s.

          - HyDE prompt :
            "Generate a single short technical paragraph (100-200
            words) that hypothetically answers this query.
            Query: <query>. Paragraph:"
            Output retourné as-is, c'est embedé par le pipeline.

          - Rerank prompt :
            "Given the query <query>, rerank the following
            candidates by relevance. Return a JSON array of ids in
            best-to-worst order. Candidates: [<id, title, desc>
            ...]"
            Parser le JSON ; en cas d'échec de parse, fallback
            silent SUR LE CLASSEMENT RRF NON-RERANGÉ et log un
            warning explicite (proposition 5 du RFC : fallback
            EXPLICITE avec warning).

        Modifications dans engine.search (étape 11(B)) :
          - HyDE : appelé AVANT embedder.embed_text si hyde=true.
            L'embedding est calculé sur le pseudo-document, pas la
            query originale. Le chemin lexical garde la query
            originale.
          - Rerank : appelé APRÈS rrf_fuse, prend top-K=20 et
            retourne top-N.

        Tests unitaires : exigent ANTHROPIC_API_KEY donc gated par
        une feature flag de test `#[cfg_attr(not(feature =
        "anthropic-tests"), ignore)]`. Tests minimum :
          - test_rerank_requires_api_key (avec env vide, erreur
            attendue, ne dépend pas de la clé).
          - test_hyde_requires_api_key (idem).

        Note : le test "appel HTTP réussit" n'est PAS dans le
        scope automatisé CI (dépend du réseau et coûte un appel
        API). Documenté en lesson-learned finale.
