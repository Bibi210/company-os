    - description: >
        ÉTAPE 10 — Tokenizer FTS5 explicite et BM25 ranking côté
        SQL. Modifications dans crates/orchestrator/src/db.rs.

        (a) Constante FTS_SQL remplacée par FTS_SQL_NEW :
              "CREATE VIRTUAL TABLE IF NOT EXISTS artifacts_fts
                USING fts5(
                  id UNINDEXED,
                  kind,
                  title,
                  description,
                  tags,
                  content,
                  tokenize = 'unicode61 remove_diacritics 2
                             separators ''-_./\""'''
                );"
            Note : la syntaxe FTS5 pour tokenize accepte une string
            avec options. Le `separators` accepte une chaîne où
            chaque caractère est un séparateur. Apostrophes et
            guillemets doivent être échappés selon les règles
            SQLite (double-quote / double-single-quote). Validation
            empirique au cours de l'étape 19 (migration au boot).

        (b) search_artifacts() est REMPLACÉE par une nouvelle
            méthode signature :

              pub fn search_lexical(
                &self,
                fts_query: &str,  // déjà sanitizé par caller
                filters: &SearchFilters,
                limit: usize,
              ) -> Result<Vec<RankedResult>, OrchestratorError>;

            où SearchFilters est une nouvelle struct dans types.rs :
              pub struct SearchFilters {
                pub kind: Option<Vec<String>>,
                pub author: Option<String>,
                pub tags: Option<Vec<String>>,
                pub project: Option<String>,
                pub created_after: Option<String>, // RFC3339
                pub created_before: Option<String>,
                pub id_prefix: Option<String>,
              }
            Pas tous les filtres ont une colonne dédiée dans
            artifacts. Note : artifacts.author, artifacts.project,
            artifacts.created_at NE SONT PAS dans le schéma actuel
            (cf. db.rs lignes 37-45). Décision : étendre la table
            artifacts pour ajouter ces colonnes en NULL-tolerant,
            et les peupler dans extract_artifact_metadata (étape
            14 si nécessaire). Pour la première version, on peut
            commencer minimaliste : kind et tags supportés en SQL,
            author/project/dates ignorés avec un commentaire
            "TODO : nécessite extension du schéma artifacts".
            Décision plan : ON IMPLÉMENTE le schéma étendu DÈS
            cette étape pour ne pas refactorer plus tard.

            Extension de la table artifacts (modif du SCHEMA_SQL) :
              CREATE TABLE IF NOT EXISTS artifacts (
                id TEXT PRIMARY KEY,
                kind TEXT NOT NULL,
                title TEXT NOT NULL DEFAULT '',
                description TEXT NOT NULL DEFAULT '',
                tags TEXT NOT NULL DEFAULT '[]',
                file_path TEXT NOT NULL,
                indexed_at TEXT NOT NULL,
                author TEXT NULL,
                project TEXT NULL,
                created_at TEXT NULL
              );
            extract_artifact_metadata (engine.rs) lit metadata.author,
            metadata.project, metadata.created_at depuis le YAML.
            La migration au boot (étape 19) DROP + CREATE de la
            table fera l'upgrade automatiquement.

          SQL généré dans search_lexical (squelette) :
            SELECT a.id, bm25(artifacts_fts, 10, 5, 3, 1) AS rank
            FROM artifacts_fts f
            JOIN artifacts a ON a.id = f.id
            WHERE artifacts_fts MATCH ?
              AND (?kind IS NULL OR a.kind IN (...))
              AND (?author IS NULL OR a.author = ?)
              AND (?project IS NULL OR a.project = ?)
              AND (?created_after IS NULL OR a.created_at >= ?)
              AND (?created_before IS NULL OR a.created_at <= ?)
              AND (?id_prefix IS NULL OR a.id LIKE ?)
            ORDER BY rank
            LIMIT ?
          Les filtres conditionnels sont implémentés via
          construction dynamique de la WHERE clause + paramètres
          bindés (pas de string formatting des valeurs, sécurité
          SQL).

          Filtre tags : artifacts.tags est JSON. Pour matcher OR
          d'un tag, EXISTS (SELECT 1 FROM json_each(a.tags) WHERE
          json_each.value IN (?, ?, ?)). Coût acceptable pour
          notre échelle.

        Note : bm25(table, w1, w2, w3, w4) requiert AUTANT de
        poids que de colonnes INDEXÉES (kind, title, description,
        tags, content soit 5 — id est UNINDEXED). Ajuster : 5
        poids : w_kind=0, w_title=10, w_description=3, w_tags=5,
        w_content=1. w_kind=0 parce que kind n'a pas vocation à
        contribuer au ranking (c'est un filtre).

        Tests unitaires :
          - test_search_lexical_kind_filter.
          - test_search_lexical_tags_filter.
          - test_search_lexical_bm25_orders_title_above_body :
            deux artifacts, un avec le mot dans le title, l'autre
            dans le content, le premier remonte premier.
          - test_search_lexical_unicode_diacritics : "résumé"
            matche "resume".
          - test_search_lexical_separators_tokenize_identifier :
            "sqlite-vec" indexé peut être trouvé par "sqlite" ou
            "vec".
