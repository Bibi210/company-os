spec:
  steps:
    - description: >
        ÉTAPE 1 — Décisions tranchées et constantes. Ce n'est pas une
        étape d'écriture : c'est la table des arbitrages que les étapes
        suivantes appliquent. Les valeurs ci-dessous sont les défauts ;
        elles peuvent être ajustées par l'étape 18 (benchmark) si une
        mesure empirique le justifie, avec rationale documenté en
        changelog du plan.

        DÉPENDANCES EXTERNES (target_paths Cargo.toml + Cargo.lock du
        permit).
          - rusqlite : conserver "0.32" (compatible avec sqlite-vec
            actuel), AJOUTER la feature "load_extension" en plus de
            "bundled".
          - sqlite-vec (crate Rust qui empacquette la lib C statique
            via build.rs) : version exacte pinnée. Cible "=0.1.6" ou la
            dernière 0.1.x publiée à l'instant du merge, à confirmer
            empiriquement à l'étape 2. La crate expose
            sqlite_vec::sqlite3_vec_init et un helper d'enregistrement
            via sqlite3_auto_extension. Pin EXACT (=) imposé par
            F-rfc-4 du RFC, smoke test au boot imposé à l'étape 3.
          - fastembed : version "=5.x.y" exact, dernière 5.x publiée
            au merge. Justification du choix : seul runtime Rust qui
            respecte (i) autonomie runtime au moment de embed() une
            fois les poids en cache local, (ii) catalogue de modèles
            multilingues testés et quantizés int8/fp16, (iii) API
            synchrone simple (TextEmbedding::try_new + embed(&[txt])),
            (iv) gestion des poids déterministe via Hugging Face
            cache. Le RFC F-commun-1 (iteration 3) a explicitement
            assoupli la contrainte "Rust pur" et accepte FFI vers ONNX
            Runtime.

        MODÈLE D'EMBEDDING BASELINE.
          - Choix : fastembed::EmbeddingModel::MultilingualE5Small.
          - Justification : 118M paramètres, dimension 384, quantization
            int8, footprint disk ~120MB, footprint RAM chargé ~150MB,
            latence CPU ~20-40ms par texte court, multilingue natif
            (entraîné sur 100+ langues dont FR et EN technique). Tient
            largement dans la contrainte footprint < 1GB et latence
            < 100ms. Score MIRACL/MTEB multilingue solide pour la
            taille.
          - model_version stocké en DB : la chaîne
            "intfloat/multilingual-e5-small@v1" (model_name + tag
            interne). Tout changement de modèle bump cette chaîne et
            déclenche wipe + reindex_all automatique au boot (cf.
            étape 5).
          - Fallback documenté : si le benchmark de l'étape 18 montre
            précision@10 < 0.5 sur le bench, escalade vers
            MultilingualE5Base (278M, dim 768, ~280MB) puis
            ParaphraseMlMpnetBaseV2 (278M, dim 768). Si toutes
            insuffisantes, BgeM3 quantizé (568M, dim 1024). Le
            changement de modèle change model_version, donc tout
            reindex au boot est gratuit.

        DIMENSIONS DU VECTEUR.
          - 384 pour la baseline E5Small. La création de la table
            virtuelle artifacts_vec fige ce paramètre. Un changement
            de modèle qui changerait la dimension déclenche
            wipe + DROP + CREATE de artifacts_vec dans le code de
            détection model_version (étape 5).

        MÉTRIQUE DE DISTANCE.
          - cosine. Les embeddings sentence-transformers sont
            normalisés L2 implicitement par fastembed (option
            normalize=true). cosine distance = 1 - dot product, donc
            sqlite-vec va calculer L2 distance sur vecteurs L2-normés
            = équivalent monotone à cosine. Le SELECT trie sur
            distance ASC, donc plus petit = plus proche, sans
            ambiguïté.

        CONSTANTES DE FUSION ET BM25.
          - K_RETRIEVE (top-K par chemin avant fusion) : 50. Couvre
            largement le besoin d'un top-N=10 fusionné et reste
            sub-10ms en lexical comme en sémantique sur le corpus
            actuel.
          - k_RRF (smoothing constant) : 60. Valeur canonique TREC,
            robuste empiriquement. À éventuellement ajuster à l'étape
            18.
          - Poids BM25 par colonne : w_title=10, w_tags=5,
            w_description=3, w_content=1. Cohérent avec la
            recommandation initiale du RFC proposition 1. La fonction
            bm25() de FTS5 attend les poids dans l'ordre des colonnes
            indexées (cf. étape 10).

        TOKENIZER FTS5 EXPLICITE.
          - unicode61, remove_diacritics=2 (NFKD folding),
            tokenchars="" (rien à ajouter aux tokens par défaut),
            separators="-_./'\"" (cinq caractères ajoutés aux
            séparateurs par défaut de unicode61). Cela tokenise
            "sqlite-vec" en {sqlite, vec}, "BGE-M3" en {bge, m3},
            "rfc/bdee1af4" en {rfc, bdee1af4}, et l'apostrophe et
            le guillemet en séparateurs garantit qu'un "l'agent"
            tokenise en {l, agent}. NFKD fold diacritics donc
            "résumé" et "resume" matchent.

        PIPELINE DE CALCUL D'EMBEDDING.
          - Vue embeddable : metadata.title + ". " +
            metadata.description + ". " + tags.join(", ") + ". " +
            body_text_by_kind, où body_text_by_kind concatène les
            champs sémantiques de spec selon le kind (mapping détaillé
            à l'étape 4). Si la concaténation dépasse 8192 caractères
            (proxy raisonnable de 2048 tokens E5), tronquer à droite
            sans chunking (décision design-doc).
          - normalize=true (cosine via L2 sur vecteurs normés).

        MÉCANIQUE PRE-FETCH.
          - Mode CLI dédié du binaire orchestrator :
            `--prefetch-embeddings`. Charge le modèle via
            fastembed::TextEmbedding::try_new (qui télécharge dans le
            cache HF par défaut, redirigé vers
            company/data/embeddings/cache/<model_version>/ via
            variable d'environnement HF_HOME ou option fastembed).
            Affiche "OK" et exit 0 si succès. Cette commande est
            idempotente.
          - Check au boot : avant ouverture du serveur (run_server),
            APRÈS load_extension sqlite-vec et AVANT smoke test,
            vérifier la présence du cache. Si absent : exit non-zero
            avec message "embedding model cache not found at <path>,
            run cargo run -- --prefetch-embeddings first".
          - Note : fastembed gère la résolution du cache en interne ;
            on peut s'appuyer sur cette gestion plutôt que ré-
            inventer le check fichier-par-fichier. Décision tactique
            à l'étape 4 : essayer un load "léger" (initialiser le
            TextEmbedding et capturer l'erreur si pas de cache et pas
            de réseau) plutôt qu'un check filesystem. Si fastembed
            tente le réseau et échoue, on remonte une erreur claire.
            Si fastembed s'appuie sur HF_HUB_OFFLINE=1 pour bloquer
            le réseau, on set la variable au boot. Détail technique
            à valider en code à l'étape 4.

        CACHE_DIR.
          - company/data/embeddings/cache/<model_version>/ avec
            <model_version> = "multilingual-e5-small-v1" (slug du
            model_version pour éviter les "@" dans le path). Le path
            est créé par --prefetch-embeddings et lu au boot.
          - Le dossier company/data/embeddings/ est ajouté au
            .gitignore (étape 4 inclut cette modification, mais
            .gitignore n'est PAS dans le permit donc on devra demander
            extension si nécessaire ; alternatif : un nouveau
            sous-dossier company/data/ déjà gitignored par
            company/data/orchestrator.db pattern. À vérifier au
            moment du code).

        Aucune écriture de fichier à cette étape ; c'est la table
        des décisions que les étapes suivantes consomment.
      files: []

    - description: >
        ÉTAPE 2 — Ajout des dépendances workspace. Modification
        unique du Cargo.toml racine pour activer la feature
        load_extension de rusqlite, et ajout de fastembed et
        sqlite-vec dans workspace.dependencies. Cargo.lock va se
        régénérer au prochain build, c'est attendu.

        Modifications précises :
          - rusqlite : `features = ["bundled", "load_extension"]`
            (au lieu de `["bundled"]` actuel).
          - Ajouter : `fastembed = "=5.x.y"` (version exacte à fixer
            au moment de l'écriture du code en consultant crates.io
            pour la dernière 5.x stable).
          - Ajouter : `sqlite-vec = "=0.1.x"` (idem dernière 0.1.x
            stable, contrainte F-rfc-4).

        Le crate orchestrator (crates/orchestrator/Cargo.toml) ajoute
        ces deux dépendances avec workspace = true.

        Le crate mcp-servers/orchestrator (crates/mcp-servers/
        orchestrator/Cargo.toml) ne change PAS : il consomme
        l'orchestrator via le path, donc bénéficie transitivement
        des nouvelles dépendances.

        Validation : `cargo check -p companyos-orchestrator` au
        terme de cette étape doit passer (les nouvelles deps sont
        importables même si pas encore utilisées). Note: ce check
        sera fait avec le build complet à la fin de l'étape 4.
      files:
        - Cargo.toml
        - Cargo.lock
        - crates/orchestrator/Cargo.toml

    - description: >
        ÉTAPE 3 — Intégration de sqlite-vec et smoke test au boot.
        Création du module helper d'enregistrement de l'extension
        et du smoke test obligatoire (proposition 2(d.2) du RFC).

        Modifications dans crates/orchestrator/src/db.rs :

          (a) Imports : `use sqlite_vec::sqlite3_vec_init;` (le
              binding crate expose la fonction d'initialisation
              de l'extension comme un symbole C). Si l'API est
              différente (par exemple via un `auto_extension()`
              helper), adapter en conséquence — vérifier la doc de
              la version pinnée.

          (b) Dans `OrchestratorDb::open`, AVANT l'application des
              defensive pragmas et AVANT migrate :

                conn.load_extension_enable()?;
                // SAFETY : load_extension est unsafe pour la
                // possibilité de charger une lib arbitraire ; ici
                // on charge la fonction Rust embarquée statiquement
                // par la crate sqlite-vec, pas un .so externe.
                unsafe {
                  conn.load_extension(sqlite_vec_init_path, None)?;
                  // ou via sqlite3_auto_extension selon l'API
                  // exacte de la crate.
                }
                conn.load_extension_disable()?;

              Plus précisément, sqlite-vec crate fournit
              probablement une API safe du genre
              `sqlite_vec::load_module(&conn)` ou similaire. Utiliser
              l'API safe si elle existe, sinon le pattern unsafe
              ci-dessus.

          (c) Smoke test : nouvelle méthode privée
              `fn smoke_test_sqlite_vec(&self) -> Result<()>` qui :
                - Crée une table virtuelle `vec0_smoketest USING
                  vec0(emb float[3])` en mémoire de la connexion
                  courante (utilisable parce que c'est une table
                  TEMPORAIRE ou définie sur la DB ouverte). À la fin
                  du test, DROP TABLE vec0_smoketest.
                - INSERT INTO vec0_smoketest (rowid, emb) VALUES
                  (1, '[1.0, 0.0, 0.0]'), (2, '[0.0, 1.0, 0.0]').
                - Exécute `SELECT rowid, distance FROM vec0_smoketest
                  WHERE emb MATCH '[1.0, 0.0, 0.0]' AND k = 2 ORDER
                  BY distance` (syntaxe sqlite-vec).
                - Vérifie que la première row a rowid=1 et distance
                  proche de 0 (< 1e-3), et que la seconde a rowid=2
                  et distance > 0 (au moins 1.0 pour L2 ou ~1 pour
                  cosine).
                - Si la vérification échoue : retourne
                  OrchestratorError::IntegrityFailure avec details
                  "sqlite-vec smoke test failed: <observed>".
                - DROP TABLE en fin.
              Cette méthode est appelée par OrchestratorDb::open
              après load_extension et avant le retour.

          (d) Si load_extension échoue (lib mal liée, ABI cassé) :
              propager l'erreur, qui remontera jusqu'à main et
              causera l'exit non-zero du serveur (cohérent avec
              proposition 2(c)(d) du RFC : pas de fallback
              silencieux).

        Test unitaire à ajouter dans le module tests existant de
        db.rs : `test_smoke_test_sqlite_vec_passes_on_fresh_db`
        et `test_smoke_test_detects_broken_knn` (ce dernier test
        peut être skip si pas trivial à simuler, on accepte une
        couverture partielle ; le test positif suffit pour
        l'acceptance).

        Validation : `cargo test -p companyos-orchestrator
        test_smoke_test` passe.
      files:
        - crates/orchestrator/src/db.rs

    - description: >
        ÉTAPE 4 — Module embedding.rs. Nouveau fichier qui implémente
        la couche d'embedding via fastembed.

        Création de crates/orchestrator/src/embedding.rs avec :

          (a) Constantes au sommet :
                pub const MODEL_VERSION: &str =
                  "multilingual-e5-small-v1";
                pub const EMBEDDING_DIM: usize = 384;
                pub const CACHE_DIR_REL: &str =
                  "company/data/embeddings/cache/multilingual-e5-small-v1";
                pub const MAX_INPUT_CHARS: usize = 8192;

          (b) Struct publique :
                pub struct Embedder {
                  inner: fastembed::TextEmbedding,
                }

                impl Embedder {
                  pub fn load_from_cache(root: &str)
                    -> Result<Self, OrchestratorError>;
                  pub fn embed_text(&self, text: &str)
                    -> Result<Vec<f32>, OrchestratorError>;
                  pub fn embed_artifact_view(
                    &self,
                    yaml: &serde_json::Value,
                    kind: &str,
                  ) -> Result<Vec<f32>, OrchestratorError>;
                }

          (c) load_from_cache(root) :
                - Construit cache_path = {root}/{CACHE_DIR_REL}.
                - Définit HF_HUB_OFFLINE=1 et HF_HOME=cache_path
                  via std::env::set_var AVANT l'init de
                  TextEmbedding, pour forcer le mode offline.
                - Appelle fastembed::TextEmbedding::try_new(
                    InitOptions::new(EmbeddingModel::
                    MultilingualE5Small).with_cache_dir(cache_path)
                    .with_show_download_progress(false)
                  ).
                - Si erreur (cache absent, modèle pas téléchargé) :
                  retourne OrchestratorError::EmbeddingModelMissing
                  avec un message clair contenant le path du cache
                  et la commande de pre-fetch.

          (d) embed_text(text) :
                - Truncate à MAX_INPUT_CHARS (slice sur byte
                  boundary safe via String::from_utf8_lossy ou
                  char_indices).
                - Appelle self.inner.embed(vec![text.to_string()],
                  Some(1)) (batch size 1).
                - Vérifie que len(result) == 1 et len(result[0]) ==
                  EMBEDDING_DIM.
                - Retourne result.into_iter().next().unwrap().
                - Tout panic du fastembed wrapper est converti en
                  OrchestratorError::EmbeddingFailed avec message.

          (e) embed_artifact_view(yaml, kind) :
                - Construit la vue embeddable selon le kind :
                  Universal prefix : title + ". " + description +
                    ". " + tags.join(", ").
                  Extensions par kind :
                    - "task-request" : + spec.description
                    - "design-doc"   : + spec.overview
                    - "rfc"          : + spec.motivation
                                      + " " + spec.proposal_summary
                                      (truncated à 4000 chars)
                    - "implementation-plan" : + concat des
                      spec.steps[].description (truncated)
                    - "diagnostic-report" : + spec.symptom
                                          + " " + spec.root_cause
                                          + " " + spec.resolution
                    - "lesson-learned" : + spec.context
                                       + " " + spec.insight
                                       + " " + spec.recommendation
                    - autres : juste le prefix universel.
                - Appelle embed_text sur la vue construite.

          (f) Mode --prefetch-embeddings dans main.rs (modification
              du dispatcher CLI existant à l'étape 11) :
                - Crée le dossier cache si absent.
                - Lance fastembed::TextEmbedding::try_new SANS
                  HF_HUB_OFFLINE pour autoriser le téléchargement.
                - Affiche "Embedding model downloaded to <path>" et
                  exit 0.

        Ajout dans crates/orchestrator/src/error.rs :
          variants EmbeddingModelMissing { path: String } et
          EmbeddingFailed { reason: String }.

        Ajout dans crates/orchestrator/src/lib.rs :
          `pub mod embedding;` + re-exports utiles.

        Tests unitaires (dans le module tests à la fin de
        embedding.rs) :
          - test_embedder_is_deterministic_same_text : deux appels
            embed_text("hello world"), vérifier que cosine
            similarity > 0.9999 (déterminisme effectif imposé par
            iteration 3 du design-doc, finding F-design-2).
          - test_embed_artifact_view_includes_title_and_tags : YAML
            synthétique, vérifier que le texte est bien construit.
          - test_embed_truncates_long_input : input > 10000 chars,
            vérifie que ça n'échoue pas.
        Note : ces tests exigent que le cache soit présent, donc
        ils sont gated derrière #[cfg(test)] et exécutés en CI
        après un --prefetch-embeddings préalable. Documenter dans
        un README local.

        Validation : cargo test après --prefetch-embeddings doit
        passer.
      files:
        - crates/orchestrator/src/embedding.rs
        - crates/orchestrator/src/error.rs
        - crates/orchestrator/src/lib.rs

    - description: >
        ÉTAPE 5 — Schéma de la table virtuelle artifacts_vec et
        métadonnées model_version. Modifications dans
        crates/orchestrator/src/db.rs.

        Ajout d'une constante :
          const VEC_TABLE_SQL: &str = "
            CREATE VIRTUAL TABLE IF NOT EXISTS artifacts_vec
              USING vec0(
                embedding float[384]
              );
            CREATE TABLE IF NOT EXISTS index_metadata (
              key TEXT PRIMARY KEY,
              value TEXT NOT NULL
            );
          ";

        Note : sqlite-vec vec0 utilise le rowid de la table virtuelle
        pour corrélation. Pour faire le lien rowid <-> artifacts.id
        (qui est un UUID string), on ajoute une colonne lookup :
        soit on stocke artifact_id en colonne side via
        `vec0(artifact_id text, embedding float[384])` (sqlite-vec
        supporte les colonnes auxiliaires), soit on maintient une
        table d'index `vec_artifact_id (rowid INTEGER PRIMARY KEY,
        artifact_id TEXT NOT NULL UNIQUE)` à côté.

        Décision pour ce plan : `vec0(artifact_id text, embedding
        float[384])` avec partition_key sur artifact_id si sqlite-vec
        le supporte ; sinon, la table `vec_artifact_id` séparée. Le
        SQL exact est à finaliser au moment du code en consultant la
        doc sqlite-vec, la propriété fonctionnelle est : on doit
        pouvoir JOIN artifacts ON artifacts.id = <colonne dans
        artifacts_vec>.

        Migration du schéma. La fonction OrchestratorDb::migrate()
        est étendue pour exécuter aussi VEC_TABLE_SQL dans la même
        transaction BEGIN IMMEDIATE / COMMIT. La constante MIGRATION
        devient :
          "BEGIN IMMEDIATE; {SCHEMA_SQL} {FTS_SQL_NEW} {VEC_TABLE_SQL}
           COMMIT;"
        (où FTS_SQL_NEW est défini à l'étape 9 avec le tokenizer
        explicite).

        Détection model_version au boot :
          - Nouvelle méthode OrchestratorDb::get_index_metadata(key)
            et set_index_metadata(key, value) qui lisent/écrivent
            dans index_metadata.
          - Nouvelle méthode OrchestratorDb::check_and_update_
            model_version(current: &str) -> Result<ModelVersionState>
            où ModelVersionState enum { Fresh, Match, Mismatch }.
            Fresh = pas de row dans index_metadata, on insère et
            retourne Fresh. Match = row présente et égale, retourne
            Match. Mismatch = row présente et différente, retourne
            Mismatch (caller décide quoi faire : wipe + reindex).
          - L'architecture_marker (F-design-2 design-doc iteration
            3) est encodée dans la même chaîne :
            "multilingual-e5-small-v1+<arch>", où <arch> vient de
            std::env::consts::ARCH (par exemple "x86_64" ou
            "aarch64"). Tout mismatch d'architecture déclenche aussi
            un wipe + reindex via la même logique. Décision : on ne
            fait PAS de champ séparé, on concatène dans
            model_version.

        Wipe + reindex en cas de mismatch. Le caller (run_server à
        l'étape 11) consomme le résultat de
        check_and_update_model_version. En cas de Mismatch, il
        appelle une nouvelle méthode
        OrchestratorDb::wipe_vec_table_and_metadata() qui
        DELETE FROM artifacts_vec et DELETE FROM index_metadata
        WHERE key = 'model_version', puis le code de run_server
        déclenche reindex_all qui recalculera tous les embeddings
        avec le nouveau modèle.

        Tests unitaires :
          - test_migrate_creates_vec_table : après migrate(), une
            requête sur artifacts_vec ne doit pas échouer.
          - test_model_version_fresh_then_match : appel deux fois
            check_and_update avec la même chaîne, état Fresh puis
            Match.
          - test_model_version_mismatch_detected : insert "v1",
            check avec "v2", état Mismatch.
          - test_wipe_vec_clears_table.
