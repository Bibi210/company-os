    - description: >
        ÉTAPE 14 — Tool MCP index_status. Modifications dans
        crates/mcp-servers/orchestrator/src/main.rs et engine.rs.

        (A) Côté engine.rs : nouvelle méthode

              pub struct IndexStatusGlobal {
                pub artifacts_count: usize,
                pub fts_count: usize,
                pub vec_count: usize,
                pub triplet_coherent: bool,
                pub triplet_diff: Option<TripletDiff>,
                pub file_watcher_alive: bool,
                pub pending_index_queue_size: usize,
                pub last_indexed_at: Option<String>,
              }

              pub struct IndexStatusPerPath {
                pub indexed_at: Option<String>,
                pub file_mtime: Option<String>,
                pub stale: bool,
                pub present_in_fts: bool,
                pub present_in_vec: bool,
              }

              pub fn index_status(
                &self,
                path: Option<&str>,
                watcher_alive: bool,
                queue_size: usize,
              ) -> Result<IndexStatusResponse, OrchestratorError>;

            Le champ file_watcher_alive et pending_index_queue_size
            sont passés par le caller (main.rs) parce qu'ils
            vivent au niveau du serveur, pas de l'engine. L'engine
            traite seulement les COUNT SQL.

            triplet_coherent : artifacts_count == fts_count ==
            vec_count.
            triplet_diff (rempli SEULEMENT si !triplet_coherent) :
              in_artifacts_not_in_fts, etc. (4 listes d'ids via
              SELECT id FROM A EXCEPT SELECT id FROM B). Coûteux
              sur grand corpus ; sur 84 artifacts c'est < 5ms.

        (B) Côté main.rs :
            - Nouveau champ dans OrchestratorServer :
              `watcher_alive: Arc<AtomicBool>`.
            - La tokio task du file watcher (run_server) wrap son
              code dans une closure qui set true au début, et un
              drop guard ou un select! cleanup qui set false en
              sortie.
            - Nouveau tool MCP :
              #[tool(description = "Inspect indexation state")]
              async fn index_status(&self, params:
                Parameters<IndexStatusParams>)
                -> Result<CallToolResult, McpError>;
            - IndexStatusParams : { path: Option<String> }.

            La queue size : si on n'introduit pas de
            tokio::sync::mpsc::channel intermédiaire (cf. RFC
            proposition 8 alinéa "queue"), exposer 0 par défaut
            avec documentation. Décision plan : on EXPOSE 0
            (watcher en mode notify direct sans queue) et on
            commente ça dans le retour JSON via un champ
            `queue_mode: "direct"`.

        Tests :
          - test_index_status_returns_counts.
          - test_triplet_coherent_after_upsert.
          - test_per_path_stale_when_mtime_newer.
