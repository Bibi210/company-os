    - description: >
        ÉTAPE 9 — Module query.rs (sanitize_fts_query, modes
        Natural / Advanced / Exact). Nouveau fichier
        crates/orchestrator/src/query.rs.

        API :
          pub enum QueryMode { Natural, Advanced, Exact }

          pub fn sanitize_fts_query(input: &str, mode: QueryMode)
            -> String;

        Implémentation :
          Natural (défaut) :
            - Strip leading/trailing whitespace.
            - Si input vide, retourner "" (caller responsabilité).
            - Tokenize sur whitespace (split_whitespace).
            - Pour chaque token :
                - Strip chars in {`*`, `:`, `"`, `(`, `)`, `-` (en
                  position préfixe pour ne pas l'interpréter comme
                  NOT)}.
                - Si token vide après strip, skip.
                - Wrap dans des double-quotes pour neutraliser tout
                  caractère restant : '"' + token + '"'.
            - Joindre tokens avec " OR ".
            - Si liste vide, retourner "" (caller décide quoi faire,
              par exemple skip lexical path).

          Advanced :
            - Retourner input tel quel (caller assume la
              responsabilité d'une FTS5 expression valide).

          Exact :
            - Strip whitespace.
            - Wrap dans double-quotes : '"' + escaped + '"' (échapper
              les double-quotes internes en les doublant).
            - Cas d'usage : id_prefix, recherche exacte d'UUID.

        Ajout dans lib.rs : `pub mod query;`.

        Tests unitaires (au moins 8) :
          - test_natural_simple_words.
          - test_natural_strips_dash.
          - test_natural_strips_quotes_and_parens.
          - test_natural_uuid_like_input.
          - test_natural_empty_returns_empty.
          - test_advanced_passthrough.
          - test_exact_wraps_double_quotes.
          - test_exact_escapes_internal_quotes.
