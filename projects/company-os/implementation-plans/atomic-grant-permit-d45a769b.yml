metadata:
  id: d45a769b-27fc-4530-b929-9d2286c0ee47
  title: "Plan d'implémentation — grant_write_permit atomique avec auto-commit, checkpoint WAL, rollback et idempotence"
  author: implementer
  created_at: "2026-06-03"
  description: >
    Plan d'exécution dérivé du RFC 359f9162 (approuvé). Atomicise
    grant_write_permit côté serveur MCP : après l'INSERT du permit,
    le tool force un checkpoint WAL, exécute git add -f ciblé sur le
    seul .db puis git commit, et en cas d'échec rollback le permit
    inséré (DELETE) pour ne jamais laisser de permit fantôme. Intègre
    les trois décisions d'arbitrage CEO : (1) durcissement git avec
    erreur MCP distinguant la cause, (2) retrait de l'étape 2 (seal
    manuel) de implementer.yml en préservant l'invariant consume-en-
    dernier (lesson 8fd49300), (3) idempotence du grant par clé
    rfc_id + granted_to + target_paths (rejeu = renvoi du permit
    existant + hash de scellement, pas de doublon).
  tags:
    - write-permit
    - defense-in-depth
    - atomicity
    - mcp
    - companyos-internals
    - rust
    - implementation
