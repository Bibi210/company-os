    - description: >
        Étape 8 : validation manuelle bout-en-bout (cf. RFC section 7.c,
        acceptance criterion 6 du task-request 8ce26e7f).

        Cette étape n'est PAS de l'exécution automatisée ; c'est un protocole
        de validation que l'Implementer exécute après le passage au vert de
        l'étape 7. Objectif : vérifier que la chaîne complète tool MCP →
        engine → DB → YAML produit la restitution attendue côté PM.

        Protocole :
          1. Vérifier l'absence de roadmap existante (vérification de
             cohérence — au moment de la rédaction du plan, ls
             company/roadmaps/ est vide) :
                 list_roadmaps()  → attendu : { roadmaps: [], count: 0 }

          2. Créer une roadmap fixture minimale "companyos-system" avec 3
             items dont 1 blocked. Le fichier est placé dans
             company/roadmaps/companyos-system-<8chars>.yml.
             Contenu minimal : kind=roadmap, metadata { id (généré),
             title, description, tags }, spec { domain="companyos-system",
             status="active", narrative="...", items: 3 entrées dont une
             status=blocked et timeframe=present }.
             Validation : validate_file sur le YAML créé.

          3. Appeler list_roadmaps() puis vérifier :
                 - count == 1
                 - roadmaps[0].domain == "companyos-system"
                 - roadmaps[0].items_count == 3
                 - roadmaps[0].blocked_count == 1
                 - roadmaps[0].status == "active"

          4. Appeler summarize_roadmap(domain="companyos-system") puis
             vérifier :
                 - roadmap.narrative est bien rendu en clair (pas tronqué)
                 - summary.items_total == 3, summary.blocked_count == 1
                 - blocked_items.len() == 1, et son key correspond bien
                 - items_by_status["blocked"].len() == 1
                 - items_by_timeframe a bien 3 clés (past/present/future),
                   même si certaines sont vides

          5. Appeler summarize_roadmap(id="<id-fixture>") et vérifier que
             le résultat est identique à celui de l'étape 4.

          6. Tester un cas d'erreur :
                 summarize_roadmap(id="00000000-0000-0000-0000-000000000000")
                 → attendu : erreur typée RoadmapNotFound (selector="id=00...")

          7. Si l'utilisateur le souhaite, supprimer ou archiver la roadmap
             fixture (mise à status=archived) et re-tester pour confirmer
             que list_roadmaps() avec status="archived" la trouve.

        Si une seule de ces vérifications échoue, produire un
        diagnostic-report qui pointe le symptôme et la commande qui a
        échoué, puis remonter au PM.
