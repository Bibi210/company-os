  risks:
    - "Risque 1 : OUBLI DU SCELLAGE DE LA DB. Si l'Implementer modifie les fichiers Rust avant de committer company/data/orchestrator.db, le hook git rejettera le commit final. Mitigation : suivre rigoureusement l'ordre concret de l'étape 7 (a) → (b)."
    - "Risque 2 : CONSUME_WRITE_PERMIT APPELÉ AVANT LE COMMIT. La règle write_permit_full_sequence est explicite : le commit git précède consume_write_permit. Inverser bloque le commit a posteriori. Mitigation : la séquence est explicitée en étape 7.c puis 7.d."
    - "Risque 3 : RELOAD_CONFIG APPELÉ AVANT CARGO TEST. Si reload_config recharge un binaire MCP construit sur du code qui ne compile pas / dont les tests échouent, la session MCP peut perdre son contexte. Mitigation : étape 7.f explicitement conditionnée aux verts de 7.e."
    - "Risque 4 : MATCH NON-EXHAUSTIF SUR ArtifactKind QUELQUE PART. Le code ne fait pas de match sur ArtifactKind::Roadmap à l'extérieur de crates/config (cf. grep effectué pendant le lookup). Risque résiduel faible. Mitigation : le compilateur Rust impose l'exhaustivité ; cargo build de l'étape 7.e révélerait toute branche manquante."
    - "Risque 5 : PERMIT NE COUVRE PAS error.rs. L'ajout de variants à OrchestratorError est imposé par les décisions de l'étape 0 (c). Si check_write_permit(implementer, 'crates/orchestrator/src/error.rs') retourne None, l'Implementer doit s'arrêter et remonter au PM pour ré-émission du permit. Ne pas tenter de contourner. Mitigation détective : check_write_permit avant écriture, étape 7.b."
    - "Risque 6 : PERMIT NE COUVRE PAS roadmap_summary.rs (nouveau fichier). Pour les fichiers NOUVEAUX, glob-matching peut quand même couvrir si le permit utilise un préfixe crates/orchestrator/src/ (à vérifier sur le permit réel). Mitigation : check_write_permit avant l'écriture du nouveau fichier ; si non couvert, remonter au PM avant d'écrire."
    - "Risque 7 : LE SCHÉMA YAML DES ROADMAPS DIVERGE DE LA STRUCTURE RoadmapItem. Si parse_roadmap_yaml échoue sur des YAML valides au regard du schéma JSON (ex: un champ optionnel mal géré), les tests engine échoueront. Mitigation : les fixtures de test couvrent les variantes (items avec et sans target_date / depends_on / rationale, ref de chacun des 3 types project/rfc/external)."
    - "Risque 8 : INVARIANTS PROTOCOLAIRES MCP NON CAPTURÉS PAR LE PSEUDO-CODE (cf. lesson c5413270). Les nouveaux tools sont des fonctions read-only sans état persistant ; l'analogie avec le proxy MCP ne tient pas (pas de session longue, pas de re-handshake, pas de cycle de vie). Le risque réside surtout dans la sérialisation JSON : le test test_roadmap_summary_serializes_to_expected_json_shape (étape 6.d) est explicitement conçu pour valider la FORME du JSON, ce qu'un consommateur PM verra réellement. Si après merge un appel PM produit une forme inattendue, capitaliser en lesson dérivée."
    - "Risque 9 : VOLUMÉTRIE FUTURE DES ROADMAPS. À 1-10 roadmaps c'est trivial ; au-delà, parser tous les YAML à chaque list_roadmaps devient coûteux. Mitigation : le RFC accepte ce coût pour rester sans cache (cohérent avec la décision 'pas d'auto-synchronisation' du RFC a49801aa). Pas d'action requise tant que le volume reste petit."
