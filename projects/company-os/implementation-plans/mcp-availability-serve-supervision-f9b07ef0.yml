    - "node (>= 18) disponible dans le PATH — déjà requis par le proxy et les plugins, dépendance implicite. node:test disponible pour make test-js."
    - "cargo/rust toolchain disponible pour le PREMIER make deploy-serve (Étape 12e) et le pré-check éventuel du binaire de test (Étape 10). Aucun autre cargo build dans le plan."
    - "Approbation préalable de ce plan par l'Architect (review round) avant d'entrer en PHASE 2 d'exécution (write_permit_gate)."
    - "target/ est dans BASH_SAFE_PATHS du hook defense-in-depth (L38) : deploy-serve.sh peut écrire target/serve/ sans permit. Vérifié."

  risks:
    - "Risque 1 — Session courante utilise l'ANCIEN proxy et target/debug pendant toute l'implémentation. Les binaires servis (target/serve) n'existent qu'après l'Étape 12e. Le basculement effectif (nouveau proxy + opencode.json) n'a lieu qu'au prochain boot opencode. Mitigation : c'est le comportement ATTENDU et sûr (identique à d9399863) ; la preuve du fix vient des tests standalone (Étapes 2/10), pas de l'absence de régression dans la session courante. Aucun cargo build sur target/debug n'est lancé avant l'Étape 12, donc l'ancien proxy n'est pas perturbé par ce plan."
    - "Risque 2 — Le rename atomique mv -f n'est atomique que sur le MÊME filesystem. Mitigation : source (.<bin>.tmp) et destination (<bin>) sont TOUTES DEUX sous target/serve/, donc même filesystem par construction ; l'atomicité POSIX est garantie. deploy-serve.sh crée le .tmp dans target/serve/, pas dans /tmp."
    - "Risque 3 — Test 2 existant du script d'intégration asserte l'INVERSE du nouveau comportement (exit sur circuit breaker vs jamais d'exit). Mitigation : ma note de review n°2 est intégrée à l'Étape 9 ; le scénario 3 REMPLACE (assertion inversée) le Test 2, il ne l'étend pas. Le risque est de croire la formulation RFC 'reste exécutable tel quel dans son principe' et d'oublier d'inverser l'assertion — l'Étape 9 le prévient explicitement."
    - "Risque 4 — B5 : le hook a un chemin primaire release (L143/L157) non cité par le RFC, en plus du fallback debug (L148/L158). Mitigation : ma note de review n°1 est intégrée à l'Étape 6 ; décision tranchée = fallback → serve, primaire release conservé (déjà stable, non relinké par ci qui build en debug). Documenté dans le commit."
    - "Risque 5 — spawn du bootstrap deploy-serve.sh (Étape 4b) échoue (build cassé). Mitigation : le proxy N'EXIT PAS (waiting_binary), sert -32050 au-delà du plafond, retente à l'apparition du binaire via le watcher. C'est précisément le comportement A/B/C ; aucun chemin de mort."
    - "Risque 6 — Le watch du répertoire capte les événements du fichier .<bin>.tmp en plus du binaire servi. Mitigation : filtre sur le basename attendu (Étape 4d) ; le basename .<bin>.tmp ne matche pas <bin>, donc ignoré. Le rename final émet un événement sur <bin>, capté."
    - "Risque 7 — Latch par incarnation mal implémenté → onChildGone exécuté deux fois (double respawn) ou zéro fois (zombie de retour). Mitigation : latch attaché à l'incarnation courante du child (un jeton par spawn), vérifié+consommé atomiquement en tête de onChildGone ; couvert par le scénario 3 (crash-loop) du script d'intégration qui observerait un double respawn comme anomalie de cadence de backoff."
    - "Risque 8 — Le plafond 120s rend le scénario 4 du test d'intégration très lent. Mitigation : rendre UNAVAILABLE_ESCALATION_MS configurable via variable d'env (défaut 120000), lue par le proxy, pour un test rapide (Étape 9 scénario 4). À trancher à l'écriture ; si non configurable, le test devra tolérer 120s ou être marqué long."
    - "Risque 9 — Commit rejeté par les hooks defense-in-depth (schema, naming, ou permit incomplet). Mitigation : les 10 paths sont couverts par le permit (vérifié Étape 0) ; en cas de rejet, commit additionnel après fix (pas d'amend, règle git globale)."
    - "Risque 10 — consume_write_permit refusé par GARDE 3 (worktree sale sur un target_path). Mitigation : l'Étape 11 (commit) précède strictement l'Étape 12a (consume) ; git status vérifié avant consume ; tous les target_paths committés ensemble."
