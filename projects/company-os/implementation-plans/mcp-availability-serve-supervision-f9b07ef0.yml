api_version: companyos/v1
kind: implementation-plan
metadata:
  id: f9b07ef0-c3b5-43c0-ac62-df8c67f08bb4
  title: "Implementation plan : disponibilité MCP définitive (RFC 18011bfc) — B target/serve + promotion atomique, A supervision sans abandon, C readiness événementielle"
  author: implementer
  created_at: "2026-07-02"
  description: >
    Plan d'implémentation du RFC 18011bfc (disponibilité MCP définitive,
    architecture B + A + C, fondé sur le diagnostic 79f13f30). B — les
    binaires servis vivent dans target/serve/, jamais touchés par cargo ;
    la mise à jour du serveur devient une promotion atomique explicite
    (make deploy-serve : cargo build -p → cp .tmp → chmod → mv -f). A — le
    proxy perd tout chemin de mort définitive : circuit breaker supprimé,
    backoff plafonné avec réarmement, onChildGone unifié + latch par
    incarnation, watch du répertoire parent, bootstrap waiting_binary sans
    exit. C — le buffer FIFO est le contrat de readiness ; au-delà de 120s
    d'indisponibilité, réponse JSON-RPC -32050 (escalate:true) ; la règle
    de prose mcp_reconnect devient mcp_availability. Le plan ne touche
    AUCUN fichier Rust et ne lance AUCUN cargo build, à l'exception du
    PREMIER make deploy-serve en toute fin de séquence (qui build les
    crates pour peupler target/serve/). Contrainte forte identique à
    d9399863 : le proxy modifié n'est PAS celui qui sert la session
    courante ; les binaires servis (target/serve/) n'existent pas encore ;
    la session actuelle continue d'utiliser l'ANCIEN proxy et
    target/debug/. Le basculement effectif n'a lieu qu'au prochain boot de
    session opencode. Les tests s'exécutent en standalone (node --test +
    script d'intégration en sous-processus), jamais contre le proxy actif.
    Respecte strictement write_permit_full_sequence : écriture → commit →
    consume → validation → deploy-serve.
  tags:
    - companyos-v1
    - mcp
    - proxy
    - availability
    - supervision
    - atomic-deploy
    - resilience
    - harness
    - implementation
    - write-permit
    - critical-infra
  related:
    - id: 18011bfc-c8ae-4c31-8aca-f994755b93e7
      kind: rfc
      relationship: input
    - id: 415c73c0-eae9-46e0-8f05-e3ff38156b3c
      kind: task-request
      relationship: input
    - id: 79f13f30-af1a-453e-9b42-962c35f93d26
      kind: diagnostic-report
      relationship: related
