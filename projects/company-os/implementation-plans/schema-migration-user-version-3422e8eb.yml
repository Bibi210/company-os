kind: implementation-plan
metadata:
  id: 3422e8eb-5c9f-4de4-a6f2-9c69d8671ca7
  title: "Plan d'implémentation — Discipline de migration SQL : PRAGMA user_version + registre de migrations numérotées dans migrations.rs"
  author: implementer
  created_at: "2026-06-04"
  description: >
    Implementation-plan dérivé du RFC 973a5569 (approuvé). Refonte interne de
    OrchestratorDb::migrate() (db.rs:353) en boucle pilotée par PRAGMA
    user_version sur un registre ORDONNÉ de migrations numérotées, isolé dans
    un nouveau module crates/orchestrator/src/migrations.rs. Intègre le hotfix
    57019e7 (Step 2bis) dans la migration numérotée portant ses ALTER, remplace
    le matching fragile "duplicate column" par PRAGMA table_info(artifacts),
    ajoute le variant SchemaVersionTooNew pour refuser proprement une DB de
    version future, et entérine 6 tests #[test] de transition dans la suite
    cargo. La signature publique pub fn migrate(&self) -> Result<(),
    OrchestratorError> est CONSERVÉE : aucun des 4 sites d'appel
    (main.rs:1385, 1448, 1504, tests) n'est adapté.
  tags:
    - sqlite
    - schema-migration
    - user-version
    - orchestrator
    - migrations-module
    - idempotence
    - testing
    - companyos-internals
    - critical-infra
