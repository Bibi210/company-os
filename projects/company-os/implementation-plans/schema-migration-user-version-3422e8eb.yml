      kind: lesson-learned
      relationship: related
    - id: d5c9c933-2955-41e1-b2ae-73c9f307f09f
      kind: lesson-learned
      relationship: related
    - id: 611fde3e-de00-4cfd-ad7e-6c4e16085bc8
