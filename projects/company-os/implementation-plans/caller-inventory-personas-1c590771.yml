api_version: companyos/v1
kind: implementation-plan
metadata:
  id: 1c590771-bfb0-49d8-9f88-ae0340a2b7cc
  title: "Plan d'implémentation RFC eb42a8de : discipline d'inventaire des callers dans les personas Architect et Implementer"
  author: implementer
  created_at: "2026-06-05"
  project: company-os
  description: >
    Plan d'implémentation chirurgical du RFC eb42a8de (iteration 2).
    Ajout d'une entrée rules.must dans chacune des deux personas
    Architect et Implementer formalisant la discipline d'inventaire
    exhaustif des callers d'une API publique de crate avant de figer
    (Architect, au RFC/design-doc) ou de modifier (Implementer, à
    l'exécution) une signature. Aucun code Rust, aucun schema, aucun
    tool MCP. Deux edits YAML en zone protégée (company/personas/),
    couverts par le write permit 02e0191f.
  tags:
    - workflow
    - api
    - callers
    - personas
    - companyos-internals
  related:
