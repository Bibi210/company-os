api_version: companyos/v1
kind: implementation-plan
metadata:
  id: 0e77b612-c0a7-41d0-b18b-b0034c83e6b0
  title: "Implementation-plan : tool MCP rfc_set_implemented(id) — transition approved -> implemented pilotée serveur"
  author: implementer
  created_at: "2026-06-04"
  description: >
    Plan d'implémentation du RFC 1c0f2570 (approuvé). Ajoute un tool MCP
    rfc_set_implemented(id) qui fait passer un RFC de status: approved à
    status: implemented sans write permit, sur le modèle exact de
    close_review_round (écriture serveur via std::fs::write, hors canal bash
    surveillé). Le plan étend update_rfc_status_in_file pour le timestamp
    implemented_at, ajoute une méthode moteur set_rfc_implemented (résolution
    par id via l'index, vérification stricte du status, délégation de
    l'écriture), expose le tool dans main.rs sur le pattern Parameters<...> +
    engine.lock().await, et couvre les trois axes de test (nominal, négatif,
    edge) dont l'idempotence already-implemented. Intègre les deux décisions
    CEO tranchées au review : (1) RFC déjà implemented = succès idempotent,
    timestamp d'origine préservé ; (2) tool ouvert à tout agent, aucun token.
  tags:
    - rfc-lifecycle
    - mcp
    - tooling
    - orchestrator
    - write-permit
    - friction-permits
    - companyos-internals
  related:
    - id: 1c0f2570-71e2-4f02-ac4f-81e406b22568
      kind: rfc
