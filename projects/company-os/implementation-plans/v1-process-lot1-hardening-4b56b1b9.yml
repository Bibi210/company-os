api_version: companyos/v1
kind: implementation-plan
metadata:
  id: 4b56b1b9-bd6f-4913-ae66-189b24824c8a
  title: "Implementation-plan : V1 process lot 1 — 5 gardes serveur/schema + purge des règles mortes"
  author: implementer
  created_at: "2026-06-10"
  description: >
    Plan d'implémentation du RFC 8bf78218 (approuvé, itération 2). Mécanise
    dans le harness les 5 gardes de process (self_review_forbidden,
    review_findings_honesty + canal notes, commit-puis-consume,
    grant exige un RFC approved, reviewers_by_artifact_type appliqué) et
    purge les règles mortes (budget_limits, circuit_breaker,
    escalation_rules, chargement Rust de human-review-triggers) avec verrou
    schema additionalProperties: false. Intègre les décisions tranchées en
    itération 2 du review : engine.submit_vote CHANGE de signature (param
    notes, caller-inventory main.rs L558 + 9 call-sites engine.rs) ;
    fixtures GARDE 4 via db.upsert_artifact + embedding zéros EMBEDDING_DIM
    (le harness setup_server utilise new_without_embedder, index_artifact
    impossible) ; sémantique "all" = ensemble FERMÉ {pm, architect,
    implementer, ceo} moins l'auteur (Myself/All exclues) ; hot-reload
    watcher = clone Arc<RwLock<ReviewProtocol>> avant la closure + .write()
    sur ConfigChangeKind::Config (attention disjoint capture edition 2024,
    lesson ea6e9dd1) ; pathspecs git avec préfixe :(glob) sur les
    métacaractères, comportement conservateur fail-safe. La purge YAML +
    schemas + Rust est ATOMIQUE (un seul commit). Le permit
    286abb1a-d7d8-456e-bdfd-25188338065b couvre les 16 paths
    d'affected_files.modified. Consume APRÈS les commits, jamais avant
    (lesson 8fd49300, et la GARDE 3 implémentée l'exigera).
  tags:
    - companyos-v1
    - process
    - hardening
    - harness
    - mechanical-invariant
    - review-protocol
    - write-permit
    - companyos-internals
    - critical-infra
  related:
    - id: 8bf78218-e1f3-4bc5-864c-2abf618a990d
      kind: rfc
      relationship: input
    - id: 11f13a9d-467b-4e5b-b4c3-a5e45ce1e080
      kind: task-request
      relationship: input
    - id: ea6e9dd1-93dc-4b19-9854-103328203489
      kind: lesson-learned
      relationship: input
