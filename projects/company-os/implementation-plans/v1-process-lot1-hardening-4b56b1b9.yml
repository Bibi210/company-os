  risks:
    - >
      RISQUE 1 — Signature publique engine.submit_vote modifiée. Caller-
      inventory fait en étape 0 (au moment T) : main.rs L558 + 9 tests
      engine.rs, tous dans le permit. Aucun caller hors workspace (crate
      interne, pas d'API exportée consommée ailleurs). Mitigation : si
      cargo build révèle un call-site oublié (improbable, l'inventaire est
      exhaustif), il sera dans engine.rs ou main.rs (déjà dans le permit) ;
      si par extraordinaire ailleurs -> STOP + escalade (lesson 611fde3e /
      ea6e9dd1 APPRENTISSAGE 4).
    - >
      RISQUE 2 — Divergence glob crate vs pathspec git (GARDE 3). Décision
      itération 2 : préfixe :(glob) sur les métacaractères, comportement
      conservateur fail-safe (git matche plus -> refus plus strict, jamais un
      worktree sale qui passe). Mitigation : test
      test_consume_refused_dirty_worktree sur un target_path littéral ET, si
      possible, sur un pattern glob, pour confirmer le matching. Le risque
      résiduel est un faux positif (refus à tort) qui se résout en commitant,
      jamais une faille de sécurité.
    - >
      RISQUE 3 — Disjoint capture edition 2024 sur le clone de
      Arc<RwLock<ReviewProtocol>> dans la closure du watcher (GARDE 5,
      lesson ea6e9dd1). Le clone DOIT être textuellement lu dans l'async move
      (il l'est via le .write() de l'étape 10.c). Mitigation : ne PAS préfixer
      le binding par _ ; vérifier au get_diagnostics / cargo build qu'aucun
      warning unused n'apparaît (signe que la capture n'a pas eu lieu) ; le
      test de hot-reload (étape 14) exerce le rafraîchissement.
    - >
      RISQUE 4 — Fixtures GARDE 4 : le harness setup_server consomme db par
      valeur (new_without_embedder). L'upsert direct DOIT précéder la
      construction de l'engine. Mitigation : helper setup_server_with_rfc qui
      ouvre le db, migrate, upsert l'artifact RFC (embedding zéros
      EMBEDDING_DIM), PUIS new_without_embedder(db, 3). Fixtures YAML
      construites sans continuation backslash (lesson f3fc4a5d).
    - >
      RISQUE 5 — Atomicité de la purge. Si la purge YAML+schemas+Rust est
      scindée en plusieurs commits, un commit intermédiaire laisse soit des
      YAML invalides au schema durci, soit des structs Rust orphelines. RFC
      impact : un seul commit. Mitigation : l'étape 11 regroupe les 8
      fichiers de purge ; le commit de purge inclut les 8 d'un coup. cargo
      build (structs orphelines) + make validate (YAML vs schema) valident
      l'atomicité.
    - >
      RISQUE 6 — Rounds en vol non conformes (impact RFC). La garde
      submit_vote s'applique aussi aux rounds pré-existants : un author dans
      required_reviewers d'un round ouvert ne peut plus voter. Décision
      assumée (RFC) : données éphémères, l'invariant prime ; aucun round
      ouvert non conforme connu à ce jour. Mitigation : au merge, vérifier
      qu'aucun round ouvert n'a author ∈ required_reviewers ; sinon le fermer
      / recréer. Hors scope code de ce plan.
    - >
      RISQUE 7 — error.rs touché deux fois (SelfReviewForbidden +
      ApproveWithFindings). Mitigation : regrouper l'ajout des DEUX variantes
      dans l'étape 1 (une seule passe sur error.rs), même si la garde 2a est
      décrite en étape 3. error.rs est dans le permit.
    - >
      RISQUE 8 — Périmètre des écritures borné aux 16 affected_files.modified.
      AUCUN fichier à créer (le RFC ne crée rien : tests inline, pas de
      nouveau fichier — convention workspace). Le permit couvre exactement
      ces 16 paths (vérifié). Aucun amendement d'affected_files nécessaire.
