      kind: task-request
      relationship: input
    - id: 611fde3e-de00-4cfd-ad7e-6c4e16085bc8
      kind: lesson-learned
      relationship: input
    - id: be16dc46-0a2c-470c-a1f4-8f89a98abdbf
      kind: lesson-learned
      relationship: input
    - id: 3f507271-70ba-49ac-9a08-eeb833fb6063
