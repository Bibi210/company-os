api_version: companyos/v1
kind: implementation-plan
metadata:
  id: 00b46372-4ab0-4285-9bf6-49cf2c73aa28
  title: "Implementation-plan : schema RFC affected_files modified/created (anyOf rétro-compatible)"
  author: implementer
  created_at: "2026-06-04"
  description: >
    Plan d'implémentation du RFC a4eb3ee7 (approuvé). Remplace le bloc
    spec.affected_files du schema RFC (company/schemas/rfc.schema.json,
    actuellement un array plat de strings, lignes 24-27) par un anyOf à deux
    branches : FORME A legacy (array de strings, identique au caractère près
    à l'existant, garantit la rétro-compatibilité) et FORME B structurée
    (objet {modified, created}, deux listes optionnelles, additionalProperties:
    false). Le JSON Schema exact est celui dicté par la proposal du RFC.
    AUCUNE ligne de Rust ne change : grep "affected_files" sur crates/ = 0,
    le champ est purement documentaire et le mécanisme de permit repose sur
    target_paths fourni par le CEO, pas sur affected_files (RFC impact §2).
    Le plan ajoute aussi une règle dans company/config/shared-rules.yml
    recommandant la FORME B pour les RFCs touchant du code (cleanup du
    contournement de prose, application be16dc46 + AC5). Les TESTS sont des
    validations exécutées via le tool MCP yaml-validator (validate_yaml sur
    des RFCs FORME A et FORME B en mémoire, aucun fichier écrit, donc hors
    zone protégée) couvrant les trois axes : nominal, négatif, edge. La lesson
    de capitalisation se fait APRÈS merge, hors scope de ce plan.
  tags:
    - rfc-schema
    - affected-files
    - schema
    - companyos-internals
    - friction-permits
    - backward-compatible
