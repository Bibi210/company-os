spec:
  steps:
    - description: >
        Étape 0 — Décisions tranchées (laissées ouvertes par le RFC).

        (0.a) Panic handler dans la consumer task : choix de l'option (b)
        proposée par l'Architect, basée sur JoinError, SANS introduire la
        dépendance `futures = "0.3"`. Le tokio::spawn retourne un JoinHandle
        qui, sur abort() ou panic interne, retourne Err(JoinError) au .await.
        Aujourd'hui main.rs:1298-1300 appelle h.abort() puis ne .await pas
        le résultat — donc un panic dans la consumer task est invisible.
        Décision : remplacer `h.abort()` par un fire-and-forget abort puis,
        DANS la consumer task elle-même, encapsuler la boucle dans un
        std::panic::AssertUnwindSafe non-async (impossible directement à
        cause du .await), donc en pratique : laisser tokio capturer le
        panic via JoinError au shutdown, et logger error juste après le
        abort() avec un timeout court (200ms) sur .await du handle pour
        récupérer le JoinError éventuel.

        Implémentation concrète :
          tokio::time::timeout(Duration::from_millis(200), h).await
        Si Ok(Err(join_err)) et join_err.is_panic() → tracing::error!.
        Si Err(_) (timeout) ou Ok(Ok(())) → silencieux (cas normal).

        Pas de dépendance nouvelle. Invariant RFC respecté : un panic dans
        la consumer task LAISSE une trace error dans les logs serveur.

        (0.b) Valeurs de timeout test : confirmées du RFC.
          - sleep post-spawn_watcher : 200ms (kernel inotify attach margin)
          - timeout réception event : 2500ms (debounce 500ms + propagation
            + scheduler + marge CI sous charge).

        (0.c) Ordering AtomicBool is_shutting_down : Release sur store
        (handlers SIGTERM/SIGINT), Acquire sur load (Drop de WatcherGuard).
        Acquire/Release suffit, pas de SeqCst (pas de dépendance d'ordre
        croisée avec d'autres atomics).

        (0.d) protected-zones.json du test : prefixes minimaux mais
        cohérents avec les sous-dirs créés (company/config/, company/personas/,
        company/schemas/, company/plugins/, crates/). Le test classifie
        l'écriture company/config/__probe.yml comme ConfigChangeKind::Config
        (cf. classify() ligne 40-48 watcher.rs : starts_with company/config/
        match le prefix protected zones).

        Aucun fichier modifié à cette étape (pure documentation des choix
        dans le plan).
      files: []

    - description: >
        Étape 1 — Seal du permit (option b retenue suite à finding F1
        iteration 1 du round eda6659d).

        Choix d'option F1 : **(b) commit .db SEUL sans checkpoint forcé**,
        cohérent avec le pattern historique (commits c456fec et 5919adb
        vérifiés : `git show` confirme `company/data/orchestrator.db`
        seul, pas de .db-wal ni .db-shm). Justification :

        - L'option (a) checkpoint forcé via sqlite3 hors-tree est bloquée
          par le flock OS (PILIER A du RFC cdbfee72) tenu par le serveur
          courant.
        - L'option (c) committer le triplet .db + .db-wal + .db-shm est
          dangereuse : le .db-shm est de la mémoire partagée transitoire,
          un snapshot triplé peut produire un état incohérent au git
          checkout suivant, l'integrity_check échoue, le PILIER D
          autorepair se déclenche, le permit est perdu.
        - L'option (b) commit .db seul accepte que le permit reste en
          WAL en l'état actuel. C'est OK tant que le serveur courant ne
          meurt PAS entre maintenant et consume_write_permit (Étape 10).
          Garantie procédurale : on évite cargo build / restart binaire
          avant le commit + consume.

        Procédure :
          (1.a) git add -f company/data/orchestrator.db
          (1.b) git commit -m "chore: seal write permit 05b33c22 for RFC 062ebaa8 (file watcher fix)"

        Ce commit fige une partie de l'état permit (la portion du WAL
        qui aurait été checkpointée naturellement avant le grant), le
        reste reste en WAL. Le permit est en RAM dans le serveur courant
        ET partiellement sur disque. Tant que le serveur courant vit
        jusqu'à Étape 10 (consume), le permit reste utilisable.

        Conforme à write_permit_full_sequence étape 2 (commit AVANT
        modif des zones protégées) et au pattern historique éprouvé.
      files:
        - company/data/orchestrator.db

    - description: >
        Étape 2 — Introduire le newtype WatcherGuard dans
        crates/config/src/watcher.rs.

        (2.a) Ajouter en haut du fichier l'import nécessaire :
          use std::sync::Arc;
          use std::sync::atomic::{AtomicBool, Ordering};
          (tracing déjà importé via le crate)

        (2.b) Définir le struct WatcherGuard (après la définition de
        ConfigChangeKind, avant FileWatcherHandle) :

          pub struct WatcherGuard {
              watcher: Option<RecommendedWatcher>,
              is_shutting_down: Arc<AtomicBool>,
          }

          impl WatcherGuard {
              fn new(watcher: RecommendedWatcher, is_shutting_down: Arc<AtomicBool>) -> Self {
                  Self { watcher: Some(watcher), is_shutting_down }
              }
          }

          impl Drop for WatcherGuard {
              fn drop(&mut self) {
                  // Drop le watcher en premier pour libérer les fds inotify
                  // AVANT de loguer (le message reflète l'état post-drop).
                  // catch_unwind paranoïaque au cas où le destructeur de
                  // RecommendedWatcher panique (notify v7 ne devrait pas,
                  // mais défense-en-profondeur).
                  let _ = std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {
                      self.watcher.take();
                  }));
                  if self.is_shutting_down.load(Ordering::Acquire) {
                      tracing::info!(
                          "WatcherGuard dropped during shutdown — inotify watches released cleanly."
                      );
                  } else {
                      tracing::error!(
                          "WatcherGuard dropped OUTSIDE shutdown — file watcher is now DEAD; \
                           inotify watches released. Investigate immediately (cf. diagnostic 9534dd33)."
                      );
                  }
              }
          }

        Vérification LSP : get_diagnostics après ajout, attendu 0 erreur
        (le type est self-contained, aucune dépendance sur le reste).
      files:
        - crates/config/src/watcher.rs

    - description: >
        Étape 3 — Refonte FileWatcherHandle (champ _guard) et signature
        spawn_watcher.

        (3.a) Modifier FileWatcherHandle :

          /// Handle returned by [`spawn_watcher`]. Drop it (or its `_guard`
          /// field, if you destructure) to stop watching.
          pub struct FileWatcherHandle {
              pub rx: mpsc::Receiver<ConfigChangeKind>,

              /// HOLD this field alive for as long as you consume `rx`.
              /// Dropping it releases the inotify watches and kills the
              /// underlying file watcher. The leading underscore silences
              /// the unused-field lint; capturing it via
              /// `let _keep = _guard;` inside an `async move` block is
              /// MANDATORY in Rust 2024 (disjoint capture for async
              /// closures). Cf. diagnostic-report 9534dd33.
              pub _guard: WatcherGuard,
          }

        (3.b) Modifier la signature de spawn_watcher :

          pub fn spawn_watcher(
              root: &str,
              debounce: Duration,
              is_shutting_down: Arc<AtomicBool>,
          ) -> anyhow::Result<FileWatcherHandle>

        (3.c) À la fin de spawn_watcher, remplacer :
            Ok(FileWatcherHandle { rx: out_rx, _watcher: watcher })
          par :
            Ok(FileWatcherHandle {
                rx: out_rx,
                _guard: WatcherGuard::new(watcher, is_shutting_down),
            })

        Vérification LSP : get_diagnostics → main.rs aura une erreur de
        signature (3ème arg manquant + _watcher renamed), normal, sera
        corrigé Étape 5.
      files:
        - crates/config/src/watcher.rs

    - description: >
        Étape 4 — Extension à projects/ avec best-effort dans
        crates/config/src/watcher.rs.

        Après le bloc qui watche company/ (lignes 92-95 du fichier
        original), insérer :

          // Best-effort: projects/ peut ne pas exister sur un fresh
          // checkout ou si tous les projets ont été archivés. L'absence
          // n'est pas un échec ; un échec d'inotify_watch (par exemple
          // limite max_user_watches atteinte) n'est pas non plus une
          // raison de couler tout le watcher, car les autres dirs (zones
          // protégées + company/) restent watchés.
          let projects_dir = root_path.join(constants::PROJECTS_DIR);
          if projects_dir.is_dir() {
              if let Err(e) = watcher.watch(&projects_dir, RecursiveMode::Recursive) {
                  tracing::warn!(
                      "Failed to watch projects/ (best-effort, other dirs still watched): {e}"
                  );
              }
          }

        Note : constants::PROJECTS_DIR existe déjà ligne 32 de
        constants.rs (vérifié), pas de modification de ce fichier. Le
        permit le couvre par asymétrie favorable mais ne sera pas
        consommé sur ce path (acceptable, le permit non consommé est
        inerte selon CEO finding 5).

        Vérification LSP : get_diagnostics → uniquement erreurs main.rs
        attendues.
      files:
        - crates/config/src/watcher.rs

    - description: >
        Étape 5 — Adaptation de crates/mcp-servers/orchestrator/src/main.rs.

        Toutes les modifications dans la fonction run_server (ligne 1061
        approx).

        (5.a) Créer is_shutting_down AVANT spawn_watcher (juste après la
        création de watcher_alive ligne 1188 environ) :

          let is_shutting_down = Arc::new(AtomicBool::new(false));

        (5.b) Modifier l'appel spawn_watcher (ligne 1215) pour passer
        is_shutting_down.clone() en 3ème argument :

          let watcher_handle_opt = match watcher::spawn_watcher(
              &root,
              Duration::from_millis(500),
              is_shutting_down.clone(),
          ) {

        (5.c) Restructurer le `Ok(mut handle) => { ... }` (lignes 1216-1266)
        en `Ok(handle) => { ... }` avec destructure et capture explicite :

          Ok(handle) => {
              // Destructure pour casser la disjoint capture rule de
              // l'edition 2024 : on bindge explicitement `_guard` et on
              // l'embarque dans la closure async via un `let _keep = _guard;`
              // à l'intérieur. FileWatcherHandle ne porte PAS Drop ; le
              // Drop bruyant vit dans WatcherGuard.
              let watcher::FileWatcherHandle { mut rx, _guard } = handle;
              let engine = engine.clone();
              let validator = validator.clone();
              let root = root.clone();
              let schemas_dir = schemas_dir.clone();
              let watcher_alive = watcher_alive.clone();
              let task_handle = tokio::spawn(async move {
                  // Le guard (et donc le RecommendedWatcher qu'il porte)
                  // doit vivre aussi longtemps que la consumer task. Sans
                  // cette ligne, l'edition 2024 ne le capture pas (champ
                  // jamais lu dans la closure) et il est dropé à la fin
                  // du match arm, tuant le fd inotify (cf. diagnostic
                  // 9534dd33). NE PAS SUPPRIMER ce binding même s'il a
                  // l'air inutilisé.
                  let _keep_guard = _guard;

                  watcher_alive.store(true, Ordering::Release);
                  struct AliveGuard(Arc<AtomicBool>);
                  impl Drop for AliveGuard {
                      fn drop(&mut self) {
                          self.0.store(false, Ordering::Release);
                      }
                  }
                  let _alive_guard = AliveGuard(watcher_alive.clone());

                  while let Some(change) = rx.recv().await {
                      // ... corps existant inchangé (match change { ... }) ...
                  }
              });
              Some(task_handle)
          }

        Important : remplacer toutes les références `handle.rx.recv()`
        par `rx.recv()` dans le corps de la closure (cf. nouveau binding
        local après destructure).

        (5.d) Modifier les arms SIGTERM/SIGINT du tokio::select! (lignes
        1280-1293) pour armer is_shutting_down AVANT le tracing::info :

          _ = sigterm.recv() => {
              is_shutting_down.store(true, Ordering::Release);
              tracing::info!("SIGTERM received, initiating graceful shutdown");
          }
          _ = sigint.recv() => {
              is_shutting_down.store(true, Ordering::Release);
              tracing::info!("SIGINT received, initiating graceful shutdown");
          }

        Pour le cas `result = service.waiting()` (MCP service termine
        naturellement, ex: stdin closed), armer AUSSI is_shutting_down
        car c'est sémantiquement un shutdown propre :

          result = service.waiting() => {
              is_shutting_down.store(true, Ordering::Release);
              match result {
                  Ok(_) => tracing::info!("MCP service ended normally"),
                  Err(e) => tracing::warn!("MCP service ended with error: {e}"),
              }
          }

        (5.e) Adapter la séquence shutdown (lignes 1298-1300) pour
        détecter un panic via JoinError (décision 0.a) :

          if let Some(h) = watcher_handle_opt {
              h.abort();
              // Récupérer un éventuel panic avec un timeout court.
              // Au-delà de 200ms on n'attend pas — le shutdown doit
              // rester ponctuel.
              match tokio::time::timeout(Duration::from_millis(200), h).await {
                  Ok(Err(join_err)) if join_err.is_panic() => {
                      tracing::error!(
                          "Watcher consumer task panicked at shutdown: {join_err}"
                      );
                  }
                  _ => {} // cancelled, normal exit, or timeout: silent
              }
          }

        Note : `h.abort()` prend `&self` (vérifié docs.rs tokio 1.52.3,
        clos en finding F2 iteration 1). On peut donc enchaîner
        `h.abort(); tokio::time::timeout(_, h).await` sans double move.

        Vérification LSP : get_diagnostics après chaque sous-étape
        (5.a → 5.e), attendu 0 erreur en fin de 5.e.
      files:
        - crates/mcp-servers/orchestrator/src/main.rs

    - description: >
        Étape 6 — Test de régression dans
        crates/config/tests/watcher_integration.rs (nouveau fichier).

        Contenu complet (copie fidèle de la spec RFC iteration 2 enrichie) :

          use std::sync::Arc;
          use std::sync::atomic::{AtomicBool, Ordering};
          use std::time::Duration;

          use companyos_config::watcher::{spawn_watcher, FileWatcherHandle};
          use tempfile::TempDir;

          #[tokio::test]
          async fn watcher_survives_async_move_destructure() {
              // (F4.a) Reset cache statique de protected_zones AVANT
              // setup, sinon un test précédent peut avoir mis en cache
              // un autre PathBuf.
              companyos_config::protected_zones::reload();

              let tmp = TempDir::new().expect("tempdir");
              let root = tmp.path();

              // (F4.b) Créer les sous-dirs minimaux. Inclut projects/
              // pour exercer la branche best-effort de Modif 2.
              for d in [
                  "company",
                  "company/config",
                  "company/personas",
                  "company/schemas",
                  "company/plugins",
                  "crates",
                  "projects",
              ] {
                  std::fs::create_dir_all(root.join(d)).unwrap();
              }
              std::fs::write(
                  root.join("company/config/protected-zones.json"),
                  r#"{"prefixes":["company/config/","company/personas/","company/schemas/","company/plugins/","crates/"],"files":[]}"#,
              ).unwrap();
              companyos_config::protected_zones::reload();

              let is_shutting_down = Arc::new(AtomicBool::new(false));
              let handle = spawn_watcher(
                  root.to_str().unwrap(),
                  Duration::from_millis(500),
                  is_shutting_down.clone(),
              ).expect("spawn_watcher ok");

              // Reproduire EXACTEMENT le pattern de main.rs : destructure
              // + async move + let _keep = _guard.
              let FileWatcherHandle { mut rx, _guard } = handle;
              let task = tokio::spawn(async move {
                  let _keep = _guard;
                  rx.recv().await
              });

              // (F4.c) Laisser inotify s'attacher.
              tokio::time::sleep(Duration::from_millis(200)).await;

              // Touch un YAML dans company/config (classified Config).
              let probe = root.join("company/config/__probe.yml");
              std::fs::write(&probe, "x").unwrap();

              // Timeout 2.5s.
              let received = tokio::time::timeout(
                  Duration::from_millis(2500),
                  task,
              ).await.expect(
                  "watcher did not deliver any event within 2.5s — \
                   regression of the disjoint-capture bug (cf. 9534dd33)"
              );
              assert!(matches!(received, Ok(Some(_))));

              // Éviter le log error parasite en fin de test (drop du
              // _keep en fin de scope).
              is_shutting_down.store(true, Ordering::Release);
          }

        Notes :
        - tempfile = "3" est déjà en dev-dep du crate (vérifié dans
          crates/config/Cargo.toml ligne 19), pas besoin de modif Cargo.toml.
        - companyos_config::protected_zones::reload() existe (vérifié
          dans le module).
        - Le test est `#[tokio::test]` qui requiert tokio macros. Le
          workspace tokio = { features = ["full"] } les fournit déjà.

        Vérification LSP : get_diagnostics sur le nouveau fichier,
        attendu 0 erreur.
      files:
