    - description: >
        Étape 11 — reload_config (DERNIÈRE étape sur le serveur).

        Appel MCP `reload_config()`. Recharge la config in-memory du
        serveur (flow-control.yml, etc.) et n'a normalement pas de
        side-effect destructif. Selon la persona, cet appel peut
        déclencher un restart du binaire si tracing-subscriber redémarre,
        donc à faire UNIQUEMENT en dernier.

