  title: "Implementation plan : fix file watcher orchestrator (disjoint capture + WatcherGuard + projects/ best-effort)"
  author: implementer
  created_at: "2026-06-03"
  project: company-os
  description: >
    Plan d'exécution du RFC 062ebaa8 (iteration 2 approved). Trois modifications
    Rust coordonnées dans crates/config/src/watcher.rs et
    crates/mcp-servers/orchestrator/src/main.rs, plus un test de régression
    dans crates/config/tests/watcher_integration.rs. Le permit
    05b33c22-7cc2-44cc-8631-428d96406137 est actif sur les 4 paths (dont
    crates/config/src/constants.rs en asymétrie favorable, probablement non
    consommé).

    Ordre dicté par les dépendances : décisions tranchées d'abord (open
    points laissés par le RFC), puis newtype WatcherGuard (base sur laquelle
    repose tout le reste), puis refonte FileWatcherHandle et signature
    spawn_watcher (impacte le seul caller main.rs), puis l'extension
    projects/ qui réutilise le même watcher, puis l'adaptation de main.rs
    (destructure + AtomicBool partagé), puis le test de régression, enfin
    build/test verts et validation manuelle des 6 acceptance criteria.

    Permit en WAL non checkpointé : checkpoint manuel via PRAGMA en début
    de séquence pour figer le permit sur disque avant le commit de seal.
    Modifs Rust appliquées via Edit AVANT cargo build pour ne pas perdre
    le permit sur restart du binaire (cf. note opérationnelle utilisateur).
