api_version: companyos/v1
kind: task-request
metadata:
  id: 0db7585b-a58a-477a-ab38-a4757ed03029
  title: "V1 rust : audit crate par crate (dead code, duplication, API sans callers, primitive obsession)"
  author: pm
  created_at: "2026-08-25"
  project: company-os
  description: >
    Domaine v1-rust-audit du programme companyos-v1 (roadmap a410bb43).
    Première passe globale sur les ~14000 lignes de Rust (4 crates + 2
    serveurs MCP) depuis la création du projet : code mort, duplication
    entre crates, API publiques sans callers, dépendances inutilisées, et
    passe primitive-obsession exigée par la directive utilisateur du
    2026-08-25 (lesson cc0ca5d7) : les invariants vivent dans les types,
    String/bytes est un dernier recours. La correction de SealPermit
    (8 champs String, RFC cde13417) est le premier cas d'application.
    Directive utilisateur complémentaire du même jour (lesson 3aff4e3c) :
    (1) passe littéraux magiques, toute valeur littérale porteuse de sens
    est nommée en constante typée ; (2) passe anti-réinvention, minimiser
    le in-house : tout composant maison redondant avec une crate stable et
    reconnue de la communauté est recensé avec sa crate candidate, et
    remplacé sauf justification explicite.
  tags:
    - companyos-v1
    - rust
    - audit
    - dead-code
    - primitive-obsession
    - typage
    - magic-literals
    - crates
    - not-invented-here
