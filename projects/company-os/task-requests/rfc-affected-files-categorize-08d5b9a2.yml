api_version: companyos/v1
kind: task-request
metadata:
  id: 08d5b9a2-2dc6-4b73-8e6a-c7799367b04d
  title: "Schema RFC : distinguer affected_files modified vs created"
  author: pm
  created_at: "2026-06-04"
  project: company-os
  description: >
    Le champ spec.affected_files du schema RFC est aujourd'hui un array
    plat de strings qui ne distingue pas les fichiers à MODIFIER (déjà
    existants dans HEAD) des fichiers à CRÉER (nouveaux). Cette absence de
    distinction a causé des blockers de permit répétés : un fichier à
    créer oublié dans affected_files bloque le hook au moment de
    l'écriture (lesson 611fde3e : Cargo.toml et types.rs oubliés sur le
    RFC bdee1af4). De plus, tous les RFCs récents (359f9162, 1c0f2570,
    bde023e2) ont dû expliciter cette distinction EN PROSE dans la section
    impact, faute de champ structuré, ce qui est redondant et non
    exploitable par l'outillage. L'objectif est d'introduire une
    structure qui distingue modified et created dans le schema RFC, de
    manière à rendre la distinction explicite, vérifiable, et exploitable
    (par exemple par un futur outillage de pré-vérification de permit).
  tags:
    - rfc-schema
    - affected-files
    - schema
    - companyos-internals
    - friction-permits
  related:
    - id: 611fde3e-de00-4cfd-ad7e-6c4e16085bc8
      kind: lesson-learned
      relationship: input
    - id: be16dc46-0a2c-470c-a1f4-8f89a98abdbf
      kind: lesson-learned
      relationship: input
    - id: 359f9162-18f2-4b72-85b0-7d0e44608959
      kind: rfc
      relationship: related

spec:
  priority: medium
  status: done
  acceptance_criteria:
    - >
      Le schema RFC (company/schemas/rfc.schema.json) permet de distinguer
      explicitement les fichiers à modifier (existants) des fichiers à
      créer (nouveaux) dans spec.affected_files (ou un champ équivalent).
      La structure retenue est documentée et validée.
    - >
      RÉTRO-COMPATIBILITÉ : les RFCs existants (qui utilisent le format
      plat array de strings) ne doivent pas devenir invalides. SOIT le
      nouveau format est rétro-compatible (le format plat reste accepté en
      plus du format structuré), SOIT une migration des RFCs existants est
      prévue et exécutée. Le choix entre ces deux approches est une
      décision d'architecture à trancher. Aucun RFC existant ne doit
      casser la validation après le changement.
    - >
      Le code Rust qui lit affected_files (s'il en existe : extraction des
      paths pour les write permits, indexation, etc.) est mis à jour pour
      gérer le nouveau format sans régression. Si aucun code ne lit ce
      champ structurellement, le noter.
    - >
      Tests couvrant les trois axes. Nominal : un RFC au nouveau format
      (modified + created séparés) valide correctement. Négatif : format
      invalide rejeté avec erreur claire. Edge : RFC sans fichier créé
      (created vide ou absent), RFC sans fichier modifié, RFC au format
      plat legacy (selon la décision de rétro-compatibilité), listes
      vides.
    - >
      La discipline de catégorisation est reflétée là où elle doit l'être
      (par exemple : si une règle ou une lesson recommandait d'expliciter
      la distinction en prose, elle est mise à jour pour pointer vers le
      champ structuré). Application be16dc46.
    - >
      ATTENTION ESCALADE : si le changement de schema est un breaking
      change (rend invalides des artifacts existants), il relève de
      ceo_cannot_approve_alone (breaking-schema-change) et nécessite une
      attention particulière. Le design doit viser la rétro-compatibilité
      pour éviter cette catégorie, ou la justifier explicitement si elle
      est inévitable.
