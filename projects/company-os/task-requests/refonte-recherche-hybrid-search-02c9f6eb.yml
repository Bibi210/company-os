api_version: companyos/v1
kind: task-request
metadata:
  id: 02c9f6eb-fb2d-48f2-82d2-5676773e0e8b
  title: "Refondre la recherche dans la mémoire collective : hybrid search lexical + sémantique"
  author: pm
  created_at: "2026-06-01"
  project: company-os
  description: >
    Le tool MCP search() actuel utilise SQLite FTS5 en mode lexical
    pur sur titre+description+tags des artifacts. Il retourne
    massivement zéro résultat sur des requêtes pertinentes,
    démontré empiriquement pendant la session de cadrage : trois
    queries autour du sujet "search semantic embeddings vector",
    "recherche memoire collective FTS", "lookup memoire faux
    negatif" ont toutes retourné 0 résultat dans un corpus qui
    contient justement des artifacts sur la mémoire collective et
    sur le lookup. La recherche est le cœur fonctionnel de
    CompanyOS : la règle memory_lookup_before_acting impose à
    tous les agents un lookup avant chaque production
    d'artifact. Si la recherche est faible, la mémoire collective
    devient une promesse non tenue et la règle se transforme en
    rituel formel sans valeur. Ce task-request cadre la refonte
    profonde de search(), de son backend, et du pipeline
    d'indexation associé. L'Architect mène le design, choisit la
    pile technique, arbitre les compromis. Breaking change
    accepté sur l'API search() si nécessaire, à condition que la
    migration soit propre et que les appelants connus soient mis
    à jour.
  tags:
    - search
    - retrieval
    - memory
    - rag
    - embeddings
    - hybrid-search
    - critical-infra
  related:
