api_version: companyos/v1
kind: task-request
metadata:
  id: 029c9c39-186f-41f5-bf08-225ba9776f83
  title: "Basculer les modèles du PM et de l'Architect vers claude-fable-5 dans opencode.json"
  author: pm
  created_at: "2026-06-10"
  project: company-os
  description: >
    Demande utilisateur : remplacer le modèle anthropic/claude-opus-4-8 par
    anthropic/claude-fable-5 UNIQUEMENT pour les agents pm et architect dans
    company/config/opencode.json. Les agents implementer et ceo restent sur
    anthropic/claude-opus-4-8. Le fichier est en zone protégée (company/config/) :
    le changement nécessite un RFC, une approbation CEO et un write permit. Une
    tentative de modification directe a déjà été annulée par le hook defense-in-depth
    (session du 2026-06-10). Périmètre réduit de 4 à 2 agents sur précision
    utilisateur du 2026-06-10.
  tags:
    - opencode
    - config
    - model
    - agents
    - companyos-internals

spec:
  priority: medium
  status: in_progress

  context: >
    L'utilisateur a initialement changé manuellement le modèle des 4 agents de
    anthropic/claude-opus-4-8 vers anthropic/claude-fable-5 dans
    company/config/opencode.json. Lors de la tentative de commit par le PM, le hook
    pre-commit a refusé (zone protégée sans write permit), puis le hook defense-in-depth
    a annulé la modification du working tree. Le fichier est donc revenu à
    claude-opus-4-8. L'utilisateur a ensuite précisé le périmètre : seuls pm et
    architect passent à claude-fable-5 ; implementer et ceo restent sur
    claude-opus-4-8. Il faut faire passer ce changement par le circuit officiel
    (RFC -> review -> approbation CEO -> write permit -> implémentation -> commit).

  acceptance_criteria:
    - "company/config/opencode.json référence anthropic/claude-fable-5 comme modèle pour les agents pm et architect uniquement"
    - "Les agents implementer et ceo restent sur anthropic/claude-opus-4-8"
    - "Aucun autre champ de opencode.json n'est modifié (prompts, default_agent, structure)"
    - "Le changement est couvert par un RFC approuvé par le CEO et un write permit, puis commité (sans push)"
    - "Le fichier reste un JSON valide et la config opencode reste fonctionnelle"

  constraints:
    - "Périmètre strictement borné aux champs model des agents pm et architect dans company/config/opencode.json"
    - "Pas de push : commit local uniquement"
