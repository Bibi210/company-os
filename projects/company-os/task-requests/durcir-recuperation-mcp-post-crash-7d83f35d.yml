api_version: companyos/v1
kind: task-request
metadata:
  id: 7d83f35d-b6a5-46ff-b7e3-70a130ec99a8
  title: "Durcir la récupération MCP post-crash : logs persistés, reindex sans double panic, health-check non suicidaire, plafond -32050 sous le timeout client"
  author: pm
  created_at: "2026-09-09"
  project: company-os
  description: >
    Suite de l'incident du 2026-09-09 (diagnostic ccd7c984) : SIGABRT du
    serveur orchestrator par double panic dans le task reindex du file
    watcher, puis ~4 minutes de non-récupération (hypothèse dominante :
    boucle de kill par health-check 10s pendant une fenêtre de boot lent),
    résolues par un reboot manuel que l'architecture 18011bfc devait rendre
    inutile. Ce task-request cadre les correctifs : instrumentation d'abord
    (sans logs persistés, le prochain incident sera aussi aveugle), puis
    élimination du mode de panne à la racine (double panic) et de la boucle
    de récupération (health-check), et alignement du contrat d'escalade sur
    le timeout client réel.
  tags:
    - mcp
    - orchestrator
    - proxy
    - availability
    - resilience
    - sigabrt
    - health-check
    - logging
    - critical-infra
  related:
    - id: ccd7c984-eb4b-4d69-90bb-c7a8980b5169
      kind: diagnostic-report
