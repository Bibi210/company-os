  title: "V1 process : recensement des règles en prose et durcissement dans le harness"
  author: pm
  created_at: "2026-06-10"
  project: company-os
  description: >
    Troisième domaine du programme companyos-v1 (roadmap a410bb43, item
    v1-process-hardening). Recenser TOUTES les règles de process en prose
    (shared-rules, review-protocol, flow-control, human-review-triggers,
    rules des 4 personas) et classer chacune : déjà mécanisée / mécanisable
    (avec mécanisme proposé) / intrinsèquement prose. Puis durcir dans le
    harness tout ce qui est mécanisable, via RFCs. Test de réussite fixé
    par l'utilisateur : si make clean-company efface la mémoire YAML, tout
    ce qu'on a appris doit survivre parce qu'il vit dans le harness.
