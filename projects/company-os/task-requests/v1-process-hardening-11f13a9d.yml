spec:
  priority: high
  status: done

  context: >
    Principe directeur n°1 du programme V1 : le harness avant la prose. Une
    règle d'interaction entre agents qui ne vit que dans shared-rules repose
    sur la bonne volonté d'un LLM ; une règle dans le harness (hook
    defense-in-depth, pre-commit, tool MCP, schema JSON) est impossible à
    contourner. Le pattern est déjà validé par la mémoire (invariant
    mécanique : retirer le paramètre plutôt qu'interdire son usage, lesson
    bd4650e2 ; supersession à deux écritures détectable par check
    déterministe, lesson 9b2c1951 ; l'ordre commit-puis-consume des permits
    violé en session le 2026-06-10 faute d'être outillé). Le recensement
    doit couvrir l'intégralité des règles, y compris celles des personas,
    et proposer pour chaque règle mécanisable le mécanisme concret et sa
    couche (plugin JS, serveur Rust, schema, pre-commit).

  acceptance_criteria:
    - "Un diagnostic-report recense TOUTES les règles de process en prose des fichiers : shared-rules.yml, review-protocol.yml, flow-control.yml, human-review-triggers.yml, et les rules.must/never des 4 personas"
    - "Chaque règle est classée : déjà mécanisée (avec le mécanisme existant), mécanisable (avec le mécanisme proposé et sa couche), ou intrinsèquement prose (avec justification)"
    - "Chaque règle est aussi évaluée au test clean-company : survivrait-elle à l'effacement de la mémoire YAML ?"
    - "Les règles mécanisables sont priorisées par rapport coût/valeur et regroupées en lots cohérents donnant lieu à un ou plusieurs RFCs"
    - "Au moins le premier lot (le plus haute valeur) est implémenté via le cycle complet RFC -> review -> approbation CEO -> permit -> implémentation"
    - "Le recensement identifie aussi les règles mortes (jamais appliquées, contredites par la pratique) à retirer ou amender"

  constraints:
    - "Les mécanismes ajoutés ne doivent pas dupliquer de logique entre couches (préparer le terrain de v1-harness-refactor, pas l'aggraver)"
    - "Pas de push : commits locaux uniquement"
    - "Les changements aux zones protégées passent par RFC + approbation CEO + write permit, comme toujours"
