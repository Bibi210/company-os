      kind: lesson-learned
      relationship: related

spec:
  priority: medium
  status: backlog

  acceptance_criteria:
    - >
      Le paramètre `kind` est retiré du tool MCP `search` :
      signature MCP, code Rust côté engine + db, documentation
      éventuelle. Les appels existants qui passent kind=X reçoivent
      soit un comportement de filtre ignoré (avec warning), soit
      une erreur claire de paramètre inconnu (breaking change
      contrôlé, à arbitrer par l'Architect).

    - >
      L'Architect statue sur les autres filtres structurés
      introduits par RFC bdee1af4. Au minimum : `author`,
      `project`, `created_after`, `created_before`. Position PM :
      `tags` et `id_prefix` à garder, le reste à challenger. Mais
      c'est l'Architect qui tranche selon utilisation observée.

    - >
      Mise à jour cohérente du jeu de queries de référence
      (`search_eval`) si présent. Vérifier qu'aucune query ne
      dépendait du filtre kind. Si oui, refactor.

    - >
      Mise à jour des appelants connus : `memory_lookup_before_acting`
      dans shared-rules invite explicitement les agents à appeler
      search(query, kind=...) — la formulation doit être adaptée.
      Les personas peuvent aussi mentionner search(...kind...) dans
      leur prose, à grep.

    - >
      Tests : tests unitaires + intégration du `search` post-refactor.
      Acceptance criterion empirique : les 3 queries du symptôme
      original (search semantic embeddings vector, recherche memoire
      collective FTS, lookup memoire faux negatif) retournent
      toujours au moins 5 résultats top-pertinents avec recall
      équivalent ou supérieur à la baseline post-bdee1af4 (recall@10
      = 0.895).

    - >
      Lesson-learned de clôture chaînée 600307a4 (refonte search) et
      4e5c109b (préférence déterministe vs LLM). Capter la
      réflexion : un filtre qui appauvrit le rappel n'a pas sa place
      dans le tool de retrieval principal.

  investigation_hints: >
    Pistes non prescriptives.

    (1) Lookup mémoire. RFC bdee1af4 (refonte search hybrid) qui
    a introduit les filtres structurés. Lesson 600307a4 qui
    documente l'implémentation. shared-rules.yml règle
    memory_lookup_before_acting qui mentionne explicitement
    search(query, kind=...). Lessons sur le cargo-cult des
    paramètres optionnels (02b8e1ce) — adjacent.

    (2) Décision breaking change vs deprecation graceful.
    Retrait pur (l'argument kind n'est plus reconnu) est plus
    propre mais casse les appels existants. Deprecation graceful
    (kind accepté mais ignoré avec warning) laisse une transition.
    À arbitrer.

    (3) Le besoin "liste tous les artifacts d'un kind" reste
    légitime. Soit on l'adresse via un nouveau tool
    `list_artifacts(kind)` séparé, soit on accepte que ce besoin
    n'est pas dans le scope du retrieval principal. L'Architect
    décide.

    (4) Sanity check empirique sur ma roadmap actuelle (329da45f) :
    search("roadmap auto-sync") devrait retourner le task-request +
    le RFC + le design-doc + l'implementation-plan + la lesson en
    top. Si kind est retiré, ce serait beaucoup plus lisible.

    (5) Le filtre est probablement encore utile pour les filtres
    qui RESTREIGNENT par méta-données précises (id_prefix pour
    cibler un artifact, tags pour raffiner par thématique). À
    distinguer de kind qui filtre par TYPE — sous-cas du listing,
    pas du retrieval.

  out_of_scope: >
    - Refonte plus large de l'API search() au-delà du retrait des
      filtres. Le mode hybrid/lexical/semantic reste.
    - Introduction d'un nouveau tool list_artifacts (peut être
      proposé en suite par l'Architect, mais hors de ce
      task-request).
    - Modification du pipeline d'indexation (l'index reste tel
      quel, c'est juste la signature du search qui change).
