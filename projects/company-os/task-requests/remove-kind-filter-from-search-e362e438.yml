api_version: companyos/v1
kind: task-request
metadata:
  id: e362e438-e550-4c98-9cdd-2af21b5d8978
  title: "Retirer le paramètre kind du tool MCP search (le filtrage par kind appauvrit la recherche)"
  author: pm
  created_at: "2026-06-05"
  project: company-os
  description: >
    Décision utilisateur explicite : retirer le paramètre `kind` du
    tool MCP `search`. La présence de ce filtre incite les agents
    (et le PM) à restreindre la recherche à un type d'artifact
    précis, ce qui appauvrit le rappel. Or l'intention du retrieval
    hybride (RFC bdee1af4 implémenté) est précisément de retourner
    BEAUCOUP de résultats pertinents tous kinds confondus, pour que
    le lookup mémoire expose l'écosystème complet d'un sujet :
    task-request + design-doc + RFC + lesson + diagnostic etc.

    Le filtrage par kind reste utile dans certains cas (par exemple
    « liste tous les RFCs actifs »), mais ce n'est pas une
    recherche : c'est un listing. Pour ce besoin, le tool MCP
    `list_roadmaps` existe pour les roadmaps, et un éventuel
    `list_artifacts(kind)` séparé serait l'outil adapté. Le tool
    `search` doit rester focalisé sur sa mission : retrieval
    sémantique + lexical large.

    Sont aussi à examiner les autres filtres structurés introduits
    par RFC bdee1af4 (`author`, `tags`, `project`, `created_after`,
    `created_before`, `id_prefix`). Mon avis PM (non bloquant) :
    `tags` et `id_prefix` ont un cas d'usage légitime
    (raffinement quand le rappel est trop large), les autres sont
    discutables. L'Architect arbitre.
  tags:
    - search
    - retrieval
    - api
    - simplification
    - companyos-internals
  related:
    - id: bdee1af4-4944-4bee-b7c0-18efd6c7961f
