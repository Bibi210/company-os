api_version: companyos/v1
kind: task-request
metadata:
  id: 415c73c0-eae9-46e0-8f05-e3ff38156b3c
  title: "Disponibilité MCP : remplacer la stratégie de polling/retry par une gestion propre"
  author: pm
  created_at: "2026-06-10"
  project: company-os
  description: >
    Directive utilisateur (2026-06-10) : arrêter la stratégie de polling pourrie
    et concevoir un vrai mécanisme propre de disponibilité du serveur MCP.
    Aujourd'hui, quand le binaire orchestrator est tué (cargo build/relink
    pendant make ci, reload_config, crash), la récupération repose sur un
    empilement de contournements : health check par polling dans le proxy,
    règle de prose mcp_reconnect demandant aux agents de retry 3 fois avec des
    sleeps, et en dernier recours un reboot manuel de la session par
    l'utilisateur. Incident du jour : le proxy terminé pendant le relink n'a
    jamais été respawné, bloquant generate_id et l'indexation pour toute la
    fin de session malgré les retries. Objectif : une architecture de
    disponibilité événementielle et auto-réparante, sans polling ni sleeps,
    où la panne du binaire est un événement géré, pas une instruction de
    patience donnée aux LLMs.
  tags:
    - companyos-v1
    - mcp
    - proxy
    - availability
    - resilience
    - harness
    - critical-infra
