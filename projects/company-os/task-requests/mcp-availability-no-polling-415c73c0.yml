spec:
  priority: critical
  status: in_progress

  context: >
    Le RFC d9399863 a rendu le proxy résilient aux restarts courts (buffer
    FIFO, health check, circuit breaker), mais l'incident du 2026-06-10
    montre les limites : binaire tué pendant un relink cargo, proxy terminé
    sans respawn, session MCP morte jusqu'au reboot utilisateur. Côté agents,
    la règle mcp_reconnect (prose) prescrit des retries espacés de sleeps,
    exactement le pattern de polling que la directive utilisateur condamne.
    Le sujet exige d'abord une investigation : cartographier tous les points
    de polling/sleep/retry de la chaîne (proxy, plugin, règles de prose,
    comportements d'agents), identifier les modes de panne réels observés
    (diagnostics e84b641d, fa9bd072, incident du jour), puis concevoir le
    mécanisme propre (supervision/respawn du processus, readiness
    événementielle, file d'attente persistante des requêtes, escalade
    structurée vers l'utilisateur en dernier recours). S'inscrit dans le
    principe V1 "le harness avant la prose" : la règle mcp_reconnect devrait
    disparaître au profit d'un mécanisme.

  acceptance_criteria:
    - "Un diagnostic-report cartographie tous les points de polling/sleep/retry de la chaîne MCP (proxy, plugins, règles de prose, Makefile) et les modes de panne observés"
    - "Un RFC propose une architecture de disponibilité sans polling : supervision et respawn automatique du binaire, readiness événementielle, gestion des requêtes pendant l'indisponibilité"
    - "La règle de prose mcp_reconnect est retirée ou réduite à un pointeur vers le mécanisme (test clean-company)"
    - "Un kill du binaire pendant un cargo build/relink ne nécessite plus jamais un reboot de session utilisateur"

  constraints:
    - "Compatible avec le transport MCP stdio imposé par opencode"
    - "Ne pas casser la résilience existante du RFC d9399863 : l'améliorer ou la remplacer explicitement"
    - "Pas de push : commits locaux uniquement"
