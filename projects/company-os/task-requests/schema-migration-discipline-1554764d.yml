api_version: companyos/v1
kind: task-request
metadata:
  id: 1554764d-1836-4705-84f6-2171b5caa727
  title: "Discipline de migration de schéma SQL côté orchestrator"
  author: pm
  created_at: "2026-06-04"
  project: company-os
  description: >
    Le hotfix appliqué à db.rs (CREATE INDEX exécuté AVANT les ALTER TABLE
    qui ajoutaient les colonnes, crashant la migration sur toute DB
    pré-existante, commit 57019e7) est symptomatique d'une absence de
    discipline générale sur les migrations de schéma SQL de l'orchestrator.
    Aujourd'hui il n'y a pas de mécanisme de versionning de schéma, et pas
    de tests qui exercent toutes les transitions possibles (DB vierge, DB
    legacy avec ancien schéma, DB déjà à jour). Une migration mal ordonnée
    ou non idempotente casse silencieusement au boot sur les DB existantes.
    L'objectif est de formaliser une approche robuste : un suivi de version
    de schéma, des migrations idempotentes et ordonnées, et des tests qui
    exercent les transitions. NOTE : la DB SQLite est un index
    reconstructible depuis les YAML (PILIER D autorepair, RFC cdbfee72),
    donc l'enjeu n'est pas la perte de données mais la robustesse du boot
    et l'évitement des crashs de migration.
  tags:
    - sqlite
    - schema-migration
    - orchestrator
    - robustness
    - companyos-internals
