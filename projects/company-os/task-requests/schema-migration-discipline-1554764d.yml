spec:
  priority: medium
  status: backlog
  acceptance_criteria:
    - >
      L'état actuel de la gestion du schéma SQL de l'orchestrator est
      caractérisé : comment le schéma est créé/migré au boot aujourd'hui
      (CREATE TABLE IF NOT EXISTS, ALTER TABLE, CREATE INDEX), dans quel
      ordre, et quelles fragilités existent (ordre, idempotence, absence de
      versionning). Diagnostic vérifié sur db.rs.
    - >
      Un mécanisme de suivi de version de schéma est introduit (par exemple
      une table schema_version, ou PRAGMA user_version, ou un système de
      migrations ordonnées numérotées). Le choix du mécanisme est une
      décision d'architecture à trancher. Le boot applique les migrations
      manquantes dans l'ordre, de manière idempotente (relancer le boot sur
      une DB déjà à jour ne fait rien et ne crashe pas).
    - >
      Les migrations sont ordonnées correctement : toute colonne ajoutée
      par ALTER TABLE existe avant qu'un CREATE INDEX ne la référence (la
      classe de bug du hotfix 57019e7 est structurellement évitée, pas
      seulement corrigée ponctuellement).
    - >
      Tests couvrant les transitions, entérinés dans la suite de tests
      automatisée (PAS seulement validés à la main, cf. lesson b04f8838).
      Nominal : boot sur DB vierge -> schéma complet créé. Transition : boot
      sur DB legacy (schéma antérieur) -> migrée sans perte ni crash. Edge :
      boot sur DB déjà à jour -> no-op idempotent ; boot interrompu puis
      relancé -> reprise correcte ; DB avec version inconnue/future ->
      comportement défini (refus propre plutôt que corruption).
    - >
      Si le hotfix 57019e7 (réordonnancement ponctuel CREATE INDEX/ALTER
      TABLE) est rendu obsolète par le mécanisme général, le code du hotfix
      est nettoyé/intégré dans le nouveau système plutôt que laissé en
      double (application be16dc46).
    - >
      Périmètre borné : ce chantier traite la discipline de migration du
      schéma SQL. Il ne modifie pas la sémantique des données ni le PILIER D
      autorepair (qui reste le filet de sécurité si une migration échoue
      malgré tout).
