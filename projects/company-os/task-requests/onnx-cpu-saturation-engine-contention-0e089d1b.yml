spec:
  priority: high
  status: backlog
  triage_note: >
    Triage V1 hygiène (décision agents 2026-06-10, programme companyos-v1,
    diagnostic v1-hygiene-recensement). Conservé en BACKLOG : le sujet est
    réel, non livré, de priorité haute (critical-infra). Aucun RFC ni fix
    n'a encore été produit (le diagnostic fa9bd072 conclut qu'un RFC dédié
    reste à rédiger pour la PISTE B côté binaire Rust). EXCEPTION à la règle
    « backlog conservé seulement si tracé dans une roadmap » : ce sujet
    n'est PAS encore tracé dans une roadmap au moment du triage. Action de
    suivi remontée au PM : ajouter cet item à la roadmap companyos-system
    (ou companyos-v1) pour rendre la conservation conforme. Ne pas annuler :
    le problème de saturation CPU ONNX est un vrai défaut de fond non résolu.
  acceptance_criteria:
    - >
      Le serveur orchestrator au repos (aucune requête en cours) consomme
      une CPU négligeable (ordre de grandeur : proche de 0%, pas ~600%). Le
      busy-spin permanent du pool ONNX/fastembed est éliminé. Mesure avant
      (saturation confirmée par le diagnostic) et après (idle) documentée.
    - >
      Le pool de threads ONNX/fastembed est bridé : nombre de threads
      intra-op limité (par exemple 2 à 4 au lieu du nombre de cœurs) et
      spin-wait désactivé (pool en mode blocking). Le choix exact des
      paramètres est une décision d'architecture, mais l'objectif idle
      proche de 0% prime.
    - >
      reload_config() reste répondant même pendant qu'un reindex est en
      cours. La contention sur le mutex unique de l'engine est réduite de
      sorte qu'une opération administrative légère (reload_config) ne soit
      pas bloquée par une opération lourde (reindex_all). L'approche
      (reindex incrémental ciblé sur événement watcher au lieu de
      reindex_all complet, et/ou découplage lecture/réindexation) est à
      trancher par l'Architect.
    - >
      Aucune régression sur la qualité de l'embedding ni sur le déterminisme
      (le bridage du pool ne doit pas changer les vecteurs produits, juste
      le nombre de threads et le comportement d'attente). Le recall de search
      reste équivalent.
    - >
      Tests entérinés dans la suite automatisée (lesson b04f8838, PAS de
      validation manuelle). Nominal : embedding d'un artifact produit le
      vecteur attendu avec le pool bridé. Performance : une mesure
      automatisable ou au minimum documentée de la CPU idle. Edge :
      reindex en cours + opération concurrente (reload_config ou search)
      qui doit rester répondante ; déterminisme du vecteur identique avant/
      après bridage.
    - >
      Périmètre : ce chantier traite la saturation CPU ONNX et la contention
      engine. Il ne modifie pas le proxy MCP (d9399863, qui reste correct
      pour les restarts de binaire) ni la sémantique de search. Il ferme la
      PISTE B identifiée par le diagnostic fa9bd072.
