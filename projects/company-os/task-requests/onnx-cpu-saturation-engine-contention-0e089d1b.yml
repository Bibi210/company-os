metadata:
  id: 0e089d1b-ffb4-4011-b755-7da70bb6b514
  title: "Brider le pool ONNX fastembed et réduire la contention engine (freeze reload_config)"
  author: pm
  created_at: "2026-06-04"
  project: company-os
  description: >
    Le diagnostic-report fa9bd072 a identifié la cause d'un freeze de la
    session MCP après reload_config(). reload_config n'est que le
    révélateur. La cause racine est double : (1) le thread-pool ONNX de
    fastembed (embedding.rs) tourne en busy-spin permanent, saturant le CPU
    du serveur orchestrator (~600% CPU en continu, signature de spin-wait
    confirmée par les context switches), parce que le pool intra-op est
    dimensionné au nombre de cœurs (16) et n'est pas bridé ni mis en mode
    blocking ; (2) reload_config, le reindex_all de boot, et le reindex
    déclenché par le file-watcher partagent l'unique tokio::Mutex de
    l'engine, donc un reindex_all (delete_all + ré-embed des 123 artifacts)
    retient le lock et, sous CPU déjà saturé, fait attendre reload_config
    assez longtemps pour qu'opencode perçoive un freeze. C'est l'angle mort
    PISTE B laissé ouvert par le RFC d9399863 (proxy résilient) : un serveur
    non-répondant SANS exit, que le proxy ne sait pas détecter.
  tags:
    - onnx
    - fastembed
    - cpu-saturation
    - engine-contention
    - orchestrator
    - reload-config
    - critical-infra
    - companyos-internals
