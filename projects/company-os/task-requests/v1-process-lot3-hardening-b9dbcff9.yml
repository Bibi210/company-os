  title: "V1 process lot 3 : pré-check permits, triggers humains path-matchables, matrice author-produces, intégrité related, rappels de capitalisation, régénération personas.yml"
  author: pm
  created_at: "2026-07-11"
  project: company-os
  description: >
    Lot 3 et dernier du durcissement process (recensement c981bf62, items 14
    à 19) plus deux frictions découvertes aux lots précédents. Items :
    (14) pré-check de périmètre au grant (union affected_files
    modified+created du RFC comparée aux target_paths, warning sur les
    oublis, ferme la classe des lessons 611fde3e/1bb07073, trois incidents
    observés), (15) human-review-triggers path-matchables (D23 access
    matrix, D24 persona ceo, D26 suppression de persona ; D25 breaking
    schema reste prose), (16) matrice author-produces validée à
    l'indexation, (17) validation référentielle des related[].id à
    l'indexation (warning), (18) write_permit_gate : grant vérifie qu'un
    implementation-plan approuvé lié au RFC existe quand le RFC touche du
    code, (19) rappel non bloquant de lesson manquante sur
    rfc_set_implemented et diagnostic resolved. Frictions : (20)
    réconcilier personas.yml auto-généré avec le pre-commit (rejeté
    faute d'api_version, désormais périmé vs ceo.yml), (21) warning de
    supersession dans reindex_all (tracing absent du crate orchestrator).
