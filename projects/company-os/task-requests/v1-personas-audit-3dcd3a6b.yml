api_version: companyos/v1
kind: task-request
metadata:
  id: 3dcd3a6b-ee1f-4fd6-9ac0-f9d055087723
  title: "V1 personas : audit des 4 personas (règles devenues mécaniques, manques, duplication)"
  author: pm
  created_at: "2026-07-27"
  project: company-os
  description: >
    Domaine v1-personas-audit du programme companyos-v1 (roadmap a410bb43).
    Le durcissement process est terminé : 27 règles vivent désormais dans
    le harness. Les personas doivent être réalignées : retirer ou annoter
    les règles de prose devenues mécaniques (plus besoin d'ordonner ce que
    le harness impose), combler les manques observés en sessions réelles,
    éliminer la duplication entre personas et shared-rules, et vérifier
    que chaque règle restante est soit du jugement (légitime en prose),
    soit un pointeur vers son mécanisme.
  tags:
    - companyos-v1
    - personas
    - audit
    - prose
    - harness
  related:
