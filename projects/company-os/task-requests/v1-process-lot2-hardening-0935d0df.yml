spec:
  priority: high
  status: done

  context: >
    Le recensement c981bf62 a classé 62 règles de process ; le lot 1
    (violations observées, RFC 8bf78218) est implémenté et vérifié en vif.
    Le lot 2 regroupe les mécanismes à valeur haute restants : deux
    durcissements de schemas (review-report triaxial, design-doc complet),
    une validation de placement kind↔chemin côté binaire validator (donc
    hook + pre-commit + make validate gratuits), l'outillage de la
    supersession à deux écritures (11 lessons silencieusement périmées
    découvertes à l'audit mémoire faute de réciprocité des liens), un gate
    sur reload_config (permits actifs), et deux durcissements du hook
    defense-in-depth (CEO ne peut pas écrire, granted_to vérifié à
    l'écriture). Après ce lot, 23 des 62 règles du recensement survivent
    au test clean-company comme garanties mécaniques (16 aujourd'hui).

  acceptance_criteria:
    - "Un RFC couvre les 7 mécanismes avec comportements exacts, rétro-compatibilité analysée (notamment le schema review-report en anyOf, pattern a4eb3ee7), et affected_files FORME B exhaustif"
    - "Les 7 mécanismes sont implémentés via le cycle complet (review, approbation CEO, permit, plan si nécessaire) et vérifiés par des tests aux trois axes"
    - "Le test clean-company passe de 16 à 23 garanties mécaniques"
    - "Aucune duplication de logique nouvelle entre couches (les deux durcissements hook restent dans le plugin, les validations de schema dans les schemas, les gates dans le serveur)"

  constraints:
    - "Rétro-compatibilité obligatoire pour les schemas (les artifacts existants doivent rester valides)"
    - "Pas de push : commits locaux uniquement"
    - "Les incohérences inter-couches recensées (matching permit/path triple, active vs consumed) restent hors périmètre, réservées à v1-harness-refactor"
