metadata:
  id: 0935d0df-be16-4361-b71b-03f0a43fb77c
  title: "V1 process lot 2 : 7 mécanismes de durcissement (schemas triaxial/design-doc, file_placement, supersession, reload gate, gardes CEO et granted_to)"
  author: pm
  created_at: "2026-07-03"
  project: company-os
  description: >
    Lot 2 du durcissement process (recensement c981bf62, items 7 à 13),
    suite du lot 1 livré (RFC 8bf78218). Sept mécanismes coût S/M, valeur
    haute, sans violation observée à ce jour : (7) schema review-report
    triaxial structurel (spec.axes nominal/negative/edge, rétro-compatible),
    (8) schema design-doc exigeant components et decisions, (9) validation
    kind↔chemin dans le yaml-validator (file_placement), (10) supersession
    à deux écritures (tool MCP supersede_artifact + warning d'asymétrie à
    l'indexation, lesson 9b2c1951), (11) reload_config refuse si des permits
    actifs subsistent, (12) hook : write/edit bloqués pour agent==ceo,
    (13) hook : hasActivePermit croise l'agent écrivain avec granted_to
    (ferme le trou "un agent écrit sous le permit d'un autre").
