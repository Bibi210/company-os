spec:
  priority: medium
  status: done
  acceptance_criteria:
    - >
      Le comportement du hook face à une altération de write_permits est
      caractérisé précisément : dans quels cas le revert est aujourd'hui
      sélectif (DELETE ciblé) et dans quels cas il est nucléaire (wipe
      total). Le diagnostic distingue les deux branches et leurs
      déclencheurs réels (vérifié sur le code de defense-in-depth*.mjs).
    - >
      Le revert nucléaire (wipe de TOUS les permits) est éliminé ou borné
      à un cas résiduel strictement justifié et documenté (par exemple :
      impossibilité technique de déterminer le baseline légitime). Dans le
      cas nominal d'une altération détectée, seuls les permits réellement
      non autorisés sont supprimés ; les permits légitimes (présents dans
      le snapshot baseline, ou scellés en HEAD git) sont préservés.
    - >
      La garantie de sécurité d'origine est préservée : un permit injecté
      frauduleusement hors du canal MCP est toujours détecté et supprimé.
      Le revert sélectif ne doit pas ouvrir une faille permettant à un
      permit illégitime de survivre.
    - >
      Tests couvrant les trois axes. Nominal : altération d'un permit
      illégitime parmi plusieurs légitimes -> seul l'illégitime est
      supprimé, les autres survivent. Négatif : tentative d'injection
      frauduleuse d'un permit -> détecté et supprimé ; snapshot baseline
      indisponible/corrompu -> comportement de repli documenté et sûr.
      Edge : table vide, un seul permit, tous les permits illégitimes,
      altérations concurrentes.
    - >
      Si une lesson (notamment ed7776fb) documentait le comportement
      nucléaire comme attendu, elle est mise à jour ou supersedée pour
      refléter le nouveau comportement sélectif (application be16dc46).
    - >
      Périmètre borné : ce chantier ne touche QUE la logique de revert du
      hook face à une altération de permits. Il ne modifie pas le
      mécanisme d'émission (atomic-grant-permit, déjà livré) ni la
      sémantique des permits eux-mêmes.
