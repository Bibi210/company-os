metadata:
  id: dcb17b79-952b-403d-b8ed-c979aec8aad3
  title: "Hook defense-in-depth : revert sélectif au lieu de nucléaire"
  author: pm
  created_at: "2026-06-03"
  project: company-os
  description: >
    Le hook defense-in-depth, quand il détecte une altération non-MCP de
    la table write_permits, peut réagir de manière nucléaire en wipant
    TOUS les permits plutôt qu'en ciblant uniquement le ou les permits
    suspects. Ce comportement amplifie le coût des incidents : deux
    blockers documentés pendant la refonte search où des permits
    parfaitement légitimes et scellés ont été perdus collatéralement
    (agent-messages 4f000127, 05224964 ; lesson ed7776fb). L'objectif est
    de rendre le revert SÉLECTIF : ne supprimer que le ou les permits
    réellement non autorisés (non présents dans le snapshot baseline
    légitime), en préservant les permits valides. NOTE : l'investigation
    du sujet atomic-grant-permit a montré que revertPermitTampering a
    DÉJÀ une branche sélective (DELETE WHERE id NOT IN before_ids) ET une
    branche nucléaire. Le travail consiste à comprendre exactement quand
    chaque branche se déclenche et à éliminer (ou borner strictement) le
    comportement nucléaire au profit du sélectif.
  tags:
