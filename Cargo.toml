[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/validation",
    "crates/orchestrator",
    "crates/mcp-servers/orchestrator",
    "crates/mcp-servers/yaml",
    "tests/integration",
]


[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "1.2", features = ["server", "transport-io"] }
jsonschema = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
schemars = "1"
glob = "0.3"
notify = "7"
